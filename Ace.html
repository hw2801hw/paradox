<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07071a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>倖存者</title>
<style>
/* =====================================================================
   ★★★ 字體大小規則（永久有效，請勿違反） ★★★
   本專案所有文字（按鈕、數值、提示、浮動文字、Canvas 文字）
   的字體大小「永久不得低於 16px」。
   - CSS：一律使用 max(16px, …) 或 var(--fs-min) 作為下限。
   - Canvas：所有文字經由 drawText() 繪製，內部 Math.max(16, size)。
   - JS 守門員：enforceMinFont() 會掃描動態產生的元素，若小於 16px 自動修正。
   ===================================================================== */
:root{
  --fs-min:16px;                       /* 字體下限，永久不得低於 16px */
  --ink:#eef3ff; --cy:#5ee7ff; --mg:#ff4fd8; --gd:#ffd166; --rd:#ff5a6e; --vi:#9b7bff;
  --sat:env(safe-area-inset-top,0px);
  --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --u:3.6px;                           /* 1u = 遊戲畫面寬度的 1%，由 JS 在 resize 時更新 */
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#04040c;overscroll-behavior:none;touch-action:none;
  font-family:var(--font);font-size:16px;color:var(--ink);-webkit-user-select:none;user-select:none}
/* 使用 100dvh（動態視窗高度，排除瀏覽器網址列/手勢列）並扣除安全區域 */
body{
  display:flex;align-items:center;justify-content:center;
  height:100vh;height:100svh;height:100dvh;
  padding:var(--sat) var(--sar) var(--sab) var(--sal);
  background:radial-gradient(120% 90% at 50% 0%,#1b1245 0%,#0a0a1f 55%,#030308 100%);
}
/* 9:16 遊戲舞台：寬度取「可用寬度」與「可用高度*9/16」的較小者，絕不超出螢幕 */
#app{
  position:relative;overflow:hidden;background:#07071a;
  width:min(100%,calc((100vh - var(--sat) - var(--sab)) * 9 / 16));
  width:min(100%,calc((100svh - var(--sat) - var(--sab)) * 9 / 16));
  width:min(100%,calc((100dvh - var(--sat) - var(--sab)) * 9 / 16));
  aspect-ratio:9/16;max-height:100%;
  font-size:16px;
}
@media (min-width:560px){ #app{border-radius:24px;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 30px 90px rgba(80,60,255,.35)} }
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(2,2,12,.65) 100%)}
#hurt{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(255,30,60,.55) 100%)}
#touch{position:absolute;inset:0;z-index:2;touch-action:none}
#joy{position:absolute;z-index:3;width:calc(var(--u)*30);height:calc(var(--u)*30);left:0;top:0;margin:calc(var(--u)*-15) 0 0 calc(var(--u)*-15);
  border-radius:50%;pointer-events:none;opacity:0;transition:opacity .15s;
  background:radial-gradient(circle,rgba(94,231,255,.10),rgba(94,231,255,.04));border:2px solid rgba(94,231,255,.45);
  box-shadow:0 0 24px rgba(94,231,255,.25),inset 0 0 24px rgba(94,231,255,.15)}
#joy.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#7fe6ff 55%,#2a8bd6);box-shadow:0 0 18px rgba(94,231,255,.8)}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:4;pointer-events:none;display:none;flex-direction:column;gap:6px;
  padding:calc(var(--u)*2.2) calc(var(--u)*3) 0}
#app.ingame #hud{display:flex}
.row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{min-width:calc(var(--u)*20);height:40px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(10,12,34,.62);border:1px solid rgba(255,255,255,.16);border-radius:20px;backdrop-filter:blur(6px);
  font-size:max(16px,calc(var(--u)*4.6));font-weight:800;letter-spacing:.5px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.pill.time{font-variant-numeric:tabular-nums;color:#fff;border-color:rgba(94,231,255,.5);box-shadow:0 0 18px rgba(94,231,255,.25)}
.pill.time.urgent{color:#ffd0d6;border-color:rgba(255,90,110,.7);box-shadow:0 0 18px rgba(255,90,110,.45);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;
  background:rgba(10,12,34,.62);color:#fff;font-size:max(18px,calc(var(--u)*5));backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:scale(.92)}
.bar{position:relative;height:26px;border-radius:13px;overflow:hidden;background:rgba(6,8,26,.7);border:1px solid rgba(255,255,255,.18)}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;transform:scaleX(1)}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-min);font-weight:800;line-height:24px;
  text-shadow:0 1px 4px #000,0 0 8px rgba(0,0,0,.8);white-space:nowrap}
.bar.hp>i#hpFill{background:linear-gradient(90deg,#ff3d6a,#ff7a8a)}
.bar.hp>i#shFill{top:auto;height:6px;background:linear-gradient(90deg,#7fd4ff,#fff)}
.bar.xp>i{background:linear-gradient(90deg,#7a5cff,#5ee7ff);transform:scaleX(0)}
.bar.boss{display:none;border-color:rgba(255,80,130,.7);box-shadow:0 0 16px rgba(255,60,110,.4)}
.bar.boss.on{display:block}
.bar.boss>i{background:linear-gradient(90deg,#b0103a,#ff4f8a)}
#evtLine{font-size:var(--fs-min);font-weight:700;text-align:center;color:#d9e2ff;text-shadow:0 1px 5px #000,0 0 10px rgba(0,0,0,.9)}
/* HUD 左側技能列已移除：不再列出各技能等級 / 數值 / 冷卻條，避免遮擋遊戲畫面 */

#hint{position:absolute;z-index:4;left:0;right:0;top:56%;text-align:center;pointer-events:none;opacity:0;
  font-size:max(16px,calc(var(--u)*4.6));font-weight:800;line-height:1.5;text-shadow:0 2px 10px #000;color:#dff6ff}
#hint.go{animation:hint 4.2s forwards}
@keyframes hint{0%{opacity:0;transform:translateY(10px)}12%,80%{opacity:1;transform:none}100%{opacity:0}}
#banner{position:absolute;z-index:6;left:0;right:0;top:28%;text-align:center;pointer-events:none;opacity:0;
  font-size:max(16px,calc(var(--u)*7.6));font-weight:900;letter-spacing:2px;padding:0 12px;text-shadow:0 0 22px currentColor,0 3px 12px #000}
#banner.go{animation:banner 2.6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes banner{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(.96) translateY(-10px)}}

/* ---------- 畫面層（選單、彈窗） ---------- */
.screen{position:absolute;inset:0;display:none;z-index:10;flex-direction:column}
.screen.show{display:flex}
.modal{background:rgba(3,3,14,.78);backdrop-filter:blur(8px);align-items:center;justify-content:center;z-index:20;padding:calc(var(--u)*4)}
.panel{width:100%;max-height:100%;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,rgba(28,22,70,.96),rgba(12,12,36,.97));border:1px solid rgba(160,150,255,.35);
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(120,90,255,.25);animation:pop .28s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.ph h2{font-size:max(20px,calc(var(--u)*6.4));font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,#fff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.pb{padding:12px 14px 16px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.btn{position:relative;width:100%;min-height:56px;padding:12px 18px;border-radius:18px;cursor:pointer;color:#fff;
  font-family:var(--font);font-size:max(18px,calc(var(--u)*5.6));font-weight:900;letter-spacing:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.3);
  box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s,filter .12s;overflow:hidden}
.btn:active{transform:scale(.96);filter:brightness(1.2)}
.btn.primary{background:linear-gradient(180deg,#8d6bff,#4a2fe0 60%,#3a1fb8);border-color:#c3b3ff;
  box-shadow:0 8px 30px rgba(110,80,255,.65),0 0 0 2px rgba(150,120,255,.25),inset 0 1px 0 rgba(255,255,255,.5);animation:glowbtn 2.2s infinite}
.btn.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 3s infinite}
@keyframes shine{0%{left:-60%}50%,100%{left:130%}}
@keyframes glowbtn{50%{box-shadow:0 8px 40px rgba(130,100,255,.95),0 0 0 4px rgba(150,120,255,.3),inset 0 1px 0 rgba(255,255,255,.5)}}
.btn.sm{min-height:48px;font-size:max(16px,calc(var(--u)*4.6));letter-spacing:2px}

/* 主選單 */
#menu{align-items:center;justify-content:space-between;padding:calc(var(--u)*8) calc(var(--u)*8) calc(var(--u)*6);background:transparent}
/* 廣告體驗按鈕（主選單右上角，僅此區塊） */
#btnAd{position:absolute;top:calc(var(--u)*3);right:calc(var(--u)*3);z-index:11}
.mtop{text-align:center;margin-top:calc(var(--u)*2)}
.badge{display:inline-block;padding:6px 16px;border-radius:20px;border:1px solid rgba(94,231,255,.5);background:rgba(94,231,255,.08);
  font-size:max(16px,calc(var(--u)*4.2));font-weight:800;letter-spacing:4px;color:var(--cy)}
.title{margin-top:calc(var(--u)*3);font-size:calc(var(--u)*24);font-weight:900;letter-spacing:calc(var(--u)*2);line-height:1.05;
  background:linear-gradient(180deg,#fff 0%,#c9bbff 45%,#7a5cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(130,100,255,.8)) drop-shadow(0 4px 0 rgba(20,10,60,.9));animation:float 3.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.sub{margin-top:8px;font-size:max(16px,calc(var(--u)*4.4));color:#c7d2ff;letter-spacing:3px;font-weight:700;text-shadow:0 2px 8px #000}
.mbtns{width:100%;display:flex;flex-direction:column;gap:14px}
.tip{text-align:center;font-size:max(16px,calc(var(--u)*4.2));color:#aeb9e8;line-height:1.6;text-shadow:0 2px 8px #000}

/* 技能圖鑑 */
.card{border-radius:16px;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.card h3{font-size:max(18px,calc(var(--u)*5));font-weight:900;margin-bottom:6px;color:var(--gd)}
.card p,.card li{font-size:var(--fs-min);line-height:1.55;color:#dfe6ff}
.card ul{padding-left:20px}
.sk{border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:inset 0 0 30px color-mix(in srgb,var(--c) 14%,transparent)}
.sk-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:max(28px,calc(var(--u)*8));
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 70%,#fff),color-mix(in srgb,var(--c) 40%,#000));box-shadow:0 0 18px color-mix(in srgb,var(--c) 70%,transparent);flex:none}
.sk-h b{display:block;font-size:max(18px,calc(var(--u)*5.2));font-weight:900}
.tag{display:inline-block;margin-top:2px;padding:0 10px;border-radius:10px;font-style:normal;font-size:var(--fs-min);font-weight:800;
  background:color-mix(in srgb,var(--c) 30%,transparent);border:1px solid var(--c)}
.lvs{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.lvs li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:7px 9px;border-radius:10px;background:rgba(0,0,0,.28)}
.lvn{font-weight:900;color:var(--cy);white-space:nowrap}
.lvs li.brk{background:linear-gradient(90deg,rgba(255,209,102,.28),rgba(255,120,60,.12));border:1px solid rgba(255,209,102,.8);box-shadow:0 0 16px rgba(255,209,102,.35)}
.lvs li.brk .lvn{color:var(--gd)}

/* 升級選擇 */
#cards{display:flex;flex-direction:column;gap:12px}
.pick{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:18px;cursor:pointer;color:#fff;font-family:var(--font);
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 28%,rgba(14,14,40,.95)),rgba(14,14,40,.95));
  border:1.5px solid var(--c);box-shadow:0 6px 22px rgba(0,0,0,.45),0 0 22px color-mix(in srgb,var(--c) 35%,transparent);transition:transform .12s;animation:pop .35s both}
.pick:nth-child(2){animation-delay:.07s}.pick:nth-child(3){animation-delay:.14s}
.pick:active{transform:scale(.96)}
.pick.brk{border-color:var(--gd);box-shadow:0 6px 26px rgba(0,0,0,.5),0 0 30px rgba(255,209,102,.7);animation:pop .35s both,brkglow 1.4s infinite}
@keyframes brkglow{50%{box-shadow:0 6px 26px rgba(0,0,0,.5),0 0 44px rgba(255,170,60,1)}}
.pick .ic{width:60px;height:60px}
.pick b{display:block;font-size:max(18px,calc(var(--u)*5.2));font-weight:900}
.pick .lvl{font-size:var(--fs-min);font-weight:800;color:var(--cy)}
.pick.brk .lvl{color:var(--gd)}
.pick .eff{font-size:var(--fs-min);line-height:1.45;color:#e6ecff;margin-top:2px}
.sub2{text-align:center;font-size:var(--fs-min);color:#c8d2ff;margin-top:-2px}
/* ---------- 精英突破三選一（與升級選擇相同卡片樣式） ---------- */
#lottery .panel{max-height:100%}
#lotteryCards{display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);text-align:center}
.stat b{display:block;font-size:max(20px,calc(var(--u)*6));font-weight:900;color:var(--gd)}
.stat span{font-size:var(--fs-min);color:#c8d2ff}
.big{font-size:max(26px,calc(var(--u)*9));font-weight:900;text-align:center;letter-spacing:3px}
.win{color:var(--gd);text-shadow:0 0 22px rgba(255,209,102,.8)}.lose{color:var(--rd);text-shadow:0 0 22px rgba(255,90,110,.8)}
.col{display:flex;flex-direction:column;gap:10px}
/* ---------- 銘文系統（新增，僅此區塊） ---------- */
.rune-pentagon-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px 4px}
.rune-pentagon{width:min(100%,260px);height:auto;display:block}
.rune-totals{text-align:center;font-size:var(--fs-min);line-height:1.6;color:#e6ecff}
.rune-totals b{color:var(--gd)}
.rune-schools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rune-school{padding:12px;border-radius:16px;cursor:pointer;color:#fff;font-family:var(--font);text-align:left;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.22)}
.rune-school:active{transform:scale(.97)}
.rune-school.active{border-color:var(--gd);box-shadow:0 0 18px rgba(255,209,102,.35);background:linear-gradient(180deg,rgba(255,209,102,.18),rgba(255,255,255,.03))}
.rune-school.sel{outline:2px solid rgba(94,231,255,.8);outline-offset:1px}
.rune-school b{display:block;font-size:max(18px,calc(var(--u)*5.2));font-weight:900}
.rune-school span{font-size:var(--fs-min);color:#c8d2ff;line-height:1.5}
.rune-school .rune-tag{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:10px;font-size:var(--fs-min);font-weight:800;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.25)}
.rune-slot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14)}
.rune-slot b{font-size:var(--fs-min)}
.rune-slot span{font-size:var(--fs-min);color:#c8d2ff}
.rune-mini{padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-family:var(--font);font-size:var(--fs-min);font-weight:800;cursor:pointer}
.rune-mini:disabled{opacity:.35;cursor:not-allowed}
.rune-picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rune-opt{padding:10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-family:var(--font);font-size:var(--fs-min);font-weight:800;cursor:pointer;text-align:left;line-height:1.4}
.rune-opt:disabled{opacity:.32;cursor:not-allowed}
.rune-opt:active{transform:scale(.97)}
.rune-warn{font-size:var(--fs-min);color:#ffb3be;line-height:1.6;text-align:center;font-weight:800}
.rune-current{font-size:var(--fs-min);color:#c8d2ff;line-height:1.6;text-align:center}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="vignette"></div>
  <div id="hurt"></div>
  <div id="touch"></div>
  <div id="joy"><div id="knob"></div></div>

  <!-- 遊戲 HUD：時間、經驗、血量、技能等級摘要常駐顯示 -->
  <div id="hud">
    <div class="row1">
      <div class="pill">☠ <span id="killTxt">0</span></div>
      <div class="pill time" id="timeBox">⏱ <span id="timeTxt">5:00</span></div>
      <button class="iconbtn" id="btnTimeStop" aria-label="時間停止" title="時間停止（一次性）">⏳</button>
      <button class="iconbtn" id="btnPause" aria-label="暫停">⏸</button>
    </div>
    <div class="bar hp"><i id="hpFill"></i><i id="shFill"></i><span id="hpTxt">❤ 1234/1234</span></div>
    <div class="bar xp"><i id="xpFill"></i><span id="xpTxt">EXP 0%</span></div>
    <div class="bar boss" id="bossBar"><i id="bossFill"></i><span id="bossTxt">BOSS</span></div>
    <div id="evtLine"></div>
  </div>
  <div id="hint">拖曳螢幕任意處移動<br>攻擊會自動進行</div>
  <div id="banner"></div>

  <!-- 主選單 -->
  <div class="screen show" id="menu">
    <button class="iconbtn" id="btnAd" aria-label="廣告體驗" title="廣告體驗">🛐</button>
    <div class="mtop">
      <span class="badge">SURVIVOR · 5:00</span>
      <h1 class="title">倖存者</h1>
      <p class="sub">撐過五分鐘 · 擊敗 Boss</p>
    </div>
    <div class="mbtns">
      <button class="btn primary" id="btnStart">⚔ 開始生存</button>
      <button class="btn" id="btnRune">💎 銘文系統</button>
      <button class="btn" id="btnCodex">📖 技能圖鑑</button>
      <p class="tip" id="runeCurrent">💎 目前流派：未選擇，請先到「銘文系統」選擇流派才可開始生存</p>
      <p class="tip">拖曳螢幕移動 攻擊自動進行<br>擊敗精英怪可三選一直接突破技能</p>
    </div>
  </div>

  <!-- 廣告體驗：詢問是否觀看廣告，確認後開始快速體驗 -->

/* ---------------- 銘文系統（新增） ----------------

function calcRuneTotals(slots){
  const o={atk:0,cd:0,life:0,move:0,smart:0,total:0};
  for(const s of (slots||[])){if(!s)continue;o[s.school]+=RUNE_LEVEL_PCT(s.lv)}
  o.total=o.atk+o.cd+o.life+o.move+o.smart;return o;
}
function getRuneTotals(){
  if(!selectedRune||!selectedRune.slots)return {atk:0,cd:0,life:0,move:0,smart:0,total:0};
  return calcRuneTotals(selectedRune.slots);
}
function runeSlotsForFixed(mode){
  if(mode==='omni')return RUNE_OMNI_SLOTS.map(s=>({school:s.school,lv:s.lv}));
  return [1,2,3,4,5].map(lv=>({school:mode,lv}));
}
function runeEffectText(school,lv){
  const p=RUNE_LEVEL_PCT(lv),e=RUNE_SCHOOLS[school].effect;

}
function runeTotalsText(tot){
  const parts=[];
  if(tot.atk)parts.push('攻擊 +'+tot.atk+'%');
  if(tot.cd)parts.push('冷卻 -'+tot.cd+'%');
  if(tot.life)parts.push('保命 每 5 秒 +'+tot.life+'% 最大生命');
  if(tot.move)parts.push('機動 移速 +'+tot.move+'% · 迴避 +'+tot.move+'%');
  if(tot.smart)parts.push('智選 開局經驗 +'+tot.smart+'%');
  return parts.length?parts.join(' · '):'尚未填入任何銘文';
}
function runeSelectedText(){

/* ---------------- 遊戲狀態 ---------------- */
let state='menu';            // menu | play | levelup | pause | dying | over

/* ---------------- 粒子 / 特效 ---------------- */
const MAXP=1500;
function emit(x,y,vx,vy,life,size,col,shape,drag,add,grow){
  if(parts.length>=MAXP)return null;
  const p=pool.pop()||{};
  p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=p.max=life;p.size=size;p.col=col;p.shape=shape||0;p.drag=drag||0;p.add=add!==false;p.grow=!!grow;
  p.rot=Math.random()*6.28;p.vr=rnd(-8,8);parts.push(p);return p;
}
function burst(x,y,n,s0,s1,col,life,size,shape,drag){
  for(let i=0;i<n;i++){const a=rnd(0,6.2832),s=rnd(s0,s1);emit(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(life*.55,life),size*rnd(.7,1.2),col,shape===undefined?1:shape,drag===undefined?2:drag)}
}
function ring(x,y,r0,r1,life,w,col){fx.push({k:'ring',x,y,r0,r1,life,max:life,w,col})}
function flare(x,y,r,life,col){fx.push({k:'flare',x,y,r,life,max:life,col})}
function mkBolt(x1,y1,x2,y2,jit){
  let pts=[[x1,y1],[x2,y2]],off=jit;
  for(let k=0;k<5;k++){
    const np=[pts[0]];
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i],b=pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,o=rnd(-off,off);
      np.push([(a[0]+b[0])/2-dy/l*o,(a[1]+b[1])/2+dx/l*o],b);
    }
    pts=np;off*=.56;
  }
  return pts;
}
function boltFx(x1,y1,x2,y2,col,w,life){
  fx.push({k:'bolt',pts:mkBolt(x1,y1,x2,y2,Math.hypot(x2-x1,y2-y1)*.22+6),col,w,life,max:life});
  const n=rint(1,3);
  for(let i=0;i<n;i++){
    const t=rnd(.2,.8),bx=x1+(x2-x1)*t,by=y1+(y2-y1)*t,a=Math.atan2(y2-y1,x2-x1)+rnd(-1.1,1.1),l=rnd(20,50);
    fx.push({k:'bolt',pts:mkBolt(bx,by,bx+Math.cos(a)*l,by+Math.sin(a)*l,l*.3),col,w:w*.55,life:life*.8,max:life*.8});
  }
}

/* ---------------- 敵人 / 空間網格 ---------------- */
const CS=48,HB=1024,head=new Int32Array(HB),nxt=new Int32Array(2048);let stamp=0;
const hcell=(cx,cy)=>((cx*73856093)^(cy*19349663))&(HB-1);
function buildGrid(){
  head.fill(-1);bigs.length=0;
  for(let i=0;i<enemies.length&&i<2048;i++){
    const e=enemies[i];if(e.dead)continue;
    if(e.big){bigs.push(e);continue}
    const h=hcell(Math.floor(e.x/CS),Math.floor(e.y/CS));nxt[i]=head[h];head[h]=i;
  }
}
function gather(x,y,r,out){
  out.length=0;stamp++;
  const x0=Math.floor((x-r-18)/CS),x1=Math.floor((x+r+18)/CS),y0=Math.floor((y-r-18)/CS),y1=Math.floor((y+r+18)/CS);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){
    for(let j=head[hcell(cx,cy)];j>=0;j=nxt[j]){
      const e=enemies[j];if(!e||e.qs===stamp||e.dead)continue;e.qs=stamp;
      const dx=e.x-x,dy=e.y-y,rr=r+e.r;if(dx*dx+dy*dy<=rr*rr)out.push(e);
    }
  }
  for(let i=0;i<bigs.length;i++){const b=bigs[i];if(b.dead)continue;const dx=b.x-x,dy=b.y-y,rr=r+b.r;if(dx*dx+dy*dy<=rr*rr)out.push(b)}
  return out;
}
function nearestList(x,y,range,k){
  const arr=[],r2=range*range;
  for(const e of enemies){if(e.dead)continue;const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<r2)arr.push({e,d})}
  arr.sort((a,b)=>a.d-b.d);return arr.slice(0,k).map(o=>o.e);
}
function nearestUnhit(x,y,range,set){
  let best=null,bd=range*range;
  for(const e of enemies){if(e.dead||set.has(e))continue;const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=e}}
  return best;
}
function spawnEnemy(type,x,y,hp){

  const e={type,x,y,r:ET.r,big,hp:hp||Math.round(ET.hp*hpMul),spd:ET.spd*(big?1:(1+Math.min(mins,5)*.04)*rnd(.92,1.08)),
    dmg:big?ET.dmg:ET.dmg*growth,col:ET.col,flash:0,slow:1,slowT:0,freeze:0,kx:0,ky:0,bladeT:0,trailT:0,dead:false,id:++uid,qs:0,ph:Math.random()*6.28,

}
function ringPos(){const a=rnd(0,6.2832),d=Math.hypot(WW,WH)/2+40;return[pl.x+Math.cos(a)*d,pl.y+Math.sin(a)*d,a]}

/* ---------------- 玩家 ---------------- */
function recalc(){
  const v=pl.sk.vit?pl.sk.vit.lv:0,w=pl.sk.wind?pl.sk.wind.lv:0;
  const oldMax=pl.maxHp||CFG.PLAYER_HP;
  const baseHp=CFG.PLAYER_HP*Math.pow(1.10,(G&&G.overTier||0));
  const vitPct=v?SK.vit.hpPct[v-1]/100:0;
  pl.maxHp=Math.round(baseHp*(1+vitPct));
  if(pl.maxHp>oldMax)pl.hp+=pl.maxHp-oldMax;
  pl.regen=0;pl.killHeal=v?SK.vit.kh[v-1]:0;
  pl.speed=CFG.PLAYER_SPEED*(1+(w?SK.wind.spd[w-1]:0)/100);pl.dodge=w?SK.wind.dodge[w-1]/100:0;
  const s=pl.sk.shield?pl.sk.shield.lv:0;pl.shieldMax=s?SK.shield.val[s-1]:0;
  /* 銘文系統（新增）：固定流派 / 全能流皆 20%；原有技能數值不動；疾風之靴與機動流疊加 */
  const rt=getRuneTotals();
  pl.runeLifePct=rt.life/100;
  pl.runeCdMul=Math.max(0.05,1-rt.cd/100);
  pl.speed=CFG.PLAYER_SPEED*(1+(w?SK.wind.spd[w-1]:0)/100+rt.move/100);
  pl.dodge=(w?SK.wind.dodge[w-1]/100:0)+rt.move/100;
  pl.atkMul=Math.pow(1.03,(G&&G.overTier||0))*(1+rt.atk/100);
}

function toneAt(type,f0,f1,dur,vol,at){
  const ac=actx;if(!ac)return;
  try{const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,at);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),at+dur);
    g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+0.012);g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(g);g.connect(ac.destination);o.start(at);o.stop(at+dur+0.02);}catch(_){}
}

      ctx.strokeStyle=`rgba(255,255,255,${a*.9})`;ctx.lineWidth=Math.max(1,f.w*(1-t*.7)*.5);ctx.beginPath();ctx.arc(f.x,f.y,r,0,6.3);ctx.stroke();
    }else if(f.k==='flare'){glow(f.x,f.y,f.r*(.5+.7*t),f.col,Math.pow(1-t,1.5))}
    else if(f.k==='bolt'){
      const a=(1-t)*(.6+.4*Math.random());ctx.lineJoin='round';ctx.lineCap='round';
      const passes=[[f.w*4,.2,f.col],[f.w*2,.55,f.col],[Math.max(1.2,f.w*.7),1,'255,255,255']];
      for(const ps of passes){
        ctx.strokeStyle=`rgba(${ps[2]},${ps[1]*a})`;ctx.lineWidth=ps[0];ctx.beginPath();
        f.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
      }
    }
  }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  // ===== 螢幕空間：文字、血條、箭頭、閃光 =====
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sx=wx=>(wx-cx+WW/2)*Z,sy=wy=>(wy-cy+WH/2)*Z;
  for(const t of texts){
    const a=Math.min(1,t.life/t.max*2.2),pop=t.max-t.life<.12?1.25:1;
    ctx.globalAlpha=a;drawText(t.text,sx(t.x),sy(t.y),t.size*pop,t.col);
  }
  ctx.globalAlpha=1;
  for(const e of enemies){
    if(!e.big||e.dead)continue;
    const bx=sx(e.x),by=sy(e.y-e.r-14),bw=70,hp=Math.max(0,e.hp/e.maxhp);
    if(e.type==='elite'){
      ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(bx-bw/2,by-8,bw,9);ctx.fillStyle='#ffc94a';ctx.fillRect(bx-bw/2,by-8,bw*hp,9);
      ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;ctx.strokeRect(bx-bw/2,by-8,bw,9);
      drawText(Math.ceil(e.hp)+'/'+e.maxhp,bx,by-22,16,'#fff2c4');
    }
    // 螢幕外箭頭
    const ex=sx(e.x),ey=sy(e.y);
    if(ex<0||ex>VW||ey<0||ey>VH){
      const a=Math.atan2(ey-VH/2,ex-VW/2),ax=clamp(VW/2+Math.cos(a)*VW,26,VW-26),ay=clamp(VH/2+Math.sin(a)*VH,150,VH-26);
      ctx.save();ctx.translate(ax,ay);ctx.rotate(a);ctx.globalAlpha=.7+.3*Math.sin(T*8);
      ctx.fillStyle=e.type==='boss'?'#ff4f7e':'#ffc94a';ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-9,-11);ctx.lineTo(-4,0);ctx.lineTo(-9,11);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    }
  }
  ctx.globalAlpha=1;
  if(flashA>0){ctx.fillStyle=`rgba(${flashCol},${Math.min(.85,flashA)})`;ctx.fillRect(0,0,VW,VH)}
}

    ctx.beginPath();ctx.arc(0,0,VW*(.2+k*.1),0,6.3);ctx.stroke();ctx.setLineDash([]);ctx.restore();
  }

  const box=$('#lotteryCards');box.innerHTML='';

function openLevelUp(){
  if(state!=='play')return;
  const avail=ORDER.filter(id=>(pl.sk[id]?pl.sk[id].lv:0)<5);
  if(!avail.length){
    /* 已擁有全部突破技能：Exp 不再多餘，pending 全轉為超限等級；每滿 4 級 +10% HP、+3% 攻擊（疊乘） */
    const gained=G.pending;G.pending=0;G.overLv+=gained;
    const newTier=Math.floor(G.overLv/4);
    if(newTier>G.overTier){
      const up=newTier-G.overTier;G.overTier=newTier;pl.atkMul=Math.pow(1.03,G.overTier);recalc();
      const hpInc=Math.round((Math.pow(1.10,up)-1)*1000)/10,atkInc=Math.round((Math.pow(1.03,up)-1)*10000)/100;
      floatText(pl.x,pl.y-30,'超限強化 ×'+up+'！HP+'+hpInc+'% · 攻擊+'+atkInc+'%','#ffd166',22,1.6);
      banner('✦ 超限強化 ×'+up+'！HP +'+hpInc+'% · 攻擊 +'+atkInc+'% ✦','#ffd166');addShake(6);flashScreen(.25,'255,215,120');
    }else{
      floatText(pl.x,pl.y-30,'超限經驗 +'+gained+' 級（'+G.overLv+' / 4）','#9fffb0',20,1.4);
    }
    return;
  }
  avail.sort(()=>Math.random()-.5);const choices=avail.slice(0,3);
  state='levelup';input.active=false;el.joy.classList.remove('on');
  $('#lvlTitle').textContent='⬆ 升級！Lv '+(G.level-G.pending+1);
  $('#lvlSub').textContent=adMode?'三選一直接突破至 Lv5（剩餘選擇 '+G.pending+' 次）':'三選一強化（剩餘選擇 '+G.pending+' 次）';
  const box=$('#cards');box.innerHTML='';
  for(const id of choices){
    const S=SK[id],cur=pl.sk[id]?pl.sk[id].lv:0,nx=adMode?5:cur+1;
    const b=document.createElement('button');b.className='pick'+(nx===5?' brk':'');b.style.setProperty('--c','rgb('+S.col+')');b.disabled=true;
    b.innerHTML=`<div class="ic" style="--c:rgb(${S.col})">${S.icon}</div><div><b>${S.name} <span class="lvl">· ${S.type}</span></b>
      <span class="lvl">${cur?('Lv'+cur+' → Lv'+nx):(adMode?'✦ 新技能 直接 Lv5 ★突破':'✦ 新技能 Lv1')}${(nx===5&&cur)?' ★突破！':''}</span><div class="eff">${S.row(nx)}</div></div>`;
    b.addEventListener('click',()=>choose(id));box.appendChild(b);
  }
  show('lvl');enforceMinFont($('#lvl'));
  setTimeout(()=>box.querySelectorAll('.pick').forEach(b=>b.disabled=false),420);   // 防止誤觸
}

    const stroke=s?`rgba(${col},1)`:'rgba(255,255,255,.28)';
    const mx=(v1[0]+v2[0])/2,my=(v1[1]+v2[1])/2;
    const lx=cx+(mx-cx)*.62,ly=cy+(my-cy)*.62;
    const label=s?RUNE_SCHOOLS[s.school].short+' Lv'+s.lv:'—';
    const pct=s?('+'+RUNE_LEVEL_PCT(s.lv)+'%'):'未選';
    tris+=`<polygon points="${cx},${cy} ${v1[0].toFixed(1)},${v1[1].toFixed(1)} ${v2[0].toFixed(1)},${v2[1].toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`
      +`<text x="${lx.toFixed(1)}" y="${(ly-8).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" stroke="rgba(0,0,0,.85)" stroke-width="3" paint-order="stroke">${label}</text>`
      +`<text x="${lx.toFixed(1)}" y="${(ly+10).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="800" fill="#ffd166" stroke="rgba(0,0,0,.85)" stroke-width="3" paint-order="stroke">${pct}</text>`;
  }
  const outer=vert.map(v=>v[0].toFixed(1)+','+v[1].toFixed(1)).join(' ');
  return `<svg class="rune-pentagon" viewBox="0 0 220 220" role="img" aria-label="銘文五角形，五個三角形各代表一個銘文"><polygon points="${outer}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/>${tris}<circle cx="${cx}" cy="${cy}" r="3" fill="#fff"/></svg>`;
}
function buildRuneUI(){
  const b=$('#runeBody');if(!b)return;
  b.innerHTML=`<div class="card"><h3>💎 銘文規則（全數公開）</h3><ul>
    <li>銘文由 <b style="color:var(--gd)">5 個三角形組成的五角形</b> 構成，每個三角形 = 1 個銘文，任何流派都固定 5 個銘文。</li>
    <li>銘文等級：<b>Lv1 +1%、Lv2 +2%、Lv3 +3%、Lv4 +4%、Lv5 +10%</b>。</li>
    <li>固定流派（攻擊 / 冷卻 / 保命 / 機動 / 智選）：5 個銘文固定為 Lv1、Lv2、Lv3、Lv4、Lv5，合計 <b>1+2+3+4+10 = +20%</b>。</li>
    <li>全能流：固定為 5 種不同流派的 Lv4（攻擊／冷卻／保命／機動／智選 各 1 個 Lv4），合計 <b>+20%</b>。</li>
    <li>攻擊流：傷害 +% · 冷卻流：冷卻時間 -% · 保命流：每 5 秒回復最大生命 +% · 機動流：移速 +% 且迴避率 +% · 智選流：開局經驗 +%。</li>
    <li>開始生存前，必須先在這裡選擇一個流派。</li></ul></div>
    <div class="card"><h3>⬣ 銘文五角形</h3><div class="rune-pentagon-wrap"><div id="runePentagon"></div><div class="rune-totals" id="runeTotals"></div></div>
    <p class="rune-warn" id="runeWarn"></p></div>
    <div class="card"><h3>🎯 選擇流派</h3><div class="rune-schools" id="runeSchools"></div>
    <p class="rune-current" id="runeSelectedLine" style="margin-top:10px"></p></div>
    <div class="card"><div id="runeDetail"></div></div>`;
  if(!runeBound){b.addEventListener('click',runeBodyClick);runeBound=true;}
  renderRune();
}
let runeBound=false;
function runeBodyClick(e){
  const el=e.target.closest('[data-rune-action]');if(!el)return;
  const act=el.dataset.runeAction;
  if(act==='select-school'){
    const mode=el.dataset.school;
    runeView=mode;
    selectedRune={mode,slots:runeSlotsForFixed(mode)};
    renderRune();return;
  }
}
function renderRune(){
  const pg=$('#runePentagon');if(!pg)return;
  const viewSlots=runeSlotsForFixed(runeView);
  pg.innerHTML=runePentagonSVG(viewSlots);
  const tot=calcRuneTotals(viewSlots);
  const sumNote=runeView==='omni'?'固定 5 個 Lv4（5 流派各 1）= +20%':'固定 5 個銘文：Lv1 + Lv2 + Lv3 + Lv4 + Lv5 = +20%';
  $('#runeTotals').innerHTML='<b>'+runeTotalsText(tot)+'</b><br>合計 +'+tot.total+'% · '+sumNote;
  /* 流派按鈕 */
  const schoolsEl=$('#runeSchools');
  const modes=[['atk','固定'],['cd','固定'],['life','固定'],['move','固定'],['smart','固定'],['omni','全能']];
  schoolsEl.innerHTML=modes.map(([m])=>{
    const isOmni=m==='omni';
    const S=isOmni?{name:'全能流',icon:'✦',desc:'5 種不同流派的 Lv4，合計 +20%'}:RUNE_SCHOOLS[m];
    const active=runeView===m?' active':'';
    const sel=(selectedRune&&selectedRune.mode===m)?' sel':'';
    const tag=(selectedRune&&selectedRune.mode===m)?'✓ 已選擇':(isOmni?'全能 +20%':'固定 +20%');
    return `<button class="rune-school${active}${sel}" data-rune-action="select-school" data-school="${m}"><b>${S.icon} ${S.name}</b><span>${S.desc}</span><br><span class="rune-tag">${tag}</span></button>`;
  }).join('');
  $('#runeSelectedLine').textContent=runeSelectedText();
  const cur=$('#runeCurrent');if(cur)cur.textContent=runeSelectedText();
  /* 詳細資訊：像圖鑑列出每一級 */
  const det=$('#runeDetail');
  if(runeView==='omni'){
    det.innerHTML=`<h3>✦ 全能流 — 詳細資訊</h3><p style="font-size:var(--fs-min);line-height:1.6;color:#dfe6ff">固定為 5 種不同流派的 Lv4，一次擁有全部效果：</p><ul class="lvs">`
      +RUNE_OMNI_SLOTS.map(s=>`<li><span class="lvn">${RUNE_SCHOOLS[s.school].short} Lv4</span><span>${RUNE_SCHOOLS[s.school].icon} ${RUNE_SCHOOLS[s.school].name} — ${runeEffectText(s.school,4)}</span></li>`).join('')
      +`</ul><p style="font-size:var(--fs-min);line-height:1.6;color:#dfe6ff;margin-top:8px">合計：4% × 5 = <b style="color:var(--gd)">+20%</b></p>`;
  }else{
    const S=RUNE_SCHOOLS[runeView];
    det.innerHTML=`<h3>${S.icon} ${S.name} — 詳細資訊</h3><p style="font-size:var(--fs-min);line-height:1.6;color:#dfe6ff">${S.desc}。固定 5 個銘文：</p><ul class="lvs">`
      +[1,2,3,4,5].map(lv=>`<li class="${lv===5?'brk':''}"><span class="lvn">Lv${lv}${lv===5?' ★':''}</span><span>${runeEffectText(runeView,lv)}</span></li>`).join('')+`</ul><p style="font-size:var(--fs-min);line-height:1.6;color:#dfe6ff;margin-top:8px">合計：1% + 2% + 3% + 4% + 10% = <b style="color:var(--gd)">+20%</b></p>`;
  }
  enforceMinFont($('#rune'));
}

/* ---------------- 輸入 ---------------- */
const joyMax=()=>Math.max(40,VW*.14);
function pdown(e){
  if(state!=='play'||input.active)return;
  const r=app.getBoundingClientRect();input.active=true;input.id=e.pointerId;
  input.ox=e.clientX-r.left;input.oy=e.clientY-r.top;input.dx=input.dy=0;
  el.joy.style.left=input.ox+'px';el.joy.style.top=input.oy+'px';el.knob.style.transform='translate(0,0)';el.joy.classList.add('on');
  try{el.touch.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
}
function pmove(e){
  if(!input.active||e.pointerId!==input.id)return;
  const r=app.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  let dx=x-input.ox,dy=y-input.oy;const l=Math.hypot(dx,dy),m=joyMax();
  if(l>m){const k=(l-m)/l;input.ox+=dx*k;input.oy+=dy*k;dx=x-input.ox;dy=y-input.oy;el.joy.style.left=input.ox+'px';el.joy.style.top=input.oy+'px'}
  const L=Math.hypot(dx,dy)||1,v=Math.min(1,L/m);
  if(v<.1){input.dx=input.dy=0}else{input.dx=dx/L*v;input.dy=dy/L*v}
  const kx=dx/L*Math.min(L,m)*.6,ky=dy/L*Math.min(L,m)*.6;
  el.knob.style.transform=`translate(${kx}px,${ky}px)`;
  e.preventDefault();
}
function pup(e){
  if(e.pointerId!==input.id)return;input.active=false;input.dx=input.dy=0;el.joy.classList.remove('on');
}
el.touch.addEventListener('pointerdown',pdown);
el.touch.addEventListener('pointermove',pmove);
el.touch.addEventListener('pointerup',pup);
el.touch.addEventListener('pointercancel',pup);
window.addEventListener('keydown',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=true;if(e.key==='Escape'||e.key==='p'){state==='play'?pauseGame():state==='pause'&&resumeGame()}});
window.addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

$('#btnStart').addEventListener('click',()=>{reqFS();startGame()});   // 點擊後立刻進入遊戲並請求全螢幕
$('#btnAd').addEventListener('click',()=>show('ad'));
$('#adClose').addEventListener('click',()=>hide('ad'));
$('#btnAdCancel').addEventListener('click',()=>hide('ad'));
$('#btnAdWatch').addEventListener('click',()=>{hide('ad');reqFS();startGame(true)});
$('#btnCodex').addEventListener('click',()=>{show('codex');$('#codexBody').scrollTop=0});
$('#codexClose').addEventListener('click',()=>hide('codex'));
$('#btnRune').addEventListener('click',()=>{buildRuneUI();show('rune');$('#runeBody').scrollTop=0});
$('#runeClose').addEventListener('click',()=>hide('rune'));
$('#btnPause').addEventListener('click',pauseGame);
$('#btnTimeStop').addEventListener('click',useTimeStop);
$('#btnResume').addEventListener('click',resumeGame);
$('#btnQuit').addEventListener('click',toMenu);
$('#btnAgain').addEventListener('click',()=>{reqFS();startGame()});
$('#btnMenu').addEventListener('click',toMenu);

/* ---------------- 主迴圈 ---------------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;T+=dt;
  if(state==='menu'){drawMenu(dt);return}
  if(state==='play')update(dt);
  else if(state==='dying'){updateFx(dt*.4);dyingT-=dt;el.hurt.style.opacity=0;if(dyingT<=0)showResult()}
  else if(state==='showcase'){updateFx(dt);if(timeSlow>0)timeSlow-=dt;showcaseT-=dt;if(showcaseT<=0)endGame()}
  render();
}
resize();buildCodex();buildRuneUI();enforceMinFont(document.body);
newGame();state='menu';app.classList.remove('ingame');
requestAnimationFrame(frame);
})();
</script>
