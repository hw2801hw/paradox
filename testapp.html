<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>單一檔案 PWA - GitHub Pages 修正版</title>

  <!-- 內嵌 Manifest -->
  <script type="application/manifest+json">
  {
    "name": "單一檔案 PWA 示範",
    "short_name": "單檔PWA",
    "description": "單 HTML 檔 PWA，支援 GitHub Pages",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#ffffff",
    "theme_color": "#1976d2",
    "icons": [
      {
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231976d2'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white'>P</text></svg>",
        "sizes": "192x192",
        "type": "image/svg+xml",
        "purpose": "any maskable"
      },
      {
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231976d2'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white'>P</text></svg>",
        "sizes": "512x512",
        "type": "image/svg+xml",
        "purpose": "any maskable"
      }
    ]
  }
  </script>

  <!-- 相容性 meta（消除 deprecated 警告 + Apple 支援） -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1976d2">

  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f0f4f8; color: #333; text-align: center; }
    h1 { color: #1976d2; }
    button { padding: 12px 24px; font-size: 1.1rem; background: #1976d2; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px; }
    #status { margin-top: 20px; font-style: italic; color: #555; white-space: pre-wrap; }
    pre { background: #eee; padding: 10px; border-radius: 6px; text-align: left; max-width: 90%; margin: 20px auto; overflow: auto; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>單一 HTML PWA（已修正錯誤）</h1>
  <p>用 DevTools（F12） → Console 查看詳細 log。<br>如果仍有問題，請貼出 Console 完整錯誤訊息。</p>

  <button id="installBtn" style="display:none;">安裝到裝置</button>
  <div id="status">載入中...</div>
  <pre id="log">Log 輸出區...\n</pre>

  <script type="module">
    const logElement = document.getElementById('log');
    const statusElement = document.getElementById('status');
    let deferredPrompt = null;

    function appendLog(msg) {
      console.log(msg);
      logElement.textContent += msg + '\n';
    }

    statusElement.textContent = '檢查環境中...';

    if (!('serviceWorker' in navigator)) {
      statusElement.textContent = '瀏覽器不支援 Service Worker（無法離線）';
      appendLog('錯誤：無 serviceWorker 支援');
    } else {
      appendLog('Service Worker API 可用');

      window.addEventListener('load', async () => {
        appendLog('開始註冊 Service Worker...');

        try {
          const swCode = `
            const CACHE_NAME = 'single-pwa-v1';
            const urlsToCache = ['.'];

            self.addEventListener('install', event => {
              event.waitUntil(
                caches.open(CACHE_NAME)
                  .then(cache => cache.addAll(urlsToCache))
                  .then(() => self.skipWaiting())
              );
            });

            self.addEventListener('activate', event => {
              event.waitUntil(self.clients.claim());
            });

            self.addEventListener('fetch', event => {
              event.respondWith(
                caches.match(event.request)
                  .then(response => response || fetch(event.request))
              );
            });
          `;

          const blob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(blob);

          appendLog('Blob SW URL: ' + swUrl);

          const registration = await navigator.serviceWorker.register(swUrl, { scope: './' });

          appendLog('註冊成功！Scope: ' + registration.scope);
          statusElement.textContent = 'Service Worker 已註冊 ✓（支援離線）';

          registration.addEventListener('updatefound', () => appendLog('發現 SW 更新...'));
        } catch (err) {
          appendLog('註冊失敗：');
          appendLog('錯誤名稱: ' + (err.name || '未知'));
          appendLog('錯誤訊息: ' + (err.message || '無詳細訊息'));
          appendLog('完整錯誤: ' + err);

          statusElement.textContent = 'Service Worker 註冊失敗 ✗\n請檢查上方 log';
        }
      });
    }

    // 安裝提示處理
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'inline-block';
      appendLog('beforeinstallprompt 觸發 → 可安裝');
      statusElement.textContent += '\n（可安裝！點擊上方按鈕）';
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      appendLog('安裝選擇結果: ' + outcome);
      deferredPrompt = null;
      document.getElementById('installBtn').style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      appendLog('PWA 安裝成功！');
      statusElement.textContent = '已安裝到裝置 🎉';
    });
  </script>
</body>
</html>
