<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>單檔 PWA - GitHub Pages 修正版</title>

  <!-- 簡化 + 正確 encoded 的 data: manifest（避免 syntax error） -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Single%20File%20PWA%22%2C%22short_name%22%3A%22SinglePWA%22%2C%22description%22%3A%22Single%20HTML%20PWA%20demo%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%231976d2%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fvia.placeholder.com%2F192%2F1976d2%2Fffffff%3Ftext%3DP%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%2C%7B%22src%22%3A%22https%3A%2F%2Fvia.placeholder.com%2F512%2F1976d2%2Fffffff%3Ftext%3DP%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

  <!-- 相容性 meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1976d2">

  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f0f4f8; color: #333; text-align: center; }
    h1 { color: #1976d2; }
    button { padding: 12px 24px; font-size: 1.1rem; background: #1976d2; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px; }
    #status { margin-top: 20px; font-style: italic; color: #555; white-space: pre-wrap; }
    pre { background: #eee; padding: 10px; border-radius: 6px; text-align: left; max-width: 90%; margin: 20px auto; overflow: auto; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>單一 HTML PWA（已修正 manifest syntax error）</h1>
  <p>Manifest 應正常載入（DevTools Application → Manifest 檢查）。<br>安裝提示應出現（地址列或下方按鈕）。</p>

  <button id="installBtn" style="display:none;">安裝到裝置</button>
  <div id="status">載入中...</div>
  <pre id="log">Log 輸出區...\n</pre>

  <script type="module">
    const logElement = document.getElementById('log');
    const statusElement = document.getElementById('status');
    let deferredPrompt = null;

    function appendLog(msg) {
      console.log(msg);
      logElement.textContent += msg + '\n';
    }

    statusElement.textContent = 'Manifest (data: URL 簡化版) 已載入';
    appendLog('使用外部 placeholder icon + 簡化 JSON → 避免 encode 錯誤');
    appendLog('無 Service Worker（單檔限制）');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'inline-block';
      appendLog('beforeinstallprompt 觸發 → 可安裝');
      statusElement.textContent += '\n（可安裝！點擊上方按鈕）';
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) {
        appendLog('無安裝提示（可能已安裝或瀏覽器不支援）');
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      appendLog('安裝結果: ' + outcome);
      deferredPrompt = null;
      document.getElementById('installBtn').style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      appendLog('PWA 安裝成功！');
      statusElement.textContent = '已安裝到裝置 🎉';
    });
  </script>
</body>
</html>
