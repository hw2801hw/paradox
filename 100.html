<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>彈射決鬥</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top);
      --safe-right: env(safe-area-inset-right);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);
      --panel: rgba(8, 14, 24, 0.74);
      --panel-strong: rgba(12, 18, 30, 0.92);
      --line: rgba(255, 255, 255, 0.14);
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
      --danger: #fb7185;
      --good: #34d399;
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, 0.72);
    }

    html {
      font-size: 16px;
      color-scheme: dark;
      -webkit-text-size-adjust: 100%;
    }

    body, button, input, label, select, textarea {
      font-size: 1rem;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(125, 211, 252, 0.14), transparent 35%),
        linear-gradient(180deg, #020617 0%, #0f172a 55%, #020617 100%);
      color: var(--text);
      touch-action: none;
    }

    #app {
      position: fixed;
      inset: 0;
      box-sizing: border-box;
      padding:
        calc(var(--safe-top) + 12px)
        calc(var(--safe-right) + 12px)
        calc(var(--safe-bottom) + 12px)
        calc(var(--safe-left) + 12px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(7, 12, 20, 0.98), rgba(4, 7, 14, 1));
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.34), rgba(2, 6, 23, 0.58));
      backdrop-filter: blur(14px);
      transition: opacity 0.24s ease, transform 0.24s ease;
      z-index: 20;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px) scale(0.98);
    }

    .panel {
      width: min(100%, 46rem);
      max-height: min(86%, 48rem);
      overflow: auto;
      border-radius: 24px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.32);
      padding: 1rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(125, 211, 252, 0.5) transparent;
    }

    .panel::-webkit-scrollbar {
      width: 12px;
    }

    .panel::-webkit-scrollbar-thumb {
      background: rgba(125, 211, 252, 0.35);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: content-box;
    }

    .title-glow {
      text-shadow: 0 0 24px rgba(125, 211, 252, 0.28);
      animation: floatTitle 4.8s ease-in-out infinite;
    }

    @keyframes floatTitle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .btn {
      min-height: 3rem;
      padding: 0.75rem 1rem;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.78));
      color: var(--text);
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(125, 211, 252, 0.5);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
    }

    .btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .btn-primary {
      background: linear-gradient(180deg, rgba(59, 130, 246, 0.95), rgba(37, 99, 235, 0.9));
      border-color: rgba(125, 211, 252, 0.45);
    }

    .btn-ghost {
      background: rgba(15, 23, 42, 0.58);
    }

    .btn-danger {
      background: linear-gradient(180deg, rgba(244, 63, 94, 0.95), rgba(190, 24, 93, 0.9));
      border-color: rgba(251, 113, 133, 0.42);
    }

    .hud {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: 0.75rem;
      gap: 0.75rem;
      z-index: 10;
    }

    .hud.hidden {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      width: 100%;
      pointer-events: auto;
    }

    .hud-pill {
      min-height: 2.8rem;
      border-radius: 18px;
      background: rgba(8, 14, 24, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 0.5rem 0.8rem;
      gap: 0.6rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .meter {
      flex: 1;
      height: 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-width: 80px;
    }

    .meter > div {
      height: 100%;
      border-radius: inherit;
      transition: width 0.18s ease;
    }

    .meter-good { background: linear-gradient(90deg, #22c55e, #86efac); }
    .meter-danger { background: linear-gradient(90deg, #fb7185, #f43f5e); }
    .small-note {
      color: var(--muted);
      line-height: 1.5;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 900;
      margin: 0 0 0.75rem 0;
      letter-spacing: 0.02em;
    }

    .menu-grid {
      width: min(100%, 28rem);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .brand {
      font-size: clamp(2.1rem, 5vw, 3.8rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1;
    }

    .brand-sub {
      text-align: center;
      color: rgba(248, 250, 252, 0.74);
      line-height: 1.5;
      max-width: 32rem;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .choice-card {
      min-height: 8.3rem;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .choice-card:hover {
      transform: translateY(-1px);
      border-color: rgba(125, 211, 252, 0.5);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .choice-card.active {
      border-color: rgba(125, 211, 252, 0.9);
      box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.2), 0 14px 34px rgba(0, 0, 0, 0.32);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.86));
    }

    .choice-name {
      font-size: 1.05rem;
      font-weight: 900;
    }

    .choice-meta {
      color: rgba(248, 250, 252, 0.75);
      line-height: 1.45;
    }

    .choice-rows {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .row-item {
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.62);
      padding: 0.85rem;
    }

    .row-item strong {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 1.05rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gameCanvas"></canvas>

      <!-- 主選單介面 -->
      <div id="menuScreen" class="overlay">
        <button id="fullscreenBtn" class="btn btn-ghost text-base absolute top-4 right-4 flex items-center gap-2 z-10" aria-label="全螢幕">
          <span id="fullscreenIcon">⛶</span> <span id="fullscreenText">全螢幕</span>
        </button>

        <div class="menu-grid">
          <div>
            <div class="brand title-glow">彈射決鬥</div>
            <p class="brand-sub mx-auto mt-4 text-base">
              2D 側視物理投擲對戰。按住畫面任意處拖拽拉弓瞄準，360 度無死角發射！
            </p>
          </div>
          <button id="startBtn" class="btn btn-primary text-base">開始遊玩</button>
          <button id="encyclopediaBtn" class="btn btn-ghost text-base">武器圖鑑</button>
          <button id="skillsBtn" class="btn btn-ghost text-base">角色技能</button>
          <p class="small-note text-base text-center">
            往左下拖拉向右上發射，往右下拖拉向左上發射！
          </p>
        </div>
      </div>

      <div id="hud" class="hud hidden">
        <div class="topbar">
          <!-- 左側：玩家 HP -->
          <div class="hud-pill flex-1 max-w-[220px]">
            <div class="font-black text-amber-400 mr-1 min-w-[1.8rem]">你</div>
            <div class="meter"><div id="playerMeter" class="meter-good" style="width: 100%;"></div></div>
            <div id="playerHp" class="font-black ml-1 min-w-[3.2rem] text-right">1000</div>
          </div>

          <!-- 正中間：退出按鈕與回合提示 -->
          <div class="flex flex-col items-center">
            <button id="exitGameBtn" class="btn btn-danger text-base px-4 py-1.5" style="min-height: 2.4rem;">退出</button>
            <div id="turnTag" class="text-base font-extrabold text-cyan-300 mt-1 bg-slate-900/85 px-3 py-0.5 rounded-full border border-white/10 shadow-md">你的回合</div>
          </div>

          <!-- 右側：AI HP -->
          <div class="hud-pill flex-1 max-w-[220px] justify-end">
            <div id="aiHp" class="font-black mr-1 min-w-[3.2rem] text-left">1000</div>
            <div class="meter"><div id="aiMeter" class="meter-danger" style="width: 100%;"></div></div>
            <div class="font-black text-rose-400 ml-1 min-w-[1.8rem] text-right">AI</div>
          </div>
        </div>

        <!-- 技能發動按鈕 -->
        <div id="skillBtnWrapper" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 pointer-events-auto hidden">
          <button id="skillBtn" class="btn border-yellow-400 bg-yellow-900/80 text-yellow-100 px-6 py-2 rounded-full font-bold shadow-lg transition-transform pointer-events-none opacity-50" style="min-width: 160px; font-size: 1.1rem; border-width: 2px;">
            技能: 0/100%
          </button>
        </div>
      </div>

      <div id="selectionModal" class="overlay hidden">
        <div class="panel">
          <div class="section-title">開始遊玩</div>
          <p class="small-note text-base mb-4">先選角色，再選武器。AI 會自動隨機配置。</p>

          <div class="choice-rows mb-4">
            <div>
              <div class="label mb-2 font-bold">角色</div>
              <div id="characterGrid" class="choice-grid"></div>
            </div>

            <div>
              <div class="label mb-2 font-bold">武器</div>
              <div id="weaponGrid" class="choice-grid"></div>
            </div>
          </div>

          <div class="row-item mb-4">
            <strong>目前配置</strong>
            <div id="selectionSummary" class="small-note text-base"></div>
          </div>

          <div class="flex flex-wrap gap-3 justify-end">
            <button id="cancelSelectionBtn" class="btn btn-ghost text-base">返回主選單</button>
            <button id="confirmSelectionBtn" class="btn btn-primary text-base">確認出戰</button>
          </div>
        </div>
      </div>

      <div id="encyclopediaModal" class="overlay hidden">
        <div class="panel">
          <div class="section-title">武器圖鑑</div>
          <p class="small-note text-base mb-4">基礎命中固定傷害皆為 100，速度皆已統一，可專注於彈跳、體積尺寸與地形破壞能力的運用。</p>
          <div id="weaponList" class="choice-rows"></div>
          <div class="mt-4 flex justify-end">
            <button class="btn btn-ghost text-base closePanelBtn">關閉</button>
          </div>
        </div>
      </div>

      <div id="skillsModal" class="overlay hidden">
        <div class="panel">
          <div class="section-title">角色技能</div>
          <p class="small-note text-base mb-4">所有角色生命統一為 1000，各自擁有獨特的被動技能。</p>
          <div id="skillsList" class="choice-rows"></div>
          <div class="mt-4 flex justify-end">
            <button class="btn btn-ghost text-base closePanelBtn">關閉</button>
          </div>
        </div>
      </div>

      <div id="resultModal" class="overlay hidden">
        <div class="panel text-center">
          <div id="resultTitle" class="section-title" style="font-size: 1.6rem;">勝負已分</div>
          <p id="resultText" class="small-note text-base mb-4">---</p>
          <div class="flex flex-wrap gap-3 justify-center">
            <button id="againBtn" class="btn btn-primary text-base">再來一局</button>
            <button id="backMenuBtn" class="btn btn-ghost text-base">回到主選單</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const dom = {
        app: document.getElementById('app'),
        stage: document.getElementById('stage'),
        menuScreen: document.getElementById('menuScreen'),
        hud: document.getElementById('hud'),
        skillBtnWrapper: document.getElementById('skillBtnWrapper'),
        skillBtn: document.getElementById('skillBtn'),
        selectionModal: document.getElementById('selectionModal'),
        encyclopediaModal: document.getElementById('encyclopediaModal'),
        skillsModal: document.getElementById('skillsModal'),
        resultModal: document.getElementById('resultModal'),
        startBtn: document.getElementById('startBtn'),
        encyclopediaBtn: document.getElementById('encyclopediaBtn'),
        skillsBtn: document.getElementById('skillsBtn'),
        cancelSelectionBtn: document.getElementById('cancelSelectionBtn'),
        confirmSelectionBtn: document.getElementById('confirmSelectionBtn'),
        exitGameBtn: document.getElementById('exitGameBtn'),
        fullscreenBtn: document.getElementById('fullscreenBtn'),
        fullscreenText: document.getElementById('fullscreenText'),
        fullscreenIcon: document.getElementById('fullscreenIcon'),
        turnTag: document.getElementById('turnTag'),
        playerMeter: document.getElementById('playerMeter'),
        aiMeter: document.getElementById('aiMeter'),
        playerHp: document.getElementById('playerHp'),
        aiHp: document.getElementById('aiHp'),
        characterGrid: document.getElementById('characterGrid'),
        weaponGrid: document.getElementById('weaponGrid'),
        selectionSummary: document.getElementById('selectionSummary'),
        weaponList: document.getElementById('weaponList'),
        skillsList: document.getElementById('skillsList'),
        resultTitle: document.getElementById('resultTitle'),
        resultText: document.getElementById('resultText'),
        againBtn: document.getElementById('againBtn'),
        backMenuBtn: document.getElementById('backMenuBtn'),
      };

      // 100米地圖規模 (3400px，每米約 34px)
      const WORLD = {
        width: 3400,
        height: 980,
        groundPad: 82,
      };

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function saveSetting(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch (e) {}
      }

      function loadSetting(key, defaultVal) {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : defaultVal;
        } catch (e) {
          return defaultVal;
        }
      }

      const characters = [
        {
          id: 'shadow',
          name: '影之武士',
          speedBonus: 0.1,
          splashBonus: 0,
          recoilResist: 0.1,
          skill: '10% 機率閃避傷害，10% 機率獲得額外回合',
          color: '#a855f7',
        },
        {
          id: 'guardian',
          name: '鋼鐵守護者',
          speedBonus: 0,
          splashBonus: 0,
          recoilResist: 0.4,
          skill: '開局自帶 1 層護盾，25% 機率受到傷害減半',
          color: '#3b82f6',
        },
        {
          id: 'engineer',
          name: '爆破專家',
          speedBonus: 0.05,
          splashBonus: 0.25,
          recoilResist: 0.1,
          skill: '武器彈跳+3次，每彈跳 1 次該回合體積/坑洞+5',
          color: '#f97316',
        },
        {
          id: 'mountain',
          name: '泰山巨兵',
          speedBonus: -0.1,
          splashBonus: 0,
          recoilResist: 0.6,
          skill: '反彈 9% 受到的傷害；HP 低於 50% 時視野能看更遠',
          color: '#22c55e',
        },
      ];

      const weapons = [
        {
          id: 'hammer',
          name: '重錘球',
          bounces: 2,
          radius: 25,
          speed: 1.0,
          gravity: 1.0,
          bounce: 0.4,
          color: '#eab308',
          splash: 50,
          terrainRadius: 40,
          terrainDepth: 30,
          ability: '重型彈體，10% 機率使敵人眩暈',
          skillDesc: '發動後本回合先後連擲 2 次',
        },
        {
          id: 'flare',
          name: '爆裂瓶',
          bounces: 1,
          radius: 20,
          speed: 1.1,
          gravity: 0.9,
          bounce: 0.2,
          color: '#ef4444',
          splash: 45,
          terrainRadius: 35,
          terrainDepth: 25,
          ability: '每次彈跳與終點皆四濺 4 朵殘留火焰',
          skillDesc: '發動後本回合同時並行 3 瓶散射',
        },
        {
          id: 'bounce_ball',
          name: '彈彈球',
          bounces: 4,
          radius: 10,
          speed: 1.0,
          gravity: 1.0,
          bounce: 0.5,
          color: '#38bdf8',
          splash: 30,
          terrainRadius: 10,
          terrainDepth: 10,
          ability: '每彈跳 1 次，本局攻擊永久疊加 1%',
          skillDesc: '發動後本局彈跳次數額外 +5',
        },
        {
          id: 'water_burst',
          name: '蜘蛛蛋',
          bounces: 0,
          radius: 30,
          speed: 1.0,
          gravity: 1.0,
          bounce: 0.2,
          color: '#06b6d4',
          splash: 30,
          terrainRadius: 30,
          terrainDepth: 30,
          ability: '同時並行5發散射+先後連擲4次(共20發蜘蛛蛋)，蜘蛛蛋於兩回合後孵化停留原地',
          skillDesc: '發動後本回合轉為單發母蜘蛛(彈跳3次•體積/坑洞:60)，命中敵人時造成100傷害，並會命令所有小蜘蛛立即追蹤敵人，每隻隨機造成1~9點傷害後消失。如果母蜘蛛沒有命中敵人，那麼全部小蜘蛛都會死亡，並會恢復角色300HP。',
        },
      ];

      function getCharacter(id) {
        return characters.find((c) => c.id === id) || characters[0];
      }

      function getWeapon(id) {
        return weapons.find((w) => w.id === id) || weapons[0];
      }

      const cloudSeeds = Array.from({ length: 14 }, () => ({
        x: Math.random() * WORLD.width,
        y: 60 + Math.random() * 260,
        s: 0.7 + Math.random() * 0.6,
        w: 0.8 + Math.random() * 0.5,
      }));

      const state = {
        phase: 'menu',
        selectedCharacterId: loadSetting('selectedCharacterId', 'shadow'),
        selectedWeaponId: loadSetting('selectedWeaponId', 'bounce_ball'),
        match: null,
        camera: { x: 0, y: 0, shake: 0 },
        cameraFocus: 'player',
        viewW: window.innerWidth,
        viewH: window.innerHeight,
        dpr: window.devicePixelRatio || 1,
        time: 0,
        lastTs: 0,
        aiDelay: 0,
        turnDelay: 0,
        particles: [],
        floatingTexts: [],
        flash: null,
      };

      const dragState = {
        active: false,
        pointerId: null,
        startX: 0,
        startY: 0,
        currentX: 0,
        currentY: 0,
      };

      const TERRAIN_STEP = 2;
      const terrainSamples = [];

      function buildTerrain() {
        terrainSamples.length = 0;
        for (let x = 0; x <= WORLD.width + TERRAIN_STEP; x += TERRAIN_STEP) {
          terrainSamples.push({ x, y: terrainHeightRaw(x) });
        }
      }

      function terrainHeightRaw(x) {
        const u = (x - 1700) / 1700;
        const clampedU = clamp(u, -1, 1);
        return 800 - 260 * (1 - Math.sqrt(1 - clampedU * clampedU));
      }

      function terrainHeightAt(x) {
        const clamped = clamp(x, 0, WORLD.width);
        const index = Math.floor(clamped / TERRAIN_STEP);
        const a = terrainSamples[index] || terrainSamples[0];
        const b = terrainSamples[index + 1] || a;
        const t = (clamped - a.x) / TERRAIN_STEP;
        return lerp(a.y, b.y, clamp(t, 0, 1));
      }

      function destroyTerrain(impactX, impactY, R) {
        const currentY = terrainHeightAt(impactX);
        const surfaceY = Math.max(impactY, currentY);

        for (let i = 0; i < terrainSamples.length; i++) {
          const pt = terrainSamples[i];
          const dx = Math.abs(pt.x - impactX);
          if (dx < R) {
            const craterY = surfaceY + Math.sqrt(R * R - dx * dx);
            if (pt.y < craterY) {
              pt.y = Math.min(WORLD.height - WORLD.groundPad, craterY);
            }
          }
        }
      }

      function createPlayer(def, side) {
        const x = side === 'left' ? 1615 : 1785;
        const y = terrainHeightAt(x);
        return {
          side,
          def,
          x,
          y,
          vx: 0,
          vy: 0,
          hpMax: 1000,
          hp: 1000,
          flash: 0,
          bobSeed: Math.random() * Math.PI * 2,
          aimAngle: side === 'left' ? 45 : 135,
          aimPower: 70,
          recoilTimer: 0,
          shield: def.id === 'guardian' ? 1 : 0,
          stunned: false,
        };
      }

      function createMatch() {
        buildTerrain();
        const playerDef = getCharacter(state.selectedCharacterId);
        const weaponDef = getWeapon(state.selectedWeaponId);
        const aiDef = pick(characters.filter((item) => item.id !== playerDef.id));
        const aiWeapon = pick(weapons);

        return {
          turn: 0,
          round: 1,
          extraTurn: false,
          winner: null,
          player: createPlayer(playerDef, 'left'),
          ai: createPlayer(aiDef, 'right'),
          playerWeapon: weaponDef,
          aiWeapon,
          projectiles: [],
          spiders: [],
          aiProfile: aiDef,
          aiWeaponDef: aiWeapon,
          lastTrajectories: [],
          playerSkillCharge: 0,
          aiSkillCharge: 0,
          hammerSeqActive: false,
          aiHammerSeqActive: false,
          flareSkillThisTurn: false,
          aiFlareSkillThisTurn: false,
          playerSpiderSkillActive: false,
          aiSpiderSkillActive: false,
          pendingSequentialShot: false,
          playerBounceDmgBonus: 0,
          aiBounceDmgBonus: 0,
          playerExtraBounces: 0,
          aiExtraBounces: 0,
        };
      }

      function openPanel(panel) {
        hideAllPanels();
        panel.classList.remove('hidden');
      }

      function hideAllPanels() {
        [dom.selectionModal, dom.encyclopediaModal, dom.skillsModal, dom.resultModal].forEach((panel) => {
          panel.classList.add('hidden');
        });
      }

      function showMenu() {
        state.phase = 'menu';
        state.match = null;
        state.camera.x = 1700 - (state.viewW || 800) / 2;
        state.camera.y = 160;
        state.aiDelay = 0;
        state.turnDelay = 0;
        dragState.active = false;
        hideAllPanels();
        dom.menuScreen.classList.remove('hidden');
        dom.hud.classList.add('hidden');
        dom.skillBtnWrapper.classList.add('hidden');

        renderSelectionSummary();
        openPanel(dom.selectionModal);

      function showEncyclopedia() {
        renderEncyclopedia();

      }

      function showSkills() {

      function startGame() {
        tryFullscreenAndLandscape();
        state.phase = 'game';
        state.match = createMatch();
        state.particles = [];
        state.floatingTexts = [];
        state.flash = null;
        state.camera.shake = 0;
        state.cameraFocus = 'player';
        dragState.active = false;
        
        dom.menuScreen.classList.add('hidden');
        dom.hud.classList.remove('hidden');
        dom.skillBtnWrapper.classList.remove('hidden');
        hideAllPanels();
        
        syncTurnUI();
        syncHpUI();
        syncSkillUI();
        beginTurn(0, true);
      }

      function endGame(winnerText) {
        state.phase = 'over';
        state.match.winner = winnerText;
        dom.resultTitle.textContent = winnerText === '你' ? '你贏了' : 'AI 贏了';
        dom.resultText.textContent = winnerText === '你'
          ? '漂亮的一擊，成功拆掉對手的血量。'
          : '這一局由 AI 率先抓到節奏。再試一次吧。';
        openPanel(dom.resultModal);
        dom.hud.classList.add('hidden');
        dom.skillBtnWrapper.classList.add('hidden');
      }

      async function tryFullscreenAndLandscape() {
        try {
          const docEl = document.documentElement;
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (docEl.requestFullscreen) {
              await docEl.requestFullscreen();
            } else if (docEl.webkitRequestFullscreen) {
              await docEl.webkitRequestFullscreen();
            } else if (docEl.msRequestFullscreen) {
              await docEl.msRequestFullscreen();
            }
          }
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape').catch(() => {});
          }
        } catch (err) {}
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          tryFullscreenAndLandscape();
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      }

      function updateFullscreenButton() {
        const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
        dom.fullscreenText.textContent = isFS ? '退出全螢幕' : '全螢幕';
        dom.fullscreenIcon.textContent = isFS ? '✕' : '⛶';
      }

      document.addEventListener('fullscreenchange', updateFullscreenButton);
      document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

      function syncSelectionModel() {
        saveSetting('selectedCharacterId', state.selectedCharacterId);
        saveSetting('selectedWeaponId', state.selectedWeaponId);
        renderSelectionCards();

      function renderSelectionSummary() {
        const character = getCharacter(state.selectedCharacterId);
