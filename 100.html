      function syncHpUI() {
        if (!state.match) return;
        const player = state.match.player;
        const ai = state.match.ai;
        dom.playerHp.textContent = Math.max(0, Math.ceil(player.hp));
        dom.aiHp.textContent = Math.max(0, Math.ceil(ai.hp));
        dom.playerMeter.style.width = `${clamp((player.hp / player.hpMax) * 100, 0, 100)}%`;
        dom.aiMeter.style.width = `${clamp((ai.hp / ai.hpMax) * 100, 0, 100)}%`;
      }

      function syncSkillUI() {
        if (!state.match) return;
        const progress = Math.min(100, state.match.playerSkillCharge || 0);
        dom.skillBtn.textContent = `技能: ${progress}/100%`;

        if (progress >= 100) {
            dom.skillBtn.classList.remove('pointer-events-none', 'opacity-50');
            dom.skillBtn.classList.add('cursor-pointer', 'hover:scale-105', 'bg-yellow-500', 'text-slate-900');
        } else {
            dom.skillBtn.classList.add('pointer-events-none', 'opacity-50');
            dom.skillBtn.classList.remove('cursor-pointer', 'hover:scale-105', 'bg-yellow-500', 'text-slate-900');
        }
      }

      function syncTurnUI() {
        if (!state.match) return;
        const whose = state.match.turn === 0 ? '你的回合 (請拉拽角色投擲)' : 'AI 回合';
        dom.turnTag.textContent = `${whose} · 第 ${state.match.round} 回合`;
      }

      function beginTurn(turnIndex, immediate = false) {
        if (!state.match || state.phase !== 'game') return;

        // 蜘蛛蛋於兩回合後自動孵化為小蜘蛛並留在原地
        if (state.match && state.match.spiders) {
          state.match.spiders.forEach(s => {
            if (!s.hatched) {
              if (s.turnsRemaining > 0) {
                s.turnsRemaining--;
                if (s.turnsRemaining <= 0) {
                  s.hatched = true;
                }
              }
            }
          });
        }

        // 檢查目標是否處於眩暈狀態 (暫停一回合)
        const activePlayer = turnIndex === 0 ? state.match.player : state.match.ai;
        if (activePlayer.stunned) {
          activePlayer.stunned = false;
          spawnFloatingText(activePlayer.x, activePlayer.y - 120, '眩暈中 跳過回合!', '#f5c15a');
          state.turnDelay = 1.2;
          return;
        }

        // 回合充能 20%
        if (turnIndex === 0) {
          state.match.playerSkillCharge = Math.min(100, (state.match.playerSkillCharge || 0) + 20);
          syncSkillUI();
        } else {
          state.match.aiSkillCharge = Math.min(100, (state.match.aiSkillCharge || 0) + 20);
        }

        state.match.turn = turnIndex;
        syncTurnUI();

        if (turnIndex === 0) {
          state.aiDelay = 0;
          state.turnDelay = 0;
          state.cameraFocus = 'player';
        } else {
          state.aiDelay = 0.85 + Math.random() * 0.55;
          state.cameraFocus = 'ai';
        }
      }

      function getShotOrigin(player, angleRad) {
        const rad = angleRad !== undefined ? angleRad : player.aimAngle * Math.PI / 180;
        return {
          x: player.x + Math.cos(rad) * 36,
          y: player.y - 60 - Math.sin(rad) * 36,
        };
      }

      function calculateTrajectoryPoints(startX, startY, angleDeg, powerValue, weapon, player) {
        const pts = [{ x: startX, y: startY }];
        const angleRad = angleDeg * Math.PI / 180;
        const baseSpeed = (300 + powerValue * 12) * weapon.speed * (1 + (player ? player.def.speedBonus : 0));
        let vx = Math.cos(angleRad) * baseSpeed;
        let vy = -Math.sin(angleRad) * baseSpeed;
        let x = startX;
        let y = startY;
        const gravity = 900 * weapon.gravity;
        const dt = 0.03;

        let bounces = weapon.bounces;
        if (state.match && player === state.match.player && state.match.playerSpiderSkillActive) {
          bounces = 3;
        } else if (state.match && player === state.match.ai && state.match.aiSpiderSkillActive) {
          bounces = 3;
        } else {
          if (player && player.def.id === 'engineer') bounces += 3;
          if (state.match && player === state.match.player && state.match.playerExtraBounces) bounces += state.match.playerExtraBounces;
          if (state.match && player === state.match.ai && state.match.aiExtraBounces) bounces += state.match.aiExtraBounces;
        }

        for (let i = 0; i < 80; i++) {
          vy += gravity * dt;
          x += vx * dt;
          y += vy * dt;

          if (x < 0 || x > WORLD.width) {
            vx *= -0.72;
            x = clamp(x, 0, WORLD.width);
          }

          const gY = terrainHeightAt(x);
          if (y >= gY) {
            pts.push({ x, y: gY });
            if (bounces > 0) {
              bounces--;
              vy = -Math.max(Math.abs(vy) * 1.01, Math.sqrt(2 * gravity * 130));
              vx = (vx >= 0 ? 1 : -1) * Math.max(Math.abs(vx) * 1.01, 200);
            } else {
              break;
            }
          } else {
            pts.push({ x, y });
          }
        }
        return pts;
      }

      function fireProjectile(angleDeg, powerValue, weapon, player, isAI = false, isWaterSubShot = false) {
        if (!state.match || state.phase !== 'game') return;

        // 扔出武器 2 秒後，使自身下方地形隆起正半圓形
        const shooterX = player.x;
        setTimeout(() => {
            if (!state.match) return;
            const raiseRadius = 60;
            for (let i = 0; i < terrainSamples.length; i++) {
                const pt = terrainSamples[i];
                const dx = Math.abs(pt.x - shooterX);
                if (dx < raiseRadius) {
                    const h = Math.sqrt(raiseRadius * raiseRadius - dx * dx);
                    pt.y = Math.max(0, pt.y - h);
                }
            }
        }, 2000);

        let isMother = false;
        if (weapon.id === 'water_burst') {
          if (!isAI && state.match.playerSpiderSkillActive) {
            isMother = true;
            state.match.playerSpiderSkillActive = false;
          } else if (isAI && state.match.aiSpiderSkillActive) {
            isMother = true;
            state.match.aiSpiderSkillActive = false;
          }
        }

        let numShots = 1;
        if (weapon.id === 'flare' && !isAI && state.match.flareSkillThisTurn) {
            numShots = 3;
            state.match.flareSkillThisTurn = false;
        } else if (weapon.id === 'flare' && isAI && state.match.aiFlareSkillThisTurn) {
            numShots = 3;
            state.match.aiFlareSkillThisTurn = false;
        } else if (weapon.id === 'water_burst' && !isMother) {
            numShots = 5; // 蜘蛛蛋普通攻擊：同時並行 5 發散射
        }

        // 蜘蛛蛋普通攻擊：先後連擲 4 次（共 20 發蜘蛛蛋）
        if (weapon.id === 'water_burst' && !isWaterSubShot && !isMother) {
            state.match.pendingSequentialShot = true;
            for (let v = 1; v < 4; v++) {
                setTimeout(() => {
                    if (state.match && state.phase === 'game') {
                        if (v === 3) state.match.pendingSequentialShot = false;
                        fireProjectile(angleDeg, powerValue, weapon, player, isAI, true);
                    }
                }, v * 160);
            }
        }

        const angles = [];
        if (numShots === 1) {
            angles.push(angleDeg);
        } else {
            const spread = 8;
            const startAngle = angleDeg - (spread * (numShots - 1)) / 2;
            for (let i = 0; i < numShots; i++) {
                angles.push(startAngle + i * spread);
            }
        }

        if (!isAI) {
            state.match.lastTrajectories = angles.map(deg => {
                const rad = deg * Math.PI / 180;
                const origin = getShotOrigin(player, rad);
                return calculateTrajectoryPoints(origin.x, origin.y, deg, powerValue, weapon, player);
            });
        }

        angles.forEach(deg => {
            const angleRad = deg * Math.PI / 180;
            const origin = getShotOrigin(player, angleRad);
            const baseSpeed = (300 + powerValue * 12) * weapon.speed * (1 + player.def.speedBonus);
            
            const vx = Math.cos(angleRad) * baseSpeed;
            const vy = -Math.sin(angleRad) * baseSpeed;

            let bounces = weapon.bounces;
            let radius = weapon.radius;

            if (isMother) {
              bounces = 3;
              radius = 60;
            } else {
              if (player.def.id === 'engineer') {
                  bounces += 3;
              }
              if (player === state.match.player && state.match.playerExtraBounces) {
                  bounces += state.match.playerExtraBounces;
              } else if (player === state.match.ai && state.match.aiExtraBounces) {
                  bounces += state.match.aiExtraBounces;
              }
            }

            state.match.projectiles.push({
                x: origin.x,
                y: origin.y,
                vx,
                vy,
                radius,
                weapon: isMother ? { ...weapon, radius: 60, splash: 60, terrainRadius: 60 } : weapon,
                owner: player,
                bouncesLeft: bounces,
                age: 0,
                trail: [],
                aiShot: isAI,
                isFlame: false,
                isSpiderEgg: weapon.id === 'water_burst' && !isMother,
                isMotherSpider: isMother,
            });

            spawnFlash(origin.x, origin.y, isMother ? '#0891b2' : weapon.color, 0.22);
        });

        if (weapon.id === 'hammer' && !isAI && state.match.hammerSeqActive) {
            state.match.hammerSeqActive = false;
            state.match.pendingSequentialShot = true;
            setTimeout(() => {
                if (state.match && state.phase === 'game') {
                    state.match.pendingSequentialShot = false;
                    fireProjectile(angleDeg, powerValue, weapon, player, isAI);
                }
            }, 1000);
        } else if (weapon.id === 'hammer' && isAI && state.match.aiHammerSeqActive) {
            state.match.aiHammerSeqActive = false;
            state.match.pendingSequentialShot = true;
            setTimeout(() => {
                if (state.match && state.phase === 'game') {
                    state.match.pendingSequentialShot = false;
                    fireProjectile(angleDeg, powerValue, weapon, player, isAI);
                }
            }, 1000);
        }
      }

      function spawnFlareFlames(x, y, shooter, aiShot) {
        if (!state.match) return;
        for (let f = 0; f < 4; f++) {
          const angle = rand(-Math.PI * 0.85, -Math.PI * 0.15);
          const speed = rand(200, 460);
          state.match.projectiles.push({
            x: x,
            y: y - 12,
            vx: Math.cos(angle) * speed + rand(-60, 60),
            vy: Math.sin(angle) * speed,
            radius: 12,
            weapon: getWeapon('flare'),
            owner: shooter,
            bouncesLeft: 0,
            age: 0,
            trail: [],
            aiShot: aiShot,
            isFlame: true,
          });
        }
      }

      function findAiShot(attacker, target, weapon) {
        const start = getShotOrigin(attacker, 135 * Math.PI / 180);
        const targetX = target.x;
        const targetY = target.y - 70;
        let best = null;

        const isTargetRight = targetX > start.x;
        const minAngle = isTargetRight ? -10 : 100;
        const maxAngle = isTargetRight ? 80 : 170;
        const defaultAngle = isTargetRight ? 45 : 135;

        for (let angle = minAngle; angle <= maxAngle; angle += 2) {
          for (let power = 20; power <= 100; power += 4) {
            let x = start.x;
            let y = start.y;
            const angleRad = angle * Math.PI / 180;
            const speed = (300 + power * 12) * weapon.speed * (1 + attacker.def.speedBonus);
            let vx = Math.cos(angleRad) * speed;
            let vy = -Math.sin(angleRad) * speed;
            let min = Infinity;

            for (let t = 0; t < 2.2; t += 0.05) {
              vy += 900 * weapon.gravity * 0.05;
              x += vx * 0.05;
              y += vy * 0.05;
              const dist = Math.hypot(x - targetX, y - targetY);
              if (dist < min) min = dist;
              if (x < 0 || x > WORLD.width || y > WORLD.height) break;
            }

            const score = min;
            if (!best || score < best.score) {
              best = { angle, power, score };
            }
          }
        }

        const jitterAngle = rand(-4, 4);
        const jitterPower = rand(-6, 6);
        return {
          angle: clamp(Math.round((best ? best.angle : defaultAngle) + jitterAngle), minAngle - 5, maxAngle + 5),
          power: clamp(Math.round((best ? best.power : 65) + jitterPower), 20, 100),
        };
      }

      function updateProjectiles(dt) {
        const match = state.match;
        if (!match || match.projectiles.length === 0) return;

        for (let i = match.projectiles.length - 1; i >= 0; i--) {
            const p = match.projectiles[i];
            let resolved = false;

            const gravity = 900 * p.weapon.gravity;
            const subSteps = 4;
            const step = dt / subSteps;

            for (let s = 0; s < subSteps; s += 1) {
                const prevX = p.x;
                const prevY = p.y;

                p.age += step;
                p.vy += gravity * step;
                p.x += p.vx * step;
                p.y += p.vy * step;

                p.trail.push({ x: p.x, y: p.y, life: 1 });
                if (p.trail.length > 20) p.trail.shift();

                if (p.x < 0 || p.x > WORLD.width) {
                    p.vx *= -0.72;
                    p.x = clamp(p.x, 0, WORLD.width);
                    spawnSpark(p.x, p.y, p.weapon.color, 5);
                }

                const dist = Math.hypot(p.x - prevX, p.y - prevY);
                const raySteps = Math.max(1, Math.ceil(dist / 2));
                let hitTerrain = false;
                let hitX = p.x;
                let hitY = p.y;

                for (let r = 1; r <= raySteps; r++) {
                    const t = r / raySteps;
                    const sampleX = lerp(prevX, p.x, t);
                    const sampleY = lerp(prevY, p.y, t);
                    const gY = terrainHeightAt(sampleX);

                    if (sampleY + p.radius >= gY) {
                        hitTerrain = true;
                        hitX = sampleX;
                        hitY = gY - p.radius;
                        break;
                    }
                }

                if (hitTerrain) {
                    p.x = hitX;

                    if (p.bouncesLeft > 0 && !p.isFlame) {
                        p.bouncesLeft -= 1;

                        if (p.owner.def.id === 'engineer') {
                            p.bounceCount = (p.bounceCount || 0) + 1;
                            p.radius += 5;
                        }

                        const g = 900 * p.weapon.gravity;
                        p.vy = -Math.max(Math.abs(p.vy) * 1.01, Math.sqrt(2 * g * 130));
                        p.vx = (p.vx >= 0 ? 1 : -1) * Math.max(Math.abs(p.vx) * 1.01, 200);
                        p.y = hitY - 6;

                        if (p.weapon.id === 'flare') {
                            spawnFlareFlames(p.x, p.y, p.owner, p.aiShot);
                        }

                        if (p.weapon.id === 'bounce_ball') {
                            if (p.owner === match.player) {
                                match.playerBounceDmgBonus = (match.playerBounceDmgBonus || 0) + 0.01;
                            } else if (p.owner === match.ai) {
                                match.aiBounceDmgBonus = (match.aiBounceDmgBonus || 0) + 0.01;
                            }
                            spawnFloatingText(p.x, p.y - 30, '+1% 傷害!', '#38bdf8');
                        }

                        spawnSpark(p.x, p.y, p.weapon.color, 16);
                    } else {
                        p.y = hitY;
                        resolveImpact(p.x, p.y, p, false);
                        resolved = true;
                        break;
                    }
                }

                if (resolved) break;

                const target = p.owner === match.player ? match.ai : match.player;
                const targetHitRadius = 48;
                const targetCenterY = target.y - 60;
                const distToPlayer = Math.hypot(p.x - target.x, p.y - targetCenterY);
                if (distToPlayer <= p.radius + targetHitRadius) {
                    resolveImpact(p.x, p.y, p, true);
                    resolved = true;
                    break;
                }
            }

            if (!resolved && p.age > 45.0) {
                resolveImpact(p.x, p.y, p, false);
            }
        }
      }

      function resolveImpact(x, y, projectile, directHit = false) {
        const match = state.match;
        if (!match) return;

        const shooter = projectile.owner;
        const weapon = projectile.weapon;
        const target = shooter === match.player ? match.ai : match.player;

        const baseDamage = (projectile.isFlame ? 50 : 100);
        let splashRadius = projectile.isFlame ? 35 : weapon.splash * (1 + shooter.def.splashBonus);
        let actualTerrainRadius = weapon.terrainRadius;
        if (shooter.def.id === 'engineer') {
            actualTerrainRadius += (projectile.bounceCount || 0) * 5;
        }

        if (projectile.isMotherSpider) {
          const targetCenterY = target.y - 70;
          const distToEnemy = Math.hypot(target.x - x, targetCenterY - y);
          const hitEnemy = directHit || distToEnemy <= 110;

          if (hitEnemy) {
            applyDamage(target, x, y, 100, 60, shooter, directHit, false, weapon);
            let activeCount = 0;
            if (match.spiders) {
              match.spiders.forEach(s => {
                if (s.owner === shooter) {
                  s.hatched = true;
                  s.tracking = true;
                  s.trackProgress = 0;
                  s.startX = s.x;
                  s.startY = s.y;
                  s.trackDuration = rand(3.5, 6.5);
                  activeCount++;
                }
              });
            }
            spawnFloatingText(target.x, target.y - 120, `母蜘蛛命中! ${activeCount}隻小蜘蛛追擊!`, '#06b6d4');
          } else {
            if (match.spiders) {
              match.spiders = match.spiders.filter(s => {
                if (s.owner === shooter) {
                  spawnSpark(s.x, s.y, '#94a3b8', 6);
                  return false;
                }
                return true;
              });
            }
            shooter.hp = clamp(shooter.hp + 300, 0, shooter.hpMax);
            spawnFloatingText(shooter.x, shooter.y - 100, '+300 HP 獻祭恢復!', '#34d399');
            spawnSpark(shooter.x, shooter.y - 50, '#34d399', 16);
          }

          destroyTerrain(x, y, 60);
        } else if (projectile.isSpiderEgg || weapon.id === 'water_burst') {
          match.spiders.push({
            x: x,
            y: terrainHeightAt(x),
            hatched: false,
            turnsRemaining: 2,
            owner: shooter,
            tracking: false,
            trackProgress: 0,
            trackDuration: rand(3.5, 6.5),
            startX: x,
            startY: terrainHeightAt(x),
            seed: Math.random() * 100,
          });
          spawnSpark(x, y, '#06b6d4', 10);
        } else {
          applyDamage(match.ai, x, y, baseDamage, splashRadius, shooter, directHit, projectile.isFlame, weapon);
          applyDamage(match.player, x, y, baseDamage, splashRadius, shooter, directHit, projectile.isFlame, weapon);
        }

        if (!projectile.isMotherSpider) {
          if (projectile.isFlame) {
              destroyTerrain(x, y, 12);
          } else {
              destroyTerrain(x, y, actualTerrainRadius);
          }
        }

        if (weapon.id === 'flare' && !projectile.isFlame && !directHit) {
            spawnFlareFlames(x, y, shooter, projectile.aiShot);
        }

        state.camera.shake = Math.min(14, 6 + splashRadius * 0.08);

        if (shooter === match.player) {
          state.cameraFocus = 'ai';
        } else {
          state.cameraFocus = 'player';
        }

        const idx = match.projectiles.indexOf(projectile);
        if (idx !== -1) {
            match.projectiles.splice(idx, 1);
        }

        syncHpUI();
        checkTurnEnd(shooter);
      }

      function updateSpiders(dt) {
        const match = state.match;
        if (!match || !match.spiders) return;

        const hadTrackingBefore = match.spiders.some(s => s.tracking);
        let lastShooter = null;

        for (let i = match.spiders.length - 1; i >= 0; i--) {
          const s = match.spiders[i];

          if (!s.tracking) {
            s.y = terrainHeightAt(s.x);
          } else {
            lastShooter = s.owner;
            const target = s.owner === match.player ? match.ai : match.player;
            s.trackProgress += dt / s.trackDuration;

            const t = clamp(s.trackProgress, 0, 1);
            const currX = lerp(s.startX, target.x, t);
            const groundY = terrainHeightAt(currX);
            const directY = lerp(s.startY, target.y - 40, t);

            const arcHeight = Math.sin(t * Math.PI) * 70;
            s.x = currX;
            s.y = Math.min(groundY, directY) - arcHeight;

            if (Math.random() < 0.35) {
              spawnParticle(s.x, s.y, rand(-20, 20), rand(-20, 20), 0.3, '#06b6d4', rand(2, 4));
            }

            if (t >= 1) {
              const pct = Math.floor(Math.random() * 9) + 1;
              const baseDmg = 100;
              const dmg = Math.round(baseDmg * (pct / 100));

              target.hp = clamp(target.hp - dmg, 0, target.hpMax);
              spawnFloatingText(target.x, target.y - 100, `-${dmg} HP`, '#06b6d4');
              spawnSpark(target.x, target.y - 50, '#06b6d4', 12);

              target.flash = 0.18;
              match.spiders.splice(i, 1);
              syncHpUI();

              if (target.hp <= 0 && state.phase === 'game') {
                endGame(s.owner === match.player ? '你' : 'AI');
                return;
              }
            }
          }
        }

        const hasTrackingAfter = match.spiders.some(s => s.tracking);
        if (hadTrackingBefore && !hasTrackingAfter) {
          checkTurnEnd(lastShooter);
        }
      }

      function checkTurnEnd(shooter) {
        const match = state.match;
        if (!match || state.phase !== 'game') return;

        const hasTrackingSpiders = match.spiders && match.spiders.some(s => s.tracking);
        if (match.projectiles.length === 0 && !match.pendingSequentialShot && !hasTrackingSpiders) {
          if (match.player.hp <= 0) {
            endGame('AI');
            return;
          }
          if (match.ai.hp <= 0) {
            endGame('你');
            return;
          }

          if (shooter && shooter.def && shooter.def.id === 'shadow' && Math.random() < 0.10) {
            spawnFloatingText(shooter.x, shooter.y - 140, '連擊 EXTRA TURN!', '#22d3ee');
            match.extraTurn = true;
          }

          state.turnDelay = 0.7;
        }
      }

      function applyDamage(player, x, y, baseDamage, splashRadius, shooter, directHit, isFlame = false, weapon) {
        const centerY = player.y - 70;
        const dist = Math.hypot(player.x - x, centerY - y);
        const maxDist = splashRadius + 50;
        if (dist > maxDist) return;

        let isDodge = false;
        if (player.def.id === 'shadow' && Math.random() < 0.10) {
            isDodge = true;
            spawnFloatingText(player.x, player.y - 120, '閃避 DODGE!', '#38bdf8');
        }

        if (!isDodge) {
            if (player.shield > 0) {
                player.shield -= 1;
                spawnFloatingText(player.x, player.y - 120, '護盾抵擋 SHIELD!', '#a78bfa');
                spawnSpark(player.x, player.y - 70, '#a78bfa', 16);
            } else {
                let damage = baseDamage;
                
                if (shooter === state.match.player && state.match.playerBounceDmgBonus) {
                    damage *= (1 + state.match.playerBounceDmgBonus);
                } else if (shooter === state.match.ai && state.match.aiBounceDmgBonus) {
                    damage *= (1 + state.match.aiBounceDmgBonus);
                }

                if (player.def.id === 'guardian' && Math.random() < 0.25) {
                    damage = damage * 0.5;
                    spawnFloatingText(player.x, player.y - 130, '防禦減半!', '#a78bfa');
                }
                
                damage = Math.round(damage);
                player.hp = clamp(player.hp - damage, 0, player.hpMax);
                
                const flameLabel = isFlame ? ' (火焰)' : '';
                if (damage > 0) {
                    spawnFloatingText(player.x, player.y - 100, `-${damage}${flameLabel}`, isFlame ? '#ff7446' : '#f43f5e');
                }

                if (weapon && weapon.id === 'hammer' && damage > 0 && Math.random() < 0.10) {
                    player.stunned = true;
                    spawnFloatingText(player.x, player.y - 140, '眩暈 STUNNED!', '#f5c15a');
                }

                if (player.def.id === 'mountain' && shooter !== player && damage > 0) {
                    const reflectDmg = Math.round(damage * 0.09);
                    if (reflectDmg > 0) {
                        shooter.hp = clamp(shooter.hp - reflectDmg, 0, shooter.hpMax);
                        spawnFloatingText(shooter.x, shooter.y - 100, `反傷 -${reflectDmg}`, '#f59e0b');
                    }
                }
            }
        }

        const dx = player.x - x;
        const dir = dx >= 0 ? 1 : -1;
        const knockMult = 1 - player.def.recoilResist;
        
        player.vx += dir * 429 * knockMult;
        player.vy = -553 * knockMult;
        player.flash = 0.28;
        player.recoilTimer = 0.2;
      }

      function spawnFloatingText(x, y, text, color) {
        state.floatingTexts.push({
          x,
          y,
          text,
          color,
          life: 1.2,
          maxLife: 1.2,
        });
      }

      function spawnParticle(x, y, vx, vy, life, color, size) {
        state.particles.push({ x, y, vx, vy, life, maxLife: life, color, size });
      }

      function spawnSpark(x, y, color, count) {
        for (let i = 0; i < count; i += 1) {
          const angle = rand(0, Math.PI * 2);
          const speed = rand(50, 420);
          spawnParticle(
            x,
            y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed - rand(60, 180),
            rand(0.22, 0.6),
            color,
            rand(1.5, 3.8)
          );
        }
      }

      function spawnFlash(x, y, color, life = 0.2) {
        state.flash = { x, y, radius: 20, life, color };
      }

      function updatePlayers(dt) {
        if (!state.match) return;
        [state.match.player, state.match.ai].forEach((player) => {
          player.x += player.vx * dt;
          player.vx *= Math.pow(0.08, dt);
          player.x = clamp(player.x, 80, WORLD.width - 80);

          const groundY = terrainHeightAt(player.x);
          if (player.y < groundY || player.vy < 0) {
            player.vy += 900 * dt;
            player.y += player.vy * dt;
            if (player.y >= groundY) {
              player.y = groundY;
              player.vy = 0;
            }
          } else {
            player.y = groundY;
            player.vy = 0;
          }

          player.flash = Math.max(0, player.flash - dt);
          player.recoilTimer = Math.max(0, player.recoilTimer - dt);
        });
      }

      function updateParticles(dt) {
        state.particles = state.particles.filter((particle) => {
          particle.life -= dt;
          particle.vy += 860 * dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= Math.pow(0.4, dt);
          particle.vy *= Math.pow(0.4, dt);
          return particle.life > 0;
        });

        state.floatingTexts = state.floatingTexts.filter((ft) => {
          ft.life -= dt;
          ft.y -= 38 * dt;
          return ft.life > 0;
        });

        if (state.flash) {
          state.flash.life -= dt;
          state.flash.radius += 540 * dt;
          if (state.flash.life <= 0) state.flash = null;
        }
      }

      function updateCamera(dt) {
        let targetX;
        let targetY;

        if (state.phase === 'menu' || state.phase === 'over' || !state.match) {
          targetX = 1700;
          targetY = 480;
        } else if (state.match.projectiles.length > 0) {
          targetX = state.match.projectiles[0].x;
          targetY = state.match.projectiles[0].y;
        } else if (state.cameraFocus === 'ai') {
          targetX = state.match.ai.x - 120;
          targetY = state.match.ai.y - 100;
        } else {
          targetX = state.match.player.x + 120;
          targetY = state.match.player.y - 100;
        }

        let cameraScale = 1;
        if (state.viewW < 1100 || state.viewH < 650) {
          cameraScale = Math.min(state.viewW / 1100, state.viewH / 650);
          cameraScale = clamp(cameraScale, 0.45, 1.0);
        }

        if (state.match) {
          const playerIsMountainLowHp = state.match.player.def.id === 'mountain' && state.match.player.hp < state.match.player.hpMax * 0.5;
          if (playerIsMountainLowHp) {
            cameraScale *= 0.68;
          }
        }

        state.cameraScale = cameraScale;

        const effectiveViewW = state.viewW / cameraScale;
        const effectiveViewH = state.viewH / cameraScale;

        targetX = clamp(targetX - effectiveViewW / 2, 0, WORLD.width - effectiveViewW);
        targetY = clamp(targetY - effectiveViewH / 2, 0, WORLD.height - effectiveViewH);

        state.camera.x = lerp(state.camera.x, targetX, 0.08);
        state.camera.y = lerp(state.camera.y, targetY, 0.08);

        if (state.camera.shake > 0) {
          state.camera.shake = Math.max(0, state.camera.shake - dt * 20);
        }
      }

      function setupDragListeners() {
        canvas.addEventListener('pointerdown', (e) => {
          const match = state.match;
          if (state.phase !== 'game' || !match || match.turn !== 0) return;
          const hasTrackingSpiders = match.spiders && match.spiders.some(s => s.tracking);
          if (match.projectiles.length > 0 || hasTrackingSpiders || match.pendingSequentialShot || state.turnDelay > 0) return;

          dragState.active = true;
          dragState.pointerId = e.pointerId;
          dragState.startX = e.clientX;
          dragState.startY = e.clientY;
          dragState.currentX = e.clientX;
          dragState.currentY = e.clientY;
          canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointermove', (e) => {
          if (!dragState.active || e.pointerId !== dragState.pointerId) return;
          dragState.currentX = e.clientX;
          dragState.currentY = e.clientY;

          const dx = dragState.currentX - dragState.startX;
          const dy = dragState.currentY - dragState.startY;
          const dist = Math.hypot(dx, dy);

          if (dist > 8) {
            const angleRad = Math.atan2(dy, -dx);
            let angleDeg = angleRad * 180 / Math.PI;
            if (angleDeg < 0) angleDeg += 360;

            const power = clamp(Math.round(dist / 2.5), 0, 100);
            const player = state.match.player;
            player.aimAngle = Math.round(angleDeg);
            player.aimPower = power;
          }
        });

        const releaseDrag = (e) => {
          if (!dragState.active || e.pointerId !== dragState.pointerId) return;
          dragState.active = false;
          try {
            canvas.releasePointerCapture(e.pointerId);
          } catch (err) {}

          const match = state.match;
          const hasTrackingSpiders = match && match.spiders && match.spiders.some(s => s.tracking);
          if (state.phase === 'game' && match && match.turn === 0 && match.projectiles.length === 0 && !hasTrackingSpiders && !match.pendingSequentialShot && state.turnDelay <= 0) {
            const weapon = match.playerWeapon;
            const player = match.player;
            fireProjectile(player.aimAngle, player.aimPower, weapon, player, false);
          }
        };

        canvas.addEventListener('pointerup', releaseDrag);
        canvas.addEventListener('pointercancel', releaseDrag);
      }

      function render() {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const scale = (state.dpr || 1) * (state.cameraScale || 1);
        ctx.scale(scale, scale);

        const shakeX = (Math.random() - 0.5) * state.camera.shake;
        const shakeY = (Math.random() - 0.5) * state.camera.shake;

        ctx.translate(-state.camera.x + shakeX, -state.camera.y + shakeY);

        drawBackground();
        drawTerrain();

        if (state.match) {
          if (state.match.lastTrajectories && state.match.lastTrajectories.length > 0) {
            state.match.lastTrajectories.forEach(pts => {
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash([8, 8]);
                ctx.strokeStyle = 'rgba(160, 160, 160, 0.65)';
                ctx.lineWidth = 3.5;
                if (pts.length > 0) {
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for (let i = 1; i < pts.length; i++) {
                        ctx.lineTo(pts[i].x, pts[i].y);
                    }
                }
                ctx.stroke();
                ctx.restore();
            });
          }

          if (dragState.active && state.match.turn === 0) {
            drawAimPreview();
          }

          drawPlayer(state.match.player);
          drawPlayer(state.match.ai);
          drawSpiders();

          if (state.match.projectiles.length > 0) {
            state.match.projectiles.forEach(drawProjectile);
          }
        }

        drawParticles();
        drawFloatingTexts();

        ctx.restore();
      }

      function drawBackground() {
        const skyGradient = ctx.createLinearGradient(0, 0, 0, WORLD.height);
        skyGradient.addColorStop(0, '#040914');
        skyGradient.addColorStop(0.6, '#0f172a');
        skyGradient.addColorStop(1, '#1e1b4b');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, WORLD.width, WORLD.height);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        cloudSeeds.forEach((cloud) => {
          ctx.beginPath();
          ctx.arc(cloud.x, cloud.y, 40 * cloud.s, 0, Math.PI * 2);
          ctx.arc(cloud.x + 35 * cloud.w, cloud.y - 10, 50 * cloud.s, 0, Math.PI * 2);
          ctx.arc(cloud.x + 75 * cloud.w, cloud.y, 38 * cloud.s, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawTerrain() {
        ctx.beginPath();
        ctx.moveTo(0, WORLD.height);
        terrainSamples.forEach((pt) => {
          ctx.lineTo(pt.x, pt.y);
        });
        ctx.lineTo(WORLD.width, WORLD.height);
        ctx.closePath();

        const groundGrad = ctx.createLinearGradient(0, 300, 0, WORLD.height);
        groundGrad.addColorStop(0, '#1e293b');
        groundGrad.addColorStop(0.3, '#0f172a');
        groundGrad.addColorStop(1, '#020617');
        ctx.fillStyle = groundGrad;
        ctx.fill();

        ctx.lineWidth = 6;
        ctx.strokeStyle = '#38bdf8';
        ctx.stroke();
      }

      function drawAimPreview() {
        const player = state.match.player;
        const weapon = state.match.playerWeapon;

        let numShots = 1;
        if (weapon.id === 'flare' && state.match.flareSkillThisTurn) {
            numShots = 3;
        } else if (weapon.id === 'water_burst' && !state.match.playerSpiderSkillActive) {
            numShots = 5;
        }

        const angles = [];
        if (numShots === 1) {
            angles.push(player.aimAngle);
        } else {
            const spread = 8;
            const startAngle = player.aimAngle - (spread * (numShots - 1)) / 2;
            for (let i = 0; i < numShots; i++) {
                angles.push(startAngle + i * spread);
            }
        }

        angles.forEach(deg => {
            const rad = deg * Math.PI / 180;
            const origin = getShotOrigin(player, rad);
            const pts = calculateTrajectoryPoints(origin.x, origin.y, deg, player.aimPower, weapon, player);

            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([6, 6]);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3.5;
            if (pts.length > 0) {
              ctx.moveTo(pts[0].x, pts[0].y);
              for (let i = 1; i < pts.length; i++) {
                ctx.lineTo(pts[i].x, pts[i].y);
              }
            }
            ctx.stroke();

            pts.forEach((p, idx) => {
              if (idx % 12 === 0) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#7dd3fc';
                ctx.fill();
              }
            });
            
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`力度: ${player.aimPower}`, origin.x + 10, origin.y - 20);
            
            ctx.restore();
        });
      }

      function drawPlayer(player) {
        ctx.save();
        ctx.translate(player.x, player.y);

        const isPlayer = player.side === 'left';
        const bodyColor = player.def.color;

        const bodyY = -52;
        const headY = -92;

        if (player.shield > 0) {
          ctx.beginPath();
          ctx.arc(0, -60, 58, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(167, 139, 250, 0.22)';
          ctx.fill();
          ctx.strokeStyle = '#a78bfa';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.ellipse(0, -4, 38, 12, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fill();

        ctx.beginPath();
        ctx.roundRect(-22, bodyY - 26, 44, 52, 12);
        ctx.fillStyle = player.flash > 0 ? '#ffffff' : bodyColor;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, headY, 24, 0, Math.PI * 2);
        ctx.fillStyle = player.flash > 0 ? '#ffffff' : bodyColor;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        const eyeX = isPlayer ? 8 : -8;
        ctx.beginPath();
        ctx.arc(eyeX, headY - 2, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();

        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(player.def.name, 0, -132);

        const rad = player.aimAngle * Math.PI / 180;
        ctx.save();
        ctx.translate(0, -60);
        ctx.rotate(-rad + (isPlayer ? 0 : Math.PI));
        ctx.fillStyle = isPlayer ? state.match.playerWeapon.color : state.match.aiWeaponDef.color;
        
        let weaponVisualSize = 10;
        ctx.fillRect(16, -weaponVisualSize / 2, weaponVisualSize * 1.8, weaponVisualSize);
        ctx.restore();

        ctx.restore();
      }

      function drawSpiders() {
        if (!state.match || !state.match.spiders) return;
        state.match.spiders.forEach(s => {
          ctx.save();
          ctx.translate(s.x, s.y);

          if (!s.hatched) {
            ctx.beginPath();
            ctx.ellipse(0, -6, 7, 9, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#06b6d4';
            ctx.fill();
            ctx.strokeStyle = '#a5f3fc';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-5, -6); ctx.lineTo(5, -6);
            ctx.moveTo(0, -12); ctx.lineTo(0, 0);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1;
            ctx.stroke();
          } else {
            const wiggle = s.tracking ? Math.sin(state.time * 26 + s.seed) * 5 : Math.sin(state.time * 4 + s.seed) * 2;

            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 1.8;
            for (let side = -1; side <= 1; side += 2) {
              for (let l = 0; l < 4; l++) {
                const offY = -8 + l * 2.5;
                const legReach = side * (9 + l * 2);
                ctx.beginPath();
                ctx.moveTo(side * 3, offY);
                ctx.lineTo(legReach, offY - 4 + (l % 2 === 0 ? wiggle : -wiggle));
                ctx.lineTo(legReach + side * 3, offY + 3);
                ctx.stroke();
              }
            }

            ctx.beginPath();
            ctx.arc(0, -10, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#0891b2';
            ctx.fill();
            ctx.strokeStyle = '#67e8f9';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, -4, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#06b6d4';
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-2, -5, 1.5, 1.5);
            ctx.fillRect(0.5, -5, 1.5, 1.5);
          }

          ctx.restore();
        });
      }

      function drawProjectile(projectile) {
        ctx.save();

        if (projectile.isMotherSpider) {
          ctx.beginPath();
          ctx.arc(projectile.x, projectile.y, projectile.radius * 1.3, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(6, 182, 212, 0.25)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#0891b2';
          ctx.fill();
          ctx.strokeStyle = '#a5f3fc';
          ctx.lineWidth = 4;
          ctx.stroke();

          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(projectile.x - 14, projectile.y - 10, 6, 0, Math.PI * 2);
          ctx.arc(projectile.x + 14, projectile.y - 10, 6, 0, Math.PI * 2);
          ctx.fill();
        } else if (projectile.isFlame) {
          ctx.beginPath();
          ctx.arc(projectile.x, projectile.y, projectile.radius * 1.8, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 85, 0, 0.38)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#ff4500';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(projectile.x, projectile.y, projectile.radius * 0.5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffea00';
          ctx.fill();

          if (Math.random() < 0.6) {
            spawnParticle(
              projectile.x + rand(-4, 4),
              projectile.y + rand(-4, 4),
              rand(-20, 20),
              rand(-40, -10),
              rand(0.2, 0.4),
              pick(['#ff2200', '#ff7700', '#ffee00']),
              rand(2, 5)
            );
          }
        } else {
          projectile.trail.forEach((t, i) => {
            ctx.beginPath();
            ctx.arc(t.x, t.y, projectile.radius * (i / projectile.trail.length) * 0.7, 0, Math.PI * 2);
            ctx.fillStyle = projectile.weapon.color;
            ctx.globalAlpha = (i / projectile.trail.length) * 0.4;
            ctx.fill();
          });

          ctx.globalAlpha = 1;
          ctx.beginPath();
          ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
          ctx.fillStyle = projectile.weapon.color;
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawParticles() {
        state.particles.forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life / p.maxLife;
          ctx.fill();
        });

        if (state.flash) {
          ctx.beginPath();
          ctx.arc(state.flash.x, state.flash.y, state.flash.radius, 0, Math.PI * 2);
          ctx.fillStyle = state.flash.color;
          ctx.globalAlpha = state.flash.life * 0.4;
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawFloatingTexts() {
        state.floatingTexts.forEach((ft) => {
          ctx.save();
          ctx.font = '900 24px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = ft.color;
          ctx.globalAlpha = clamp(ft.life / ft.maxLife, 0, 1);
          ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
          ctx.shadowBlur = 6;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        });
      }

      function tick(ts) {
        if (!state.lastTs) state.lastTs = ts;
        const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
        state.lastTs = ts;
        state.time += dt;

        resizeCanvas();

        if (state.phase === 'game' && state.match) {
          updatePlayers(dt);
          updateProjectiles(dt);
          updateSpiders(dt);
          updateParticles(dt);

          const hasTrackingSpiders = state.match.spiders && state.match.spiders.some(s => s.tracking);
          if (state.match.turn === 1 && state.match.projectiles.length === 0 && !hasTrackingSpiders && !state.match.pendingSequentialShot && state.phase === 'game' && state.turnDelay <= 0) {
            state.aiDelay -= dt;
            if (state.aiDelay <= 0) {
              state.aiDelay = Infinity;

              if ((state.match.aiSkillCharge || 0) >= 100) {
                state.match.aiSkillCharge -= 100;
                const aiWeaponId = state.match.aiWeapon.id;
                if (aiWeaponId === 'hammer') {
                  state.match.aiHammerSeqActive = true;
                  spawnFloatingText(state.match.ai.x, state.match.ai.y - 140, 'AI技能: 先後2連擊!', '#f5c15a');
                } else if (aiWeaponId === 'flare') {
                  state.match.aiFlareSkillThisTurn = true;
                  spawnFloatingText(state.match.ai.x, state.match.ai.y - 140, 'AI技能: 並行+2散射!', '#ff7446');
                } else if (aiWeaponId === 'bounce_ball') {
                  state.match.aiExtraBounces = (state.match.aiExtraBounces || 0) + 5;
                  spawnFloatingText(state.match.ai.x, state.match.ai.y - 140, 'AI技能: 本局彈跳+5!', '#38bdf8');
                } else if (aiWeaponId === 'water_burst') {
                  state.match.aiSpiderSkillActive = true;
                  spawnFloatingText(state.match.ai.x, state.match.ai.y - 140, 'AI技能: 下發母蜘蛛!', '#06b6d4');
                }
              }

              const aiShot = findAiShot(state.match.ai, state.match.player, state.match.aiWeapon);
              state.match.ai.aimAngle = aiShot.angle;
              state.match.ai.aimPower = aiShot.power;
              fireProjectile(aiShot.angle, aiShot.power, state.match.aiWeapon, state.match.ai, true);
            }
          }

          if (state.turnDelay > 0) {
            state.turnDelay -= dt;
            if (state.turnDelay <= 0 && state.phase === 'game') {
              if (state.match.extraTurn) {
                  state.match.extraTurn = false;
                  beginTurn(state.match.turn);
              } else {
                  const nextTurn = state.match.turn === 0 ? 1 : 0;
                  if (nextTurn === 0) state.match.round += 1;
                  beginTurn(nextTurn);
              }
            }
          }
        } else {
          updateParticles(dt);
        }

        updateCamera(dt);
        render();

        requestAnimationFrame(tick);
      }

      function resizeCanvas() {
        const rect = dom.stage.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const width = Math.floor(rect.width * dpr);
        const height = Math.floor(rect.height * dpr);

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          state.viewW = rect.width;
          state.viewH = rect.height;
          state.dpr = dpr;
        }
      }

      function bindEvents() {
        dom.startBtn.addEventListener('click', showSelection);
        dom.encyclopediaBtn.addEventListener('click', showEncyclopedia);
        dom.skillsBtn.addEventListener('click', showSkills);

        dom.confirmSelectionBtn.addEventListener('click', startGame);
        dom.cancelSelectionBtn.addEventListener('click', showMenu);

        dom.exitGameBtn.addEventListener('click', showMenu);
        dom.againBtn.addEventListener('click', startGame);
        dom.backMenuBtn.addEventListener('click', showMenu);

        dom.fullscreenBtn.addEventListener('click', toggleFullscreen);

        dom.skillBtn.addEventListener('click', () => {
            const match = state.match;
            if (state.phase !== 'game' || !match || match.turn !== 0) return;
            const hasTrackingSpiders = match.spiders && match.spiders.some(s => s.tracking);
            if (match.projectiles.length > 0 || hasTrackingSpiders || match.pendingSequentialShot || state.turnDelay > 0) return;

            if ((match.playerSkillCharge || 0) >= 100) {
                match.playerSkillCharge -= 100;
                
                const weaponId = match.playerWeapon.id;
                if (weaponId === 'hammer') {
                    match.hammerSeqActive = true;
                    spawnFloatingText(match.player.x, match.player.y - 140, '技能發動: 先後2連擊!', '#f5c15a');
                } else if (weaponId === 'flare') {
                    match.flareSkillThisTurn = true;
                    spawnFloatingText(match.player.x, match.player.y - 140, '技能發動: 並行+2散射!', '#ff7446');
                } else if (weaponId === 'bounce_ball') {
                    match.playerExtraBounces = (match.playerExtraBounces || 0) + 5;
                    spawnFloatingText(match.player.x, match.player.y - 140, '技能發動: 本局彈跳+5!', '#38bdf8');
                } else if (weaponId === 'water_burst') {
                    match.playerSpiderSkillActive = true;
                    spawnFloatingText(match.player.x, match.player.y - 140, '技能發動: 下發轉為母蜘蛛!', '#06b6d4');
                } else {
                    spawnFloatingText(match.player.x, match.player.y - 140, '技能發動!', '#ffffff');
                }
                
                syncSkillUI();
            }
        });

        document.querySelectorAll('.closePanelBtn').forEach((btn) => {
          btn.addEventListener('click', hideAllPanels);
        });

        setupDragListeners();
      }

      function init() {
        buildTerrain();
        bindEvents();
        showMenu();
        requestAnimationFrame(tick);
      }

      window.onload = function () {
        init();
      };
    })();
  </script>
</body>
</html>
