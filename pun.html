                        const canAttack = allCanAttack || attackerIndices.includes(col);
                        const isTriangle = (col === triangleCol) && !trianglePlaced;
                        
                        if (isTriangle) trianglePlaced = true;
                        
                        this.bricks.push(new Brick(x, y, brickWidth, brickHeight, baseHp, canAttack, false, 0, isTriangle));
                        bricksSpawned++;
                    }
                    
                    // 隨機模式不生成+球道具
                    if (this.ballDamageMode !== 'random' && Math.random() < 0.1) {
                        const x = CONFIG.BRICK_PADDING + col * (brickWidth + CONFIG.BRICK_PADDING) + brickWidth / 2;
                        const y = this.topOffset + CONFIG.BRICK_PADDING + brickHeight / 2;
                        this.powerups.push(new Powerup(x, y));
                    }
                }
                
                // 確保至少有一個磚塊，且有一個三角形
                if (bricksSpawned === 0) {
                    const col = Math.floor(CONFIG.BRICK_COLS / 2);
                    const x = CONFIG.BRICK_PADDING + col * (brickWidth + CONFIG.BRICK_PADDING);
                    const y = this.topOffset + CONFIG.BRICK_PADDING;
                    this.bricks.push(new Brick(x, y, brickWidth, brickHeight, baseHp, true, false, 0, true));
                } else if (!trianglePlaced) {
                    // 如果還沒放三角形，在已有的磚塊中隨機選一個變成三角形
                    const regularBricks = this.bricks.filter(b => !b.isBoss && !b.isTriangle && b.y === this.topOffset + CONFIG.BRICK_PADDING);
                    if (regularBricks.length > 0) {
                        const randomBrick = regularBricks[Math.floor(Math.random() * regularBricks.length)];
                        randomBrick.isTriangle = true;
                    }
                }
                
                this.spawnCrossLasers(brickWidth, brickHeight);
            }

            spawnCrossLasers(brickWidth, brickHeight) {
                this.crossLasers = [];
                const maxRow = 5;
                const laserCount = CONFIG.CROSS_LASER_COUNT;
                let placed = 0;
                let attempts = 0;
                
                while (placed < laserCount && attempts < 50) {
                    const col = Math.floor(Math.random() * CONFIG.BRICK_COLS);
                    const row = Math.floor(Math.random() * maxRow);
                    
                    const laserX = CONFIG.BRICK_PADDING + col * (brickWidth + CONFIG.BRICK_PADDING) + brickWidth / 2;
                    const laserY = this.topOffset + CONFIG.BRICK_PADDING + row * (brickHeight + CONFIG.BRICK_PADDING) + brickHeight / 2;
                    
                    let overlaps = false;
                    for (let brick of this.bricks) {
                        if (laserX > brick.x && laserX < brick.x + brick.width &&
                            laserY > brick.y && laserY < brick.y + brick.height) {
                            overlaps = true;
                            break;
                        }
                    }
                    
                    // 檢查與其他雷射器是否重疊
                    for (let laser of this.crossLasers) {
                        if (Math.abs(laser.x - laserX) < brickWidth && Math.abs(laser.y - laserY) < brickHeight) {
                            overlaps = true;
                            break;
                        }
                    }
                    
                    if (!overlaps) {
                        this.crossLasers.push(new CrossLaser(col, row, brickWidth, brickHeight, this.topOffset));
                        placed++;
                    }
                    
                    attempts++;
                }
            }

            spawnBoss() {
                const brickWidth = (CONFIG.GAME_WIDTH - CONFIG.BRICK_PADDING * (CONFIG.BRICK_COLS + 1)) / CONFIG.BRICK_COLS;
                
                let bossSize, bossHp, canAttack;
                if (this.wave === 10) {
                    bossSize = 3;
                    bossHp = 1000;
                    canAttack = true;
                } else {
                    bossSize = 5;
                    bossHp = 1234567; // 上調到1234567血
                    canAttack = false;
                }
                
                const bossWidth = bossSize * brickWidth + (bossSize - 1) * CONFIG.BRICK_PADDING;
                const bossHeight = bossWidth;
                const bossX = (CONFIG.GAME_WIDTH - bossWidth) / 2;
                const bossY = this.topOffset + CONFIG.BRICK_PADDING;
                
                const boss = new Brick(bossX, bossY, bossWidth, bossHeight, bossHp, canAttack, true, this.wave);
                this.bricks.push(boss);
                this.currentBoss = boss;
                
                this.audio.play('boss');
            }

            moveBricksDown() {
                const brickWidth = (CONFIG.GAME_WIDTH - CONFIG.BRICK_PADDING * (CONFIG.BRICK_COLS + 1)) / CONFIG.BRICK_COLS;
                const moveAmount = brickWidth + CONFIG.BRICK_PADDING;
                
                for (let brick of this.bricks) {
                    brick.moveDown(moveAmount);
                    
                    if (brick.active && brick.isBoss && brick.bossWave === 20) {
                        if (brick.y + brick.height >= CONFIG.GAME_HEIGHT - 80) {
                            this.gameOver();
                            return;
                        }
                    }
                    
                    if (brick.active && !brick.isBoss && brick.y + brick.height >= CONFIG.GAME_HEIGHT - 80) {
                        this.gameOver();
                        return;
                    }
                }
                
                for (let powerup of this.powerups) {
                    powerup.moveDown(moveAmount);
                }
                
                for (let laser of this.crossLasers) {
                    laser.moveDown(moveAmount);
                }
                
                this.powerups = this.powerups.filter(p => p.y < CONFIG.GAME_HEIGHT - 70);
            }

            enemyAttack() {
                for (let brick of this.bricks) {
                    // 被冰凍的磚塊不攻擊
                    if (!brick.active || !brick.canAttack || brick.frozen) continue;
                    
                    let damage = 1;
                    if (brick.isBoss && brick.bossWave === 10) {
                        damage = 10;
                    }
                    
                    this.playerHp -= damage;
                    this.audio.play('damage');
                    this.createFloatingText(this.launcher.x, this.launcher.y - 50, `-${damage}`, '#ff0000');
                    
                    this.attackEffects.push({
                        startX: brick.x + brick.width / 2,
                        startY: brick.y + brick.height,
                        endX: this.launcher.x,
                        endY: this.launcher.y,
                        progress: 0
                    });
                }
                
                // 第20波Boss回血
                for (let brick of this.bricks) {
                    if (brick.active && brick.isBoss && brick.bossWave === 20) {
                        const healAmount = Math.floor(brick.maxHp * 0.1);
                        brick.hp = Math.min(brick.maxHp, brick.hp + healAmount);
                        this.createFloatingText(brick.x + brick.width/2, brick.y + brick.height/2, `+${healAmount}`, '#00ff00');
                    }
                }
                
                // 處理凍結回合（在敵人行動後減少）
                for (let brick of this.bricks) {
                    brick.processTurnEnd();
                }
                
                if (this.playerHp <= 0) {
                    this.playerHp = 0;
                    this.gameOver();
                }
            }

            gameOver() {
                this.state = 'gameover';
                this.audio.play('gameover');
            }

            victory() {
                this.state = 'victory';
                this.audio.play('victory');
            }

            generateSkillChoices() {
                const availableTypes = Object.keys(BALL_TYPES).filter(t => 
                    t !== 'normal' && !this.selectedCombos.includes(t)
                );
                this.skillChoices = [];
                
                const shuffled = [...availableTypes].sort(() => Math.random() - 0.5);
                this.skillChoices = shuffled.slice(0, 3);
            }

            showSkillSelection() {
                this.generateSkillChoices();
                this.state = 'skillSelect';
                this.showingSkillSelect = true;
            }

            createFloatingText(x, y, text, color) {
                this.floatingTexts.push({
                    x, y, text, color,
                    alpha: 1,
                    vy: -2
                });
            }

            update() {
                if (this.state === 'menu' || this.state === 'gameover' || 
                    this.state === 'victory' || this.state === 'skillSelect') return;

                for (let powerup of this.powerups) {
                    powerup.update();
                }

                for (let laser of this.crossLasers) {
                    laser.update();
                }

                this.iceWalls = this.iceWalls.filter(w => w.active);

                if (this.state === 'launching') {
                    this.launchDelay++;
                    if (this.launchDelay >= this.launchInterval && this.launchQueue.length > 0) {
                        const ballType = this.launchQueue.shift();
                        const speed = CONFIG.BALL_SPEED;
                        const vx = Math.cos(this.aimAngle) * speed;
                        const vy = Math.sin(this.aimAngle) * speed;
                        
                        const newBall = new Ball(
                            this.launcher.x, 
                            this.launcher.y - this.launcher.size, 
                            vx, vy, 
                            ballType
                        );
                        // 應用本回合助攻Combo加成
                        newBall.bonusDamage = this.comboAssistBonus;
                        this.balls.push(newBall);
                        this.launchDelay = 0;
                    }
                    
                    if (this.launchQueue.length <= 0) {
                        this.state = 'flying';
                    }
                }

                for (let ball of this.balls) {
                    ball.update(this);
                }

                if (this.state === 'flying') {
                    const allReturned = this.balls.every(b => b.returned);
                    if (allReturned) {
                        this.onWaveEnd();
                    }
                }

                this.bricks = this.bricks.filter(b => b.active);
                
                if (this.currentBoss && !this.currentBoss.active) {
                    if (this.currentBoss.bossWave === 20) {
                        this.victory();
                        return;
                    }
                    this.currentBoss = null;
                }
                
                // 更新特效
                for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                    const ft = this.floatingTexts[i];
                    ft.y += ft.vy;
                    ft.alpha -= 0.02;
                    if (ft.alpha <= 0) {
                        this.floatingTexts.splice(i, 1);
                    }
                }
                
                for (let i = this.explosionEffects.length - 1; i >= 0; i--) {
                    const exp = this.explosionEffects[i];
                    exp.radius += 15;
                    exp.alpha -= 0.03;
                    if (exp.alpha <= 0) {
                        this.explosionEffects.splice(i, 1);
                    }
                }
                
                for (let i = this.attackEffects.length - 1; i >= 0; i--) {
                    const atk = this.attackEffects[i];
                    atk.progress += 0.1;
                    if (atk.progress >= 1) {
                        this.attackEffects.splice(i, 1);
                    }
                }
                
                for (let i = this.lightningEffects.length - 1; i >= 0; i--) {
                    const l = this.lightningEffects[i];
                    l.alpha -= 0.1;
                    if (l.alpha <= 0) {
                        this.lightningEffects.splice(i, 1);
                    }
                }
                
                for (let i = this.laserEffects.length - 1; i >= 0; i--) {
                    const l = this.laserEffects[i];
                    l.alpha -= 0.05;
                    if (l.alpha <= 0) {
                        this.laserEffects.splice(i, 1);
                    }
                }
            }

            onWaveEnd() {
                if (this.nextLauncherX !== null) {
                    this.launcher.x = this.nextLauncherX;
                }
                
                this.balls = [];
                this.iceWalls = [];
                
                this.enemyAttack();
                
                if (this.state === 'gameover') return;
                
                this.moveBricksDown();
                
                if (this.state === 'gameover') return;
                
                this.wave++;
                
                // 隨機模式：每波重新隨機球數
                if (this.ballDamageMode === 'random') {
                    this.normalBallCount = Math.floor(Math.random() * 99) + 1;
                }
                
                if (this.wave > 20 && !this.currentBoss) {
                    this.victory();
                    return;
                }
                
                if (this.wave % 2 === 0 && this.wave <= 20) {
                    this.showSkillSelection();
                    this.spawnWave();
                    return;
                }
                
                this.spawnWave();
                
                if (this.state !== 'gameover' && this.state !== 'victory' && this.state !== 'skillSelect') {
                    this.state = 'waiting';
                }
            }

            drawAimLine() {
                if (this.state !== 'aiming') return;

                const ctx = this.ctx;
                const startX = this.launcher.x;
                const startY = this.launcher.y - this.launcher.size;
                
                let x = startX;
                let y = startY;
                let vx = Math.cos(this.aimAngle);
                let vy = Math.sin(this.aimAngle);
                
                ctx.strokeStyle = CONFIG.COLORS.aimLine;
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.moveTo(x, y);
                
                let bounces = 0;
                const maxBounces = 9;
                const maxDist = 3000;
                let totalDist = 0;
                
                while (bounces < maxBounces && totalDist < maxDist) {
                    const step = 5;
                    const nextX = x + vx * step;
                    const nextY = y + vy * step;
                    totalDist += step;
                    
                    if (nextX <= CONFIG.BALL_RADIUS) {
                        x = CONFIG.BALL_RADIUS;
                        vx = -vx;
                        bounces++;
                        ctx.lineTo(x, y);
                    } else if (nextX >= CONFIG.GAME_WIDTH - CONFIG.BALL_RADIUS) {
                        x = CONFIG.GAME_WIDTH - CONFIG.BALL_RADIUS;
                        vx = -vx;
                        bounces++;
                        ctx.lineTo(x, y);
                    } else {
                        x = nextX;
                    }
                    
                    if (nextY <= this.topOffset + CONFIG.BALL_RADIUS) {
                        y = this.topOffset + CONFIG.BALL_RADIUS;
                        vy = -vy;
                        bounces++;
                        ctx.lineTo(x, y);
                    } else {
                        y = nextY;
                    }
                    
                    let hitBrick = null;
                    for (let brick of this.bricks) {
                        if (!brick.active) continue;
                        if (x > brick.x - CONFIG.BALL_RADIUS && 
                            x < brick.x + brick.width + CONFIG.BALL_RADIUS &&
                            y > brick.y - CONFIG.BALL_RADIUS && 
                            y < brick.y + brick.height + CONFIG.BALL_RADIUS) {
                            hitBrick = brick;
                            break;
                        }
                    }
                    
                    if (hitBrick) {
                        ctx.lineTo(x, y);
                        
                        const centerX = hitBrick.x + hitBrick.width / 2;
                        const centerY = hitBrick.y + hitBrick.height / 2;
                        const ballToCenterX = x - centerX;
                        const ballToCenterY = y - centerY;
                        
                        if (Math.abs(ballToCenterX) / hitBrick.width > Math.abs(ballToCenterY) / hitBrick.height) {
                            vx = -vx;
                            if (x < centerX) {
                                x = hitBrick.x - CONFIG.BALL_RADIUS - 1;
                            } else {
                                x = hitBrick.x + hitBrick.width + CONFIG.BALL_RADIUS + 1;
                            }
                        } else {
                            vy = -vy;
                            if (y < centerY) {
                                y = hitBrick.y - CONFIG.BALL_RADIUS - 1;
                            } else {
                                y = hitBrick.y + hitBrick.height + CONFIG.BALL_RADIUS + 1;
                            }
                        }
                        bounces++;
                    }
                }
                
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = CONFIG.COLORS.aimLine;
                ctx.fill();
            }

            drawUI() {
                const ctx = this.ctx;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, CONFIG.GAME_WIDTH, this.topOffset);
                
                ctx.fillStyle = CONFIG.COLORS.text;
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'left';
                
                let waveText = `第 ${this.wave} 波`;
                if (this.wave === 10 || this.wave === 20) {
                    waveText = `⚔️ BOSS ${this.wave} ⚔️`;
                    ctx.fillStyle = '#ff0000';
                }
                ctx.fillText(waveText, 10, 25);
                
                ctx.fillStyle = CONFIG.COLORS.combo;
                ctx.font = 'bold 16px Arial';
                ctx.fillText(`Combo: ${this.comboCount}`, 10, 48);
                
                ctx.font = '12px Arial';
                let comboX = 10;
                for (let combo of this.selectedCombos) {
                    const comboData = COMBO_TYPES[combo];
                    ctx.fillStyle = comboData.color;
                    ctx.fillText(comboData.icon, comboX, 68);
                    comboX += 25;
                }
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`🔵 ${this.normalBallCount}`, CONFIG.GAME_WIDTH / 2, 25);
                
                ctx.font = '10px Arial';
                ctx.fillStyle = '#888888';
                let modeText = '固定傷害';
                if (this.ballDamageMode === 'wave') modeText = `波數傷害: ${this.wave}`;
                else if (this.ballDamageMode === 'random') modeText = `每波隨機球數 傷害0~3`;
                else if (this.ballDamageMode === 'combo10') modeText = '每次碰撞+10 Combo';
                ctx.fillText(modeText, CONFIG.GAME_WIDTH / 2, 40);
                
                // 顯示本回合助攻加成
                if (this.comboAssistBonus > 0) {
                    ctx.fillStyle = '#ffd700';
                    ctx.fillText(`攻擊+${this.comboAssistBonus}`, CONFIG.GAME_WIDTH / 2, 55);
                }
                
                const btnX = CONFIG.GAME_WIDTH - 50;
                const btnY = 20;
                ctx.fillStyle = 'rgba(255, 100, 100, 0.8)';
                ctx.beginPath();
                ctx.roundRect(btnX, btnY - 10, 40, 20, 5);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('返回', btnX + 20, btnY + 4);
            }

            drawEffects() {
                const ctx = this.ctx;
                
                for (let exp of this.explosionEffects) {
                    ctx.beginPath();
                    ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 100, 0, ${exp.alpha * 0.3})`;
                    ctx.fill();
                    ctx.strokeStyle = `rgba(255, 200, 0, ${exp.alpha})`;
                    ctx.lineWidth = 5;
                    ctx.stroke();
                }
                
                for (let l of this.lightningEffects) {
                    ctx.beginPath();
                    ctx.moveTo(l.startX, l.startY);
                    
                    const segments = 5;
                    for (let i = 1; i <= segments; i++) {
                        const t = i / segments;
                        const x = l.startX + (l.endX - l.startX) * t + (Math.random() - 0.5) * 20;
                        const y = l.startY + (l.endY - l.startY) * t + (Math.random() - 0.5) * 20;
                        ctx.lineTo(x, y);
                    }
                    
                    ctx.strokeStyle = `rgba(255, 255, 0, ${l.alpha})`;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
                
                for (let l of this.laserEffects) {
                    ctx.globalAlpha = l.alpha;
                    ctx.fillStyle = CONFIG.COLORS.laser;
                    ctx.fillRect(0, l.y - 2, CONFIG.GAME_WIDTH, 4);
                    ctx.fillRect(l.x - 2, 0, 4, CONFIG.GAME_HEIGHT);
                    ctx.globalAlpha = 1;
                }
                
                for (let atk of this.attackEffects) {
                    const x = atk.startX + (atk.endX - atk.startX) * atk.progress;
                    const y = atk.startY + (atk.endY - atk.startY) * atk.progress;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff0000';
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.moveTo(atk.startX, atk.startY);
                    ctx.lineTo(x, y);
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                
                for (let ft of this.floatingTexts) {
                    ctx.globalAlpha = ft.alpha;
                    ctx.fillStyle = ft.color;
                    ctx.font = 'bold 14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                    ctx.globalAlpha = 1;
                }
            }

            drawMenuScreen() {
                const ctx = this.ctx;
                
                ctx.fillStyle = CONFIG.COLORS.background;
                ctx.fillRect(0, 0, CONFIG.GAME_WIDTH, CONFIG.GAME_HEIGHT);
                
                ctx.fillStyle = CONFIG.COLORS.launcher;
                ctx.font = 'bold 60px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('霦', CONFIG.GAME_WIDTH / 2, 80);
                
                ctx.fillStyle = '#888888';
                ctx.font = '14px Arial';
                ctx.fillText('Break Brick Roguelike', CONFIG.GAME_WIDTH / 2, 105);
                
                const navY = CONFIG.GAME_HEIGHT - 60;
                const navHeight = 50;
                
                ctx.fillStyle = this.menuTab === 'combo' ? '#00d4ff' : '#333333';
                ctx.fillRect(0, navY, CONFIG.GAME_WIDTH / 2, navHeight);
                ctx.fillStyle = this.menuTab === 'combo' ? '#000000' : '#888888';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Combo', CONFIG.GAME_WIDTH / 4, navY + 30);
                
                ctx.fillStyle = this.menuTab === 'ball' ? '#00d4ff' : '#333333';
                ctx.fillRect(CONFIG.GAME_WIDTH / 2, navY, CONFIG.GAME_WIDTH / 2, navHeight);
                ctx.fillStyle = this.menuTab === 'ball' ? '#000000' : '#888888';
                ctx.fillText('普通球', CONFIG.GAME_WIDTH * 3 / 4, navY + 30);
                
                if (this.menuTab === 'combo') {
                    this.drawComboSelection(ctx);
                } else {
                    this.drawBallSelection(ctx);
                }
                
                // 開始遊戲按鈕與提示文字
                const startBtnW = 160;
                const startBtnH = 50;
                const startBtnY = CONFIG.GAME_HEIGHT - 120;
                const startBtnX = (CONFIG.GAME_WIDTH / 2) - (startBtnW / 2);
                
                const canStart = this.selectedCombos.length === 2;
                ctx.fillStyle = canStart ? '#00ff88' : '#444444';
                ctx.beginPath();
                ctx.roundRect(startBtnX, startBtnY, startBtnW, startBtnH, 10);
                ctx.fill();
                
                ctx.fillStyle = canStart ? '#000000' : '#888888';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('開始遊戲', CONFIG.GAME_WIDTH / 2, startBtnY + 30);
                
                if (!canStart) {
                    ctx.fillStyle = '#ff6666';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('請選擇2個Combo', CONFIG.GAME_WIDTH / 2, startBtnY + 65);
                }
            }

            drawComboSelection(ctx) {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`選擇2個Combo (已選: ${this.selectedCombos.length}/2)`, CONFIG.GAME_WIDTH / 2, 125);
                
                const comboTypes = Object.keys(COMBO_TYPES);
                const cardWidth = 180;
                const cardHeight = 105;
                const cols = 2;
                const spacing = 6;
                const totalWidth = cols * cardWidth + (cols - 1) * spacing;
                const startX = (CONFIG.GAME_WIDTH - totalWidth) / 2;
                const startY = 140;
                
                for (let i = 0; i < comboTypes.length; i++) {
                    const type = comboTypes[i];
                    const comboData = COMBO_TYPES[type];
                    const col = i % cols;
                    const row = Math.floor(i / cols);
                    const cardX = startX + col * (cardWidth + spacing);
                    const cardY = startY + row * (cardHeight + spacing);
                    
                    const isSelected = this.selectedCombos.includes(type);
                    
                    ctx.fillStyle = isSelected ? comboData.color : '#1a1a3e';
                    ctx.beginPath();
                    ctx.roundRect(cardX, cardY, cardWidth, cardHeight, 10);
                    ctx.fill();
                    
                    if (isSelected) {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }
                    
                    // 圖示 - 放大
                    ctx.fillStyle = isSelected ? '#000000' : comboData.color;
                    ctx.font = '36px Arial';
                    ctx.textAlign = 'left';
                    ctx.fillText(comboData.icon, cardX + 8, cardY + 40);
                    
                    // 名稱 - 放大
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText(comboData.name, cardX + 55, cardY + 32);
                    
                    // 描述 - 放大兩倍
                    ctx.font = '13px Arial';
                    ctx.fillStyle = isSelected ? '#222222' : '#cccccc';
                    const desc = comboData.description;
                    const maxWidth = cardWidth - 16;
                    let words = desc.split('');
                    let line = '';
                    let lineY = cardY + 58;
                    for (let char of words) {
                        const testLine = line + char;
                        const metrics = ctx.measureText(testLine);
                        if (metrics.width > maxWidth && line.length > 0) {
                            ctx.fillText(line, cardX + 8, lineY);
                            line = char;
                            lineY += 16;
                        } else {
                            line = testLine;
                        }
                    }
                    if (line) ctx.fillText(line, cardX + 8, lineY);
                    
                    // 觸發條件 - 放大
                    ctx.font = 'bold 11px Arial';
                    ctx.fillStyle = isSelected ? '#444444' : '#888888';
                    ctx.fillText(`觸發: ${comboData.threshold}次碰撞`, cardX + 8, cardY + 98);
                }
            }

            drawBallSelection(ctx) {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('選擇普通球模式', CONFIG.GAME_WIDTH / 2, 140);
                
                const btnWidth = 160;
                const btnHeight = 60;
                const startY = 160;
                const centerX = CONFIG.GAME_WIDTH / 2 - btnWidth / 2;
                const gap = 15;
                
                const modes = [
                    { id: '20balls', title: '20顆普通球', desc: '固定1點傷害' },
                    { id: 'wave', title: '1顆普通球', desc: '傷害 = 當前波數' },
                    { id: 'random', title: '每波1~99顆', desc: '傷害0~3，無+球道具' },
                    { id: 'combo10', title: '1顆普通球', desc: '每次碰撞+10 Combo' }
                ];
                
                for (let i = 0; i < modes.length; i++) {
                    const mode = modes[i];
                    const btnY = startY + i * (btnHeight + gap);
                    
                    ctx.fillStyle = this.ballDamageMode === mode.id ? '#00d4ff' : '#333333';
                    ctx.beginPath();
                    ctx.roundRect(centerX, btnY, btnWidth, btnHeight, 10);
                    ctx.fill();
                    
                    ctx.fillStyle = this.ballDamageMode === mode.id ? '#000000' : '#ffffff';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(mode.title, CONFIG.GAME_WIDTH / 2, btnY + 25);
                    ctx.font = '12px Arial';
                    ctx.fillText(mode.desc, CONFIG.GAME_WIDTH / 2, btnY + 45);
                }
            }

            drawSkillSelectScreen() {
                const ctx = this.ctx;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, CONFIG.GAME_WIDTH, CONFIG.GAME_HEIGHT);
                
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🎁 選擇技能 🎁', CONFIG.GAME_WIDTH / 2, 80);
                
                ctx.fillStyle = CONFIG.COLORS.text;
                ctx.font = '16px Arial';
                ctx.fillText('選擇一個特殊球加入你的武器庫', CONFIG.GAME_WIDTH / 2, 115);
                
                const cardWidth = 115;
                const cardHeight = 180;
                const spacing = 15;
                const totalWidth = 3 * cardWidth + 2 * spacing;
                const startX = (CONFIG.GAME_WIDTH - totalWidth) / 2;
                const startY = CONFIG.GAME_HEIGHT / 2 - cardHeight / 2 - 10;
                
                for (let i = 0; i < 3; i++) {
                    const type = this.skillChoices[i];
                    const typeData = BALL_TYPES[type];
                    const cardX = startX + i * (cardWidth + spacing);
                    
                    ctx.fillStyle = '#1a1a3e';
                    ctx.beginPath();
                    ctx.roundRect(cardX, startY, cardWidth, cardHeight, 10);
                    ctx.fill();
                    
                    ctx.strokeStyle = typeData.color;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    // 球的圖示
                    ctx.beginPath();
                    ctx.arc(cardX + cardWidth / 2, startY + 40, 25, 0, Math.PI * 2);
                    ctx.fillStyle = typeData.color;
                    ctx.fill();
                    
                    // 球名稱 - 放大
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(typeData.name, cardX + cardWidth / 2, startY + 85);
                    
                    // 描述 - 放大到14px
                    ctx.font = '14px Arial';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    const desc = typeData.description;
                    const maxWidth = cardWidth - 12;
                    let words = desc.split('');
                    let line = '';
                    let lineY = startY + 108;
                    for (let char of words) {
                        const testLine = line + char;
                        const metrics = ctx.measureText(testLine);
                        if (metrics.width > maxWidth && line.length > 0) {
                            ctx.fillText(line, cardX + cardWidth / 2, lineY);
                            line = char;
                            lineY += 18;
                        } else {
                            line = testLine;
                        }
                    }
                    if (line) ctx.fillText(line, cardX + cardWidth / 2, lineY);
                }
                
                const refreshBtnX = CONFIG.GAME_WIDTH / 2 - 80;
                const refreshBtnY = startY + cardHeight + 25;
                const refreshBtnW = 160;
                const refreshBtnH = 45;
                
                const canRefresh = this.refreshCount > 0 && this.normalBallCount >= 10;
                ctx.fillStyle = canRefresh ? 'rgba(100, 200, 255, 0.8)' : 'rgba(100, 100, 100, 0.5)';
                ctx.beginPath();
                ctx.roundRect(refreshBtnX, refreshBtnY, refreshBtnW, refreshBtnH, 8);
                ctx.fill();
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`🔄 刷新 (${this.refreshCount}/3)`, CONFIG.GAME_WIDTH / 2, refreshBtnY + 18);
                ctx.font = '12px Arial';
                ctx.fillStyle = canRefresh ? '#ffff00' : '#888888';
                ctx.fillText('消耗 10 普通球', CONFIG.GAME_WIDTH / 2, refreshBtnY + 36);
            }

            drawGameOverScreen() {
                const ctx = this.ctx;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, CONFIG.GAME_WIDTH, CONFIG.GAME_HEIGHT);
                
                ctx.fillStyle = CONFIG.COLORS.accent;
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', CONFIG.GAME_WIDTH / 2, CONFIG.GAME_HEIGHT / 3);
                
                ctx.fillStyle = CONFIG.COLORS.text;
                ctx.font = '24px Arial';
                ctx.fillText(`到達第 ${this.wave} 波`, CONFIG.GAME_WIDTH / 2, CONFIG.GAME_HEIGHT / 2);
                
                const time = Date.now() / 1000;
                const alpha = 0.5 + Math.sin(time * 3) * 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.font = '20px Arial';
                ctx.fillText('點擊螢幕返回主選單', CONFIG.GAME_WIDTH / 2, CONFIG.GAME_HEIGHT * 0.7);
            }

            drawVictoryScreen() {
                const ctx = this.ctx;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, CONFIG.GAME_WIDTH, CONFIG.GAME_HEIGHT);
                
                const time = Date.now() / 500;
                ctx.fillStyle = `hsl(${(time * 50) % 360}, 70%, 60%)`;
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🎉 勝利！🎉', CONFIG.GAME_WIDTH / 2, CONFIG.GAME_HEIGHT / 3);
                
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('恭喜擊敗所有Boss！', CONFIG.GAME_WIDTH / 2, CONFIG.GAME_HEIGHT / 2);
                
                const alpha = 0.5 + Math.sin(time * 3) * 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.font = '20px Arial';
                ctx.fillText('點擊螢幕返回主選單', CONFIG.GAME_WIDTH / 2, CONFIG.GAME_HEIGHT * 0.7);
            }

            draw() {
                const ctx = this.ctx;
                
                ctx.save();
                ctx.scale(this.scale, this.scale);
                
                if (this.state === 'menu') {
                    this.drawMenuScreen();
                    ctx.restore();
                    return;
                }
                
                ctx.fillStyle = CONFIG.COLORS.background;
                ctx.fillRect(0, 0, CONFIG.GAME_WIDTH, CONFIG.GAME_HEIGHT);
                
                ctx.strokeStyle = 'rgba(0, 212, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.strokeRect(1, this.topOffset, CONFIG.GAME_WIDTH - 2, CONFIG.GAME_HEIGHT - this.topOffset - 1);
                
                for (let laser of this.crossLasers) {
                    laser.draw(ctx);
                }
                
                for (let wall of this.iceWalls) {
                    wall.draw(ctx);
                }
                
                for (let brick of this.bricks) {
                    brick.draw(ctx);
                }
                
                for (let powerup of this.powerups) {
                    powerup.draw(ctx);
                }
                
                this.drawAimLine();
                
                for (let ball of this.balls) {
                    ball.draw(ctx);
                }
                
                if (this.launcher) {
                    this.launcher.draw(ctx, this.playerHp, this.maxHp);
                }
                
                this.drawEffects();
                this.drawUI();
                
                if (this.state === 'skillSelect') {
                    this.drawSkillSelectScreen();
                }
                
                if (this.state === 'gameover') {
                    this.drawGameOverScreen();
                }
                
                if (this.state === 'victory') {
                    this.drawVictoryScreen();
                }
                
                ctx.restore();
            }

            gameLoop(timestamp) {
                this.update();
                this.draw();
                requestAnimationFrame((t) => this.gameLoop(t));
            }
        }

        // 啟動遊戲
        window.addEventListener('load', () => {
            new Game();
        });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
