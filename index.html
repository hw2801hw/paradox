    <title>快捷連結</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
            background-color: #f0f8ff;
            margin: 0;
        }
        
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 30px;
        }
        
        .links-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .link-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .link-number {
            font-size: 20px;
            color: #333;
            font-weight: bold;
            min-width: 50px;
        }
        
        a {
            text-decoration: none;
            color: #007bff;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        .side-link {
            font-size: 20px;
            padding: 8px 12px;
        }
        
        .button-style {
            display: inline-block;
            padding: 12px 28px;
            background-color: #007bff;
            color: white;
            border-radius: 12px;
            font-size: 22px;
            transition: background 0.3s ease, transform 0.2s ease;
            min-width: 100px;
        }
        
        .button-style:hover {
            text-decoration: none;
            transform: scale(1.05);
            background-color: #0056b3;
        }
        
        /* 第7項泡泡專用：整個按鈕背景彩虹漸變動畫 */
        #rainbow-button {
            color: white;
            font-weight: bold;
            background: linear-gradient(270deg, #ff0000, #ff9900, #ffff00, #00ff00, #00ffff, #0000ff, #9900ff);
            background-size: 600% 600%;
            animation: rainbowFlow 2s ease infinite;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        #rainbow-button:hover {
            background: linear-gradient(270deg, #ff0000, #ff9900, #ffff00, #00ff00, #00ffff, #0000ff, #9900ff);
            background-size: 600% 600%;
        }
        
        @keyframes rainbowFlow {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 平板裝置 */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }
            
            .link-row {
                padding: 12px;
                gap: 8px;
            }
            
            .link-number {
                font-size: 18px;
                min-width: 45px;
            }
            
            .side-link {
                font-size: 18px;
                padding: 6px 10px;
            }
            
            .button-style {
                padding: 10px 20px;
                font-size: 20px;
                min-width: 90px;
            }
        }
        
        /* 手機裝置 */
        @media (max-width: 480px) {
            body {
                padding: 15px 8px;
            }
            
            h1 {
                font-size: 22px;
                margin-bottom: 20px;
            }
            
            .link-row {
                flex-direction: column;
                padding: 15px 10px;
                gap: 12px;
            }
            
            .link-number {
                font-size: 16px;
                min-width: auto;
            }
            
            .side-links {
                display: flex;
                gap: 15px;
                justify-content: center;
            }
            
            .side-link {
                font-size: 16px;
                padding: 5px 8px;
            }
            
            .button-style {
                padding: 14px 30px;
                font-size: 20px;
                min-width: 120px;
                width: 80%;
                max-width: 200px;
            }
        }
        
        /* 超小螢幕 */
        @media (max-width: 360px) {
            .button-style {
                padding: 12px 20px;
                font-size: 18px;
            }
            
            .side-link {
                font-size: 14px;
            }
            
            .link-number {
                font-size: 14px;
            }
        }
    </style>
</head>
