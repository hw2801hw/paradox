    isInBishopAura(row, col, owner) {
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                const r = row + dr, c = col + dc;
                if (r >= 0 && r < 8 && c >= 0 && c < 8) {
                    const piece = this.state.board[r][c];
                    const key = `${r},${c}`;
                    const pieceState = this.state.pieceStates[key];
                    if (piece && piece.toLowerCase() === 'b' && this.state.getOwner(piece) === owner && 
                        !(pieceState && pieceState.isGoblin)) {
                        return true;
                    }
                }
            }
        }
        return false;
    }
    
    checkGameEnd() {
        const currentPlayer = this.state.turn;
        let hasLegalMove = false;
        
        for (let r = 0; r < 8 && !hasLegalMove; r++) {
            for (let c = 0; c < 8 && !hasLegalMove; c++) {
                const piece = this.state.board[r][c];
                if (piece && this.state.getOwner(piece) === currentPlayer) {
                    const key = `${r},${c}`;
                    if (this.state.stunned[key] && !this.isImmuneToControl(r, c, currentPlayer)) {
                        continue;
                    }
                    const moves = this.getValidMoves(r, c);
                    if (moves.length > 0) {
                        hasLegalMove = true;
                    }
                }
            }
        }
        
        for (const key in this.state.ghostPieces) {
            if (hasLegalMove) break;
            const ghost = this.state.ghostPieces[key];
            if (this.state.getOwner(ghost.piece) === currentPlayer) {
                const [r, c] = key.split(',').map(Number);
                const moves = this.getGhostMoves(r, c);
                if (moves.length > 0) {
                    hasLegalMove = true;
                }
            }
        }
        
        if (!hasLegalMove) {
            this.state.gameOver = true;
            if (this.isInCheck(currentPlayer)) {
                this.state.winner = currentPlayer === 'w' ? 'b' : 'w';
                this.showGameOver(`${this.state.winner === 'w' ? '白方' : '黑方'}勝利！`, '將死！');
            } else {
                this.showGameOver('和棋！', '無子可動');
            }
            return true;
        }
        
        return false;
    }
    
    aiMove() {
        if (this.state.gameOver) return;
        
        const allMoves = [];
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = this.state.board[r][c];
                if (piece && this.state.isBlack(piece)) {
                    const key = `${r},${c}`;
                    if (this.state.stunned[key] && !this.isImmuneToControl(r, c, 'b')) {
                        continue;
                    }
                    
                    const moves = this.getValidMoves(r, c);
                    for (const move of moves) {
                        let value = Math.random() * 0.5;
                        const target = this.state.board[move.row][move.col];
                        if (target) {
                            value += this.getPieceValue(target) * 10;
                        }
                        allMoves.push({ from: { row: r, col: c }, to: move, value });
                    }
                }
            }
        }
        
        if (allMoves.length === 0) {
            this.finishTurn();
            return;
        }
        
        allMoves.sort((a, b) => b.value - a.value);
        const selectedMove = allMoves[0];
        
        this.state.selectedPos = selectedMove.from;
        this.validMoves = this.getValidMoves(selectedMove.from.row, selectedMove.from.col);
        this.makeMove(selectedMove.from.row, selectedMove.from.col, selectedMove.to.row, selectedMove.to.col);
    }
    
    getPieceValue(piece) {
        const values = { 'p': 1, 'n': 3, 'b': 3, 'r': 5, 'q': 9, 'k': 100 };
        return values[piece.toLowerCase()] || 0;
    }
    
    activateTaunt() {
        const currentOwner = this.state.turn;
        const ult = this.state.getCurrentUltimates();
        
        if (!ult.taunt.unlocked || ult.taunt.used) return;
        
        this.saveState();
        ult.taunt.active = true;
        ult.taunt.used = true;
        ult.taunt.turnsRemaining = 5;
        ult.taunt.pawnKillsCount = 0;
        
        this.showUltimateEffect('⚡ 嘲諷！');
        this.log(`🛡️ ${currentOwner === 'w' ? '白方' : '黑方'}嘲諷！對手需5回合內殺2兵！`);
        this.render();
    }
    
    executeTauntPunishment(tauntOwner) {
        const enemy = tauntOwner === 'w' ? 'b' : 'w';
        const enemyPawn = enemy === 'w' ? 'P' : 'p';
        
        this.log(`⚠️ 嘲諷懲罰！${enemy === 'w' ? '白方' : '黑方'}兵全滅！`);
        this.showUltimateEffect('💀 嘲諷制裁！');
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (this.state.board[r][c] === enemyPawn) {
                    this.state.board[r][c] = null;
                    delete this.state.pieceStates[`${r},${c}`];
                    this.createParticles(c, r, '#ff0000', 5);
                }
            }
        }
        
        const tauntUlt = this.state.getPlayerUltimates(tauntOwner);
        tauntUlt.taunt.active = false;
        this.showFX('red-flash shake');
    }
    
    activatePiercingArrow() {
        const currentOwner = this.state.turn;
        const ult = this.state.getCurrentUltimates();
        
        if (!ult.arrow.available || ult.arrow.used) return;
        
        const rookPiece = currentOwner === 'w' ? 'R' : 'r';
        let rookPos = null;
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (this.state.board[r][c] === rookPiece) {
                    rookPos = { row: r, col: c };
                    break;
                }
            }
            if (rookPos) break;
        }
        
        if (!rookPos) {
            this.log('沒有車！');
            return;
        }
        
        this.saveState();
        this.showUltimateEffect('🏹 貫矢！');
        ult.arrow.used = true;
        
        const directions = [[0,1],[0,-1],[1,0],[-1,0]];
        let kills = 0;
        
        for (const [dr, dc] of directions) {
            let r = rookPos.row + dr, c = rookPos.col + dc;
            while (r >= 0 && r < 8 && c >= 0 && c < 8) {
                const piece = this.state.board[r][c];
                if (piece && piece.toLowerCase() !== 'k') {
                    this.state.board[r][c] = null;
                    delete this.state.pieceStates[`${r},${c}`];
                    kills++;
                    this.createParticles(c, r, '#00ffff', 15);
                }
                r += dr;
                c += dc;
            }
        }
        
        this.log(`🏹 貫矢殺死${kills}個棋子！`);
        this.showFX('shake');
        this.render();
    }
    
    activateStealth() {
        const currentOwner = this.state.turn;
        const ult = this.state.getCurrentUltimates();
        
        if (!ult.stealth.available || ult.stealth.used) return;
        
        this.saveState();
        this.showUltimateEffect('🗡️ 隱身！');
        ult.stealth.used = true;
        ult.stealth.active = true;
        
        const trapCount = Object.keys(this.state.traps).length;
        this.state.traps = {};
        this.state.trapsDisabled = true;
        if (trapCount > 0) {
            this.log(`💨 所有${trapCount}個陷阱已消失！`);
        }
        this.log('🚫 雙方馬不再能設置陷阱！');
        
        // 將己方的馬變成幽靈
        const knightPiece = currentOwner === 'w' ? 'N' : 'n';
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = this.state.board[r][c];
                const key = `${r},${c}`;
                const state = this.state.pieceStates[key];
                if (piece === knightPiece && state && !state.isGoblin) {
                    this.state.board[r][c] = null;
                    delete this.state.pieceStates[key];
                    
                    this.state.ghostPieces[key] = {
                        piece: knightPiece,
                        state: { ...state, invisible: true }
                    };
                    
                    this.createParticles(c, r, '#9b59b6', 15);
                }
            }
        }
        
        this.log(`🗡️ ${currentOwner === 'w' ? '白方' : '黑方'}所有馬變成幽靈👻！`);
        this.render();
    }
    
    revealAllGhosts() {
        const currentOwner = this.state.turn;
        const ult = this.state.getCurrentUltimates();
        
        if (!ult.stealth.active) return;
        
        this.saveState();
        this.showUltimateEffect('👁️ 現身！');
        ult.stealth.active = false;
        
        const knightPiece = currentOwner === 'w' ? 'N' : 'n';
        
        for (const key in this.state.ghostPieces) {
            const ghost = this.state.ghostPieces[key];
            if (ghost.piece === knightPiece) {
                const [r, c] = key.split(',').map(Number);
                
                this.state.revealedKnightsThisTurn.add(ghost.state.id);
                
                if (!this.state.board[r][c]) {
                    this.state.board[r][c] = ghost.piece;
                    ghost.state.invisible = false;
                    this.state.pieceStates[key] = ghost.state;
                    delete this.state.ghostPieces[key];
                } else {
                    let placed = false;
                    for (let dr = -1; dr <= 1 && !placed; dr++) {
                        for (let dc = -1; dc <= 1 && !placed; dc++) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !this.state.board[nr][nc]) {
                                this.state.board[nr][nc] = ghost.piece;
                                ghost.state.invisible = false;
                                this.state.pieceStates[`${nr},${nc}`] = ghost.state;
                                delete this.state.ghostPieces[key];
                                placed = true;
                            }
                        }
                    }
                }
                
                this.createParticles(c, r, '#ff6600', 15);
            }
        }
        
        this.log('👁️ 所有刺客現身！本回合刺客無法行動。');
        this.render();
    }
    
    activatePurify() {
        const currentOwner = this.state.turn;
        const ult = this.state.getCurrentUltimates();
        
        if (!ult.purify.available || ult.purify.used) return;
        
        this.saveState();
        this.showUltimateEffect('💫 淨化！');
        ult.purify.used = true;
        ult.purify.permanentImmunity = true;
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = this.state.board[r][c];
                if (piece && this.state.getOwner(piece) === currentOwner) {
                    const key = `${r},${c}`;
                    delete this.state.stunned[key];
                    this.createParticles(c, r, '#00ffff', 10);
                }
            }
        }
        
        this.log(`💫 ${currentOwner === 'w' ? '白方' : '黑方'}永久免疫控制！`);
        this.render();
    }
    
    activateCurse() {
        const currentOwner = this.state.turn;
        const ult = this.state.getCurrentUltimates();
        const enemy = currentOwner === 'w' ? 'b' : 'w';
        
        if (!ult.curse.available || ult.curse.used) return;
        
        this.saveState();
        this.showUltimateEffect('🔮 詛咒！');
        ult.curse.used = true;
        
        const enemies = [];
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = this.state.board[r][c];
                const key = `${r},${c}`;
                const state = this.state.pieceStates[key];
                if (piece && this.state.getOwner(piece) === enemy && piece.toLowerCase() !== 'k' && !(state?.isGoblin)) {
                    enemies.push({ row: r, col: c });
                }
            }
        }
        
        const count = Math.min(2, enemies.length);
        for (let i = 0; i < count; i++) {
            const idx = Math.floor(Math.random() * enemies.length);
            const target = enemies.splice(idx, 1)[0];
            const key = `${target.row},${target.col}`;
            if (this.state.pieceStates[key]) {
                this.state.pieceStates[key].isGoblin = true;
                this.log(`🔮 ${this.posToNotation(target.row, target.col)} 變成哥布林！`);
                this.createParticles(target.col, target.row, '#00ff00', 15);
            }
        }
        
        this.render();
    }
    
    activateEscort() {
        const currentOwner = this.state.turn;
        const ult = this.state.getCurrentUltimates();
        
        if (ult.escort.used) return;
        if (this.gameMode === 'ai' && currentOwner !== 'w') return;
        
        this.escortMode = true;
        this.state.selectedPos = null;
        this.validMoves = [];
        document.getElementById('escortHint').classList.add('show');
        this.log('👑 護駕模式：點擊友方棋子與王交換');
        this.render();
    }
    
    executeEscortDirect(targetRow, targetCol) {
        this.saveState();
        
        const currentOwner = this.state.turn;
        const kingPiece = currentOwner === 'w' ? 'K' : 'k';
        const ult = this.state.getCurrentUltimates();
        
        let kingPos = null;
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                if (this.state.board[r][c] === kingPiece) {
                    kingPos = { row: r, col: c };
                    break;
                }
            }
            if (kingPos) break;
        }
        
        if (!kingPos) {
            this.cancelEscort();
            return;
        }
        
        const kingKey = `${kingPos.row},${kingPos.col}`;
        const targetKey = `${targetRow},${targetCol}`;
        
        // 交換棋盤上的棋子
        const temp = this.state.board[kingPos.row][kingPos.col];
        this.state.board[kingPos.row][kingPos.col] = this.state.board[targetRow][targetCol];
        this.state.board[targetRow][targetCol] = temp;
        
        // 交換 pieceStates
        const tempState = this.state.pieceStates[kingKey];
        this.state.pieceStates[kingKey] = this.state.pieceStates[targetKey];
        this.state.pieceStates[targetKey] = tempState;
        
        // 【修復】正確處理控制狀態：
        // 被交換的棋子原本在 targetKey，現在移到 kingKey
        // 王原本在 kingKey，現在移到 targetKey
        // 控制狀態應該跟隨棋子移動，而不是停留在原位置
        const targetStunned = this.state.stunned[targetKey];
        const kingStunned = this.state.stunned[kingKey]; // 王不應該被控制，但以防萬一
        
        // 清除兩個位置的控制狀態
        delete this.state.stunned[targetKey];
        delete this.state.stunned[kingKey];
        
        // 將被交換棋子的控制狀態移到其新位置(kingKey)
        if (targetStunned) {
            this.state.stunned[kingKey] = targetStunned;
        }
        // 王移到 targetKey，但王免疫控制，所以不設置任何控制狀態
        // (即使原本有 kingStunned 也不移動，因為王免疫)
        
        ult.escort.used = true;
        this.escortMode = false;
        document.getElementById('escortHint').classList.remove('show');
        
        if (currentOwner === 'w') {
            this.state.castling.K = false;
            this.state.castling.Q = false;
        } else {
            this.state.castling.k = false;
            this.state.castling.q = false;
        }
        
        this.showUltimateEffect('👑 護駕！');
        this.log('👑 王與友方棋子交換位置！');
        this.render();
    }
    
    cancelEscort() {
        this.escortMode = false;
        document.getElementById('escortHint').classList.remove('show');
        this.render();
    }
    
    showFX(type) {
        const overlay = document.getElementById('fxOverlay');
        overlay.className = 'fx-overlay ' + type;
        setTimeout(() => overlay.className = 'fx-overlay', 600);
    }
    
    showUltimateEffect(text) {
        this.showFX('red-flash shake');
        
        const textEl = document.createElement('div');
        textEl.className = 'ultimate-text';
        textEl.textContent = text;
        document.body.appendChild(textEl);
        
        setTimeout(() => textEl.remove(), 1500);
    }
    
    createParticles(col, row, color, count) {
        const board = this.boardEl.getBoundingClientRect();
        const cellSize = board.width / 8;
        
        for (let i = 0; i < count; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.background = color;
            particle.style.left = `${board.left + col * cellSize + cellSize/2}px`;
            particle.style.top = `${board.top + row * cellSize + cellSize/2}px`;
            particle.style.setProperty('--dx', `${(Math.random() - 0.5) * 150}px`);
            particle.style.setProperty('--dy', `${(Math.random() - 0.5) * 150}px`);
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1000);
        }
    }
    
    showGameOver(title, reason) {
        const modal = document.getElementById('gameOverModal');
        document.getElementById('gameOverText').textContent = title;
        document.getElementById('gameOverReason').textContent = reason;
        modal.classList.add('show');
        this.showUltimateEffect(title);
    }
    
    posToNotation(row, col) {
        return `${'abcdefgh'[col]}${8 - row}`;
    }
    
    log(message) {
        const logEl = document.getElementById('gameLog');
        const entry = document.createElement('div');
        entry.textContent = `[${this.state.turnNumber}] ${message}`;
        entry.className = 'text-gray-300';
        logEl.insertBefore(entry, logEl.firstChild);
        while (logEl.children.length > 30) {
            logEl.removeChild(logEl.lastChild);
        }
    }
}
</script>
</body>
