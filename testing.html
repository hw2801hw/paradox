<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>跑步追蹤器</title>
    <style>
        /* ===== 基礎樣式與深色模式 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a24;
            --bg-card: #252532;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-green: #00d68f;
            --accent-green-dark: #00a870;
            --accent-red: #ff4757;
            --accent-red-dark: #cc3a47;
            --accent-blue: #3b82f6;
            --accent-yellow: #fbbf24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
        }

        /* ===== 標題區 ===== */
        .header {
            text-align: center;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== 狀態指示器 ===== */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-radius: 50px;
            margin-bottom: 24px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: none;
        }

        .status-dot.searching {
            background: var(--accent-yellow);
            animation: pulse 1.5s infinite;
        }

        .status-dot.locked {
            background: var(--accent-green);
        }

        .status-dot.running {
            background: var(--accent-green);
            animation: pulse 1s infinite;
        }

        .status-dot.error {
            background: var(--accent-red);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .status-text {
            font-size: 14px;
            font-weight: 500;
        }

        .gps-accuracy {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: 8px;
            padding: 4px 10px;
            background: var(--bg-card);
            border-radius: 20px;
        }

        /* ===== 主要配速顯示 ===== */
        .main-pace-display {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 20px;
        }

        .pace-label {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .pace-value {
            font-size: 120px;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .pace-unit {
            font-size: 24px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .unit-toggle {
            display: inline-flex;
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 4px;
            margin-top: 16px;
        }

        .unit-toggle button {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .unit-toggle button.active {
            background: var(--accent-green);
            color: var(--bg-primary);
            font-weight: 600;
        }

        /* ===== 統計卡片網格 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-card.wide {
            grid-column: span 2;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stat-value.time {
            font-size: 48px;
            color: var(--accent-blue);
        }

        .stat-unit {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* ===== 控制按鈕 ===== */
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(transparent, var(--bg-primary) 20%);
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 20px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-start {
            background: var(--accent-green);
            color: var(--bg-primary);
        }

        .btn-start:hover {
            background: var(--accent-green-dark);
        }

        .btn-start:disabled {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .btn-stop {
            background: var(--accent-red);
            color: white;
        }

        .btn-stop:hover {
            background: var(--accent-red-dark);
        }

        .btn-stop:disabled {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .btn-reset {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* ===== 結果畫面 ===== */
        .results-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .results-overlay.show {
            display: flex;
        }

        .results-card {
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .results-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .results-subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .results-stat {
            padding: 20px 0;
            border-bottom: 1px solid var(--bg-card);
        }

        .results-stat:last-of-type {
            border-bottom: none;
        }

        .results-stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .results-stat-value {
            font-size: 42px;
            font-weight: 700;
        }

        .results-btn {
            width: 100%;
            margin-top: 24px;
            padding: 18px;
            background: var(--accent-green);
            color: var(--bg-primary);
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ===== 錯誤/載入提示 ===== */
        .message-box {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
            display: none;
        }

        .message-box.show {
            display: block;
        }

        .message-box.error {
            border: 2px solid var(--accent-red);
        }

        .message-box.info {
            border: 2px solid var(--accent-blue);
        }

        .message-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .message-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .message-text {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }

        /* ===== 載入動畫 ===== */
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid var(--bg-secondary);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 調試資訊（可選顯示） ===== */
        .debug-info {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            font-size: 12px;
            font-family: monospace;
            display: none;
        }

        .debug-info.show {
            display: block;
        }

        .debug-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid var(--bg-card);
        }
    </style>
</head>
<body>
    <!-- 標題區 -->
    <header class="header">
        <h1>🏃 跑步追蹤器</h1>
        <p class="subtitle">使用 GPS 精準追蹤您的跑步數據</p>
    </header>

    <!-- 狀態列 -->
    <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">準備就緒</span>
        <span class="gps-accuracy" id="gpsAccuracy">GPS: --</span>
    </div>

    <!-- 訊息框 -->
    <div class="message-box" id="messageBox">
        <div class="loader" id="loader"></div>
        <div class="message-icon" id="messageIcon"></div>
        <div class="message-title" id="messageTitle"></div>
        <div class="message-text" id="messageText"></div>
    </div>

    <!-- 主要配速顯示 -->
    <div class="main-pace-display">
        <div class="pace-label">當前配速</div>
        <div class="pace-value" id="currentPace">--:--</div>
        <div class="pace-unit" id="paceUnit">/km</div>
        <div class="unit-toggle">
            <button id="btnKm" class="active" onclick="setUnit('km')">公里</button>
            <button id="btnMile" onclick="setUnit('mile')">英里</button>
        </div>
    </div>

    <!-- 統計數據網格 -->
    <div class="stats-grid">
        <div class="stat-card wide">
            <div class="stat-label">經過時間</div>
            <div class="stat-value time" id="elapsedTime">00:00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">總距離</div>
            <div class="stat-value" id="totalDistance">0.00</div>
            <div class="stat-unit" id="distanceUnit">公里</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">平均配速</div>
            <div class="stat-value" id="avgPace">--:--</div>
            <div class="stat-unit" id="avgPaceUnit">/km</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">當前速度</div>
            <div class="stat-value" id="currentSpeed">0.0</div>
            <div class="stat-unit" id="speedUnit">km/h</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">有效點數</div>
            <div class="stat-value" id="validPoints">0</div>
            <div class="stat-unit">個定位點</div>
        </div>
    </div>

    <!-- 調試資訊（點擊5次標題可顯示） -->
    <div class="debug-info" id="debugInfo">
        <div class="debug-row">
            <span>原始點數:</span>
            <span id="debugRawPoints">0</span>
        </div>
        <div class="debug-row">
            <span>過濾掉的點:</span>
            <span id="debugFilteredPoints">0</span>
        </div>
        <div class="debug-row">
            <span>最後緯度:</span>
            <span id="debugLat">--</span>
        </div>
        <div class="debug-row">
            <span>最後經度:</span>
            <span id="debugLng">--</span>
        </div>
        <div class="debug-row">
            <span>移動平均速度:</span>
            <span id="debugMovingAvg">--</span>
        </div>
    </div>

    <!-- 控制按鈕 -->
    <div class="controls">
        <button class="btn btn-start" id="btnStart" onclick="startRun()">
            ▶ 開始跑步
        </button>
        <button class="btn btn-stop" id="btnStop" onclick="stopRun()" disabled>
            ⏹ 結束跑步
        </button>
    </div>

    <!-- 結果畫面 -->
    <div class="results-overlay" id="resultsOverlay">
        <div class="results-card">
            <div class="results-title">🎉 跑步完成！</div>
            <div class="results-subtitle">以下是您的跑步統計</div>
            
            <div class="results-stat">
                <div class="results-stat-label">總距離</div>
                <div class="results-stat-value" id="resultDistance">0.00 km</div>
            </div>
            <div class="results-stat">
                <div class="results-stat-label">總時間</div>
                <div class="results-stat-value" id="resultTime">00:00</div>
            </div>
            <div class="results-stat">
                <div class="results-stat-label">平均配速</div>
                <div class="results-stat-value" id="resultPace">--:-- /km</div>
            </div>
            <div class="results-stat">
                <div class="results-stat-label">平均時速</div>
                <div class="results-stat-value" id="resultSpeed">0.0 km/h</div>
            </div>

            <button class="results-btn" onclick="resetRun()">🔄 重新開始</button>
        </div>
    </div>

    <script>
        // ===================================================================
        // 全域狀態變數
        // ===================================================================
        let watchId = null;              // GPS 監聽器 ID
        let isRunning = false;           // 是否正在跑步
        let startTime = null;            // 開始時間
        let elapsedSeconds = 0;          // 經過秒數
        let timerInterval = null;        // 計時器 interval
        let totalDistanceMeters = 0;     // 總距離（公尺）
        let currentUnit = 'km';          // 當前單位 ('km' 或 'mile')
        
        // 位置追蹤相關
        let positions = [];              // 所有有效定位點 [{lat, lng, timestamp, accuracy}]
        let rawPositionCount = 0;        // 原始定位點數量
        let filteredCount = 0;           // 被過濾掉的點數量
        let lastValidPosition = null;    // 上一個有效位置
        let isGpsReady = false;          // GPS 是否已準備好（精度足夠）
        let warmupPoints = 0;            // 預熱點數量（等待GPS穩定）
        
        // 移動平均配速計算用
        const MOVING_AVG_WINDOW = 5;     // 移動平均窗口大小（最近5個點）
        let recentSpeeds = [];           // 最近的速度記錄 (m/s)

        // 常數定義
        const ACCURACY_THRESHOLD = 30;    // GPS 精度門檻（公尺）
        const MIN_DISTANCE_THRESHOLD = 5; // 最小移動距離門檻（公尺）
        const WARMUP_ACCURACY = 50;       // 預熱期精度要求（公尺）
        const WARMUP_POINTS_REQUIRED = 3; // 預熱期需要的點數

        // 調試模式
        let debugClickCount = 0;

        // ===================================================================
        // DOM 元素引用
        // ===================================================================
        const elements = {
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            gpsAccuracy: document.getElementById('gpsAccuracy'),
            currentPace: document.getElementById('currentPace'),
            paceUnit: document.getElementById('paceUnit'),
            elapsedTime: document.getElementById('elapsedTime'),
            totalDistance: document.getElementById('totalDistance'),
            distanceUnit: document.getElementById('distanceUnit'),
            avgPace: document.getElementById('avgPace'),
            avgPaceUnit: document.getElementById('avgPaceUnit'),
            currentSpeed: document.getElementById('currentSpeed'),
            speedUnit: document.getElementById('speedUnit'),
            validPoints: document.getElementById('validPoints'),
            btnStart: document.getElementById('btnStart'),
            btnStop: document.getElementById('btnStop'),
            btnKm: document.getElementById('btnKm'),
            btnMile: document.getElementById('btnMile'),
            messageBox: document.getElementById('messageBox'),
            loader: document.getElementById('loader'),
            messageIcon: document.getElementById('messageIcon'),
            messageTitle: document.getElementById('messageTitle'),
            messageText: document.getElementById('messageText'),
            resultsOverlay: document.getElementById('resultsOverlay'),
            resultDistance: document.getElementById('resultDistance'),
            resultTime: document.getElementById('resultTime'),
            resultPace: document.getElementById('resultPace'),
            resultSpeed: document.getElementById('resultSpeed'),
            debugInfo: document.getElementById('debugInfo'),
            debugRawPoints: document.getElementById('debugRawPoints'),
            debugFilteredPoints: document.getElementById('debugFilteredPoints'),
            debugLat: document.getElementById('debugLat'),
            debugLng: document.getElementById('debugLng'),
            debugMovingAvg: document.getElementById('debugMovingAvg')
        };

        // ===================================================================
        // Haversine Formula - 計算兩點間的球面距離（公尺）
        // ===================================================================
        /**
         * 使用 Haversine 公式計算地球表面兩點間的距離
         * @param {number} lat1 - 第一點緯度（度）
         * @param {number} lng1 - 第一點經度（度）
         * @param {number} lat2 - 第二點緯度（度）
         * @param {number} lng2 - 第二點經度（度）
         * @returns {number} 距離（公尺）
         */
        function haversineDistance(lat1, lng1, lat2, lng2) {
            const R = 6371000; // 地球平均半徑（公尺）
            
            // 轉換為弧度
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lng2 - lng1) * Math.PI / 180;

            // Haversine 公式
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        // ===================================================================
        // 配速格式化函數
        // ===================================================================
        /**
         * 將速度（m/s）轉換為配速字串
         * @param {number} speedMs - 速度（公尺/秒）
         * @param {string} unit - 單位 ('km' 或 'mile')
         * @returns {string} 格式化的配速字串（如 "4:28"）
         */
        function formatPace(speedMs, unit = 'km') {
            if (!speedMs || speedMs <= 0) return '--:--';
            
            // 計算每單位距離所需的秒數
            let secondsPerUnit;
            if (unit === 'km') {
                secondsPerUnit = 1000 / speedMs; // 每公里秒數
            } else {
                secondsPerUnit = 1609.344 / speedMs; // 每英里秒數
            }

            // 配速上限檢查（超過 30 分鐘/km 視為無效）
            if (secondsPerUnit > 1800) return '--:--';

            const minutes = Math.floor(secondsPerUnit / 60);
            const seconds = Math.floor(secondsPerUnit % 60);
            
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        /**
         * 格式化時間為 mm:ss 或 hh:mm:ss
         * @param {number} totalSeconds - 總秒數
         * @returns {string} 格式化的時間字串
         */
        function formatTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        /**
         * 將公尺轉換為指定單位
         * @param {number} meters - 距離（公尺）
         * @param {string} unit - 單位 ('km' 或 'mile')
         * @returns {number} 轉換後的距離
         */
        function metersToUnit(meters, unit = 'km') {
            if (unit === 'km') {
                return meters / 1000;
            }
            return meters / 1609.344;
        }

        // ===================================================================
        // 狀態更新函數
        // ===================================================================
        function updateStatus(status, text) {
            elements.statusDot.className = 'status-dot ' + status;
            elements.statusText.textContent = text;
        }

        function showMessage(type, icon, title, text, showLoader = false) {
            elements.messageBox.className = 'message-box show ' + type;
            elements.loader.style.display = showLoader ? 'block' : 'none';
            elements.messageIcon.textContent = showLoader ? '' : icon;
            elements.messageTitle.textContent = title;
            elements.messageText.textContent = text;
        }

        function hideMessage() {
            elements.messageBox.className = 'message-box';
        }

        // ===================================================================
        // 單位切換
        // ===================================================================
        function setUnit(unit) {
            currentUnit = unit;
            
            // 更新按鈕狀態
            elements.btnKm.className = unit === 'km' ? 'active' : '';
            elements.btnMile.className = unit === 'mile' ? 'active' : '';
            
            // 更新單位標籤
            const unitLabel = unit === 'km' ? '公里' : '英里';
            const paceUnitLabel = unit === 'km' ? '/km' : '/mi';
            const speedUnitLabel = unit === 'km' ? 'km/h' : 'mi/h';
            
            elements.paceUnit.textContent = paceUnitLabel;
            elements.distanceUnit.textContent = unitLabel;
            elements.avgPaceUnit.textContent = paceUnitLabel;
            elements.speedUnit.textContent = speedUnitLabel;
            
            // 重新計算並顯示數據
            updateDisplay();
        }

        // ===================================================================
        // 更新顯示
        // ===================================================================
        function updateDisplay() {
            // 總距離
            const distanceInUnit = metersToUnit(totalDistanceMeters, currentUnit);
            elements.totalDistance.textContent = distanceInUnit.toFixed(2);
            
            // 當前速度（使用移動平均）
            const avgSpeed = calculateMovingAverageSpeed();
            let speedInUnit;
            if (currentUnit === 'km') {
                speedInUnit = avgSpeed * 3.6; // m/s 轉 km/h
            } else {
                speedInUnit = avgSpeed * 2.237; // m/s 轉 mi/h
            }
            elements.currentSpeed.textContent = speedInUnit.toFixed(1);
            
            // 當前配速（使用移動平均速度計算）
            elements.currentPace.textContent = formatPace(avgSpeed, currentUnit);
            
            // 平均配速（總距離 / 總時間）
            if (elapsedSeconds > 0 && totalDistanceMeters > 0) {
                const avgSpeedMs = totalDistanceMeters / elapsedSeconds;
                elements.avgPace.textContent = formatPace(avgSpeedMs, currentUnit);
            } else {
                elements.avgPace.textContent = '--:--';
            }
            
            // 有效點數
            elements.validPoints.textContent = positions.length;
            
            // 調試資訊
            elements.debugRawPoints.textContent = rawPositionCount;
            elements.debugFilteredPoints.textContent = filteredCount;
            elements.debugMovingAvg.textContent = avgSpeed.toFixed(2) + ' m/s';
        }

        // ===================================================================
        // 計算移動平均速度
        // ===================================================================
        /**
         * 計算最近 N 個點的移動平均速度
         * @returns {number} 平均速度（m/s）
         */
        function calculateMovingAverageSpeed() {
            if (recentSpeeds.length === 0) return 0;
            
            const sum = recentSpeeds.reduce((a, b) => a + b, 0);
            return sum / recentSpeeds.length;
        }

        // ===================================================================
        // 更新平均配速（由計時器每秒呼叫）
        // ===================================================================
        /**
         * 單獨更新平均配速顯示
         * 這個函數由計時器每秒呼叫，確保即使沒有新的GPS點，平均配速也會更新
         */
        function updateAveragePace() {
            if (elapsedSeconds > 0 && totalDistanceMeters > 0) {
                const avgSpeedMs = totalDistanceMeters / elapsedSeconds;
                elements.avgPace.textContent = formatPace(avgSpeedMs, currentUnit);
            } else if (elapsedSeconds > 0 && totalDistanceMeters === 0) {
                // 有時間但沒距離（可能還在等待第一個有效移動）
                elements.avgPace.textContent = '--:--';
            }
        }

        // ===================================================================
        // GPS 位置處理
        // ===================================================================
        /**
         * GPS 位置更新回調函數
         * @param {GeolocationPosition} position - 位置物件
         */
        function handlePositionUpdate(position) {
            const { latitude, longitude, accuracy } = position.coords;
            const timestamp = position.timestamp;
            
            rawPositionCount++;
            
            // 更新 GPS 精度顯示
            elements.gpsAccuracy.textContent = `GPS: ±${Math.round(accuracy)}m`;
            
            // 調試資訊
            elements.debugLat.textContent = latitude.toFixed(6);
            elements.debugLng.textContent = longitude.toFixed(6);

            // ===== GPS 預熱階段 =====
            // 等待 GPS 精度穩定後才開始正式計算
            if (!isGpsReady) {
                if (accuracy <= WARMUP_ACCURACY) {
                    warmupPoints++;
                    updateStatus('searching', `GPS 校準中... (${warmupPoints}/${WARMUP_POINTS_REQUIRED})`);
                    
                    if (warmupPoints >= WARMUP_POINTS_REQUIRED) {
                        isGpsReady = true;
                        hideMessage();
                        updateStatus('running', '跑步中');
                    }
                } else {
                    updateStatus('searching', `GPS 精度不足 (±${Math.round(accuracy)}m)`);
                }
                return;
            }

            // ===== 精度過濾 =====
            // 只接受精度 ≤ 30 公尺的點
            if (accuracy > ACCURACY_THRESHOLD) {
                filteredCount++;
                updateStatus('running', `精度過濾 (±${Math.round(accuracy)}m)`);
                return;
            }

            // ===== 計算與上一個有效點的距離 =====
            if (lastValidPosition) {
                const distance = haversineDistance(
                    lastValidPosition.lat,
                    lastValidPosition.lng,
                    latitude,
                    longitude
                );

                // ===== 最小移動距離過濾 =====
                // 距離需 > 5 公尺才計入（避免原地抖動）
                if (distance <= MIN_DISTANCE_THRESHOLD) {
                    filteredCount++;
                    return;
                }

                // ===== 異常距離過濾 =====
                // 如果瞬間移動超過 100 公尺（可能是 GPS 跳點），忽略
                const timeDiff = (timestamp - lastValidPosition.timestamp) / 1000;
                if (timeDiff > 0) {
                    const instantSpeed = distance / timeDiff;
                    // 超過 15 m/s (54 km/h) 的速度視為異常
                    if (instantSpeed > 15) {
                        filteredCount++;
                        return;
                    }
                    
                    // ===== 記錄速度用於移動平均 =====
                    recentSpeeds.push(instantSpeed);
                    if (recentSpeeds.length > MOVING_AVG_WINDOW) {
                        recentSpeeds.shift(); // 保持窗口大小
                    }
                }

                // ===== 累加距離 =====
                totalDistanceMeters += distance;
            }

            // ===== 記錄有效位置 =====
            const validPosition = {
                lat: latitude,
                lng: longitude,
                timestamp: timestamp,
                accuracy: accuracy
            };
            
            positions.push(validPosition);
            lastValidPosition = validPosition;
            
            updateStatus('running', '跑步中');
            updateDisplay();
        }

        /**
         * GPS 錯誤處理回調函數
         * @param {GeolocationPositionError} error - 錯誤物件
         */
        function handlePositionError(error) {
            let errorMessage = '';
            let errorTitle = 'GPS 錯誤';
            
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    errorTitle = '權限被拒絕';
                    errorMessage = '請在瀏覽器設定中允許存取位置資訊，然後重新整理頁面。';
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorTitle = '無法取得位置';
                    errorMessage = '目前無法取得您的位置資訊，請確認您在開闊的戶外環境。';
                    break;
                case error.TIMEOUT:
                    errorTitle = 'GPS 逾時';
                    errorMessage = 'GPS 訊號搜尋逾時，請稍後再試或移至開闊區域。';
                    break;
                default:
                    errorMessage = '發生未知錯誤，請重新整理頁面後再試。';
            }
            
            updateStatus('error', errorTitle);
            showMessage('error', '📍', errorTitle, errorMessage);
            
            // 如果是嚴重錯誤，停止追蹤
            if (error.code === error.PERMISSION_DENIED) {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                elements.btnStart.disabled = false;
                elements.btnStop.disabled = true;
            }
        }

        // ===================================================================
        // 開始跑步
        // ===================================================================
        function startRun() {
            // 檢查 Geolocation API 支援
            if (!navigator.geolocation) {
                showMessage('error', '❌', '不支援 GPS', '您的瀏覽器不支援地理定位功能，請使用現代瀏覽器。');
                return;
            }

            // 重置狀態
            isRunning = true;
            isGpsReady = false;
            warmupPoints = 0;
            positions = [];
            recentSpeeds = [];
            rawPositionCount = 0;
            filteredCount = 0;
            totalDistanceMeters = 0;
            elapsedSeconds = 0;
            lastValidPosition = null;

            // 更新 UI
            elements.btnStart.disabled = true;
            elements.btnStop.disabled = false;
            updateStatus('searching', 'GPS 搜尋中...');
            showMessage('info', '', '正在取得 GPS 定位', '請在戶外開闊區域使用，首次定位可能需要 10-30 秒...', true);

            // 開始 GPS 追蹤
            // 使用高精度選項以獲得最佳定位結果
            const options = {
                enableHighAccuracy: true,  // 啟用高精度模式（使用 GPS）
                maximumAge: 0,             // 不使用快取的位置
                timeout: 5000              // 5 秒逾時
            };

            watchId = navigator.geolocation.watchPosition(
                handlePositionUpdate,
                handlePositionError,
                options
            );

            // 開始計時器（每秒更新）
            startTime = Date.now();
            timerInterval = setInterval(() => {
                if (isGpsReady) {
                    elapsedSeconds++;
                    elements.elapsedTime.textContent = formatTime(elapsedSeconds);
                    
                    // 每秒更新平均配速（即使沒有新的GPS點也要更新）
                    updateAveragePace();
                }
            }, 1000);
        }

        // ===================================================================
        // 結束跑步
        // ===================================================================
        function stopRun() {
            isRunning = false;

            // 停止 GPS 追蹤
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            // 停止計時器
            if (timerInterval !== null) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            // 更新按鈕狀態
            elements.btnStart.disabled = true;
            elements.btnStop.disabled = true;
            updateStatus('locked', '已完成');
            hideMessage();

            // 顯示結果
            showResults();
        }

        // ===================================================================
        // 顯示結果
        // ===================================================================
        function showResults() {
            const distanceInUnit = metersToUnit(totalDistanceMeters, currentUnit);
            const unitLabel = currentUnit === 'km' ? 'km' : 'mi';
            const paceUnitLabel = currentUnit === 'km' ? '/km' : '/mi';
            
            elements.resultDistance.textContent = `${distanceInUnit.toFixed(2)} ${unitLabel}`;
            elements.resultTime.textContent = formatTime(elapsedSeconds);
            
            if (elapsedSeconds > 0 && totalDistanceMeters > 0) {
                const avgSpeedMs = totalDistanceMeters / elapsedSeconds;
                elements.resultPace.textContent = `${formatPace(avgSpeedMs, currentUnit)} ${paceUnitLabel}`;
                
                // 計算平均時速
                let avgSpeedPerHour;
                let speedUnitLabel;
                if (currentUnit === 'km') {
                    avgSpeedPerHour = avgSpeedMs * 3.6; // m/s 轉 km/h
                    speedUnitLabel = 'km/h';
                } else {
                    avgSpeedPerHour = avgSpeedMs * 2.237; // m/s 轉 mi/h
                    speedUnitLabel = 'mi/h';
                }
                elements.resultSpeed.textContent = `${avgSpeedPerHour.toFixed(1)} ${speedUnitLabel}`;
            } else {
                elements.resultPace.textContent = `--:-- ${paceUnitLabel}`;
                const speedUnitLabel = currentUnit === 'km' ? 'km/h' : 'mi/h';
                elements.resultSpeed.textContent = `0.0 ${speedUnitLabel}`;
            }
            
            elements.resultsOverlay.classList.add('show');
        }

        // ===================================================================
        // 重新開始
        // ===================================================================
        function resetRun() {
            // 隱藏結果畫面
            elements.resultsOverlay.classList.remove('show');
            
            // 重置所有狀態
            isRunning = false;
            isGpsReady = false;
            warmupPoints = 0;
            positions = [];
            recentSpeeds = [];
            rawPositionCount = 0;
            filteredCount = 0;
            totalDistanceMeters = 0;
            elapsedSeconds = 0;
            lastValidPosition = null;
            
            // 重置 UI
            elements.btnStart.disabled = false;
            elements.btnStop.disabled = true;
            elements.currentPace.textContent = '--:--';
            elements.elapsedTime.textContent = '00:00';
            elements.totalDistance.textContent = '0.00';
            elements.avgPace.textContent = '--:--';
            elements.currentSpeed.textContent = '0.0';
            elements.validPoints.textContent = '0';
            elements.gpsAccuracy.textContent = 'GPS: --';
            
            updateStatus('', '準備就緒');
            hideMessage();
        }

        // ===================================================================
        // 調試模式切換（點擊標題5次）
        // ===================================================================
        document.querySelector('.header h1').addEventListener('click', () => {
            debugClickCount++;
            if (debugClickCount >= 5) {
                elements.debugInfo.classList.toggle('show');
                debugClickCount = 0;
            }
            // 3秒後重置計數
            setTimeout(() => { debugClickCount = 0; }, 3000);
        });

        // ===================================================================
        // 頁面載入時初始化
        // ===================================================================
        document.addEventListener('DOMContentLoaded', () => {
            // 檢查 Geolocation 支援
            if (!navigator.geolocation) {
                showMessage('error', '❌', '不支援 GPS', '您的瀏覽器不支援地理定位功能。');
                elements.btnStart.disabled = true;
            }
            
            // 防止頁面意外關閉（跑步中）
            window.addEventListener('beforeunload', (e) => {
                if (isRunning) {
                    e.preventDefault();
                    e.returnValue = '跑步正在進行中，確定要離開嗎？';
                    return e.returnValue;
                }
            });
        });

        // ===================================================================
        // 保持螢幕常亮（如果支援 Wake Lock API）
        // ===================================================================
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('螢幕常亮已啟用');
                }
            } catch (err) {
                console.log('螢幕常亮無法啟用:', err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
                console.log('螢幕常亮已釋放');
            }
        }

        // 當開始跑步時請求螢幕常亮
        const originalStartRun = startRun;
        startRun = function() {
            requestWakeLock();
            originalStartRun();
        };

        // 當結束跑步時釋放
        const originalStopRun = stopRun;
        stopRun = function() {
            releaseWakeLock();
            originalStopRun();
        };
    </script>
</body>
</html>
