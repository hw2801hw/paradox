<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RunTrack - 數據視覺化分析</title>
    
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgPrimary: '#000000',     // 極致黑
                        bgSecondary: '#09090b',   // 頂部導航微灰黑
                        bgCard: '#0f0f13',        // 卡片底色
                        bgCardHover: '#18181b',   // 卡片懸浮色
                        accentPrimary: '#ff3366', // 鮮明點綴紅
                        accentSecondary: '#00e5ff',// 霓虹青
                        accentGreen: '#00e676',   // 螢光綠
                        textMuted: '#888888',     // 柔和灰文字
                        borderColor: '#27272a'    // 邊界線
                    }
                }
            }
        }
    </script>

    <!-- Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        /* 隱藏捲軸但保留滾動功能 */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #00e5ff; }
        
        /* 基礎設定確保點擊無高光 */
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<!-- 強制套用深色背景與白色文字，解決白屏問題 -->
<body class="min-h-screen flex flex-col antialiased bg-bgPrimary text-white" style="background-color: #000000; color: #ffffff;">

    <!-- 頂部導航列 -->
    <header class="sticky top-0 z-50 bg-bgSecondary border-b border-borderColor py-3 px-4 flex flex-col gap-3 sm:flex-row sm:h-16 sm:py-0 sm:items-center sm:justify-between shadow-md">
        <div class="flex items-center justify-between w-full sm:w-auto">
            <!-- 恢復為「返回紀錄」 -->
            <button onclick="window.location.href='https://hw2801hw.github.io/paradox/jog'" class="p-2 -ml-2 text-accentSecondary hover:bg-white/5 rounded-full transition-colors flex items-center gap-2">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                <span class="font-medium text-sm sm:text-base">返回紀錄</span>
            </button>
            <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-accentPrimary to-accentSecondary bg-clip-text text-transparent">
                RunTrack 視覺化圖表
            </h1>
        </div>
        
        <!-- 全局篩選器 -->
        <div class="w-full sm:w-auto flex flex-col sm:flex-row justify-end gap-2 sm:gap-3">
            <select id="monthFilter" style="display: none;" onchange="renderAll()" class="w-full sm:w-auto bg-[#18181b] border border-borderColor text-sm rounded-lg focus:ring-accentSecondary focus:border-accentSecondary block p-2.5 text-white outline-none cursor-pointer">
                <option value="all">📅 所有月份</option>
            </select>
            <select id="userFilter" onchange="onUserChange()" class="w-full sm:w-auto bg-[#18181b] border border-borderColor text-sm rounded-lg focus:ring-accentSecondary focus:border-accentSecondary block p-2.5 text-white outline-none cursor-pointer">
                <option value="all">👥 所有跑者綜合數據</option>
                <!-- 動態生成用戶選項 -->
            </select>
        </div>
    </header>

    <!-- 頁面主要內容載入中 -->
    <div id="loadingOverlay" class="fixed inset-0 z-40 bg-bgPrimary flex flex-col items-center justify-center transition-opacity duration-500" style="background-color: #000000;">
        <!-- 改用 Tailwind utility classes 渲染 Loader 確保顏色正確 -->
        <div class="animate-spin rounded-full h-10 w-10 border-[3px] border-white/10 border-t-accentSecondary mb-4"></div>
        <p class="text-textMuted animate-pulse text-sm">數據同步中...</p>
    </div>

    <!-- 主體內容區 -->
    <main class="flex-1 p-3 sm:p-4 lg:p-8 overflow-y-auto w-full max-w-7xl mx-auto">
        
        <!-- 頂部數據統計卡片 -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
            <div class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-4 sm:p-5 flex flex-col justify-center">
                <p class="text-textMuted text-xs sm:text-sm font-semibold mb-1">總里程 (km)</p>
                <h2 id="statTotalDistance" class="text-2xl sm:text-3xl font-bold text-white">0.0</h2>
            </div>
            <div class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-4 sm:p-5 flex flex-col justify-center">
                <p class="text-textMuted text-xs sm:text-sm font-semibold mb-1">累積時長 (h)</p>
                <h2 id="statTotalTime" class="text-2xl sm:text-3xl font-bold text-accentSecondary">0.0</h2>
            </div>
            <div class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-4 sm:p-5 flex flex-col justify-center">
                <p class="text-textMuted text-xs sm:text-sm font-semibold mb-1">總跑步次數</p>
                <h2 id="statTotalRuns" class="text-2xl sm:text-3xl font-bold text-accentGreen">0</h2>
            </div>
            <div class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-4 sm:p-5 flex flex-col justify-center">
                <p class="text-textMuted text-xs sm:text-sm font-semibold mb-1">平均配速</p>
                <h2 id="statAvgPace" class="text-xl sm:text-3xl font-bold text-accentPrimary">--'--"</h2>
            </div>
        </div>

        <!-- 圖表網格區域 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 mb-8">
            
            <!-- 圖表 1: 累積里程趨勢 -->
            <div class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-3 sm:p-4 lg:col-span-2">
                <div class="flex justify-between items-center mb-2 sm:mb-4 px-1 sm:px-2">
                    <h3 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                        📈 累積里程趨勢
                    </h3>
                </div>
                <div id="chartCumulative" class="w-full h-[280px] sm:h-[400px]"></div>
            </div>

            <!-- 圖表 2: 各跑者里程貢獻 / 個人距離分佈 -->
            <div class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-3 sm:p-4">
                <h3 class="text-base sm:text-lg font-bold text-white mb-2 sm:mb-4 px-1 sm:px-2">🏆 總里程排行榜</h3>
                <div id="chartLeaderboard" class="w-full h-[280px] sm:h-[350px]"></div>
            </div>

            <!-- 新增 圖表: 累積時長排行榜 -->
            <div id="cardLeaderboardTime" style="display: none;" class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-3 sm:p-4">
                <h3 class="text-base sm:text-lg font-bold text-white mb-2 sm:mb-4 px-1 sm:px-2">⏱️ 累積時長排行榜</h3>
                <div id="chartLeaderboardTime" class="w-full h-[280px] sm:h-[350px]"></div>
            </div>

            <!-- 新增 圖表: 總跑步次數排行榜 -->
            <div id="cardLeaderboardCount" style="display: none;" class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-3 sm:p-4">
                <h3 class="text-base sm:text-lg font-bold text-white mb-2 sm:mb-4 px-1 sm:px-2">🏃 總次數排行榜</h3>
                <div id="chartLeaderboardCount" class="w-full h-[280px] sm:h-[350px]"></div>
            </div>

            <!-- 新增 圖表: 平均配速排行榜 -->
            <div id="cardLeaderboardPace" style="display: none;" class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-3 sm:p-4">
                <h3 class="text-base sm:text-lg font-bold text-white mb-2 sm:mb-4 px-1 sm:px-2">⚡ 平均配速排行榜</h3>
                <div id="chartLeaderboardPace" class="w-full h-[280px] sm:h-[350px]"></div>
            </div>

            <!-- 圖表 4: 能力評估雷達圖 (僅在個人介面顯示) -->
            <div id="radarCard" style="display: none;" class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-3 sm:p-4">
                <div class="flex justify-between items-center mb-2 sm:mb-4 px-1 sm:px-2">
                    <h3 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                        ⚡ 能力評估 (S-F)
                    </h3>
                    <div class="text-right">
                        <span class="text-xs text-textMuted font-medium">綜合評級</span>
                        <div id="radarGrade" class="text-2xl sm:text-3xl font-black italic leading-none" style="text-shadow: 0 0 10px rgba(255,255,255,0.2);">A</div>
                    </div>
                </div>
                <div id="chartRadar" class="w-full h-[280px] sm:h-[350px]"></div>
                <!-- 滿分標準參考區塊 -->
                <div id="radarMaxRef" class="mt-4 text-[11px] sm:text-xs text-textMuted bg-[#18181b] p-3 rounded-lg border border-borderColor flex flex-wrap gap-x-3 gap-y-2 justify-center items-center">
                    <!-- 動態填入 -->
                </div>
            </div>

            <!-- 圖表 5: 最佳成績 4格 (僅在個人介面顯示) -->
            <div id="bestStatsCard" style="display: none;" class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-3 sm:p-4">
                <div class="flex justify-between items-center mb-4 sm:mb-6 px-1 sm:px-2">
                    <h3 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                        🌟 最佳成績 (S-F)
                    </h3>
                    <div class="text-right">
                        <span class="text-xs text-textMuted font-medium">單項綜合評級</span>
                        <div id="bestStatsGrade" class="text-2xl sm:text-3xl font-black italic leading-none" style="text-shadow: 0 0 10px rgba(255,255,255,0.2);">A</div>
                    </div>
                </div>
                
                <!-- 4個最佳成績格子 -->
                <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-5">
                    <div class="bg-[#18181b] rounded-lg p-4 sm:p-5 border border-borderColor flex flex-col justify-center items-center relative overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <span class="text-textMuted text-xs sm:text-sm font-medium mb-1">最遠距離</span>
                        <span id="bestValDist" class="text-2xl sm:text-3xl font-bold text-white relative z-10">0.0 km</span>
                    </div>
                    <div class="bg-[#18181b] rounded-lg p-4 sm:p-5 border border-borderColor flex flex-col justify-center items-center relative overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-br from-accentSecondary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <span class="text-textMuted text-xs sm:text-sm font-medium mb-1">最長時長</span>
                        <span id="bestValDur" class="text-2xl sm:text-3xl font-bold text-accentSecondary relative z-10">0 分</span>
                    </div>
                    <div class="bg-[#18181b] rounded-lg p-4 sm:p-5 border border-borderColor flex flex-col justify-center items-center relative overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-br from-accentPrimary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <span class="text-textMuted text-xs sm:text-sm font-medium mb-1">最快配速</span>
                        <span id="bestValPace" class="text-2xl sm:text-3xl font-bold text-accentPrimary relative z-10">--'--"</span>
                    </div>
                    <div class="bg-[#18181b] rounded-lg p-4 sm:p-5 border border-borderColor flex flex-col justify-center items-center relative overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-br from-accentGreen/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <span class="text-textMuted text-xs sm:text-sm font-medium mb-1">最多步數</span>
                        <span id="bestValSteps" class="text-2xl sm:text-3xl font-bold text-accentGreen relative z-10">0 步</span>
                    </div>
                </div>

                <!-- 全局最佳參考區塊 -->
                <div id="bestGlobalRef" class="text-xs text-textMuted bg-[#0f0f13] p-3 rounded-lg border border-borderColor leading-relaxed">
                    <!-- 動態填入 -->
                </div>
            </div>

            <!-- 圖表 3: 每月跑步活躍度 (移至頁面最底部) -->
            <div id="cardMonthly" class="bg-bgCard border border-borderColor rounded-xl transition-all duration-200 hover:bg-bgCardHover hover:border-accentPrimary hover:-translate-y-0.5 p-3 sm:p-4">
                <h3 id="monthlyChartTitle" class="text-base sm:text-lg font-bold text-white mb-2 sm:mb-4 px-1 sm:px-2">📅 每月活躍分析</h3>
                <div id="chartMonthly" class="w-full h-[280px] sm:h-[350px]"></div>
            </div>
            
        </div>
    </main>

    <script>
        // ==========================================
        // 1. Firebase 核心設定與初始化
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyACjxWEkXkPUBv6xiWtVWZdsFvxeKURJ1Q",
            authDomain: "time-f681a.firebaseapp.com",
            databaseURL: "https://time-f681a-default-rtdb.firebaseio.com",
            projectId: "time-f681a",
            storageBucket: "time-f681a.firebasestorage.app",
            messagingSenderId: "486171948384",
            appId: "1:486171948384:web:715043928d3a0a0cd39a05"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 2. 全域狀態與圖表實例
        // ==========================================
        let rawUsers = {};
        let rawRecords = {};
        let flatRecords = []; 
        let userColorMap = {}; // 用於綁定使用者專屬顏色
        let isFirstLoad = true;

        let chartInstances = {
            cumulative: null,
            leaderboard: null,
            leaderboardTime: null,   // 新增
            leaderboardCount: null,  // 新增
            leaderboardPace: null,   // 新增
            monthly: null,
            radar: null
        };

        const colorPalette = [
            '#FF3366', '#00E5FF', '#00E676', '#FF9900', '#B366FF', 
            '#FFD700', '#F15BB5', '#3A86FF', '#00CC99', '#FF5533'
        ];

        // ==========================================
        // 3. ECharts 初始化與 RWD 適應
        // ==========================================
        function initCharts() {
            chartInstances.cumulative = echarts.init(document.getElementById('chartCumulative'), 'dark');
            chartInstances.leaderboard = echarts.init(document.getElementById('chartLeaderboard'), 'dark');
            chartInstances.leaderboardTime = echarts.init(document.getElementById('chartLeaderboardTime'), 'dark'); // 新增
            chartInstances.leaderboardCount = echarts.init(document.getElementById('chartLeaderboardCount'), 'dark'); // 新增
            chartInstances.leaderboardPace = echarts.init(document.getElementById('chartLeaderboardPace'), 'dark'); // 新增
            chartInstances.monthly = echarts.init(document.getElementById('chartMonthly'), 'dark');
            chartInstances.radar = echarts.init(document.getElementById('chartRadar'), 'dark');

            Object.values(chartInstances).forEach(chart => {
                if (chart) chart.setOption({ backgroundColor: 'transparent' });
            });

            window.addEventListener('resize', () => {
                Object.values(chartInstances).forEach(chart => chart && chart.resize());
            });
        }

        // 共用的渲染排行榜長條圖函數
        function renderBarChartForRanking(chart, dataArr, valueKey, valueName, colorMap, isPace = false) {
            if (!chart) return;
            // 過濾無效值 (距離為0或配速為0的數據)
            let validData = dataArr.filter(u => u[valueKey] > 0);
            
            // 排序：ECharts 從下往上繪製
            // 配速(越小越好)：差的放前面，好的放陣列尾端，畫在圖表最上方
            if (isPace) {
                validData.sort((a, b) => b[valueKey] - a[valueKey]);
            } else {
                validData.sort((a, b) => a[valueKey] - b[valueKey]);
            }

            const seriesConfig = {
                type: 'bar',
                data: validData.map(u => ({
                    value: isPace ? u[valueKey] : u[valueKey].toFixed(valueKey === 'count' ? 0 : 1),
                    itemStyle: { color: colorMap[u.uid] || '#ff3366', borderRadius: [0, 4, 4, 0] }
                })),
                label: { 
                    show: true, 
                    position: 'right', 
                    color: '#fff', 
                    formatter: function(params) {
                        return isPace ? formatPaceDisplay(params.value) : `${params.value} ${valueName}`;
                    }
                }
            };

            // 若有大於一筆資料，加入平均線
            if (validData.length > 1) {
                const avgValue = validData.reduce((sum, u) => sum + u[valueKey], 0) / validData.length;
                seriesConfig.markLine = {
                    symbol: 'none',
                    lineStyle: { color: '#FFD700', type: 'dashed', width: 2 },
                    label: { 
                        show: true, 
                        position: 'end', 
                        formatter: function() {
                            return `平均\n${isPace ? formatPaceDisplay(avgValue) : avgValue.toFixed(valueKey === 'count' ? 0 : 1) + ' ' + valueName}`;
                        }, 
                        color: '#FFD700', 
                        fontSize: 11,
                        padding: [0, 0, 0, 0] 
                    },
                    data: [{ xAxis: avgValue }]
                };
            }

            const option = {
                backgroundColor: 'transparent',
                tooltip: { 
                    trigger: 'axis', 
                    axisPointer: { type: 'shadow' }, 
                    backgroundColor: 'rgba(15,15,19,0.9)', 
                    borderColor: '#27272a', 
                    textStyle: {color:'#fff'},
                    formatter: function(params) {
                        const val = params[0].value;
                        const displayVal = isPace ? formatPaceDisplay(val) : `${val} ${valueName}`;
                        return `${params[0].name}<br/>${displayVal}`;
                    }
                },
                grid: { left: '2%', right: '15%', bottom: '2%', top: '10%', containLabel: true },
                xAxis: { 
                    type: 'value', 
                    splitLine: { show: false }, 
                    axisLabel: { 
                        color: '#888',
                        formatter: function(val) {
                            return isPace ? formatPaceDisplay(val) : val;
                        }
                    } 
                },
                yAxis: { type: 'category', data: validData.map(u => u.name), axisLabel: { color: '#ffffff', fontWeight: 'bold' } },
                series: [seriesConfig]
            };
            chart.setOption(option, true);
        }

        // ==========================================
        // 4. Firebase 資料監聽與正規化
        // ==========================================
        function loadData() {
            db.ref('users').on('value', (userSnap) => {
                rawUsers = userSnap.val() || {};
                
                // 每次網頁載入時，針對每個用戶分配專屬顏色 (打亂色盤順序確保隨機性)
                if (Object.keys(userColorMap).length === 0 && Object.keys(rawUsers).length > 0) {
                    const shuffledColors = [...colorPalette].sort(() => Math.random() - 0.5);
                    let cIdx = 0;
                    for (const uid in rawUsers) {
                        userColorMap[uid] = shuffledColors[cIdx % shuffledColors.length];
                        cIdx++;
                    }
                }
                
                updateUserFilterDropdown();
                processDataAndRender();
            });

            db.ref('records').on('value', (recSnap) => {
                rawRecords = recSnap.val() || {};
                processDataAndRender();
            });
        }

        function processDataAndRender() {
            if (Object.keys(rawUsers).length === 0) return; 
            
            flatRecords = [];
            for (const uid in rawRecords) {
                const userRecords = rawRecords[uid];
                for (const key in userRecords) {
                    if (userRecords[key].date) {
                        flatRecords.push({ uid: uid, userName: rawUsers[uid]?.name || '未知', ...userRecords[key] });
                    } else {
                        const monthRecords = userRecords[key];
                        for (const rid in monthRecords) {
                            flatRecords.push({ uid: uid, userName: rawUsers[uid]?.name || '未知', ...monthRecords[rid] });
                        }
                    }
                }
            }

            flatRecords.sort((a, b) => {
                const timeA = a.time || '00:00';
                const timeB = b.time || '00:00';
                return new Date(`${a.date}T${timeA}`) - new Date(`${b.date}T${timeB}`);
            });

            if (isFirstLoad) {
                document.getElementById('loadingOverlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 500);
                initCharts();
                isFirstLoad = false;
            }

            renderAll();
        }

        function updateUserFilterDropdown() {
            const select = document.getElementById('userFilter');
            const currentVal = select.value;
            let optionsHtml = '<option value="all">👥 所有跑者綜合數據</option>';
            for (const uid in rawUsers) {
                optionsHtml += `<option value="${uid}">🏃 ${rawUsers[uid].name}</option>`;
            }
            select.innerHTML = optionsHtml;
            select.value = rawUsers[currentVal] ? currentVal : 'all';
            
            // 觸發一次狀態更新
            onUserChange(false);
        }

        function onUserChange(triggerRender = true) {
            const uid = document.getElementById('userFilter').value;
            const monthSelect = document.getElementById('monthFilter');
            
            if (uid === 'all') {
                monthSelect.style.display = 'none';
                monthSelect.value = 'all';
            } else {
                monthSelect.style.display = 'block';
                // 找出該用戶有的所有月份
                const userRecords = flatRecords.filter(r => r.uid === uid);
                const months = [...new Set(userRecords.map(r => r.date.substring(0, 7)))].sort().reverse();
                
                const currentVal = monthSelect.value;
                let optionsHtml = '<option value="all">📅 所有月份</option>';
                months.forEach(m => {
                    optionsHtml += `<option value="${m}">${m}</option>`;
                });
                monthSelect.innerHTML = optionsHtml;
                
                // 保留當前選擇，若選擇的月份在新用戶不存在，則重置為 all
                if (months.includes(currentVal)) {
                    monthSelect.value = currentVal;
                } else {
                    monthSelect.value = 'all';
                }
            }
            
            if(triggerRender) renderAll();
        }

        function calcPaceValue(durationMin, distanceKm) {
            if (!distanceKm || distanceKm <= 0) return 0;
            return durationMin / distanceKm;
        }

        function formatPaceDisplay(paceMin) {
            if (!paceMin || paceMin === 0 || !isFinite(paceMin)) return "--'--\"";
            const mins = Math.floor(paceMin);
            const secs = Math.round((paceMin - mins) * 60);
            return `${mins}'${secs < 10 ? '0' : ''}${secs}"`;
        }

        // ==========================================
        // 5. 核心渲染邏輯
        // ==========================================
        function renderAll() {
            const filterUid = document.getElementById('userFilter').value;
            const filterMonth = document.getElementById('monthFilter').value;
            
            let data = flatRecords;
            
            // 過濾用戶
            if (filterUid !== 'all') {
                data = data.filter(r => r.uid === filterUid);
            }
            // 針對指定用戶進階過濾月份
            if (filterUid !== 'all' && filterMonth !== 'all') {
                data = data.filter(r => r.date.startsWith(filterMonth));
            }

            updateSummaryCards(data);
            renderCumulativeChart(data, filterUid);
            renderLeaderboardChart(data, filterUid);
            renderMonthlyOrDailyChart(data, filterUid);
            renderRadarChart(filterUid, filterMonth); // 渲染能力評估雷達圖
            renderBestStats(filterUid, filterMonth); // 渲染最佳成績 4 格
        }

        function updateSummaryCards(data) {
            let totalDist = 0, totalTime = 0;
            data.forEach(r => { totalDist += (r.distance || 0); totalTime += (r.duration || 0); });

            document.getElementById('statTotalDistance').textContent = totalDist.toFixed(1);
            document.getElementById('statTotalTime').textContent = (totalTime / 60).toFixed(1);
            document.getElementById('statTotalRuns').textContent = data.length;
            document.getElementById('statAvgPace').textContent = formatPaceDisplay(calcPaceValue(totalTime, totalDist));
        }

        function renderCumulativeChart(data, filterUid) {
            const chart = chartInstances.cumulative;
            const datesSet = new Set();
            data.forEach(r => datesSet.add(r.date));
            const sortedDates = Array.from(datesSet).sort();

            const series = [];
            const legendData = [];
            const userGroups = {};
            
            data.forEach(r => {
                if (!userGroups[r.uid]) userGroups[r.uid] = { name: r.userName, dailyDist: {} };
                userGroups[r.uid].dailyDist[r.date] = (userGroups[r.uid].dailyDist[r.date] || 0) + (r.distance || 0);
            });

            for (const uid in userGroups) {
                const uData = userGroups[uid];
                legendData.push(uData.name);
                
                let cumulativeDist = 0;
                const plotData = sortedDates.map(date => {
                    cumulativeDist += (uData.dailyDist[date] || 0);
                    return cumulativeDist.toFixed(2);
                });

                const uColor = userColorMap[uid] || '#ff3366';

                    areaStyle: {

                            { offset: 0, color: uColor + '80' },
                            { offset: 1, color: uColor + '00' }
                        ])
                    },
                    data: plotData
                });
            }

            const option = {
                tooltip: { trigger: 'axis', backgroundColor: 'rgba(15, 15, 19, 0.95)', borderColor: '#27272a', textStyle: { color: '#fff' } },
                legend: { data: legendData, textStyle: { color: '#888' }, bottom: 0, itemWidth: 10, itemHeight: 10 },
                grid: { left: '2%', right: '5%', bottom: '12%', top: '5%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: sortedDates, axisLabel: { color: '#888' } },
                yAxis: { type: 'value', name: 'km', splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }, axisLabel: { color: '#888' } },
                series: series
            };

            if (filterUid !== 'all') option.legend.show = false;

        // 渲染能力評估雷達圖 (僅支援個人顯示)
        function renderRadarChart(filterUid, filterMonth) {
            const card = document.getElementById('radarCard');
            if (filterUid === 'all') {
                card.style.display = 'none';
                return;
            }
            card.style.display = 'block';
            
            const chart = chartInstances.radar;
            chart.clear();

            // 以目前選取的月份或所有時間，統計所有跑者的表現以做為天花板基準 (Max)
            let baseRecords = flatRecords;
            if (filterMonth !== 'all') {
                baseRecords = baseRecords.filter(r => r.date.startsWith(filterMonth));
            }

            const userStats = {};
            baseRecords.forEach(r => {
                if (!userStats[r.uid]) {
                    userStats[r.uid] = { dist: 0, dur: 0, count: 0, steps: 0 };
                }
                userStats[r.uid].dist += (r.distance || 0);
                userStats[r.uid].dur += (r.duration || 0);
                userStats[r.uid].count += 1;
                // 移除先前的距離估算，直接使用真實步數，無資料則計為0
                userStats[r.uid].steps += (Number(r.steps) || 0);
            });

            // 尋找全體最高標準建立100分的雷達圖邊界
            let maxDist = 0.1, maxDur = 0.1, maxCount = 0.1, maxSteps = 0.1;
            let minPace = 999; // 配速越低越好

            for (const uid in userStats) {
                const stat = userStats[uid];
                if (stat.dist > maxDist) maxDist = stat.dist;
                if (stat.dur > maxDur) maxDur = stat.dur;
                if (stat.count > maxCount) maxCount = stat.count;
                if (stat.steps > maxSteps) maxSteps = stat.steps;
                
                const pace = calcPaceValue(stat.dur, stat.dist);
                if (pace > 0 && pace < minPace) minPace = pace;
            }
            if (minPace === 999) minPace = 5;

            // 取出當前特定跑者的數據
            const uStat = userStats[filterUid] || { dist: 0, dur: 0, count: 0, steps: 0 };
            const uPace = calcPaceValue(uStat.dur, uStat.dist) || 999;

            // 計算五維度分數 (0 ~ 100)
            const scoreDist = Math.min(100, (uStat.dist / maxDist) * 100);
            const scoreDur = Math.min(100, (uStat.dur / maxDur) * 100);
            const scoreCount = Math.min(100, (uStat.count / maxCount) * 100);
            const scoreSteps = Math.min(100, (uStat.steps / maxSteps) * 100);
            
            // 配速計分：與最佳配速差距越小分數越高 (容許差距5分鐘)
            let scorePace = 0;
            const paceRange = 5; 
            if (uStat.count === 0) {
                scorePace = 0;
            } else if (uPace <= minPace) {
                scorePace = 100;
            } else if (uPace > minPace + paceRange) {
                scorePace = 20; // 只要有跑，最低給20分底分
            } else {
                scorePace = 100 - ((uPace - minPace) / paceRange) * 80;
            }

            const scores = [
                Math.round(scoreDist),
                Math.round(scoreDur),
                Math.round(scorePace),
                Math.round(scoreCount),
                Math.round(scoreSteps)
            ];

            // 運算綜合評級 S ~ F
            const avgScore = scores.reduce((a, b) => a + b, 0) / 5;
            let grade = 'F', gradeColor = '#888888';
            if (avgScore >= 90) { grade = 'S'; gradeColor = '#FFD700'; }      
            else if (avgScore >= 80) { grade = 'A'; gradeColor = '#FF3366'; } 
            else if (avgScore >= 70) { grade = 'B'; gradeColor = '#B366FF'; } 
            else if (avgScore >= 60) { grade = 'C'; gradeColor = '#00E5FF'; } 
            else if (avgScore >= 50) { grade = 'D'; gradeColor = '#00E676'; } 
            else if (avgScore >= 40) { grade = 'E'; gradeColor = '#FF9900'; } 

            const gradeEl = document.getElementById('radarGrade');
            // 修改綜合評分顯示加入具體分數
            gradeEl.innerHTML = `${grade} <span class="text-lg sm:text-xl font-normal text-textMuted" style="font-style: normal; text-shadow: none;">(${Math.round(avgScore)}分)</span>`;
            gradeEl.style.color = gradeColor;

            const uColor = userColorMap[filterUid] || '#ff3366';

            // 繪製 ECharts 雷達圖
            chart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(15,15,19,0.95)',
                    borderColor: '#27272a',
                    textStyle: {color:'#fff'},
                    formatter: function(params) {
                        return `${params.name}<br/>
                                距離: ${scores[0]} 分<br/>
                                時長: ${scores[1]} 分<br/>
                                配速: ${scores[2]} 分<br/>
                                次數: ${scores[3]} 分<br/>
                                步數: ${scores[4]} 分`;
                    }
                },
                radar: {
                    indicator: [
                        { name: `距離\n(${uStat.dist.toFixed(1)}km)`, max: 100 },
                        { name: `時長\n(${uStat.dur.toFixed(0)}分)`, max: 100 },
                        { name: `配速\n(${formatPaceDisplay(uPace)})`, max: 100 },
                        { name: `次數\n(${uStat.count}次)`, max: 100 },
                        { name: `步數\n(${uStat.steps}步)`, max: 100 }
                    ],
                    shape: 'polygon',
                    radius: '65%',
                    axisName: { color: '#888', fontWeight: 'bold' },
                    splitArea: {
                        areaStyle: { color: ['rgba(255,255,255,0.02)', 'rgba(255,255,255,0.05)', 'rgba(255,255,255,0.02)', 'rgba(255,255,255,0.05)'] }
                    },
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                },
                series: [{
                    name: '能力評估',
                    type: 'radar',
                    data: [
                        {
                            value: scores,
                            name: '綜合能力',
                            itemStyle: { color: uColor },
                            areaStyle: { color: uColor + '66' },
                            lineStyle: { color: uColor, width: 2 },
                            symbol: 'circle',
                            symbolSize: 6
                        }
                    ]
                }]
            }, true);
            
            // 寫入滿分標準參考值
            const maxRefEl = document.getElementById('radarMaxRef');
            if (maxRefEl) {
                maxRefEl.innerHTML = `
                    <span class="font-bold text-white px-1">滿分標準：</span>
                    <span class="px-1">距離: <span class="text-white">${maxDist.toFixed(1)}km</span></span>
                    <span class="px-1">時長: <span class="text-white">${maxDur.toFixed(0)}分</span></span>
                    <span class="px-1">配速: <span class="text-white">${formatPaceDisplay(minPace)}</span></span>
                    <span class="px-1">次數: <span class="text-white">${maxCount}次</span></span>
                    <span class="px-1">步數: <span class="text-white">${maxSteps}步</span></span>
                `;
            }

            // 修正佈局：當雷達圖顯示時通知圖表重新計算寬高
            setTimeout(() => { chart.resize(); }, 10);
        }

        // 修改：渲染最佳成績 4格 (僅支援個人顯示)
        function renderBestStats(filterUid, filterMonth) {
            const card = document.getElementById('bestStatsCard');
            if (filterUid === 'all') {
                card.style.display = 'none';
                return;
            }
            card.style.display = 'block';

            // 建立全局天花板基準 (Max) 以及達成者紀錄
            let baseRecords = flatRecords;
            if (filterMonth !== 'all') {
                baseRecords = baseRecords.filter(r => r.date.startsWith(filterMonth));
            }

            let globalBest = {
                dist: { val: 0.1, name: '無' },
                dur: { val: 0.1, name: '無' },
                pace: { val: 999, name: '無' },
                steps: { val: 0.1, name: '無' }
            };

            baseRecords.forEach(r => {
                if (r.distance > globalBest.dist.val) { 
                    globalBest.dist.val = r.distance; 
                    globalBest.dist.name = r.userName; 
                }
                if (r.duration > globalBest.dur.val) { 
                    globalBest.dur.val = r.duration; 
                    globalBest.dur.name = r.userName; 
                }
                
                // 移除先前的距離估算，直接使用真實步數，無資料則計為0
                const steps = Number(r.steps) || 0;
                if (steps > globalBest.steps.val) { 
                    globalBest.steps.val = steps; 
                    globalBest.steps.name = r.userName; 
                }
                
                const pace = calcPaceValue(r.duration, r.distance);
                if (pace > 0 && pace < globalBest.pace.val) { 
                    globalBest.pace.val = pace; 
                    globalBest.pace.name = r.userName; 
                }
            });
            
            if (globalBest.pace.val === 999) globalBest.pace.val = 5;

            // 尋找當前用戶的單筆最佳數據
            const userRecords = baseRecords.filter(r => r.uid === filterUid);
            let uMaxDist = 0, uMaxDur = 0, uMaxSteps = 0;
            let uMinPace = 999;

            userRecords.forEach(r => {
                if (r.distance > uMaxDist) uMaxDist = r.distance;
                if (r.duration > uMaxDur) uMaxDur = r.duration;
                // 移除先前的距離估算，直接使用真實步數，無資料則計為0
                const steps = Number(r.steps) || 0;
                if (steps > uMaxSteps) uMaxSteps = steps;
                
                const pace = calcPaceValue(r.duration, r.distance);
                if (pace > 0 && pace < uMinPace) uMinPace = pace;
            });

            if (userRecords.length === 0) uMinPace = 0;

            // 計算各單項分數 (0 ~ 100)
            const scoreMaxDist = Math.min(100, (uMaxDist / globalBest.dist.val) * 100) || 0;
            const scoreMaxDur = Math.min(100, (uMaxDur / globalBest.dur.val) * 100) || 0;
            const scoreMaxSteps = Math.min(100, (uMaxSteps / globalBest.steps.val) * 100) || 0;
            
            let scoreMinPace = 0;
            const paceRange = 5; 
            if (userRecords.length === 0) {
                scoreMinPace = 0;
            } else if (uMinPace <= globalBest.pace.val) {
                scoreMinPace = 100;
            } else if (uMinPace > globalBest.pace.val + paceRange) {
                scoreMinPace = 20;
            } else {
                scoreMinPace = 100 - ((uMinPace - globalBest.pace.val) / paceRange) * 80;
            }

            const bestScores = [
                Math.round(scoreMaxDist),
                Math.round(scoreMaxDur),
                Math.round(scoreMinPace),
                Math.round(scoreMaxSteps)
            ];

            // 運算最佳成績總評級 S ~ F
            const bestAvgScore = bestScores.reduce((a, b) => a + b, 0) / 4;
            let bGrade = 'F', bGradeColor = '#888888';
            if (bestAvgScore >= 90) { bGrade = 'S'; bGradeColor = '#FFD700'; }      
            else if (bestAvgScore >= 80) { bGrade = 'A'; bGradeColor = '#FF3366'; } 
            else if (bestAvgScore >= 70) { bGrade = 'B'; bGradeColor = '#B366FF'; } 
            else if (bestAvgScore >= 60) { bGrade = 'C'; bGradeColor = '#00E5FF'; } 
            else if (bestAvgScore >= 50) { bGrade = 'D'; bGradeColor = '#00E676'; } 
            else if (bestAvgScore >= 40) { bGrade = 'E'; bGradeColor = '#FF9900'; } 

            const bGradeEl = document.getElementById('bestStatsGrade');
            bGradeEl.innerHTML = `${bGrade} <span class="text-lg sm:text-xl font-normal text-textMuted" style="font-style: normal; text-shadow: none;">(${Math.round(bestAvgScore)}分)</span>`;
            bGradeEl.style.color = bGradeColor;

            // 更新 4 個格子的數值
            document.getElementById('bestValDist').textContent = uMaxDist.toFixed(1) + ' km';
            document.getElementById('bestValDur').textContent = uMaxDur.toFixed(0) + ' 分';
            document.getElementById('bestValPace').textContent = formatPaceDisplay(uMinPace);
            document.getElementById('bestValSteps').textContent = uMaxSteps + ' 步';

            // 更新全局最佳參考
            document.getElementById('bestGlobalRef').innerHTML = `
                <div class="font-bold text-white mb-2 border-b border-borderColor pb-2 flex items-center gap-1.5">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-accentPrimary"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
                    本月群組最佳紀錄 (各項滿分標準參考)
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
                    <div class="flex items-center justify-between bg-[#18181b] p-2.5 rounded border border-borderColor/50">
                        <span class="text-textMuted">📍 最遠距離</span>
                        <span class="text-white font-medium">${globalBest.dist.val.toFixed(1)}km <span class="text-xs text-accentSecondary ml-1">(${globalBest.dist.name})</span></span>
                    </div>
                    <div class="flex items-center justify-between bg-[#18181b] p-2.5 rounded border border-borderColor/50">
                        <span class="text-textMuted">⏱️ 最長時長</span>
                        <span class="text-white font-medium">${globalBest.dur.val.toFixed(0)}分 <span class="text-xs text-accentSecondary ml-1">(${globalBest.dur.name})</span></span>
                    </div>
                    <div class="flex items-center justify-between bg-[#18181b] p-2.5 rounded border border-borderColor/50">
                        <span class="text-textMuted">⚡ 最快配速</span>
                        <span class="text-white font-medium">${formatPaceDisplay(globalBest.pace.val)} <span class="text-xs text-accentSecondary ml-1">(${globalBest.pace.name})</span></span>
                    </div>
                    <div class="flex items-center justify-between bg-[#18181b] p-2.5 rounded border border-borderColor/50">
                        <span class="text-textMuted">👣 最多步數</span>
                        <span class="text-white font-medium">${globalBest.steps.val}步 <span class="text-xs text-accentSecondary ml-1">(${globalBest.steps.name})</span></span>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>
