<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RunTrack - Running Record App</title>
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        /* ===== CSS Reset & Base ===== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --bg-card-hover: #1a2744;
            --bg-input: #0f3460;
            --accent-primary: #e94560;
            --accent-secondary: #00d2ff;
            --accent-green: #00e676;
            --accent-orange: #ff9100;
            --accent-purple: #b388ff;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --text-muted: #636e82;
            --border-color: #2a3a5c;
            --shadow-color: rgba(233, 69, 96, 0.15);
            --nav-height: 64px;
            --header-height: 56px;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 16px;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ===== App Container (9:16 mobile ratio) ===== */
        #app {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-primary);
            overflow: hidden;
        }

        /* ===== Header ===== */
        .app-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 10;
        }

        .app-header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-back-btn {
            background: none;
            border: none;
            color: var(--accent-secondary);
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
            display: none;
            align-items: center;
            gap: 4px;
        }

        .header-back-btn.visible {
            display: flex;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== Main Content Area ===== */
        .app-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            padding-bottom: calc(var(--nav-height) + 16px);
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .app-content::-webkit-scrollbar {
            width: 4px;
        }
        .app-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        /* ===== Bottom Navigation ===== */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 0;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-muted);
            transition: color 0.2s, transform 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item.active {
            color: var(--accent-primary);
        }

        .nav-item:active {
            transform: scale(0.92);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .nav-item span {
            font-size: 12px;
            font-weight: 600;
        }

        /* ===== Section Title ===== */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== User Cards ===== */
        .user-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            -webkit-tap-highlight-color: transparent;
        }

        .user-card:hover, .user-card:active {
            background: var(--bg-card-hover);
            border-color: var(--accent-primary);
            box-shadow: 0 4px 20px var(--shadow-color);
            transform: translateY(-1px);
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .user-card .user-name {
            font-size: 17px;
            font-weight: 600;
        }

        .user-card .user-stats {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .user-card .arrow {
            color: var(--text-muted);
            font-size: 18px;
        }

        /* ===== Record Cards ===== */
        .record-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
        }

        .record-card .record-date {
            font-size: 14px;
            color: var(--accent-secondary);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .record-card .record-stats {
            display: flex;
            justify-content: space-between;
            gap: 12px 8px;
            flex-wrap: wrap;
        }

        .record-card .stat {
            flex: 1;
            text-align: center;
            min-width: 60px;
        }

        .record-card .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .record-card .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .record-card .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(233, 69, 96, 0.15);
            border: none;
            color: var(--accent-primary);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }

        .record-card .delete-btn:hover {
            background: var(--accent-primary);
            color: #fff;
        }

        /* ===== Badges Section ===== */
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            padding-bottom: 24px;
        }

        .badge-item {
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .badge-item:hover, .badge-item:active {
            transform: scale(1.05);
        }

        .badge-icon {
            width: 100%;
            max-width: 160px;
            height: auto;
            aspect-ratio: 1/1;
            object-fit: contain;
            transition: filter 0.3s, opacity 0.3s;
        }

        /* ===== Buttons ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #c0392b);
            color: #fff;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--accent-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-green {
            background: linear-gradient(135deg, var(--accent-green), #00c853);
            color: #0d0d0d;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }

        .btn-small {
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 8px;
            width: auto;
        }

        /* ===== Forms ===== */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
            -webkit-appearance: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent-secondary);
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.1);
        }

        .form-group input::placeholder, .form-group textarea::placeholder {
            color: var(--text-muted);
        }
        
        .form-group textarea {
            resize: vertical;
        }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal h2 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex-shrink: 0;
        }

        .modal-scroll-content {
            overflow-y: auto;
            flex: 1;
            margin-bottom: 16px;
        }

        .modal-scroll-content::-webkit-scrollbar {
            width: 4px;
        }
        .modal-scroll-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .modal .btn {
            margin-top: 8px;
            flex-shrink: 0;
        }

        .modal .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .modal-error {
            color: var(--accent-primary);
            font-size: 14px;
            text-align: center;
            margin-top: 8px;
            min-height: 20px;
        }

        /* ===== Profile Header ===== */
        .profile-header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 16px;
        }

        .profile-header .avatar-large {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.3);
        }

        .profile-header .profile-name {
            font-size: 22px;
            font-weight: 700;
        }

        .profile-header .profile-summary {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
        }

        .profile-header .summary-stat {
            text-align: center;
        }

        .profile-header .summary-stat .val {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-secondary);
        }

        .profile-header .summary-stat .lbl {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ===== Rankings ===== */
        .ranking-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .ranking-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .ranking-tab.active {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }

        .ranking-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ranking-card .rank-num {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .rank-1 { background: linear-gradient(135deg, #FFD700, #FFA000); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #C0C0C0, #9E9E9E); color: #000; }
        .rank-3 { background: linear-gradient(135deg, #CD7F32, #A0522D); color: #fff; }
        .rank-other { background: var(--bg-input); color: var(--text-secondary); }

        .ranking-card .rank-info {
            flex: 1;
        }

        .ranking-card .rank-name {
            font-size: 16px;
            font-weight: 600;
        }

        .ranking-card .rank-detail {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .ranking-card .rank-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-green);
        }

        .date-picker-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }

        .date-picker-row input[type="date"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 16px;
        }

        /* ===== Loading Spinner ===== */
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-container {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            z-index: 2000;
            transition: transform 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast-success {
            background: var(--accent-green);
            color: #0d0d0d;
        }

        .toast-error {
            background: var(--accent-primary);
            color: #fff;
        }

        /* ===== User delete button ===== */
        .user-delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .user-delete-btn:hover {
            color: var(--accent-primary);
            background: rgba(233, 69, 96, 0.1);
        }

        /* ===== Add record form section ===== */
        .add-record-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .add-record-section h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-secondary);
        }

        /* ===== Layout Classes ===== */
        .page { display: none; }
        .page.active { display: block; }
        .user-card-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .user-card-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .sort-row { display: flex; gap: 8px; margin-bottom: 16px; }
        .sort-row select { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-primary); font-size: 16px; outline: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.3s ease forwards; }

    </style>
</head>
<body>

<div id="app">
    <!-- ===== Header ===== -->
    <header class="app-header">
        <button class="header-back-btn" id="backBtn" onclick="goBack()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            <span>Back</span>
        </button>
        <h1>🏃 RunTrack</h1>
        <div class="header-right">
            <button class="btn btn-small btn-secondary" id="addUserBtn" onclick="showAddUserModal()">+ User</button>
        </div>
    </header>

    <!-- ===== Main Content ===== -->
    <div class="app-content" id="appContent">

        <!-- Badges Page -->
        <div class="page" id="badgesPage">
            <div class="section-title">🎖️ Badges</div>
            <div class="badges-grid" id="badgesGrid">
                <!-- Badges dynamically rendered here -->
            </div>
        </div>

        <!-- Home Page -->
        <div class="page active" id="homePage">
            <div class="section-title">青牧 Runners</div>
            <div id="userList">
                <div class="loading-container"><div class="spinner"></div></div>
            </div>
        </div>

        <!-- User Profile Page -->
        <div class="page" id="profilePage">
            <div class="profile-header" id="profileHeader"></div>
            
            <div class="add-record-section">
                <h3>📝 Add Record</h3>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="recordDate">
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="time" id="recordTime">
                </div>
                <div style="display:flex;gap:8px;">
                    <!-- Duration fields use inputmode and pattern to restrict mobile keyboard, and oninput to remove non-numeric instantly -->
                    <div class="form-group" style="flex:1;">
                        <label>Duration (min)</label>
                        <input type="text" inputmode="numeric" pattern="\d*" id="recordDurationMin" placeholder="e.g. 30" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Duration (sec)</label>
                        <input type="text" inputmode="numeric" pattern="\d*" id="recordDurationSec" placeholder="e.g. 30" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    </div>
                </div>
                <div class="form-group">
                    <label>Distance (km)</label>
                    <!-- Distance still allows decimal values -->
                    <input type="number" id="recordDistance" placeholder="e.g. 5.0" min="0.01" step="0.01">
                </div>
                <div style="display:flex;gap:8px;">
                    <div class="form-group" style="flex:1;">
                        <label>Steps (optional)</label>
                        <input type="text" inputmode="numeric" pattern="\d*" id="recordSteps" placeholder="e.g. 5000" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Active Kcal (optional)</label>
                        <input type="text" inputmode="numeric" pattern="\d*" id="recordKcal" placeholder="e.g. 300" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    </div>
                </div>
                <button class="btn btn-green" onclick="addRecord()">Add Record</button>
            </div>
            
            <div class="section-title">📋 Records</div>
            <div id="recordList"></div>
        </div>

        <!-- Rankings Page -->
        <div class="page" id="rankingsPage">
            <div class="section-title">🏆 Rankings</div>
            <div class="ranking-tabs">
                <button class="ranking-tab active" onclick="switchRankingTab('total')">Total</button>
                <button class="ranking-tab" onclick="switchRankingTab('daily')">Daily</button>
            </div>
            <div id="totalRankings">
                <div class="sort-row">
                    <select id="sortSelect" onchange="renderTotalRankings()">
                        <option value="distance">Sort by Total Distance</option>
                        <option value="pace">Sort by Best Pace</option>
                        <option value="steps">Sort by Total Steps</option>
                    </select>
                </div>
                <div id="totalRankingList"></div>
            </div>
            <div id="dailyRankings" style="display:none;">
                <div class="date-picker-row">
                    <input type="date" id="rankDate" onchange="renderDailyRankings()">
                </div>
                <div class="sort-row">
                    <select id="dailySortSelect" onchange="renderDailyRankings()">
                        <option value="distance">Sort by Total Distance</option>
                        <option value="pace">Sort by Best Pace</option>
                        <option value="steps">Sort by Total Steps</option>
                    </select>

// ==========================================
// Avatar Color Generator
// ==========================================
function generateVibrantColor(hue) {
    const saturation = 70 + Math.random() * 20;
    const lightness = 50 + Math.random() * 10;
    return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function assignRandomAvatarColors() {
    const userIds = Object.keys(allUsers);
    const count = userIds.length;
    if (count === 0) { avatarColorMap = {}; return; }

    const hues = [];
    for (let i = 0; i < count; i++) {
        hues.push(Math.round((360 / count) * i));
    }
    shuffleArray(hues);

    avatarColorMap = {};
    userIds.forEach((uid, idx) => {
        avatarColorMap[uid] = generateVibrantColor(hues[idx]);
    });
}

function getAvatarColor(uid) {
    return avatarColorMap[uid] || '#e94560';
}

function getInitial(name) {
    return name.charAt(0).toUpperCase();
}

// ==========================================
// Utility Formatters
// ==========================================
function formatPace(durationMin, distanceKm) {
    if (!distanceKm || distanceKm <= 0) return '--:--';
    const paceMin = durationMin / distanceKm;
    const mins = Math.floor(paceMin);
    const secs = Math.round((paceMin - mins) * 60);
    return mins + "'" + (secs < 10 ? '0' : '') + secs + '" /km';
}

function formatDuration(totalMin) {
    if (totalMin < 60) return Math.floor(totalMin) + ' min';
    const h = Math.floor(totalMin / 60);
    const m = Math.floor(totalMin % 60);
    return h + 'h ' + (m > 0 ? m + 'm' : '');
}

function formatDate(dateStr) {
    const d = new Date(dateStr);
    const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
    return d.toLocaleDateString('en-US', options);
}

// ==========================================
// Firebase: Load Data
// ==========================================
function loadUsers() {
    db.ref('users').on('value', (snapshot) => {
        allUsers = snapshot.val() || {};
        
        // Update currentUserData in real time if profile is open
        if (currentUserId && allUsers[currentUserId]) {
            currentUserData = allUsers[currentUserId];
            if (currentPage === 'profile') renderProfileHeader();
        }

        assignRandomAvatarColors();
        renderUserList();
        loadAllRecords();
    });
}

function renderUserList() {
    const container = document.getElementById('userList');
    const userIds = Object.keys(allUsers);

    if (userIds.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🏃</div>
                <p>No runners yet.<br>Tap "+ User" to add one!</p>
            </div>`;
        return;
    }

    let html = '';
    userIds.forEach(uid => {
        const user = allUsers[uid];
        const records = allRecords[uid] || {};
        const recordCount = Object.keys(records).length;
        const color = getAvatarColor(uid);

        let totalDist = 0;
        Object.values(records).forEach(r => { totalDist += (r.distance || 0); });

        html += `
        <div class="user-card animate-in" onclick="openProfile('${uid}')">
            <div class="user-card-left">
                <div class="user-avatar" style="background:${color}">${getInitial(user.name)}</div>
                <div>
                    <div class="user-name">${escapeHtml(user.name)}</div>
                    <div class="user-stats">${recordCount} run${recordCount !== 1 ? 's' : ''} · ${totalDist.toFixed(1)} km</div>

            </div>
        </div>`;
    });

    container.innerHTML = html;
}

function loadAllRecords() {

function saveBio() {
    const newBio = document.getElementById('editBioInput').value.trim();
    db.ref('users/' + currentUserId).update({ bio: newBio }).then(() => {
        closeModal('editBioModal');
        showToast('Bio updated!');

        showToast('Error: ' + err.message, 'error');
    });
}

function renderRecords() {
    const container = document.getElementById('recordList');
    const records = allRecords[currentUserId] || {};
    const recordEntries = Object.entries(records);

    if (recordEntries.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📋</div>
                <p>No records yet.<br>Add your first run above!</p>
            </div>`;
        return;
    }

    // Sort by date ascending (Oldest to Newest)
    recordEntries.sort((a, b) => {
        if (a[1].date > b[1].date) return 1;
        if (a[1].date < b[1].date) return -1;
        
        // Secondary sort by time ascending if date is the same
        const timeA = a[1].time || '';
        const timeB = b[1].time || '';
        if (timeA > timeB) return 1;
        if (timeA < timeB) return -1;
        return 0;
    });

    let html = '';
    recordEntries.forEach(([rid, rec]) => {
        const pace = formatPace(rec.duration, rec.distance);
        
        // Time Display formatting
        const timeStr = rec.time ? ` at ${rec.time}` : '';
        
        // Steps Display Html
        const stepsHtml = rec.steps ? `
            <div class="stat">
                <div class="stat-value" style="font-size: 16px;">${rec.steps}</div>
                <div class="stat-label">steps</div>
            </div>` : '';
            
        // Kcal Display Html
        const kcalHtml = rec.kcal ? `
            <div class="stat">
                <div class="stat-value" style="font-size: 16px;">${rec.kcal}</div>
                <div class="stat-label">kcal</div>
            </div>` : '';

        // Safe fallback for old records which only had rec.duration
        const minDisp = rec.durationMin !== undefined ? rec.durationMin : Math.floor(rec.duration);
        const secDisp = rec.durationSec !== undefined ? String(rec.durationSec).padStart(2, '0') : '00';

        html += `
        <div class="record-card animate-in">
            <div class="record-date">${formatDate(rec.date)}${timeStr}</div>
            <div class="record-stats">
                <div class="stat">
                    <div class="stat-value" style="font-size: 16px;">${minDisp}'${secDisp}"</div>
                    <div class="stat-label">time</div>
                </div>
                <div class="stat">
                    <div class="stat-value" style="font-size: 16px;">${rec.distance.toFixed(2)}</div>
                    <div class="stat-label">km</div>
                </div>
                <div class="stat">
                    <div class="stat-value" style="font-size: 15px">${pace}</div>
                    <div class="stat-label">pace</div>
                </div>
                ${stepsHtml}
                ${kcalHtml}
            </div>
            <button class="delete-btn" onclick="confirmDeleteRecord('${rid}')" title="Delete">🗑</button>
        </div>`;
    });

    container.innerHTML = html;
}

// ==========================================
// Add Record
// ==========================================
function addRecord() {
    const date = document.getElementById('recordDate').value;
    const time = document.getElementById('recordTime').value || '';
    
    // Parse strictly as integers for Duration, Steps and Kcal
    const durationMin = parseInt(document.getElementById('recordDurationMin').value || '0', 10);
    const durationSec = parseInt(document.getElementById('recordDurationSec').value || '0', 10);
    const steps = parseInt(document.getElementById('recordSteps').value || '0', 10);
    const kcal = parseInt(document.getElementById('recordKcal').value || '0', 10);
    
    const distance = parseFloat(document.getElementById('recordDistance').value);

    if (!date) { showToast('Please select a date.', 'error'); return; }
    
    const totalDurationSec = durationMin * 60 + durationSec;
    if (totalDurationSec <= 0) { showToast('Please enter a valid duration.', 'error'); return; }
    if (!distance || distance <= 0) { showToast('Please enter a valid distance.', 'error'); return; }
    if (durationSec < 0 || durationSec > 59) { showToast('Seconds must be 0-59.', 'error'); return; }

    const durationMinutes = totalDurationSec / 60;

    const newRecordRef = db.ref('records/' + currentUserId).push();
    newRecordRef.set({
        date: date,
        time: time,
        duration: durationMinutes,
        durationMin: durationMin,
        durationSec: durationSec,
        distance: distance,
        steps: steps > 0 ? steps : null,
        kcal: kcal > 0 ? kcal : null,
        createdAt: new Date().toISOString()
    }).then(() => {
        showToast('Record added!');
        document.getElementById('recordDurationMin').value = '';
        document.getElementById('recordDurationSec').value = '';
        document.getElementById('recordDistance').value = '';
        document.getElementById('recordSteps').value = '';
        document.getElementById('recordKcal').value = '';
    }).catch(err => {
        showToast('Error: ' + err.message, 'error');
    });
}

// Delete Record
// ==========================================
function confirmDeleteRecord(recordId) {
    pendingDeleteRecordId = recordId;
    document.getElementById('deleteRecordPassword').value = '';
    document.getElementById('deleteRecordError').textContent = '';
    showModal('deleteRecordModal');
}

document.getElementById('confirmDeleteRecordBtn').addEventListener('click', () => {
    const password = document.getElementById('deleteRecordPassword').value;
    const errorEl = document.getElementById('deleteRecordError');

    if (password !== ADMIN_PASSWORD) {
        errorEl.textContent = 'Incorrect admin password.';
        return;
    }

    db.ref('records/' + currentUserId + '/' + pendingDeleteRecordId).remove().then(() => {
        closeModal('deleteRecordModal');
        showToast('Record deleted.');
        pendingDeleteRecordId = null;
    }).catch(err => {
        errorEl.textContent = 'Error: ' + err.message;
    });
});

// ==========================================
// Badges Functionality
// ==========================================
function getBadgeAchievers(badgeId) {
    const achievers = [];
    Object.keys(allUsers).forEach(uid => {
        const user = allUsers[uid];
        const records = allRecords[uid] || {};
        const recordEntries = Object.values(records);

        if (recordEntries.length > 0) {
            // Sort records from oldest to newest to find the exact date the threshold was met
            recordEntries.sort((a, b) => {
                if (a.date !== b.date) return a.date > b.date ? 1 : -1;
                const timeA = a.time || '';
                const timeB = b.time || '';
                return timeA > timeB ? 1 : -1;
            });

            let achievedDate = null;
            let runCount = 0;
            let totalDist = 0;
            let totalDur = 0;

            for (const r of recordEntries) {
                runCount++;
                totalDist += (r.distance || 0);
                totalDur += (r.duration || 0);

                if (badgeId === 'first_run' && runCount >= 1) {
                    achievedDate = r.date;
                    break;
                }
                if (badgeId === '10_runs' && runCount >= 10) {
                    achievedDate = r.date;
                    break;
                }
                if (badgeId === '10_km' && totalDist >= 10) {
                    achievedDate = r.date;
                    break;
                }
                if (badgeId === '10_hours' && totalDur >= 600) { // 600 minutes = 10 hours
                    achievedDate = r.date;
                    break;
                }
                if (badgeId === '50_runs' && runCount >= 50) {
                    achievedDate = r.date;
                    break;
                }
                if (badgeId === '50_km' && totalDist >= 50) {
                    achievedDate = r.date;
                    break;
                }
                if (badgeId === '50_hours' && totalDur >= 3000) { // 3000 minutes = 50 hours
                    achievedDate = r.date;
                    break;
                }
                if (badgeId === '100_runs' && runCount >= 100) {
                    achievedDate = r.date;
                    break;
                }
                if (badgeId === '100_km' && totalDist >= 100) {
                    achievedDate = r.date;
                    break;
                }
                if (badgeId === '100_hours' && totalDur >= 6000) { // 6000 minutes = 100 hours
                    achievedDate = r.date;
                    break;
                }
            }

            if (achievedDate) {
                achievers.push({
                    uid: uid,
                    name: user.name,
                    dateAchieved: achievedDate
                });
            }
        }
    });

    // Sort achievers by date achieved (oldest first)
    achievers.sort((a, b) => (a.dateAchieved > b.dateAchieved ? 1 : -1));
    return achievers;
}

function renderBadges() {
    const container = document.getElementById('badgesGrid');
    if (!container) return;

    let html = '';
    BADGES.forEach(badge => {
        const achievers = getBadgeAchievers(badge.id);
        const hasAchievers = achievers.length > 0;
        
        // Dim the badge if no one has achieved it yet
        const filterStyle = hasAchievers ? '' : 'filter: grayscale(100%); opacity: 0.5;';

        html += `
        <div class="badge-item animate-in" onclick="openBadgeDetail('${badge.id}')">
            <img src="${badge.image}" alt="${badge.name}" class="badge-icon" style="${filterStyle}">
        </div>`;
    });
    container.innerHTML = html;
}

function openBadgeDetail(badgeId) {
    const badge = BADGES.find(b => b.id === badgeId);
    const achievers = getBadgeAchievers(badgeId);

    document.getElementById('badgeDetailImg').src = badge.image;
    document.getElementById('badgeDetailTitle').textContent = badge.name;
    document.getElementById('badgeDetailCount').textContent = `${achievers.length} Achiever${achievers.length !== 1 ? 's' : ''}`;
    
    const listContainer = document.getElementById('badgeDetailList');

    if (achievers.length === 0) {
        listContainer.innerHTML = `<div class="empty-state" style="padding: 20px;"><p>No one has achieved this badge yet.</p></div>`;
    } else {
        let html = '';
        achievers.forEach((achiever, index) => {
            const color = getAvatarColor(achiever.uid);
            html += `
            <div class="ranking-card" style="margin-bottom: 8px;">
                <div class="user-avatar" style="background:${color};width:40px;height:40px;font-size:16px;">${getInitial(achiever.name)}</div>
                <div class="rank-info">
                    <div class="rank-name">${escapeHtml(achiever.name)}</div>
                    <div class="rank-detail">Achieved on ${formatDate(achiever.dateAchieved)}</div>
                </div>
            </div>`;
        });
        listContainer.innerHTML = html;
    }

    showModal('badgeDetailModal');
}

// ==========================================
// Rankings
// ==========================================
function switchRankingTab(tab) {
    document.querySelectorAll('.ranking-tab').forEach(t => t.classList.remove('active'));
    if (tab === 'total') {
        document.querySelector('.ranking-tab:first-child').classList.add('active');
        document.getElementById('totalRankings').style.display = '';
        document.getElementById('dailyRankings').style.display = 'none';
        renderTotalRankings();
    } else {
        document.querySelector('.ranking-tab:last-child').classList.add('active');
        document.getElementById('totalRankings').style.display = 'none';
        document.getElementById('dailyRankings').style.display = '';
        if (!document.getElementById('rankDate').value) {
            document.getElementById('rankDate').value = new Date().toISOString().split('T')[0];
        }
        renderDailyRankings();
    }
}

function renderTotalRankings() {
    const container = document.getElementById('totalRankingList');
    const sortBy = document.getElementById('sortSelect').value;

    let rankingData = [];
    Object.keys(allUsers).forEach(uid => {
        const user = allUsers[uid];
        const records = allRecords[uid] || {};
        
        let totalDist = 0, totalTime = 0, totalSteps = 0;
        let bestPace = Infinity;
        let bestPaceDate = '';
        let latestDate = '';

        Object.values(records).forEach(r => {
            const dist = r.distance || 0;
            const dur = r.duration || 0;
            totalDist += dist;
            totalTime += dur;
            totalSteps += (r.steps || 0);

            if (dist > 0 && dur > 0) {
                const pace = dur / dist;
                if (pace < bestPace) {
                    bestPace = pace;
                    bestPaceDate = r.date || '';
                }
            }

            if (r.date && (!latestDate || r.date > latestDate)) {
                latestDate = r.date;
            }
        });

        if (sortBy === 'pace' && bestPace === Infinity) return;
        if (sortBy === 'steps' && totalSteps === 0) return;

        rankingData.push({
            uid: uid,
            name: user.name,
            totalDist: totalDist,
            totalTime: totalTime,
            totalSteps: totalSteps,
            bestPace: bestPace === Infinity ? null : bestPace,
            bestPaceDate: bestPaceDate,
            latestDate: latestDate
        });
    });

    if (sortBy === 'distance') {
        rankingData.sort((a, b) => b.totalDist - a.totalDist);
    } else if (sortBy === 'steps') {
        rankingData.sort((a, b) => b.totalSteps - a.totalSteps);
    } else {
        rankingData.sort((a, b) => (a.bestPace || Infinity) - (b.bestPace || Infinity));
    }

    if (rankingData.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>No data yet.</p></div>`;
        return;
    }

    let html = '';
    rankingData.forEach((item, index) => {
        const rank = index + 1;
        const rankClass = rank <= 3 ? 'rank-' + rank : 'rank-other';
        const color = getAvatarColor(item.uid);

        let value, detail;
        if (sortBy === 'distance') {
            value = item.totalDist.toFixed(1) + ' km';
            detail = item.latestDate ? formatDate(item.latestDate) : 'No records';
        } else if (sortBy === 'steps') {
            value = item.totalSteps.toLocaleString() + ' steps';
            detail = item.latestDate ? formatDate(item.latestDate) : 'No records';
        } else {
            value = formatPace(item.bestPace, 1);
            detail = item.bestPaceDate ? formatDate(item.bestPaceDate) : '';
        }

        html += `
        <div class="ranking-card animate-in">
            <div class="rank-num ${rankClass}">${rank}</div>
            <div class="user-avatar" style="background:${color};width:40px;height:40px;font-size:16px;">${getInitial(item.name)}</div>
            <div class="rank-info">
                <div class="rank-name">${escapeHtml(item.name)}</div>
                <div class="rank-detail">${detail}</div>
            </div>
            <div class="rank-value" style="${sortBy==='steps' ? 'font-size:16px;' : ''}">${value}</div>
        </div>`;
    });

    container.innerHTML = html;
}

function renderDailyRankings() {
    const container = document.getElementById('dailyRankingList');
    const selectedDate = document.getElementById('rankDate').value;
    const sortBy = document.getElementById('dailySortSelect').value;

    if (!selectedDate) {
        container.innerHTML = `<div class="empty-state"><p>Select a date.</p></div>`;
        return;
    }

    let rankingData = [];
    Object.keys(allUsers).forEach(uid => {
        const user = allUsers[uid];
        const records = allRecords[uid] || {};
        let totalDist = 0, totalTime = 0, totalSteps = 0;
        let count = 0;
        
        Object.values(records).forEach(r => {
            if (r.date === selectedDate) {
                totalDist += (r.distance || 0);
                totalTime += (r.duration || 0);
                totalSteps += (r.steps || 0);
                count++;
            }
        });
        
        if (count > 0) {
            // Aggregate daily pace = total daily time / total daily distance
            const dailyPace = totalDist > 0 ? (totalTime / totalDist) : Infinity;
            rankingData.push({
                uid: uid,
                name: user.name,
                totalDist: totalDist,
                totalTime: totalTime,
                totalSteps: totalSteps,
                dailyPace: dailyPace,
                count: count
            });
        }
    });

    if (sortBy === 'distance') {
        rankingData.sort((a, b) => b.totalDist - a.totalDist);
    } else if (sortBy === 'steps') {
        rankingData = rankingData.filter(item => item.totalSteps > 0);
        rankingData.sort((a, b) => b.totalSteps - a.totalSteps);
    } else if (sortBy === 'pace') {
        rankingData = rankingData.filter(item => item.dailyPace !== Infinity);
        rankingData.sort((a, b) => a.dailyPace - b.dailyPace);
    }

    if (rankingData.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📅</div>
                <p>No valid runs found on ${formatDate(selectedDate)}.</p>
            </div>`;
        return;
    }

    let html = '';
    rankingData.forEach((item, index) => {
        const rank = index + 1;
        const rankClass = rank <= 3 ? 'rank-' + rank : 'rank-other';
        const color = getAvatarColor(item.uid);
        
        let value, detail;
        const paceStr = formatPace(item.totalTime, item.totalDist);
        
        if (sortBy === 'distance') {
            value = item.totalDist.toFixed(2) + ' km';
            detail = `${formatDuration(item.totalTime)} · ${paceStr}`;
        } else if (sortBy === 'steps') {
            value = item.totalSteps.toLocaleString() + ' steps';
            detail = `${item.totalDist.toFixed(2)} km · ${formatDuration(item.totalTime)}`;
        } else {
            value = paceStr;
            detail = `${item.totalDist.toFixed(2)} km · ${formatDuration(item.totalTime)}`;
        }

        html += `
        <div class="ranking-card animate-in">
            <div class="rank-num ${rankClass}">${rank}</div>
            <div class="user-avatar" style="background:${color};width:40px;height:40px;font-size:16px;">${getInitial(item.name)}</div>
            <div class="rank-info">
                <div class="rank-name">${escapeHtml(item.name)}</div>
                <div class="rank-detail">${detail}</div>
            </div>
            <div class="rank-value" style="${sortBy==='steps' ? 'font-size:16px;' : ''}">${value}</div>
        </div>`;
    });

    container.innerHTML = html;
}

// ==========================================
// Utility: Escape HTML
// ==========================================
function escapeHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

// ==========================================
// Initialize App
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
    loadUsers();
});
