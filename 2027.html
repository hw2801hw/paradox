<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我有大膽想法 | 遊戲列表</title>
<meta name="description" content="我有大膽想法 — 箭影試煉、塔防遊戲、倖存者、一起打飛機,四款網頁遊戲立即開玩。">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

  :root{
    --c1:#22d3ee; --c2:#a855f7; --c3:#ff2e93; --c4:#fbbf24;
  }
  html{ scroll-behavior:smooth; }
  body{
    background:#05030f; color:#eef; font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    overflow-x:hidden; min-height:100vh;
  }
  ::selection{ background:var(--c3); color:#fff; }
  ::-webkit-scrollbar{ width:10px }
  ::-webkit-scrollbar-track{ background:#05030f }
  ::-webkit-scrollbar-thumb{ background:linear-gradient(var(--c1),var(--c2),var(--c3)); border-radius:10px }

  #fx{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  #grid-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
    background-image:
      linear-gradient(rgba(168,85,247,.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,.12) 1px, transparent 1px);
    background-size:60px 60px;
    mask-image: radial-gradient(ellipse at 50% 30%, #000 10%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 10%, transparent 75%);
    animation: gridmove 14s linear infinite;
  }
  @keyframes gridmove{ to{ background-position:0 60px, 60px 0; } }

  .aurora{ position:fixed; inset:-20%; z-index:0; pointer-events:none; filter:blur(90px) saturate(1.4); opacity:.55; }
  .aurora i{ position:absolute; border-radius:50%; mix-blend-mode:screen; }
  .aurora i:nth-child(1){ width:46vw;height:46vw; left:5%; top:0; background:radial-gradient(circle,#7c3aed,transparent 65%); animation:f1 18s ease-in-out infinite alternate; }
  .aurora i:nth-child(2){ width:40vw;height:40vw; right:5%; top:15%; background:radial-gradient(circle,#06b6d4,transparent 65%); animation:f2 22s ease-in-out infinite alternate; }
  .aurora i:nth-child(3){ width:44vw;height:44vw; left:30%; bottom:0; background:radial-gradient(circle,#e11d74,transparent 65%); animation:f3 20s ease-in-out infinite alternate; }
  @keyframes f1{ to{ transform:translate(25vw,20vh) scale(1.3);} }
  @keyframes f2{ to{ transform:translate(-30vw,25vh) scale(.8);} }
  @keyframes f3{ to{ transform:translate(-20vw,-25vh) scale(1.25);} }

  #cursor-glow{
    position:fixed; left:0; top:0; width:420px; height:420px; margin:-210px 0 0 -210px; z-index:1; pointer-events:none;
    background:radial-gradient(circle, rgba(168,85,247,.22), rgba(34,211,238,.08) 40%, transparent 70%);
    mix-blend-mode:screen; transition:opacity .3s;
  }
  #cursor-dot{
    position:fixed; left:0; top:0; width:14px; height:14px; margin:-7px 0 0 -7px; z-index:100; pointer-events:none;
    border:2px solid #fff; border-radius:50%; mix-blend-mode:difference; transition:width .25s,height .25s,margin .25s,background .25s;
  }
  #cursor-dot.big{ width:54px;height:54px;margin:-27px 0 0 -27px; background:#fff; }
  @media (hover:none){ #cursor-dot,#cursor-glow{ display:none } }

  main, header, footer, section{ position:relative; z-index:2; }

  /* ====== Title ====== */
  .title{
    font-weight:900; letter-spacing:.04em; line-height:1.05;
    background:linear-gradient(100deg,#22d3ee,#a855f7 30%,#ff2e93 55%,#fbbf24 80%,#22d3ee);
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 6s linear infinite;
    filter:drop-shadow(0 0 28px rgba(168,85,247,.55));
    position:relative; display:inline-block;
  }
  @keyframes shine{ to{ background-position:300% 0; } }
  .title::before,.title::after{
    content:attr(data-text); position:absolute; inset:0; -webkit-background-clip:text; background-clip:text; color:transparent; pointer-events:none;
  }
  .title::before{ background:linear-gradient(#22d3ee,#22d3ee); -webkit-background-clip:text; background-clip:text; animation:glitch1 4.5s infinite steps(1); opacity:.0; }
  .title::after{ background:linear-gradient(#ff2e93,#ff2e93); -webkit-background-clip:text; background-clip:text; animation:glitch2 4.5s infinite steps(1); opacity:.0; }
  @keyframes glitch1{
    0%,92%,100%{ opacity:0; transform:none; clip-path:inset(0) }
    93%{ opacity:.9; transform:translate(-6px,2px); clip-path:inset(10% 0 60% 0) }
    95%{ opacity:.9; transform:translate(5px,-2px); clip-path:inset(55% 0 15% 0) }
    97%{ opacity:.9; transform:translate(-3px,0); clip-path:inset(30% 0 40% 0) }
  }
  @keyframes glitch2{
    0%,92%,100%{ opacity:0; transform:none; clip-path:inset(0) }
    94%{ opacity:.9; transform:translate(6px,-2px); clip-path:inset(60% 0 10% 0) }
    96%{ opacity:.9; transform:translate(-5px,2px); clip-path:inset(5% 0 70% 0) }
    98%{ opacity:.9; transform:translate(3px,0); clip-path:inset(40% 0 30% 0) }
  }

  .badge{
    display:inline-flex; align-items:center; gap:.6rem; padding:.45rem 1rem; border-radius:999px;
    border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); backdrop-filter:blur(10px);
    font-size:.8rem; letter-spacing:.25em; color:#cbd5ff;
  }
  .pulse-dot{ width:8px;height:8px;border-radius:50%; background:#34d399; box-shadow:0 0 0 0 rgba(52,211,153,.7); animation:pulse 1.8s infinite; }
  @keyframes pulse{ 70%{ box-shadow:0 0 0 12px rgba(52,211,153,0);} 100%{ box-shadow:0 0 0 0 rgba(52,211,153,0);} }

  .caret::after{ content:'▌'; margin-left:2px; color:var(--c1); animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0 } }

  /* ====== Buttons ====== */
  .btn{
    position:relative; display:inline-flex; align-items:center; gap:.6rem; padding:.95rem 1.8rem; border-radius:14px;
    font-weight:800; letter-spacing:.08em; color:#fff; overflow:hidden; cursor:pointer; border:0;
    background:linear-gradient(120deg,#7c3aed,#ff2e93,#f59e0b); background-size:200% 100%;
    box-shadow:0 10px 40px -8px rgba(255,46,147,.6), inset 0 0 0 1px rgba(255,255,255,.25);
    transition:transform .25s, background-position .6s, box-shadow .25s;
  }
  .btn:hover{ transform:translateY(-3px) scale(1.03); background-position:100% 0; box-shadow:0 18px 55px -8px rgba(255,46,147,.85), inset 0 0 0 1px rgba(255,255,255,.4); }
  .btn::after{ content:''; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent); transform:skewX(-20deg); transition:left .7s; }
  .btn:hover::after{ left:130%; }
  .btn-ghost{ background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); backdrop-filter:blur(10px); }
  .btn-ghost:hover{ background:rgba(255,255,255,.12); box-shadow:0 0 40px -6px rgba(34,211,238,.6), inset 0 0 0 1px rgba(34,211,238,.7); }

  /* ====== Cards ====== */
  .cards{ perspective:1400px; }
  .card{
    --rx:0deg; --ry:0deg; --mx:50%; --my:50%; --accent:var(--c1);
    position:relative; display:block; border-radius:26px; padding:2px; text-decoration:none; color:inherit;
    transform:rotateX(var(--rx)) rotateY(var(--ry)) translateZ(0); transform-style:preserve-3d;
    transition:transform .18s ease-out, box-shadow .4s;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.9);
    opacity:0; translate:0 60px; will-change:transform;
  }
  .card.in{ opacity:1; translate:0 0; transition:transform .18s ease-out, box-shadow .4s, opacity .9s, translate .9s cubic-bezier(.2,.9,.2,1); }
  .card::before{ /* rotating neon border */
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:conic-gradient(from var(--angle), transparent 0 55%, var(--accent) 75%, #fff 80%, var(--accent2,var(--c2)) 88%, transparent 100%);
    animation:spin 4s linear infinite; opacity:.55; transition:opacity .4s;
  }
  .card::after{ /* outer glow */
    content:''; position:absolute; inset:-1px; border-radius:inherit; z-index:-1; filter:blur(28px); opacity:0;
    background:conic-gradient(from var(--angle), var(--accent), var(--accent2,var(--c2)), var(--accent));
    animation:spin 4s linear infinite; transition:opacity .4s;
  }
  @keyframes spin{ to{ --angle:360deg; } }
  .card:hover::before{ opacity:1; }
  .card:hover::after{ opacity:.65; }
  .card.picked::before{ opacity:1; }
  .card.picked::after{ opacity:.9; }

  .card-inner{
    position:relative; border-radius:24px; overflow:hidden; background:#0b0820; height:100%;
    display:flex; flex-direction:column;
  }
  /* 圖片區:原始比例、完整顯示,無任何疊層、裁切、縮放、濾鏡 */
  .thumb{ position:relative; background:#000; line-height:0; }
  .thumb img{
    display:block; width:100%; height:auto;
    object-fit:fill; filter:none; transform:none; image-rendering:auto;
  }

  .num{
    display:inline-block; font-weight:900; font-size:.85rem; letter-spacing:.2em;
    padding:.25rem .75rem; border-radius:10px; background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.2); color:#fff; margin-bottom:.8rem;
  }
  .card-body{ flex:1; display:flex; flex-direction:column; align-items:flex-start; }
  .card-body .play{ margin-top:auto; }
  .card-body .tags{ margin-bottom:1.1rem; }
  .tag{
    font-size:.72rem; padding:.28rem .7rem; border-radius:999px; letter-spacing:.1em; font-weight:700;
    border:1px solid color-mix(in srgb, var(--accent) 60%, transparent);
    background:color-mix(in srgb, var(--accent) 14%, transparent); color:color-mix(in srgb, var(--accent) 70%, #fff);
  }
  .card-body{ padding:1.3rem 1.6rem 1.7rem; transform:translateZ(40px); }
  .card h3{ font-weight:900; font-size:1.9rem; letter-spacing:.05em; }
  .play{
    display:inline-flex; align-items:center; gap:.6rem; margin-top:1.1rem; font-weight:800; letter-spacing:.12em; font-size:.9rem;
    padding:.7rem 1.3rem; border-radius:12px; color:#05030f;
    background:linear-gradient(120deg,var(--accent),var(--accent2,var(--c2)));
    box-shadow:0 8px 30px -8px var(--accent); transition:gap .3s, transform .3s, box-shadow .3s;
  }
  .card:hover .play{ gap:1rem; transform:translateY(-2px); box-shadow:0 14px 40px -6px var(--accent); }
  .url{ font-size:.72rem; color:#7f86b5; letter-spacing:.05em; margin-top:.9rem; font-family:ui-monospace,monospace; word-break:break-all; }

  /* section heading */
  .eyebrow{ letter-spacing:.5em; color:var(--c1); font-size:.8rem; font-weight:700; }

  /* marquee */
  .marquee{ overflow:hidden; border-block:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.025); backdrop-filter:blur(6px); transform:rotate(-1.2deg); }
  .marquee-track{ display:flex; width:max-content; animation:marq 28s linear infinite; }
  .marquee:hover .marquee-track{ animation-play-state:paused; }
  .marquee span{ padding:1rem 2rem; font-weight:900; font-size:1.4rem; letter-spacing:.2em; white-space:nowrap; color:transparent; -webkit-text-stroke:1px rgba(255,255,255,.55); }
  .marquee span.f{ -webkit-text-stroke:0; background:linear-gradient(90deg,var(--c1),var(--c3)); -webkit-background-clip:text; background-clip:text; }
  @keyframes marq{ to{ transform:translateX(-50%);} }

  /* stats */
  .stat{ padding:1.3rem; border-radius:20px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); backdrop-filter:blur(10px); text-align:center; transition:transform .3s, border-color .3s; }
  .stat:hover{ transform:translateY(-6px); border-color:var(--c2); }
  .stat b{ display:block; font-size:2.4rem; font-weight:900; background:linear-gradient(120deg,var(--c1),var(--c3)); -webkit-background-clip:text; background-clip:text; color:transparent; }

  /* scroll hint */
  .mouse{ width:26px;height:42px;border:2px solid rgba(255,255,255,.5);border-radius:20px;position:relative; }
  .mouse::after{ content:'';position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:wheel 1.6s infinite; }
  @keyframes wheel{ to{ transform:translateY(14px); opacity:0; } }

  .reveal{ opacity:0; transform:translateY(40px); transition:opacity 1s, transform 1s cubic-bezier(.2,.9,.2,1); }
  .reveal.in{ opacity:1; transform:none; }

  /* toast */
  #toast{
    position:fixed; left:50%; bottom:32px; z-index:90; transform:translate(-50%,120px); transition:transform .5s cubic-bezier(.2,1.2,.3,1);
    padding:.9rem 1.6rem; border-radius:16px; background:rgba(15,10,40,.85); backdrop-filter:blur(16px);
    border:1px solid rgba(168,85,247,.6); box-shadow:0 0 50px -8px rgba(168,85,247,.8); font-weight:700; letter-spacing:.06em;
  }
  #toast.show{ transform:translate(-50%,0); }

  /* ====== 穿越 / Warp Overlay ====== */
  #warp-overlay{
    position:fixed; inset:0; z-index:200; display:none;
    background:radial-gradient(ellipse at center, #1a0a2e 0%, #05030f 65%);
    flex-direction:column; align-items:center; justify-content:center;
    pointer-events:all; overflow:hidden;
  }
  #warp-overlay.active{
    display:flex;
    animation:warp-in .45s ease-out forwards, vibrate .11s linear infinite;
  }
  @keyframes warp-in{
    from{ opacity:0; transform:scale(1.12); filter:blur(14px); }
    to{ opacity:1; transform:scale(1); filter:blur(0); }
  }
  @keyframes vibrate{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    15%{ transform:translate(-1.8px,1.2px) rotate(-0.35deg); }
    30%{ transform:translate(1.6px,-1.4px) rotate(0.3deg); }
    45%{ transform:translate(-1.2px,-1.6px) rotate(-0.25deg); }
    60%{ transform:translate(1.4px,1.3px) rotate(0.28deg); }
    75%{ transform:translate(-0.9px,0.8px) rotate(-0.15deg); }
  }
  .warp-portal{
    width:min(260px,58vw); height:min(260px,58vw);
    border-radius:50%;
    background:conic-gradient(from 0deg,#22d3ee,#a855f7,#ff2e93,#fbbf24,#22d3ee);
    animation:spin 1.1s linear infinite;
    position:relative;
    box-shadow:0 0 90px 24px rgba(168,85,247,.55), inset 0 0 50px rgba(0,0,0,.7);
    display:flex; align-items:center; justify-content:center;
  }
  .warp-portal::before{
    content:''; position:absolute; inset:14px; border-radius:50%;
    background:#05030f;
    box-shadow:inset 0 0 40px rgba(34,211,238,.25);
  }
  .warp-portal::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle, transparent 35%, rgba(255,46,147,.18) 65%, transparent);
    animation:pulse-ring 1.4s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{ transform:scale(.75); opacity:.9; }
    100%{ transform:scale(1.45); opacity:0; }
  }
  .warp-text{
    position:relative; z-index:2; font-weight:900; font-size:clamp(1.7rem,5.5vw,2.8rem);
    letter-spacing:.35em; background:linear-gradient(100deg,#22d3ee,#a855f7 40%,#ff2e93 70%,#fbbf24);
    background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 2.2s linear infinite;
    text-shadow:0 0 50px rgba(168,85,247,.9);
  }
  .warp-sub{
    margin-top:1.6rem; font-size:.9rem; letter-spacing:.45em; color:#a5b4fc; opacity:.9;
  }
  .warp-game-name{
    margin-top:1rem; font-size:1.15rem; font-weight:800; color:#e0e7ff;
    letter-spacing:.18em; text-shadow:0 0 20px rgba(34,211,238,.5);
  }
  .warp-progress{
    margin-top:2.2rem; width:min(260px,55vw); height:5px;
    background:rgba(255,255,255,.1); border-radius:6px; overflow:hidden;
    box-shadow:inset 0 0 8px rgba(0,0,0,.4);
  }
  .warp-progress i{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#22d3ee,#a855f7,#ff2e93,#fbbf24);
    border-radius:6px;
    box-shadow:0 0 12px rgba(168,85,247,.8);
  }
  .warp-progress i.run{ animation:progress 3s linear forwards; }
  @keyframes progress{ to{ width:100%; } }

  /* 背景粒子加強感 */
  .warp-stars{
    position:absolute; inset:0; pointer-events:none; overflow:hidden;
  }
  .warp-stars span{
    position:absolute; width:3px; height:3px; background:#fff; border-radius:50%;
    opacity:0; animation:star-fly 2.8s linear infinite;
  }
  @keyframes star-fly{
    0%{ transform:translate(0,0) scale(0); opacity:0; }
    10%{ opacity:1; }
    100%{ transform:translate(var(--tx),var(--ty)) scale(1.2); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
  }
</style>
</head>
<body>

<div class="aurora"><i></i><i></i><i></i></div>
<div id="grid-bg"></div>
<canvas id="fx"></canvas>
<div id="cursor-glow"></div>
<div id="cursor-dot"></div>

<!-- ============ HERO ============ -->
<header class="min-h-screen flex flex-col items-center justify-center text-center px-6 pt-16 pb-10">
  <div class="badge reveal"><span class="pulse-dot"></span>GAME ARCADE · 4 款遊戲上線</div>

  <h1 class="title mt-8 text-[clamp(3rem,10.5vw,9rem)] reveal" data-text="我有大膽想法" style="transition-delay:.15s">我有大膽想法</h1>

  <p class="mt-8 text-lg md:text-2xl text-indigo-100/80 font-medium h-9 reveal" style="transition-delay:.3s">
    <span id="typed" class="caret"></span>
  </p>

  <div class="mt-12 flex flex-wrap gap-4 justify-center reveal" style="transition-delay:.45s">
    <a href="#games" class="btn" data-hover>🚀 開始探索</a>
    <button id="randomBtn" class="btn btn-ghost" data-hover>🎲 隨機挑戰一款</button>
  </div>

  <a href="#games" class="mt-16 flex flex-col items-center gap-3 text-xs tracking-[.4em] text-white/50 reveal" style="transition-delay:.6s" data-hover>
    <div class="mouse"></div>SCROLL
  </a>
</header>

<!-- ============ MARQUEE ============ -->
<div class="marquee my-6 -mx-4">
  <div class="marquee-track" id="marq"></div>
</div>

<!-- ============ GAMES ============ -->
<main id="games" class="max-w-7xl mx-auto px-5 md:px-8 pt-28 pb-20">
  <div class="text-center mb-16 reveal">
    <div class="eyebrow">SELECT YOUR GAME</div>
    <h2 class="text-4xl md:text-6xl font-black mt-4 tracking-wide">選擇你的<span class="title" data-text="戰場" style="font-size:1em">戰場</span></h2>
    <p class="mt-5 text-indigo-200/70 max-w-xl mx-auto">四款風格迥異的網頁遊戲,免下載、點開即玩。移動滑鼠感受光影,點擊卡片立即出擊。</p>
  </div>

  <div class="cards grid md:grid-cols-2 gap-8 lg:gap-12" id="cardGrid"></div>
</main>

<!-- ============ STATS ============ -->
<section class="max-w-5xl mx-auto px-6 pb-24">
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 reveal">
    <div class="stat"><b data-count="4">0</b><span class="text-sm text-indigo-200/70 tracking-widest">精選遊戲</span></div>
    <div class="stat"><b data-count="100" data-suffix="%">0</b><span class="text-sm text-indigo-200/70 tracking-widest">免費暢玩</span></div>
    <div class="stat"><b data-count="0">0</b><span class="text-sm text-indigo-200/70 tracking-widest">需要下載</span></div>
    <div class="stat"><b data-count="999" data-suffix="+">0</b><span class="text-sm text-indigo-200/70 tracking-widest">大膽想法</span></div>
  </div>
</section>

<footer class="text-center pb-16 px-6 text-indigo-200/50 text-sm tracking-widest">
  <div class="title text-3xl font-black mb-3" data-text="我有大膽想法">我有大膽想法</div>
  <p>© <span id="yr"></span> 我有大膽想法 · 敢想,就敢玩</p>
  <button id="topBtn" class="mt-6 btn btn-ghost !py-2 !px-5 !text-sm" data-hover>↑ 回到頂端</button>
</footer>

<div id="toast"></div>

<!-- 穿越畫面 -->
<div id="warp-overlay">
  <div class="warp-stars" id="warpStars"></div>
  <div class="warp-portal">
    <div class="warp-text">穿越中</div>
  </div>
  <div class="warp-sub">空間跳躍進行中…</div>
  <div class="warp-game-name" id="warpGameName"></div>
  <div class="warp-progress"><i id="warpBar"></i></div>
</div>

<script>
/* ================= DATA ================= */
const GAMES = [
  { id:'925', no:'01', name:'箭影試煉', en:'ARROW TRIAL',
    url:'https://hw2801hw.github.io/paradox/925',
    img:'https://i.ibb.co/TDtR1M4c/925.jpg',
    desc:'在殘影與箭雨交錯的試煉場中,考驗你的反應與走位。精準閃避、反擊,挑戰極限生存。',
    tags:['動作','閃避','挑戰'], a:'#22d3ee', b:'#3b82f6' },
  { id:'td', no:'02', name:'塔防遊戲', en:'TOWER DEFENSE',
    url:'https://hw2801hw.github.io/paradox/td',
    img:'https://i.ibb.co/HDzQzVwj/td.webp',
    desc:'佈署防禦塔、升級火力、運籌帷幄。擋下一波又一波來襲的敵軍,守住最後防線。',
    tags:['策略','塔防','佈陣'], a:'#34d399', b:'#a3e635' },
  { id:'Ace', no:'03', name:'倖存者', en:'SURVIVORS',
    url:'https://hw2801hw.github.io/paradox/Ace',
    img:'https://i.ibb.co/RpQqkBCS/sos.jpg',
    desc:'身陷無盡怪潮,撿取經驗、強化武器,組出最強build,看你能撐到第幾分鐘。',
    tags:['生存','割草','Roguelite'], a:'#ff2e93', b:'#f97316' },
  { id:'1945', no:'04', name:'一起打飛機', en:'SKY SHOOTER',
    url:'https://hw2801hw.github.io/paradox/1945',
    img:'https://i.ibb.co/W4vLBRSb/1944.jpg',
    desc:'經典空戰射擊重現!彈幕橫飛、道具強化、Boss 壓軸登場,一起升空開打。',
    tags:['射擊','空戰','街機'], a:'#fbbf24', b:'#ef4444' },
];

/* ================= BUILD CARDS ================= */
const grid = document.getElementById('cardGrid');
GAMES.forEach((g,i)=>{
  const a = document.createElement('a');
  a.className='card'; a.href=g.url; a.target='_blank'; a.rel='noopener noreferrer'; a.dataset.id=g.id; a.dataset.hover='';
  a.style.setProperty('--accent', g.a); a.style.setProperty('--accent2', g.b);
  a.style.transitionDelay = (i%2*0.12)+'s';
  a.innerHTML = `
    <div class="card-inner">
      <div class="thumb">
        <img src="${g.img}" alt="${g.name} 遊戲截圖" loading="eager" decoding="async" referrerpolicy="no-referrer">
      </div>
      <div class="card-body">
        <span class="num">NO.${g.no}</span>
        <div class="text-xs tracking-[.35em] font-bold mb-1" style="color:${g.a}">${g.en}</div>
        <h3>${g.name}</h3>
        <p class="mt-3 text-indigo-100/75 leading-relaxed">${g.desc}</p>
        <div class="tags flex flex-wrap gap-2 mt-4">${g.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <span class="play">立即開玩 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span>
        <div class="url">${g.url.replace('https://','')}</div>
      </div>
    </div>`;
  grid.appendChild(a);
});
const cards = [...document.querySelectorAll('.card')];

/* tilt + click intercept for warp */
cards.forEach((c, idx)=>{
  c.addEventListener('mousemove',e=>{
    const r=c.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    c.style.setProperty('--ry',((x-.5)*14)+'deg');
    c.style.setProperty('--rx',((.5-y)*12)+'deg');
    c.style.setProperty('--mx',(x*100)+'%');
    c.style.setProperty('--my',(y*100)+'%');
  });
  c.addEventListener('mouseleave',()=>{ c.style.setProperty('--rx','0deg'); c.style.setProperty('--ry','0deg'); });
  c.addEventListener('click',e=>{
    e.preventDefault();
    const g = GAMES[idx];
    burst(e.clientX, e.clientY, c.style.getPropertyValue('--accent'), 70);
    startWarp(g.url, g.name);
  });
});

/* marquee */
const marq=document.getElementById('marq');
let mh='';
for(let k=0;k<2;k++) GAMES.forEach(g=>{ mh+=`<span class="f">${g.name}</span><span>${g.en}</span>`; });
marq.innerHTML = mh+mh;

/* typed subtitle */
const phrases=['四款網頁遊戲,點開就能玩。','箭雨、塔防、怪潮、空戰,一次滿足。','敢想,就敢玩。','準備好了嗎?選擇你的戰場。'];
const typed=document.getElementById('typed'); let pi=0,ci=0,del=false;
(function tick(){
  const p=phrases[pi];
  typed.textContent=p.slice(0,ci);
  if(!del && ci<p.length){ ci++; setTimeout(tick,95); }
  else if(!del){ del=true; setTimeout(tick,1700); }
  else if(ci>0){ ci--; setTimeout(tick,45); }
  else { del=false; pi=(pi+1)%phrases.length; setTimeout(tick,350); }
})();

/* reveal & counters */
const io=new IntersectionObserver(es=>{
  es.forEach(en=>{
    if(!en.isIntersecting) return;
    en.target.classList.add('in');
    en.target.querySelectorAll?.('[data-count]').forEach(countUp);
    io.unobserve(en.target);
  });
},{threshold:.12});
document.querySelectorAll('.reveal,.card').forEach(el=>io.observe(el));
function countUp(el){
  const t=+el.dataset.count, s=el.dataset.suffix||''; const st=performance.now(), d=1600;
  (function f(n){ const p=Math.min((n-st)/d,1), e=1-Math.pow(1-p,4); el.textContent=Math.round(t*e)+s; if(p<1)requestAnimationFrame(f); })(st);
}
document.getElementById('yr').textContent=new Date().getFullYear();
document.getElementById('topBtn').onclick=()=>scrollTo({top:0,behavior:'smooth'});

/* toast */
const toast=document.getElementById('toast'); let tt;
function say(m){ toast.textContent=m; toast.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>toast.classList.remove('show'),2600); }

/* random pick */
let rolling=false;
document.getElementById('randomBtn').onclick=()=>{
  if(rolling) return; rolling=true;
  document.getElementById('games').scrollIntoView({behavior:'smooth'});
  const final=Math.floor(Math.random()*cards.length);
  let i=0, step=0, total=14+final+cards.length*1, delay=70;
  cards.forEach(c=>c.classList.remove('picked'));
  setTimeout(function roll(){
    cards.forEach(c=>c.classList.remove('picked'));
    const cur=i%cards.length; cards[cur].classList.add('picked');
    if(step>=total && cur===final){
      const r=cards[cur].getBoundingClientRect();
      burst(r.left+r.width/2,r.top+r.height/2,GAMES[cur].a,220);
      say('🎯 命運選中了:'+GAMES[cur].name);
      cards[cur].scrollIntoView({behavior:'smooth',block:'center'});
      setTimeout(()=>{cards[cur].classList.remove('picked');rolling=false;},3000);
      return;
    }
    i++; step++; delay=Math.min(delay*1.09,420);
    setTimeout(roll,delay);
  },600);
};

/* ================= 穿越效果 ================= */
let warping = false;
function startWarp(url, name){
  if(warping) return;
  warping = true;
  const overlay = document.getElementById('warp-overlay');
  const bar = document.getElementById('warpBar');
  const nameEl = document.getElementById('warpGameName');
  nameEl.textContent = name ? `前往 · ${name}` : '';

  // 重設進度條動畫
  bar.classList.remove('run');
  void bar.offsetWidth;
  bar.classList.add('run');

  // 生成飛星
  const starsBox = document.getElementById('warpStars');
  starsBox.innerHTML = '';
  for(let i=0; i<28; i++){
    const s = document.createElement('span');
    const angle = Math.random()*Math.PI*2;
    const dist = 180 + Math.random()*420;
    s.style.left = '50%';
    s.style.top = '50%';
    s.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
    s.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
    s.style.animationDelay = (Math.random()*0.8) + 's';
    s.style.width = s.style.height = (1.5 + Math.random()*3) + 'px';
    starsBox.appendChild(s);
  }

  overlay.classList.add('active');

  // 3 秒後正式跳轉
  setTimeout(()=>{
    window.open(url, '_blank', 'noopener,noreferrer');
    overlay.classList.remove('active');
    bar.classList.remove('run');
    warping = false;
  }, 3000);
}

/* ================= CURSOR ================= */
const glow=document.getElementById('cursor-glow'), dot=document.getElementById('cursor-dot');
let mx=innerWidth/2,my=innerHeight/2,gx=mx,gy=my;
addEventListener('mousemove',e=>{ mx=e.clientX;my=e.clientY; dot.style.transform=`translate(${mx}px,${my}px)`; });
(function lg(){ gx+=(mx-gx)*.1; gy+=(my-gy)*.1; glow.style.transform=`translate(${gx}px,${gy}px)`; requestAnimationFrame(lg); })();
document.addEventListener('mouseover',e=>{ dot.classList.toggle('big',!!e.target.closest('[data-hover],a,button')); });

/* ================= PARTICLES ================= */
const cv=document.getElementById('fx'), cx=cv.getContext('2d');
let W,H,DPR,parts=[],sparks=[],stars=[];
const COLORS=['34,211,238','168,85,247','255,46,147','251,191,36','255,255,255'];
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth;H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; cx.setTransform(DPR,0,0,DPR,0,0);
  const n=Math.min(Math.floor(W*H/9000),160); parts=[];
  for(let i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*2+.6,c:COLORS[Math.floor(Math.random()*COLORS.length)],ph:Math.random()*6.28});
}
addEventListener('resize',resize); resize();

function burst(x,y,color,n=60){
  let rgb='255,255,255';
  if(color){ const t=document.createElement('canvas').getContext('2d'); t.fillStyle=color.trim(); const h=t.fillStyle; if(h[0]==='#'){ rgb=[1,3,5].map(i=>parseInt(h.substr(i,2),16)).join(','); } }
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, s=Math.random()*7+1.5;
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:Math.random()*.015+.01,r:Math.random()*2.6+.8,c:Math.random()<.3?'255,255,255':rgb});
  }
  rings.push({x,y,r:6,a:1,c:rgb});
}
const rings=[];
addEventListener('pointerdown',e=>{ if(!e.target.closest('.card') && !e.target.closest('#warp-overlay')) burst(e.clientX,e.clientY,null,45); });

let trailT=0;
addEventListener('mousemove',e=>{
  if(performance.now()-trailT<28) return; trailT=performance.now();
  const c=COLORS[Math.floor(Math.random()*4)];
  sparks.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*1.4,vy:(Math.random()-.5)*1.4+.3,life:1,decay:.03,r:Math.random()*2+.6,c});
});

function spawnStar(){
  const fromTop=Math.random()<.5;
  stars.push({x:Math.random()*W*1.1,y:-20,vx:-(Math.random()*6+7),vy:Math.random()*4+5,life:1,c:COLORS[Math.floor(Math.random()*4)]});
}
setInterval(()=>{ if(document.hidden) return; if(Math.random()<.65) spawnStar(); },1600);

let tm=0;
function draw(){
  tm+=.01;
  cx.clearRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  const sy=scrollY;
  // particles
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    const dx=mx-p.x, dy=my-p.y, d2=dx*dx+dy*dy;
    if(d2<22000){ const d=Math.sqrt(d2)||1, f=(1-d/148)*.6; p.vx-=dx/d*f*.35; p.vy-=dy/d*f*.35; }
    p.vx+=Math.sin(tm+p.ph)*.004; p.vy+=Math.cos(tm*.9+p.ph)*.004;
    p.vx*=.992; p.vy*=.992;
    p.x+=p.vx; p.y+=p.vy - sy*0; 
    if(p.x<-10)p.x=W+10; if(p.x>W+10)p.x=-10; if(p.y<-10)p.y=H+10; if(p.y>H+10)p.y=-10;
    const tw=.55+Math.sin(tm*3+p.ph)*.35;
    cx.beginPath(); cx.fillStyle=`rgba(${p.c},${tw})`; cx.arc(p.x,p.y,p.r,0,6.283); cx.fill();
    cx.beginPath(); cx.fillStyle=`rgba(${p.c},${tw*.12})`; cx.arc(p.x,p.y,p.r*5,0,6.283); cx.fill();
    for(let j=i+1;j<parts.length;j++){
      const q=parts[j], ax=p.x-q.x, ay=p.y-q.y, dd=ax*ax+ay*ay;
      if(dd<14400){ const o=(1-Math.sqrt(dd)/120)*.28; cx.strokeStyle=`rgba(${p.c},${o})`; cx.lineWidth=.7; cx.beginPath(); cx.moveTo(p.x,p.y); cx.lineTo(q.x,q.y); cx.stroke(); }
    }
    // mouse links
    if(d2<32000){ const o=(1-Math.sqrt(d2)/179)*.5; cx.strokeStyle=`rgba(${p.c},${o})`; cx.lineWidth=.9; cx.beginPath(); cx.moveTo(p.x,p.y); cx.lineTo(mx,my); cx.stroke(); }
  }
  // sparks
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.x+=s.vx; s.y+=s.vy; s.vx*=.965; s.vy=s.vy*.965+.05; s.life-=s.decay;
    if(s.life<=0){ sparks.splice(i,1); continue; }
    cx.beginPath(); cx.fillStyle=`rgba(${s.c},${s.life})`; cx.arc(s.x,s.y,s.r*s.life+.3,0,6.283); cx.fill();
    cx.beginPath(); cx.fillStyle=`rgba(${s.c},${s.life*.18})`; cx.arc(s.x,s.y,s.r*6*s.life,0,6.283); cx.fill();
  }
  // rings
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i]; r.r+=7; r.a-=.025; if(r.a<=0){ rings.splice(i,1); continue; }
    cx.strokeStyle=`rgba(${r.c},${r.a})`; cx.lineWidth=3*r.a+.5; cx.beginPath(); cx.arc(r.x,r.y,r.r,0,6.283); cx.stroke();
  }
  // shooting stars
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i]; s.x+=s.vx; s.y+=s.vy; s.life-=.006;
    if(s.life<=0||s.y>H+50||s.x<-100){ stars.splice(i,1); continue; }
    const g=cx.createLinearGradient(s.x,s.y,s.x-s.vx*14,s.y-s.vy*14);
    g.addColorStop(0,`rgba(${s.c},${s.life})`); g.addColorStop(1,`rgba(${s.c},0)`);
    cx.strokeStyle=g; cx.lineWidth=2; cx.beginPath(); cx.moveTo(s.x,s.y); cx.lineTo(s.x-s.vx*14,s.y-s.vy*14); cx.stroke();
    cx.beginPath(); cx.fillStyle=`rgba(255,255,255,${s.life})`; cx.arc(s.x,s.y,2,0,6.283); cx.fill();
  }
  cx.globalCompositeOperation='source-over';
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
