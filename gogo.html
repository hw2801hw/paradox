<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>WebGo - Pokémon Catch</title>
    
    <!-- Tailwind CSS (No Build Tool required) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    
    <style>
        /* 全局基礎設定：確保所有字體 >= 16px */
        :root {
            font-size: 16px;
        }
        body {
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none; /* 防止意外選取文字影響遊戲體驗 */
            -webkit-user-select: none;
        }

        /* 隱藏視圖的輔助 class */
        .hidden-view {
            display: none !important;
        }

        /* 地圖容器設定 */
        #map {
            width: 100%;
            height: calc(100dvh - 4rem); /* 減去底部導航欄的高度 */
            z-index: 10;
            background-color: #0f172a;
        }

        /* 將預設的 OpenStreetMap 轉換為深色模式 */
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        /* 遊戲地圖圖示樣式 */
        .player-marker {
            font-size: 28px;
            text-align: center;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 1));
            z-index: 1000 !important;
        }
        .monster-marker {
            font-size: 36px;
            text-align: center;
            line-height: 1;
            transition: transform 0.2s;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        .stop-marker {
            font-size: 36px;
            text-align: center;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
            animation: pulse-glow 2s infinite;
        }

        /* 動畫效果 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.6)); }
            50% { filter: drop-shadow(0 0 15px rgba(56, 189, 248, 1)); }
        }

        /* AR 相機背景 */
        #ar-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* 玻璃擬物化面板 */
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* 隱藏滾動條但允許滾動 */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] overflow-hidden text-base">

    <!-- 載入畫面 -->
    <div id="loading-screen" class="absolute inset-0 z-[100] bg-slate-900 flex flex-col items-center justify-center p-6 text-center">
        <div class="text-7xl animate-spin mb-8">🌍</div>
        <h1 class="text-4xl font-extrabold mb-4 text-blue-400 tracking-wider">WebGo</h1>
        <p id="loading-text" class="text-slate-300 text-lg mb-8">正在連接 GPS 衛星定位...</p>
        <button id="btn-mock-start" class="hidden-view px-8 py-4 bg-blue-600 hover:bg-blue-500 rounded-full font-bold text-xl shadow-[0_0_15px_rgba(37,99,235,0.6)] transition-all">
            使用模擬位置開始遊戲
        </button>
    </div>

    <!-- 頂部玩家資訊 HUD -->
    <div id="top-hud" class="absolute top-0 left-0 right-0 z-40 p-4 glass-panel flex justify-between items-center rounded-b-3xl mx-2 mt-2 hidden-view shadow-lg">
        <div class="flex items-center gap-4">
            <!-- 等級徽章 -->
            <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-blue-700 rounded-full flex items-center justify-center text-2xl font-black border-4 border-blue-300 shadow-inner">
                <span id="hud-level">1</span>
            </div>
            <div>
                <div class="font-bold text-xl tracking-wide">訓練家</div>
                <!-- 經驗條 -->
                <div class="w-28 h-4 bg-slate-800 rounded-full mt-1 overflow-hidden border border-slate-600">
                    <div id="hud-exp-bar" class="h-full bg-gradient-to-r from-yellow-400 to-yellow-300 w-0 transition-all duration-500"></div>
                </div>
            </div>
        </div>
        <!-- 金幣 -->
        <div class="flex items-center gap-2 bg-slate-800/80 px-4 py-2 rounded-full border border-yellow-500/30">
            <span class="text-xl">🪙</span>
            <span id="hud-coins" class="font-bold text-xl text-yellow-400">0</span>
        </div>
    </div>

    <!-- 主要視圖容器 -->
    <div id="views-container" class="flex-1 relative w-full h-full">
        
        <!-- 視圖 1: 地圖 -->
        <div id="view-map" class="absolute inset-0">
            <div id="map"></div>
        </div>

        <!-- 視圖 2: 寶可夢圖鑑 -->
        <div id="view-pokedex" class="absolute inset-0 bg-slate-900 overflow-y-auto p-4 hidden-view pb-24">
            <h2 class="text-3xl font-black mb-6 mt-20 text-center text-blue-400 tracking-widest">圖鑑</h2>
            <div id="pokedex-list" class="grid grid-cols-3 gap-4">
                <!-- 動態生成 -->
            </div>
        </div>

        <!-- 視圖 3: 背包 -->
        <div id="view-bag" class="absolute inset-0 bg-slate-900 overflow-y-auto p-4 hidden-view pb-24">
            <h2 class="text-3xl font-black mb-6 mt-20 text-center text-green-400 tracking-widest">背包</h2>
            <div id="bag-list" class="flex flex-col gap-4">
                <!-- 動態生成 -->
            </div>
        </div>

        <!-- 視圖 4: 設定 -->
        <div id="view-settings" class="absolute inset-0 bg-slate-900 overflow-y-auto p-4 hidden-view pb-24">
            <h2 class="text-3xl font-black mb-6 mt-20 text-center text-gray-300 tracking-widest">設定</h2>
            <div class="flex flex-col gap-6">
                <label class="glass-panel p-5 rounded-2xl flex justify-between items-center cursor-pointer">
                    <span class="text-xl font-bold">啟用模擬位置 (點擊地圖移動)</span>
                    <input type="checkbox" id="setting-mock" class="w-8 h-8 accent-blue-500">
                </label>
                <label class="glass-panel p-5 rounded-2xl flex justify-between items-center cursor-pointer">
                    <span class="text-xl font-bold">開啟 AR 相機模式</span>
                    <input type="checkbox" id="setting-ar" class="w-8 h-8 accent-blue-500">
                </label>
                <button id="btn-reset" class="mt-8 bg-red-600 hover:bg-red-500 text-white p-5 rounded-2xl font-bold text-xl shadow-lg transition-colors">
                    重置所有遊戲資料
                </button>
                <div class="text-center text-slate-500 text-base mt-4">
                    開發者提示: 若未開啟 GPS 將自動進入模擬模式。
                </div>
            </div>
        </div>
    </div>

    <!-- 底部導航欄 -->
    <nav id="bottom-nav" class="h-16 glass-panel fixed bottom-0 w-full z-40 flex justify-around items-center hidden-view border-t border-slate-700/50 pb-safe">
        <button class="nav-btn flex flex-col items-center justify-center w-1/4 h-full text-blue-400 transition-colors" data-target="view-map">
            <span class="text-2xl mb-1">🗺️</span>
            <span class="text-base font-bold leading-none">地圖</span>
        </button>
        <button class="nav-btn flex flex-col items-center justify-center w-1/4 h-full text-slate-400 transition-colors" data-target="view-pokedex">
            <span class="text-2xl mb-1">📖</span>
            <span class="text-base font-bold leading-none">圖鑑</span>
        </button>
        <button class="nav-btn flex flex-col items-center justify-center w-1/4 h-full text-slate-400 transition-colors" data-target="view-bag">
            <span class="text-2xl mb-1">🎒</span>
            <span class="text-base font-bold leading-none">背包</span>
        </button>
        <button class="nav-btn flex flex-col items-center justify-center w-1/4 h-full text-slate-400 transition-colors" data-target="view-settings">
            <span class="text-2xl mb-1">⚙️</span>
            <span class="text-base font-bold leading-none">設定</span>
        </button>
    </nav>

    <!-- 捕捉畫面 (覆蓋層) -->
    <div id="capture-screen" class="fixed inset-0 z-50 bg-slate-900 hidden-view flex flex-col items-center justify-between py-12 transition-colors duration-300">
        <!-- AR 背景 -->
        <video id="ar-video" autoplay playsinline class="hidden"></video>
        
        <!-- 頂部資訊區 -->
        <div class="w-full px-6 flex justify-between items-start z-10">
            <button id="btn-run" class="glass-panel px-6 py-3 rounded-full text-lg font-bold flex items-center gap-2 active:scale-95 transition-transform">
                <span>🏃</span> 逃跑
            </button>
            <div class="glass-panel px-5 py-3 rounded-2xl flex flex-col items-end gap-1 min-w-[120px]">
                <div class="text-base font-bold text-slate-300">HP</div>
                <div class="w-32 h-4 bg-slate-800 rounded-full overflow-hidden border border-slate-600">
                    <div id="capture-hp" class="h-full bg-green-500 w-full transition-all duration-300"></div>
                </div>
            </div>
        </div>

        <!-- 怪物顯示區 -->
        <div id="capture-monster" class="text-[120px] animate-bounce z-10 filter drop-shadow-[0_10px_20px_rgba(0,0,0,0.6)]">
            <!-- Emoji -->
        </div>

        <!-- 底部操作區 -->
        <div class="z-10 flex flex-col items-center gap-6 w-full px-6">
            <div id="capture-msg" class="glass-panel px-6 py-4 rounded-2xl text-xl font-bold text-center w-full min-h-[4rem] flex items-center justify-center shadow-lg">
                野生寶可夢出現了！
            </div>
            
            <button id="btn-throw" class="w-28 h-28 bg-red-500 rounded-full border-4 border-white flex items-center justify-center shadow-[0_0_25px_rgba(239,68,68,0.8)] active:-translate-y-6 active:scale-90 transition-all duration-300 relative overflow-hidden group">
                <div class="absolute w-full h-1/2 bg-white top-1/2 border-t-4 border-slate-800"></div>
                <div class="absolute w-10 h-10 bg-white border-4 border-slate-800 rounded-full z-10 group-active:bg-red-100 transition-colors"></div>
            </button>
            
            <div class="glass-panel px-6 py-2 rounded-full text-lg font-bold flex items-center gap-2 shadow-md">
                <span>精靈球:</span>
                <span id="capture-balls" class="text-blue-400 text-xl">0</span>
            </div>
        </div>
    </div>

    <!-- 補給站畫面 (覆蓋層) -->
    <div id="stop-screen" class="fixed inset-0 z-50 bg-slate-900/95 backdrop-blur-xl hidden-view flex flex-col items-center justify-center p-6">
        <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-8 flex flex-col items-center text-center shadow-2xl border-blue-500/30 border-2">
            <div class="text-[80px] mb-6 animate-pulse filter drop-shadow-[0_0_15px_rgba(59,130,246,0.8)]">🧊</div>
            <h2 id="stop-name" class="text-3xl font-black mb-3 text-blue-400 tracking-wide">補給站</h2>
            <p id="stop-status" class="text-xl text-slate-300 mb-10 min-h-[3rem] flex items-center justify-center">旋轉來獲得道具！</p>
            
            <button id="btn-spin" class="w-40 h-40 bg-gradient-to-br from-blue-400 to-blue-600 rounded-full border-8 border-slate-800 flex items-center justify-center text-3xl font-black text-white shadow-[0_0_40px_rgba(59,130,246,0.6)] active:scale-95 transition-all duration-700 ease-in-out mb-8">
                SPIN
            </button>
            
            <button id="btn-close-stop" class="px-10 py-4 bg-slate-700 hover:bg-slate-600 rounded-full text-xl font-bold shadow-lg transition-colors w-full">
                離開
            </button>
        </div>
    </div>

    <!-- 提示吐司 (Toast) -->
    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 z-[100] glass-panel px-8 py-4 rounded-full text-lg font-bold transition-all duration-300 opacity-0 pointer-events-none shadow-xl border-blue-400/50 translate-y-[-20px]">
        提示訊息
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- 遊戲主要邏輯 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 遊戲資料定義 ---
            const ITEMS = {
                'pokeball': { name: '精靈球', emoji: '🔴', desc: '用於捕捉野生寶可夢的裝置。' },
                'potion':   { name: '傷藥',   emoji: '🧪', desc: '噴霧式傷藥，可恢復 HP。' }
            };
            
            // 隨機寶可夢圖鑑 (加入機率與基礎設定)
            const POKEMONS = [
                { id: 1,   name: '妙蛙種子', emoji: '🌿', rate: 0.6 },
                { id: 4,   name: '小火龍',   emoji: '🔥', rate: 0.6 },
                { id: 7,   name: '傑尼龜',   emoji: '💧', rate: 0.6 },
                { id: 10,  name: '綠毛蟲',   emoji: '🐛', rate: 0.9 },
                { id: 16,  name: '波波',     emoji: '🐦', rate: 0.8 },
                { id: 25,  name: '皮卡丘',   emoji: '⚡', rate: 0.4 },
                { id: 39,  name: '胖丁',     emoji: '🎤', rate: 0.5 },
                { id: 52,  name: '喵喵',     emoji: '🐱', rate: 0.5 },
                { id: 54,  name: '可達鴨',   emoji: '🦆', rate: 0.5 },
                { id: 79,  name: '呆呆獸',   emoji: '🦥', rate: 0.6 },
                { id: 129, name: '鯉魚王',   emoji: '🐟', rate: 0.9 },
                { id: 133, name: '伊布',     emoji: '🦊', rate: 0.5 },
                { id: 143, name: '卡比獸',   emoji: '🐻', rate: 0.2 },
                { id: 149, name: '快龍',     emoji: '🐉', rate: 0.1 },
                { id: 150, name: '超夢',     emoji: '👽', rate: 0.05 },
            ];

            // 預設玩家狀態
            let player = {
                lat: 25.033964, // 預設: 台北101 (供模擬用)
                lng: 121.564468,
                level: 1,
                exp: 0,
                coins: 0,
                bag: { 'pokeball': 30, 'potion': 5 },
                caught: []
            };

            // 全局變數
            let map = null;
            let playerMarker = null;
            let monsterMarkers = {};
            let stopMarkers = {};
            let activeMonsters = [];
            let activeStops = [];
            
            let useMock = false;
            let watchId = null;
            
            // --- UI 元素參考 ---
            const els = {
                loading: document.getElementById('loading-screen'),
                loadingText: document.getElementById('loading-text'),
                btnMockStart: document.getElementById('btn-mock-start'),
                hud: document.getElementById('top-hud'),
                nav: document.getElementById('bottom-nav'),
                toast: document.getElementById('toast'),
                
                // 視圖
                views: {
                    map: document.getElementById('view-map'),
                    pokedex: document.getElementById('view-pokedex'),
                    bag: document.getElementById('view-bag'),
                    settings: document.getElementById('view-settings')
                },
                
                // 設定
                settingMock: document.getElementById('setting-mock'),
                settingAr: document.getElementById('setting-ar')
            };

            // --- 基礎工具函數 ---
            function showToast(msg) {
                els.toast.innerText = msg;
                els.toast.style.opacity = '1';
                els.toast.style.transform = 'translate(-50%, 0)';
                setTimeout(() => {
                    els.toast.style.opacity = '0';
                    els.toast.style.transform = 'translate(-50%, -20px)';
                }, 2500);
            }

            function updateHUD() {
                document.getElementById('hud-level').innerText = player.level;
                document.getElementById('hud-coins').innerText = player.coins;
                
                let requiredExp = player.level * 100;
                let pct = Math.min((player.exp / requiredExp) * 100, 100);
                document.getElementById('hud-exp-bar').style.width = `${pct}%`;
            }

            function checkLevelUp() {
                let requiredExp = player.level * 100;
                if(player.exp >= requiredExp) {
                    player.level++;
                    player.exp -= requiredExp;
                    showToast(`🎉 升級了！目前等級：${player.level}`);
                    // 升級獎勵
                    player.bag['pokeball'] = (player.bag['pokeball'] || 0) + 10;
                }
            }

            // --- 導航列切換邏輯 ---
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    let targetBtn = e.currentTarget;
                    let targetId = targetBtn.dataset.target; // e.g., "view-map"
                    let viewKey = targetId.split('-')[1]; // "map"
                    
                    // 隱藏所有視圖
                    Object.values(els.views).forEach(v => v.classList.add('hidden-view'));
                    // 顯示目標視圖
                    els.views[viewKey].classList.remove('hidden-view');
                    
                    // 更新按鈕樣式
                    document.querySelectorAll('.nav-btn').forEach(b => {
                        b.classList.remove('text-blue-400');
                        b.classList.add('text-slate-400');
                    });
                    targetBtn.classList.remove('text-slate-400');
                    targetBtn.classList.add('text-blue-400');
                    
                    // 觸發特定視圖渲染
                    if(viewKey === 'pokedex') renderPokedex();
                    if(viewKey === 'bag') renderBag();
                    if(viewKey === 'map' && map) map.invalidateSize(); // 確保地圖重新計算大小
                });
            });

            // --- 渲染圖鑑與背包 ---
            function renderPokedex() {
                let list = document.getElementById('pokedex-list');
                list.innerHTML = '';
                
                // 統計玩家擁有的寶可夢數量
                let counts = {};
                player.caught.forEach(c => {
                    counts[c.id] = (counts[c.id] || 0) + 1;
                });

                POKEMONS.forEach(p => {
                    let amount = counts[p.id] || 0;
                    let isDiscovered = amount > 0;
                    
                    let card = document.createElement('div');
                    card.className = `glass-panel rounded-2xl p-4 flex flex-col items-center text-center transition-all ${isDiscovered ? 'shadow-md border-blue-500/30' : 'opacity-40 grayscale border-transparent'}`;
                    
                    card.innerHTML = `
                        <div class="text-[50px] mb-3 leading-none">${isDiscovered ? p.emoji : '❓'}</div>
                        <div class="text-lg font-bold text-slate-100">${isDiscovered ? p.name : '未知'}</div>
                        <div class="text-base font-medium text-slate-400 mt-1 bg-slate-800 px-3 py-1 rounded-full">擁有: ${amount}</div>
                    `;
                    list.appendChild(card);
                });
            }

            function renderBag() {
                let list = document.getElementById('bag-list');
                list.innerHTML = '';
                
                Object.keys(ITEMS).forEach(key => {
                    let amount = player.bag[key] || 0;
                    let item = ITEMS[key];
                    
                    let row = document.createElement('div');
                    row.className = 'glass-panel p-5 rounded-2xl flex items-center justify-between shadow-md';
                    row.innerHTML = `
                        <div class="flex items-center gap-5">
                            <div class="text-5xl drop-shadow-md">${item.emoji}</div>
                            <div class="flex flex-col">
                                <span class="text-xl font-bold text-slate-100">${item.name}</span>
                                <span class="text-base text-slate-400 mt-1">${item.desc}</span>
                            </div>
                        </div>
                        <div class="text-2xl font-black bg-slate-800 text-blue-400 px-5 py-3 rounded-full border border-slate-600 shadow-inner">
                            x${amount}
                        </div>
                    `;
                    list.appendChild(row);
                });
            }

            // --- 遊戲初始化與定位 ---
            function initGame() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            player.lat = pos.coords.latitude;
                            player.lng = pos.coords.longitude;
                            startGame();
                            watchId = navigator.geolocation.watchPosition(updatePosition, (err) => {
                                console.warn('GPS 追蹤失敗', err);
                            }, { enableHighAccuracy: true, maximumAge: 10000 });
                        },
                        (err) => {
                            console.warn("GPS 定位失敗或被拒絕", err);
                            handleGPSFail("無法取得 GPS 位置，使用模擬器開始...");
                        },
                        { timeout: 5000, enableHighAccuracy: false }
                    );
                } else {
                    handleGPSFail("瀏覽器不支援 GPS，使用模擬器開始...");
                }
            }

            function handleGPSFail(msg) {
                els.loadingText.innerText = msg;
                setTimeout(() => {
                    useMock = true;
                    els.settingMock.checked = true;
                    startGame();
                }, 1500);
            }

            els.btnMockStart.addEventListener('click', () => {
                useMock = true;
                els.settingMock.checked = true;
                startGame();
            });

            function startGame() {
                els.loading.classList.add('hidden-view');
                els.hud.classList.remove('hidden-view');
                els.nav.classList.remove('hidden-view');
                
                generateWorld();
                initMap();
                updateHUD();
                
                if(useMock) {
                    showToast('已開啟模擬模式：點擊地圖任意處移動');
                    map.on('click', onMapClickMock);
                }
            }

            function updatePosition(pos) {
                if(useMock) return; // 模擬模式不更新真實 GPS
                player.lat = pos.coords.latitude;
                player.lng = pos.coords.longitude;
                if(playerMarker && map) {
                    playerMarker.setLatLng([player.lat, player.lng]);
                    map.panTo([player.lat, player.lng], {animate: true});
                }
            }

            // 模擬模式點擊移動
            function onMapClickMock(e) {
                if(!useMock) return;
                player.lat = e.latlng.lat;
                player.lng = e.latlng.lng;
                if(playerMarker) {
                    playerMarker.setLatLng([player.lat, player.lng]);
                    map.panTo([player.lat, player.lng], {animate: true});
                }
            }

            els.settingMock.addEventListener('change', (e) => {
                useMock = e.target.checked;
                if(useMock) {
                    map.on('click', onMapClickMock);
                    showToast('模擬模式已開啟：點擊地圖移動');
                } else {
                    map.off('click', onMapClickMock);
                    showToast('模擬模式已關閉，切換為真實 GPS');
                }
            });

            // --- 生成遊戲世界 ---
            function generateWorld() {
                const RADIUS = 0.015; // 大約 1.5 公里範圍
                activeMonsters = [];
                activeStops = [];

                // 生成 50 隻寶可夢
                for(let i=0; i<50; i++) {
                    // 根據機率隨機選擇（這裡簡單隨機）
                    let tpl = POKEMONS[Math.floor(Math.random() * POKEMONS.length)];
                    activeMonsters.push({
                        uid: 'm_' + i,
                        ...tpl,
                        lat: player.lat + (Math.random() - 0.5) * RADIUS,
                        lng: player.lng + (Math.random() - 0.5) * RADIUS,
                        hp: 100
                    });
                }
                
                // 生成 20 個補給站
                for(let i=0; i<20; i++) {
                    activeStops.push({
                        uid: 's_' + i,
                        lat: player.lat + (Math.random() - 0.5) * RADIUS,
                        lng: player.lng + (Math.random() - 0.5) * RADIUS,
                        name: '區域補給站 ' + (i+1),
                        cooldown: 0
                    });
                }
            }

            // --- 地圖初始化與渲染 ---
            function initMap() {
                // 初始化 Leaflet 地圖，隱藏縮放控制（自定義 UI）
                map = L.map('map', { zoomControl: false }).setView([player.lat, player.lng], 16);
                
                // 加入 OpenStreetMap 圖層
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                // 建立玩家標記
                let playerIcon = L.divIcon({
                    className: 'player-marker',
                    html: '🚶‍♂️',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18] // 中心點
                });
                playerMarker = L.marker([player.lat, player.lng], {icon: playerIcon}).addTo(map);

                renderWorldMarkers();
            }

            function renderWorldMarkers() {
                // 清除舊標記
                Object.values(monsterMarkers).forEach(m => map.removeLayer(m));
                Object.values(stopMarkers).forEach(m => map.removeLayer(m));
                monsterMarkers = {};
                stopMarkers = {};

                // 加入怪物標記
                activeMonsters.forEach(m => {
                    let icon = L.divIcon({ className: 'monster-marker', html: m.emoji, iconSize: [48, 48], iconAnchor: [24, 24] });
                    let marker = L.marker([m.lat, m.lng], {icon: icon}).addTo(map);
                    marker.on('click', () => openCaptureScreen(m));
                    monsterMarkers[m.uid] = marker;
                });

                // 加入補給站標記
                activeStops.forEach(s => {
                    let icon = L.divIcon({ className: 'stop-marker', html: '🧊', iconSize: [48, 48], iconAnchor: [24, 24] });
                    let marker = L.marker([s.lat, s.lng], {icon: icon}).addTo(map);
                    marker.on('click', () => openStopScreen(s));
                    stopMarkers[s.uid] = marker;
                });
            }

            // --- 捕捉小遊戲邏輯 ---
            let currentMonster = null;
            let captureScreen = document.getElementById('capture-screen');
            let arVideo = document.getElementById('ar-video');
            let arStream = null;

            function openCaptureScreen(monster) {
                // 距離檢查 (這裡可選，目前為簡化直接允許捕捉)
                currentMonster = monster;
                
                // 重置 UI
                document.getElementById('capture-monster').innerText = monster.emoji;
                document.getElementById('capture-hp').style.width = '100%';
                document.getElementById('capture-hp').className = 'h-full bg-green-500 w-full transition-all duration-300';
                document.getElementById('capture-msg').innerText = `野生 ${monster.name} 出現了！`;
                document.getElementById('capture-balls').innerText = player.bag['pokeball'] || 0;
                document.getElementById('btn-throw').disabled = false;
                
                // 顯示畫面
                captureScreen.classList.remove('hidden-view');
                
                // 啟動 AR
                if(els.settingAr.checked) {
                    startAR();
                }
            }

            document.getElementById('btn-run').addEventListener('click', closeCaptureScreen);

            function closeCaptureScreen() {
                captureScreen.classList.add('hidden-view');
                currentMonster = null;
                stopAR();
            }

            // 丟球邏輯
            document.getElementById('btn-throw').addEventListener('click', function() {
                if(!currentMonster || this.disabled) return;
                
                let ballsCount = player.bag['pokeball'] || 0;
                if(ballsCount <= 0) {
                    showToast("精靈球用光了！請去補給站收集。");
                    return;
                }

                // 鎖定按鈕防止連點
                this.disabled = true;
                
                // 消耗精靈球
                player.bag['pokeball']--;
                document.getElementById('capture-balls').innerText = player.bag['pokeball'];
                
                let msgEl = document.getElementById('capture-msg');
                msgEl.innerText = "投擲精靈球...";
                
                // 模擬捕捉延遲動畫
                setTimeout(() => {
                    let roll = Math.random();
                    // 根據寶可夢自身的捕捉率計算
                    if (roll < currentMonster.rate) {
                        // 捕捉成功
                        msgEl.innerText = `太棒了！成功捕捉 ${currentMonster.name}！`;
                        document.getElementById('capture-monster').innerText = '🔴'; // 變成球
                        document.getElementById('capture-monster').classList.remove('animate-bounce');
                        
                        // 給予獎勵
                        player.caught.push({ id: currentMonster.id, name: currentMonster.name, emoji: currentMonster.emoji, time: Date.now() });
                        player.exp += 50;
                        player.coins += 20;
                        
                        checkLevelUp();
                        updateHUD();
                        showToast(`獲得 50 EXP`);
                        
                        // 從地圖移除
                        if(monsterMarkers[currentMonster.uid]) {
                            map.removeLayer(monsterMarkers[currentMonster.uid]);
                            delete monsterMarkers[currentMonster.uid];
                        }
                        activeMonsters = activeMonsters.filter(m => m.uid !== currentMonster.uid);
                        
                        setTimeout(closeCaptureScreen, 2500);
                    } else {
                        // 捕捉失敗
                        currentMonster.hp -= 34; // 扣血
                        let hpPct = Math.max(0, currentMonster.hp);
                        let hpBar = document.getElementById('capture-hp');
                        hpBar.style.width = `${hpPct}%`;
                        
                        if(hpPct < 50) hpBar.className = 'h-full bg-yellow-500 w-full transition-all duration-300';
                        if(hpPct < 25) hpBar.className = 'h-full bg-red-500 w-full transition-all duration-300';
                        
                        if (currentMonster.hp <= 0 || Math.random() < 0.15) { // 有機率逃跑
                            msgEl.innerText = `${currentMonster.name} 逃跑了！💨`;
                            if(monsterMarkers[currentMonster.uid]) {
                                map.removeLayer(monsterMarkers[currentMonster.uid]);
                                delete monsterMarkers[currentMonster.uid];
                            }
                            activeMonsters = activeMonsters.filter(m => m.uid !== currentMonster.uid);
                            setTimeout(closeCaptureScreen, 2000);
                        } else {
                            msgEl.innerText = "噢不！被掙脫了！再試一次！";
                            this.disabled = false; // 恢復按鈕
                        }
                    }
                }, 1500);
            });

            // --- 補給站互動邏輯 ---
            let currentStop = null;
            let stopScreen = document.getElementById('stop-screen');

            function openStopScreen(stop) {
                currentStop = stop;
                let now = Date.now();
                document.getElementById('stop-name').innerText = stop.name;
                
                let btnSpin = document.getElementById('btn-spin');
                let statusEl = document.getElementById('stop-status');

                if (stop.cooldown > now) {
                    let left = Math.ceil((stop.cooldown - now) / 1000);
                    statusEl.innerText = `補給站冷卻中...\n需等待 ${left} 秒`;
                    btnSpin.style.filter = 'grayscale(100%)';
                    btnSpin.disabled = true;
                } else {
                    statusEl.innerText = "滑動/點擊下方按鈕\n來獲得道具！";
                    btnSpin.style.filter = 'none';
                    btnSpin.disabled = false;
                }
                stopScreen.classList.remove('hidden-view');
            }

            document.getElementById('btn-close-stop').addEventListener('click', () => {
                stopScreen.classList.add('hidden-view');
                currentStop = null;
            });

            document.getElementById('btn-spin').addEventListener('click', function() {
                if(this.disabled || !currentStop) return;
                
                // 旋轉動畫
                this.style.transform = `rotate(1080deg)`;
                this.disabled = true;
                
                setTimeout(() => {
                    this.style.transform = `rotate(0deg)`; // 重置角度 (無感重置)
                    
                    // 隨機獲得道具
                    let getBalls = Math.floor(Math.random() * 4) + 2; // 2-5 顆球
                    let getPotions = Math.floor(Math.random() * 2);   // 0-1 傷藥
                    
                    player.bag['pokeball'] = (player.bag['pokeball'] || 0) + getBalls;
                    if(getPotions > 0) {
                        player.bag['potion'] = (player.bag['potion'] || 0) + getPotions;
                    }
                    
                    player.exp += 15;
                    checkLevelUp();
                    updateHUD();
                    
                    let msg = `獲得了道具：\n🟢 ${getBalls}x 精靈球`;
                    if(getPotions) msg += `\n🧪 ${getPotions}x 傷藥`;
                    
                    document.getElementById('stop-status').innerText = msg;
                    
                    // 設定冷卻時間 2 分鐘 (120000 ms)
                    currentStop.cooldown = Date.now() + 120000;
                    this.style.filter = 'grayscale(100%)';
                    
                    // 更新地圖標示為冷卻中 (變成紫色)
                    let markerIcon = stopMarkers[currentStop.uid].getElement();
                    if(markerIcon) markerIcon.style.filter = 'hue-rotate(90deg) drop-shadow(0 0 10px rgba(168, 85, 247, 0.8))';
                    
                }, 700); // 動畫時間配合 CSS transition
            });

            // --- AR 相機邏輯 ---
            async function startAR() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showToast("瀏覽器不支援相機存取");
                    els.settingAr.checked = false;
                    return;
                }
                try {
                    arStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' } 
                    });
                    arVideo.srcObject = arStream;
                    arVideo.classList.remove('hidden');
                    // 將捕捉畫面背景設為透明以顯示下方影片
                    captureScreen.style.backgroundColor = 'transparent';
                } catch (e) {
                    console.log("AR Camera error:", e);
                    showToast("無法開啟相機權限");
                    els.settingAr.checked = false;
                }
            }

            function stopAR() {
                if (arStream) {
                    arStream.getTracks().forEach(track => track.stop());
                    arStream = null;
                }
                arVideo.classList.add('hidden');
                // 恢復原背景色
                captureScreen.style.backgroundColor = ''; 
            }

            els.settingAr.addEventListener('change', (e) => {
                if(e.target.checked) {
                    showToast('AR 模式已準備，下次捕捉時將開啟相機');
                } else {
                    stopAR();
                }
            });

            // --- 重置遊戲 ---
            document.getElementById('btn-reset').addEventListener('click', () => {
                if(confirm('確定要清除所有遊戲資料並重新開始嗎？所有進度將會遺失！')) {
                    location.reload(); // 簡單的重新載入即可重置 (因為狀態在記憶體中)
                }
            });

            // --- 啟動遊戲 ---
            // 延遲一小段時間模擬載入體驗並請求權限
            setTimeout(initGame, 1000);

        });
    </script>
</body>
</html>
