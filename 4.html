    // ==========================================
    // 物理與碰撞
    // ==========================================
    function updatePhysics() {
        const allUnits = [...playerUnits, ...enemyUnits].filter(u => u.alive);
        let anyMoving = false;
        
        // 更新箭矢
        arrows = arrows.filter(arrow => {
            arrow.x += arrow.vx;
            arrow.y += arrow.vy;
            
            // 邊界反彈
            let bounced = false;
            if (arrow.x < 10) {
                arrow.x = 10;
                arrow.vx *= -1;
                bounced = true;
            }
            if (arrow.x > GAME_WIDTH - 10) {
                arrow.x = GAME_WIDTH - 10;
                arrow.vx *= -1;
                bounced = true;
            }
            if (arrow.y < ARENA_TOP + 10) {
                arrow.y = ARENA_TOP + 10;
                arrow.vy *= -1;
                bounced = true;
            }
            if (arrow.y > ARENA_BOTTOM - 10) {
                arrow.y = ARENA_BOTTOM - 10;
                arrow.vy *= -1;
                bounced = true;
            }
            
            if (bounced) {
                arrow.bounces++;
                if (arrow.bounces > arrow.maxBounces) {
                    return false; // 移除箭矢
                }
            }
            
            // 檢查是否擊中敵人
            const enemies = arrow.owner.isEnemy ? playerUnits : enemyUnits;
            for (const enemy of enemies) {
                if (!enemy.alive) continue;
                const dist = distance(arrow.x, arrow.y, enemy.x, enemy.y);
                if (dist < enemy.size / 2 + 5) {
                    // 擊中敵人 - 滿血時雙倍傷害
                    let arrowDmg = arrow.damage;
                    const isFullHp = enemy.currentHp >= enemy.maxHp;
                    if (isFullHp) {
                        arrowDmg *= 2;
                        addBattleLog(`🎯 箭矢擊中滿血的 ${enemy.name}！雙倍傷害！`, "ability");
                    }
                    
                    enemy.currentHp -= arrowDmg;
                    showDamagePopup(enemy.x, enemy.y - enemy.size, arrowDmg);
                    addBattleLog(`🏹 箭矢擊中 ${enemy.name}！造成 ${arrowDmg} 傷害`, "damage");
                    
                    if (enemy.currentHp <= 0) {
                        enemy.alive = false;
                        energy++;
                        addBattleLog(`☠️ ${enemy.name} 被箭矢擊敗！`, "death");
                    }
                    
                    return false; // 移除箭矢
                }
            }
            
            anyMoving = true;
            return true;
        });
        
        // 更新折射火焰（龍騎將軍）
        refractionFlames = refractionFlames.filter(flame => {
            flame.x += flame.vx;
            flame.y += flame.vy;
            
            // 邊界反彈
            let bounced = false;
            if (flame.x < 10) {
                flame.x = 10;
                flame.vx *= -1;
                bounced = true;
            }
            if (flame.x > GAME_WIDTH - 10) {
                flame.x = GAME_WIDTH - 10;
                flame.vx *= -1;
                bounced = true;
            }
            if (flame.y < ARENA_TOP + 10) {
                flame.y = ARENA_TOP + 10;
                flame.vy *= -1;
                bounced = true;
            }
            if (flame.y > ARENA_BOTTOM - 10) {
                flame.y = ARENA_BOTTOM - 10;
                flame.vy *= -1;
                bounced = true;
            }
            
            if (bounced) {
                flame.bounces++;
                if (flame.bounces > flame.maxBounces) {
                    return false; // 移除火焰
                }
            }
            
            // 檢查是否擊中敵人（穿透所有英雄，每個只傷害一次）
            const enemies = flame.owner.isEnemy ? playerUnits : enemyUnits;
            for (const enemy of enemies) {
                if (!enemy.alive) continue;
                if (flame.hitEnemies.includes(enemy.id)) continue; // 已經擊中過
                
                const dist = distance(flame.x, flame.y, enemy.x, enemy.y);
                if (dist < enemy.size / 2 + 8) {
                    // 擊中敵人
                    flame.hitEnemies.push(enemy.id);
                    enemy.currentHp -= flame.damage;
                    showDamagePopup(enemy.x, enemy.y - enemy.size, flame.damage);
                    addBattleLog(`🔥 折射火焰擊中 ${enemy.name}！造成 ${flame.damage} 傷害`, "damage", flame.owner.isEnemy ? 'enemy' : 'player');
                    
                    if (enemy.currentHp <= 0) {
                        enemy.alive = false;
                        if (!flame.owner.isEnemy) energy++;
                        addBattleLog(`☠️ ${enemy.name} 被折射火焰擊敗！`, "death");
                    }
                    // 不return false，繼續穿透
                }
            }
            
            anyMoving = true;
            return true;
        });
        
        allUnits.forEach(unit => {
            // FIX: 移除森林斥候的強制鎖定，讓他能被撞飛
            // if (unit.isArcher) { unit.vx = 0; unit.vy = 0; }

            if (Math.abs(unit.vx) > MIN_VELOCITY || Math.abs(unit.vy) > MIN_VELOCITY) {
                anyMoving = true;
                
                unit.x += unit.vx;
                unit.y += unit.vy;
                
                unit.vx *= FRICTION;
                unit.vy *= FRICTION;
                
                // 邊界碰撞與牆壁反彈計數
                let hitWall = false;
                if (unit.x - unit.size/2 < 0) {
                    unit.x = unit.size/2;
                    unit.vx *= -BOUNCE;
                    hitWall = true;
                }
                if (unit.x + unit.size/2 > GAME_WIDTH) {
                    unit.x = GAME_WIDTH - unit.size/2;
                    unit.vx *= -BOUNCE;
                    hitWall = true;
                }
                if (unit.y - unit.size/2 < ARENA_TOP) {
                    unit.y = ARENA_TOP + unit.size/2;
                    unit.vy *= -BOUNCE;
                    hitWall = true;
                }
                if (unit.y + unit.size/2 > ARENA_BOTTOM) {
                    unit.y = ARENA_BOTTOM - unit.size/2;
                    unit.vy *= -BOUNCE;
                    hitWall = true;
                }
                
                // 宇宙龍神 Lv.2：牆壁反彈加攻擊力
                if (hitWall && unit === activeAttacker && unit.level >= 2 && unit.name === "宇宙龍神") {
                    wallBounceCount++;
                    wallBounceDamageBonus += 0.1;
                    addBattleLog(`⭐ ${unit.name} 星際反彈！攻擊力+10% (累計+${Math.floor(wallBounceDamageBonus * 100)}%)`, "ability");
                }
                
                // FIX: 光明女皇能力 - 搜尋所有女皇，不只第一隻
                if (hitWall) {
                    const empresses = [...playerUnits, ...enemyUnits].filter(u => u.alive && u.isLightEmpress);
                    empresses.forEach(empress => {
                        // 如果撞牆者已經死亡，停止處理
                        if (!unit.alive) return;

                        if (unit.isEnemy !== empress.isEnemy) {
                            // 敵方陣營碰牆扣血
                            unit.currentHp -= 5;
                            showDamagePopup(unit.x, unit.y - unit.size, 5);
                            addBattleLog(`👑 光明女皇：${unit.name} 碰牆扣 5HP！`, "damage", empress.isEnemy ? 'enemy' : 'player');
                        } else {
                            // 己方陣營碰牆補血
                            const healAmount = Math.min(unit.maxHp - unit.currentHp, 5);
                            if (healAmount > 0) {
                                unit.currentHp += healAmount;
                                showDamagePopup(unit.x, unit.y - unit.size, healAmount, true);
                                addBattleLog(`👑 光明女皇：${unit.name} 碰牆補 5HP！`, "heal", empress.isEnemy ? 'enemy' : 'player');
                            }
                        }

                        if (unit.currentHp <= 0) {
                            unit.alive = false;
                            if (!empress.isEnemy && unit.isEnemy) energy++; // 如果是被我方女皇弄死的敵人
                            addBattleLog(`☠️ ${unit.name} 被光明女皇擊敗！`, "death");
                        }
                    });
                }
                
                // 單位間碰撞
                allUnits.forEach(other => {
                    if (unit === other) return;
                    
                    const dist = distance(unit.x, unit.y, other.x, other.y);
                    const minDist = (unit.size + other.size) / 2;
                    
                    if (dist < minDist && dist > 0) {
                        handleCollision(unit, other);
                    }
                });
            } else {
                unit.vx = 0;
                unit.vy = 0;
            }
        });
        
        return anyMoving;
    }
    
    function handleCollision(unit1, unit2) {
        // FIX: 移除森林斥候的強制鎖定與物理豁免，讓他可以被物理碰撞
        // 刪除原本的 `if (unit1.isArcher || unit2.isArcher)` 區塊

        // 確定當前回合是哪一方
        const isPlayerTurnNow = activeAttacker && !activeAttacker.isEnemy;
        const isEnemyTurnNow = activeAttacker && activeAttacker.isEnemy;
        
        // 檢查是否是虛空帝皇（可穿透）
        const isPhaseUnit1 = unit1 === activeAttacker && unit1.phaseThrough;
        const isPhaseUnit2 = unit2 === activeAttacker && unit2.phaseThrough;
        
        // 檢查碰撞冷卻
        const pairKey = `${Math.min(unit1.id, unit2.id)}-${Math.max(unit1.id, unit2.id)}`;
        const now = Date.now();
        const lastCollision = collisionCooldowns.get(pairKey) || 0;
        const canDamage = (now - lastCollision) > COLLISION_COOLDOWN;
        
        // 如果攻擊者是虛空帝皇，跳過物理碰撞但仍造成傷害
        if (isPhaseUnit1 || isPhaseUnit2) {
            if (canDamage) {
                collisionCooldowns.set(pairKey, now);
                
                if (unit1.isEnemy !== unit2.isEnemy) {
                    if (isPhaseUnit1) {
                        applyDamage(unit1, unit2);
                    } else if (isPhaseUnit2) {
                        applyDamage(unit2, unit1);
                    }
                } else {
                    // 友軍碰撞也觸發效果
                    if (isPhaseUnit1) {
                        applyAllyEffect(unit1, unit2);
                    } else {
                        applyAllyEffect(unit2, unit1);
                    }
                }
            }
            return;
        }
        
        const dist = distance(unit1.x, unit1.y, unit2.x, unit2.y);
        const minDist = (unit1.size + unit2.size) / 2;
        
        const angle = Math.atan2(unit2.y - unit1.y, unit2.x - unit1.x);
        const overlap = minDist - dist;
        
        // 計算速度
        const v1 = Math.sqrt(unit1.vx * unit1.vx + unit1.vy * unit1.vy);
        const v2 = Math.sqrt(unit2.vx * unit2.vx + unit2.vy * unit2.vy);
        
        // 確定碰撞中速度較快的單位為撞擊者
        let faster = v1 > v2 ? unit1 : unit2;
        let slower = v1 > v2 ? unit2 : unit1;
        
        const fasterSpeed = Math.max(v1, v2);
        const collisionAngle = Math.atan2(slower.y - faster.y, slower.x - faster.x);
        
        // 重量比較 - 輕的不能撞飛重的
        const weightRatio = faster.weight / slower.weight;
        
        // 分離兩個單位
        if (weightRatio >= 1) {
            const pushRatio = Math.min(1, 1 / weightRatio);
            faster.x -= Math.cos(angle) * overlap * pushRatio * 0.3;
            faster.y -= Math.sin(angle) * overlap * pushRatio * 0.3;
            slower.x += Math.cos(angle) * overlap * (1 - pushRatio * 0.3);
            slower.y += Math.sin(angle) * overlap * (1 - pushRatio * 0.3);
        } else {
            faster.x -= Math.cos(angle) * overlap * 0.9;
            faster.y -= Math.sin(angle) * overlap * 0.9;
            slower.x += Math.cos(angle) * overlap * 0.1;
            slower.y += Math.sin(angle) * overlap * 0.1;
        }
        
        // 虛空行者：不會被任何英雄撞飛
        const slowerIsVoidWalker = slower.isVoidWalker;
        const fasterIsVoidWalker = faster.isVoidWalker;
        
        // 根據重量差異計算速度變化
        if (weightRatio >= 1) {
            const attackerRetain = Math.min(0.9, 0.1 + weightRatio * 0.2);
            const defenderGain = Math.min(2.0, 0.5 + weightRatio * 0.5);
            
            faster.vx *= attackerRetain * BOUNCE;
            faster.vy *= attackerRetain * BOUNCE;
            
            // 虛空行者不會被撞飛
            if (!slowerIsVoidWalker) {
                slower.vx = Math.cos(collisionAngle) * fasterSpeed * defenderGain * BOUNCE;
                slower.vy = Math.sin(collisionAngle) * fasterSpeed * defenderGain * BOUNCE;
            }
        } else {
            const attackerBounce = Math.min(1.5, 0.8 + (1 - weightRatio) * 0.5);
            const defenderMove = Math.max(0, weightRatio * 0.3);
            
            // 虛空行者不會被撞飛
            if (!fasterIsVoidWalker) {
                faster.vx = -Math.cos(collisionAngle) * fasterSpeed * attackerBounce * BOUNCE;
                faster.vy = -Math.sin(collisionAngle) * fasterSpeed * attackerBounce * BOUNCE;
            }
            
            if (!slowerIsVoidWalker) {
                slower.vx = Math.cos(collisionAngle) * fasterSpeed * defenderMove * BOUNCE;
                slower.vy = Math.sin(collisionAngle) * fasterSpeed * defenderMove * BOUNCE;
            }
        }
        
        // 碰撞冷卻檢查（允許多次傷害但有冷卻時間）
        if (!canDamage) return;
        collisionCooldowns.set(pairKey, now);
        
        // 判斷雙方陣營
        const unit1IsAttackingSide = isPlayerTurnNow ? !unit1.isEnemy : unit1.isEnemy;
        const unit2IsAttackingSide = isPlayerTurnNow ? !unit2.isEnemy : unit2.isEnemy;
        
        // 處理傷害/效果
        if (unit1.isEnemy !== unit2.isEnemy) {
            // 敵對碰撞
            // 只有進攻方陣營可以對防守方陣營造成傷害
            if (unit1IsAttackingSide && !unit2IsAttackingSide) {
                // unit1 是進攻方，unit2 是防守方
                applyDamage(unit1, unit2);
            } else if (unit2IsAttackingSide && !unit1IsAttackingSide) {
                // unit2 是進攻方，unit1 是防守方
                applyDamage(unit2, unit1);
            }
            // 防守方陣營的單位撞到進攻方不會造成傷害（除了水晶魔像反彈）
        } else {
            // 友軍碰撞 - 觸發支援效果
            // 速度快的撞擊速度慢的
            if (v1 > v2 && v1 > MIN_VELOCITY) {
                applyAllyEffect(unit1, unit2);
            } else if (v2 > v1 && v2 > MIN_VELOCITY) {
                applyAllyEffect(unit2, unit1);
            }
        }
    }
    
    function applyDamage(attacker, defender) {
        let damage = attacker.currentDamage;
        
        // 宇宙龍神Lv.2 牆壁反彈加成
        if (wallBounceDamageBonus > 0 && attacker === activeAttacker) {
            damage *= (1 + wallBounceDamageBonus);
        }
        
        // 魔王領主：自身生命值低於60%時，攻擊力提高100%
        if (attacker.isDemonLord && attacker.currentHp < attacker.maxHp * 0.6) {
            damage *= 2;
            addBattleLog(`😈 ${attacker.name} 低血量狂暴！傷害翻倍！`, "ability");
        }
        
        const abilityText = attacker.abilities[0].toLowerCase();
        
        // 額外傷害（火焰小鬼等）
        if (abilityText.includes("額外") && abilityText.includes("傷害")) {
            const extraDmg = parseInt(abilityText.match(/\d+/)?.[0] || 15);
            damage += extraDmg;
        }
        
        // 對低血量雙倍（死神使者）
        if (abilityText.includes("低於30%") && defender.currentHp < defender.maxHp * 0.3) {
            damage *= 2;
            addBattleLog(`💀 ${attacker.name} 對瀕死目標造成雙倍傷害！`, "ability");
        }
        
        // 真實傷害
        if (abilityText.includes("真實傷害")) {
            damage += 25;
        }
        
        // 減傷
        const defAbility = defender.abilities[0].toLowerCase();
        if (defAbility.includes("減少") && defAbility.includes("傷害")) {
            damage *= 0.8;
        }
        
        // 竊取HP
        if (abilityText.includes("竊取")) {
            const stealAmount = parseInt(abilityText.match(/\d+/)?.[0] || 15);
            attacker.currentHp = Math.min(attacker.maxHp, attacker.currentHp + stealAmount);
            showDamagePopup(attacker.x, attacker.y - attacker.size, stealAmount, true);
            addBattleLog(`🩸 ${attacker.name} 竊取了 ${stealAmount} HP！`, "heal");
        }
        
        // 護盾吸收
        if (defender.shield > 0) {
            const absorbed = Math.min(defender.shield, damage);
            defender.shield -= absorbed;
            damage -= absorbed;
            addBattleLog(`🛡️ ${defender.name} 的護盾吸收了 ${absorbed} 傷害`, "ability");
        }
        
        // 反彈傷害（水晶魔像的能力 - 唯一例外可以對攻擊者造成傷害）
        if (defAbility.includes("反彈")) {
            const reflectPercent = parseInt(defAbility.match(/\d+/)?.[0] || 30) / 100;
            const reflectDamage = Math.floor(damage * reflectPercent);
            attacker.currentHp -= reflectDamage;
            showDamagePopup(attacker.x, attacker.y - attacker.size, reflectDamage);
            addBattleLog(`💎 ${defender.name} 反彈了 ${reflectDamage} 傷害給 ${attacker.name}！`, "damage");
            if (attacker.currentHp <= 0) {
                attacker.alive = false;
                energy++; // 我方被擊敗也獲得能量
                addBattleLog(`☠️ ${attacker.name} 被反彈傷害擊敗！`, "death");
            }
        }
        
        damage = Math.floor(damage);
        defender.currentHp -= damage;
        
        // 顯示傷害數字
        showDamagePopup(defender.x, defender.y - defender.size, damage);
        addBattleLog(`⚔️ ${attacker.name} → ${defender.name} ${damage}傷`, "damage", attacker.isEnemy ? 'enemy' : 'player');
        
        // 灼燒效果
        if (abilityText.includes("灼燒")) {
            defender.effects.push({ type: "burn", duration: 2, damage: 10 });
            addBattleLog(`🔥 ${defender.name} 被灼燒！`, "ability");
        }
        
        // 冰霜巨人：力度限制30%
        if (abilityText.includes("力度最多只有30%")) {
            defender.effects.push({ type: "powerLimit", duration: 1, maxPower: 0.3 });
            addBattleLog(`❄️ ${defender.name} 下回合力度最多30%！`, "ability");
        }
        
        // 連鎖閃電（雷霆法師）
        if (abilityText.includes("連鎖閃電") || abilityText.includes("鄰近敵人")) {
            const chainDmg = 12;
            const enemies = defender.isEnemy ? enemyUnits : playerUnits;
            enemies.filter(e => e.alive && e !== defender).forEach(e => {
                if (distance(defender.x, defender.y, e.x, e.y) < 120) {
                    e.currentHp -= chainDmg;
                    showDamagePopup(e.x, e.y - e.size, chainDmg);
                    addBattleLog(`⚡ 閃電連鎖到 ${e.name}！`, "damage");
                    if (e.currentHp <= 0) {
                        e.alive = false;
                        energy++;
                        addBattleLog(`☠️ ${e.name} 被閃電擊敗！`, "death");
                    }
                }
            });
        }
        
        // 範圍傷害（宇宙龍神等）
        if (abilityText.includes("範圍傷害") || (abilityText.includes("周圍") && abilityText.includes("傷害"))) {
            const rangeDmg = parseInt(abilityText.match(/\d+/)?.[0] || 15);
            const enemies = defender.isEnemy ? enemyUnits : playerUnits;
            enemies.filter(e => e.alive && e !== defender).forEach(e => {
                if (distance(defender.x, defender.y, e.x, e.y) < 100) {
                    e.currentHp -= rangeDmg;
                    showDamagePopup(e.x, e.y - e.size, rangeDmg);
                    addBattleLog(`💥 ${e.name} 受到範圍傷害 ${rangeDmg}！`, "damage");
                    if (e.currentHp <= 0) {
                        e.alive = false;
                        energy++;
                        addBattleLog(`☠️ ${e.name} 被範圍傷害擊敗！`, "death");
                    }
                }
            });
        }
        
        // FIX: 混沌泰坦：隨機效果，將力度倍率恢復為 10 倍
        if (attacker.name === "混沌泰坦" || attacker.isChaosTitan) {
            const roll = Math.random();
            if (roll < 0.33) {
                // 2倍傷害（已造成的傷害再造成一次）
                defender.currentHp -= damage;
                showDamagePopup(defender.x, defender.y - defender.size + 20, damage);
                addBattleLog(`🌋 混沌力量：雙倍傷害！`, "ability");
            } else if (roll < 0.66) {
                // 治療自己30HP
                attacker.currentHp = Math.min(attacker.maxHp, attacker.currentHp + 30);
                showDamagePopup(attacker.x, attacker.y - attacker.size, 30, true);
                addBattleLog(`🌋 混沌力量：自我治療 30HP！`, "heal");
            } else {
                // FIX: 10倍力度（下回合）
                attacker.chaosPowerBoost = true;
                addBattleLog(`🌋 混沌力量：${attacker.name} 下回合力度10倍！`, "ability");
            }
        }
        
        // 檢查死亡
        if (defender.currentHp <= 0) {
            const hasRebirth = defender.abilities.some(a => a.includes("復活") || a.includes("重生"));
            if (hasRebirth && !defender.hasRevived) {
                // FIX: 永恆鳳凰復活時同步更新 MaxHP，避免血條爆掉
                const rebirthHp = Math.floor(defender.maxHp * 3.0); // 300% HP
                defender.maxHp = rebirthHp; // 更新最大血量
                defender.currentHp = rebirthHp;
                defender.hasRevived = true;
                showDamagePopup(defender.x, defender.y - defender.size, rebirthHp, true);
                addBattleLog(`🦅 ${defender.name} 浴火重生！恢復 ${rebirthHp} HP！`, "ability");
            } else {
                defender.alive = false;
                // 無論敵我都獲得能量
                energy++;
                addBattleLog(`☠️ ${defender.name} 被擊敗！獲得 1 👍`, "death");
                
                // 虛空帝皇 Lv.2：靈魂收割 - 擊敗敵人時恢復50HP
                if (attacker.level >= 2 && attacker.abilities[1] && attacker.abilities[1].includes("靈魂收割")) {
                    attacker.currentHp = Math.min(attacker.maxHp, attacker.currentHp + 50);
                    showDamagePopup(attacker.x, attacker.y - attacker.size, 50, true);
                    addBattleLog(`👁️ ${attacker.name} 靈魂收割恢復 50HP！`, "heal");
                }
            }
        }
    }
    
    function applyAllyEffect(unit1, unit2) {
        const ability = unit1.abilities[0].toLowerCase();
        
        // 河川精靈、聖光祭司：碰撞隊友時治療
        if (ability.includes("碰撞隊友") && ability.includes("治療")) {
            const healAmount = parseInt(ability.match(/\d+/)?.[0] || 20);
            unit2.currentHp = Math.min(unit2.maxHp, unit2.currentHp + healAmount);
            showDamagePopup(unit2.x, unit2.y - unit2.size, healAmount, true);
            addBattleLog(`💧 ${unit1.name} 治療 ${unit2.name} ${healAmount}HP`, "heal");
            
            // 聖光祭司：移除負面狀態
            if (ability.includes("移除負面")) {
                unit2.effects = [];
                addBattleLog(`✨ ${unit2.name} 負面狀態已移除`, "ability");
            }
        }
        
        // 大地薩滿：碰撞隊友時給予護盾
        if (ability.includes("護盾")) {
            const shieldAmount = parseInt(ability.match(/\d+/)?.[0] || 25);
            unit2.shield += shieldAmount;
            addBattleLog(`🛡️ ${unit1.name} 給予 ${unit2.name} ${shieldAmount}護盾`, "ability");
        }
        
        // 龍騎將軍：被隊友碰撞或碰撞隊友時發射折射火焰
        if (unit1.isDragonGeneral || unit2.isDragonGeneral) {
            const dragon = unit1.isDragonGeneral ? unit1 : unit2;
            const other = unit1.isDragonGeneral ? unit2 : unit1;
            
            // 計算發射方向（朝向最近的敵人）
            const enemies = dragon.isEnemy ? playerUnits : enemyUnits;
            const aliveEnemies = enemies.filter(e => e.alive);
            
            if (aliveEnemies.length > 0) {
                // 找最近的敵人
                let closestEnemy = aliveEnemies[0];
                let minDist = Infinity;
                aliveEnemies.forEach(e => {
                    const d = distance(dragon.x, dragon.y, e.x, e.y);
                    if (d < minDist) {
                        minDist = d;
                        closestEnemy = e;
                    }
                });
                
                const flameAngle = Math.atan2(closestEnemy.y - dragon.y, closestEnemy.x - dragon.x);
                const flameSpeed = 10;
                
                // 發射折射火焰
                refractionFlames.push({
                    x: dragon.x,
                    y: dragon.y,
                    vx: Math.cos(flameAngle) * flameSpeed,
                    vy: Math.sin(flameAngle) * flameSpeed,
                    damage: dragon.currentDamage,
                    owner: dragon,
                    bounces: 0,
                    maxBounces: 3,
                    hitEnemies: [] // 記錄已擊中的敵人，允許穿透但每個敵人只傷害一次
                });
                
                addBattleLog(`🐉 ${dragon.name} 發射折射火焰！`, "ability", dragon.isEnemy ? 'enemy' : 'player');
            }
        }
        
        // 暗夜刺客：被隊友擊中時，對敵方最低HP英雄隔空偷襲
        if (unit2.isAmbusher) {
            const enemies = unit2.isEnemy ? playerUnits : enemyUnits;
            const aliveEnemies = enemies.filter(e => e.alive);
            if (aliveEnemies.length > 0) {
                // 找到HP最低的敵人
                let lowestHpEnemy = aliveEnemies[0];
                aliveEnemies.forEach(e => {
                    if (e.currentHp < lowestHpEnemy.currentHp) {
                        lowestHpEnemy = e;
                    }
                });
                
                // 造成傷害
                const ambushDamage = unit2.currentDamage;
                lowestHpEnemy.currentHp -= ambushDamage;
                showDamagePopup(lowestHpEnemy.x, lowestHpEnemy.y - lowestHpEnemy.size, ambushDamage);
                addBattleLog(`🌙 ${unit2.name} 隔空偷襲 ${lowestHpEnemy.name}！造成 ${ambushDamage} 傷害`, "ability");
                
                // 添加偷襲視覺特效
                visualEffects.push({
                    type: "ambush",
                    x: lowestHpEnemy.x,
                    y: lowestHpEnemy.y,
                    startTime: Date.now(),
                    duration: 500
                });
                
                if (lowestHpEnemy.currentHp <= 0) {
                    lowestHpEnemy.alive = false;
                    if (!unit2.isEnemy) energy++;
                    addBattleLog(`☠️ ${lowestHpEnemy.name} 被偷襲擊敗！`, "death");
                }
            }
        }
    }
    
    function distance(x1, y1, x2, y2) {
        return Math.sqrt((x2-x1)**2 + (y2-y1)**2);
    }
    
    // ==========================================
    // 回合處理
    // ==========================================
    function endTurn() {
        activeAttacker = null;
        collisionCooldowns = new Map();
        
        // 處理回合結束效果
        const currentUnit = getCurrentActionUnit();
        
        // 雷神之子回合結束：對所有敵人造成8點傷害
        if (currentUnit && currentUnit.isThunderSon && currentUnit.alive) {
            const enemies = currentUnit.isEnemy ? playerUnits : enemyUnits;
            enemies.filter(u => u.alive).forEach(enemy => {
                enemy.currentHp -= 8;
                showDamagePopup(enemy.x, enemy.y - enemy.size, 8);
                if (enemy.currentHp <= 0) {
                    enemy.alive = false;
                    energy++;
                    addBattleLog(`☠️ ${enemy.name} 被雷電擊敗！`, "death");
                }
            });
            addBattleLog(`🌩️ 雷神之子回合結束！全體敵人受到 8 點傷害`, "ability", currentUnit.isEnemy ? 'enemy' : 'player');
        }
        
        // FIX: 時空法師：不論是誰的回合結束，只要生命值多於1，每回合都恢復100%滿血
        [...playerUnits, ...enemyUnits].forEach(u => {
            if (u.isTimeMage && u.alive && u.currentHp > 1) {
                const healAmount = u.maxHp - u.currentHp;
                if (healAmount > 0) {
                    u.currentHp = u.maxHp;
                    showDamagePopup(u.x, u.y - u.size, healAmount, true);
                    addBattleLog(`⏳ ${u.name} 時空回溯！恢復至滿血！`, "heal", u.isEnemy ? 'enemy' : 'player');
                }
            }
        });
        
        if (currentUnit) {
            // 天使長回合結束治療
            if (currentUnit.abilities[0].includes("回合結束時治療")) {
                const team = currentUnit.isEnemy ? enemyUnits : playerUnits;
                team.filter(u => u.alive).forEach(ally => {
                    ally.currentHp = Math.min(ally.maxHp, ally.currentHp + 50);
                    showDamagePopup(ally.x, ally.y - ally.size, 50, true);
                });
                addBattleLog(`👼 天使長治療全隊 50HP`, "heal", currentUnit.isEnemy ? 'enemy' : 'player');
            }
            
            // 處理狀態效果
            currentUnit.effects = currentUnit.effects.filter(effect => {
                if (effect.type === "burn") {
                    currentUnit.currentHp -= effect.damage;
                    showDamagePopup(currentUnit.x, currentUnit.y - currentUnit.size, effect.damage);
                    addBattleLog(`🔥 ${currentUnit.name} 灼燒 ${effect.damage}`, "damage", currentUnit.isEnemy ? 'enemy' : 'player');
                    if (currentUnit.currentHp <= 0) {
                        currentUnit.alive = false;
                        energy++;
                        addBattleLog(`☠️ ${currentUnit.name} 被灼燒擊敗！`, "death", currentUnit.isEnemy ? 'enemy' : 'player');
                    }
                    effect.duration--;
                    return effect.duration > 0;
                }

                if (effect.type === "powerLimit") {
                    effect.duration--;
                    return effect.duration > 0;
                }
                return true;
            });
        }
        
        // UR Lv.2 全體效果
        [...playerUnits, ...enemyUnits].filter(u => u.alive && u.level >= 2 && u.rarity === "UR").forEach(unit => {
            if (unit.abilities[1] && unit.abilities[1].includes("所有敵人每回合損失")) {
                const enemies = unit.isEnemy ? playerUnits : enemyUnits;
                enemies.filter(u => u.alive).forEach(enemy => {
                    enemy.currentHp -= 12;
                    showDamagePopup(enemy.x, enemy.y - enemy.size, 12);
                    if (enemy.currentHp <= 0) {
                        enemy.alive = false;
                        if (!unit.isEnemy) energy++;
                    }
                });
                addBattleLog(`🦅 煉獄烈焰傷害全體 12`, "ability", unit.isEnemy ? 'enemy' : 'player');
            }
        });
        
        // 檢查勝負
        const playerAlive = playerUnits.filter(u => u.alive).length;
        const enemyAlive = enemyUnits.filter(u => u.alive).length;
        
        if (playerAlive === 0 || enemyAlive === 0) {
            endBattle(playerAlive > 0);
            return;
        }
        
        // 切換到對方 - 真正的雙方輪流
        if (currentSide === 'player') {
            playerTurnIndex++;
            // 只有當對方還有存活單位時才切換
            if (enemyAlive > 0) {
                currentSide = 'enemy';
            }
        } else {
            enemyTurnIndex++;
            // 只有當對方還有存活單位時才切換
            if (playerAlive > 0) {
                currentSide = 'player';
            }
        }
        
        // 如果雙方都輪完一圈，增加回合數
        const maxPlayers = playerUnits.filter(u => u.alive).length;
        const maxEnemies = enemyUnits.filter(u => u.alive).length;
        if (playerTurnIndex >= maxPlayers && enemyTurnIndex >= maxEnemies) {
            playerTurnIndex = 0;
            enemyTurnIndex = 0;
            roundNumber++;
            addBattleLog(`【第 ${roundNumber} 回合】`, "round", 'player');
            addBattleLog(`【第 ${roundNumber} 回合】`, "round", 'enemy');
        }
        
        // 回合開始治療（自然守護者）
        const nextUnit = getCurrentActionUnit();
        if (nextUnit && nextUnit.abilities[0].includes("每回合開始時治療")) {
            const team = nextUnit.isEnemy ? enemyUnits : playerUnits;
            team.filter(u => u.alive).forEach(ally => {
                ally.currentHp = Math.min(ally.maxHp, ally.currentHp + 8);
            });
            addBattleLog(`🌿 自然守護者治療全隊 8HP`, "heal", nextUnit.isEnemy ? 'enemy' : 'player');
        }
        
        // 雷神之子回合開始：對所有敵人造成8點傷害
        if (nextUnit && nextUnit.isThunderSon && nextUnit.alive) {
            const enemies = nextUnit.isEnemy ? playerUnits : enemyUnits;
            enemies.filter(u => u.alive).forEach(enemy => {
                enemy.currentHp -= 8;
                showDamagePopup(enemy.x, enemy.y - enemy.size, 8);
                if (enemy.currentHp <= 0) {
                    enemy.alive = false;
                    energy++;
                    addBattleLog(`☠️ ${enemy.name} 被雷電擊敗！`, "death");
                }
            });
            addBattleLog(`🌩️ 雷神之子回合開始！全體敵人受到 8 點傷害`, "ability", nextUnit.isEnemy ? 'enemy' : 'player');
        }
        
        // 海洋霸主回合開始：拉近敵人貼近自己
        if (nextUnit && nextUnit.isOceanLord && nextUnit.alive) {
            const enemies = nextUnit.isEnemy ? playerUnits : enemyUnits;
            const pullStrength = 0.6; // 拉近60%的距離
            addBattleLog(`🌊 ${nextUnit.name} 召喚洋流！`, "ability", nextUnit.isEnemy ? 'enemy' : 'player');
            
            // 添加拉近視覺特效
            visualEffects.push({
                type: "pull",
                x: nextUnit.x,
                y: nextUnit.y,
                startTime: Date.now(),
                duration: 600
            });
            
            enemies.filter(u => u.alive).forEach(enemy => {
                const dx = nextUnit.x - enemy.x;
                const dy = nextUnit.y - enemy.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const minDist = (nextUnit.size + enemy.size) / 2 + 5;
                
                if (dist > minDist) {
                    const pullDist = (dist - minDist) * pullStrength;
                    const angle = Math.atan2(dy, dx);
                    enemy.x += Math.cos(angle) * pullDist;
                    enemy.y += Math.sin(angle) * pullDist;
                    addBattleLog(`🌊 ${enemy.name} 被洋流拉近！`, "ability", nextUnit.isEnemy ? 'enemy' : 'player');
                }
            });
        }
        
        updateBattleUI();
        
        // 如果下一個是敵方，執行AI
        if (currentSide === 'enemy') {
            setTimeout(aiTurn, 800);
        }
    }
    
    function aiTurn() {
        if (gameState !== "battle") return;
        
        const unit = getCurrentActionUnit();
        if (!unit || !unit.isEnemy) return;
        
        const playerTargets = playerUnits.filter(u => u.alive);
        if (playerTargets.length === 0) return;
        
        activeAttacker = unit;
        
        let closestTarget = playerTargets[0];
        let minDist = Infinity;
        
        playerTargets.forEach(target => {
            const dist = distance(unit.x, unit.y, target.x, target.y);
            if (dist < minDist) {
                minDist = dist;
                closestTarget = target;
            }
        });
        
        const angle = Math.atan2(closestTarget.y - unit.y, closestTarget.x - unit.x);
        const randomAngle = angle + (Math.random() - 0.5) * 0.4;
        let power = 20 + Math.random() * 10;
        
        // 冰霜巨人效果：力度最多30%
        const powerLimitEffect = unit.effects.find(e => e.type === "powerLimit");
        if (powerLimitEffect) {
            power = Math.min(power, MAX_POWER * powerLimitEffect.maxPower);
            addBattleLog(`❄️ ${unit.name} 力度被限制！`, "ability");
        }
        
        // 敵方神聖化身 Lv.2 效果
        const enemySacredAvatar = enemyUnits.find(u => u.alive && u.name === "神聖化身" && u.level >= 2);
        if (enemySacredAvatar && unit.isEnemy) {
            power *= 2.0;
        }
        
        // 鐵甲騎士：自身力度為500%
        if (unit.isIronKnight) {
            power *= 5.0;
            addBattleLog(`🛡️ ${unit.name} 鐵甲衝鋒！力度500%！`, "ability");
        }
        
        // FIX: 混沌泰坦：恢復10倍力度效果
        if (unit.chaosPowerBoost) {
            power *= 10.0;
            addBattleLog(`🌋 ${unit.name} 混沌爆發！力度10倍！`, "ability");
            unit.chaosPowerBoost = false;
        }
        
        unit.vx = Math.cos(randomAngle) * power / unit.weight;
        unit.vy = Math.sin(randomAngle) * power / unit.weight;
        
        animating = true;
        updateBattleUI();
    }
    
    function returnToMenu() {
        if (confirm("確定要返回主選單嗎？對戰進度將會遺失。")) {
            gameState = "title";
            showScreen("title");
        }
    }
    
    function endBattle(playerWon) {
        gameState = "result";
        showScreen("result");
        
        const title = document.getElementById("resultTitle");
        const stats = document.getElementById("resultStats");
        
        if (playerWon) {
            title.textContent = "🎉 勝利！";
            title.className = "result-title result-win";
        } else {
            title.textContent = "💔 戰敗";
            title.className = "result-title result-lose";
        }
        
        const playerSurvived = playerUnits.filter(u => u.alive).length;
        const enemyDefeated = 4 - enemyUnits.filter(u => u.alive).length;
        stats.textContent = `存活英雄: ${playerSurvived}/4 | 擊敗敵人: ${enemyDefeated}/4 | 獲得能量: ${energy}👍`;
    }
    
    // ==========================================
    // 輸入處理
    // ==========================================
    function handlePointerDown(e) {
        if (gameState !== "battle" || animating) return;
        
        const currentUnit = getCurrentActionUnit();
        if (!currentUnit || currentUnit.isEnemy) return;
        
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / scale;
        const y = (e.clientY - rect.top) / scale;
        
        // 只能拖動當前行動的英雄
        if (distance(x, y, currentUnit.x, currentUnit.y) < currentUnit.size + 15) {
            dragging = true;
            dragUnit = currentUnit;
            dragStart = { x, y };
            dragEnd = { x, y };
        }
    }
    
    function handlePointerMove(e) {
        if (!dragging || !dragUnit) return;
        
        const rect = canvas.getBoundingClientRect();
        dragEnd = {
            x: (e.clientX - rect.left) / scale,
            y: (e.clientY - rect.top) / scale
        };
    }
    
    function handlePointerUp(e) {
        if (!dragging || !dragUnit) return;
        
        const dx = dragStart.x - dragEnd.x;
        const dy = dragStart.y - dragEnd.y;
        const dragDistance = Math.sqrt(dx*dx + dy*dy);
        const maxDrag = 120; // 最大拖拉距離
        const power = Math.min(dragDistance, maxDrag);
        
        if (power > 10) {
            const angle = Math.atan2(dy, dx);
            let normalizedPower = power / maxDrag; // 0-1
            
            // 冰霜巨人效果：力度最多30%
            const powerLimitEffect = dragUnit.effects.find(e => e.type === "powerLimit");
            if (powerLimitEffect) {
                normalizedPower = Math.min(normalizedPower, powerLimitEffect.maxPower);
                addBattleLog(`❄️ ${dragUnit.name} 力度被限制為 ${Math.floor(normalizedPower * 100)}%！`, "ability");
            }
            
            // 神聖化身 Lv.2：所有隊友力度+100%
            const sacredAvatar = playerUnits.find(u => u.alive && u.name === "神聖化身" && u.level >= 2);
            if (sacredAvatar && !dragUnit.isEnemy) {
                normalizedPower *= 2.0; // +100% power
                addBattleLog(`⭐ 神之祝福：${dragUnit.name} 力度翻倍！`, "ability");
            }
            
            // 鐵甲騎士：自身力度為500%
            if (dragUnit.isIronKnight) {
                normalizedPower *= 5.0;
                addBattleLog(`🛡️ ${dragUnit.name} 鐵甲衝鋒！力度500%！`, "ability");
            }
            
            // FIX: 混沌泰坦：檢查是否有10倍力度效果
            if (dragUnit.chaosPowerBoost) {
                normalizedPower *= 10.0;
                addBattleLog(`🌋 ${dragUnit.name} 混沌爆發！力度10倍！`, "ability");
                dragUnit.chaosPowerBoost = false;
            }
            
            const actualPower = normalizedPower * MAX_POWER;
            
            activeAttacker = dragUnit;
            collisionCooldowns = new Map();
            wallBounceCount = 0;
            wallBounceDamageBonus = 0;
            
            // 森林斥候不會移動，只會發射箭矢
            if (dragUnit.isArcher) {
                // 發射箭矢
                const arrowSpeed = 12;
                arrows.push({
                    x: dragUnit.x,
                    y: dragUnit.y,
                    vx: Math.cos(angle) * arrowSpeed,
                    vy: Math.sin(angle) * arrowSpeed,
                    damage: dragUnit.currentDamage,
                    owner: dragUnit,
                    bounces: 0,
                    maxBounces: 10
                });
                addBattleLog(`🏹 ${dragUnit.name} 發射箭矢！`, "ability");
                animating = true;
            } else {
                dragUnit.vx = Math.cos(angle) * actualPower / dragUnit.weight;
                dragUnit.vy = Math.sin(angle) * actualPower / dragUnit.weight;
                animating = true;
            }
            
            updateBattleUI();
        }
        
        dragging = false;
        dragUnit = null;
    }
    
    function handleTouchStart(e) {
        e.preventDefault();
        if (e.touches.length > 0) {
            handlePointerDown({
                clientX: e.touches[0].clientX,
                clientY: e.touches[0].clientY
            });
        }
    }
    
    function handleTouchMove(e) {
        e.preventDefault();
        if (e.touches.length > 0) {
            handlePointerMove({
                clientX: e.touches[0].clientX,
                clientY: e.touches[0].clientY
            });
        }
    }
    
    function handleTouchEnd(e) {
        e.preventDefault();
        handlePointerUp({});
    }
    
    // ==========================================
    // 繪製
    // ==========================================
    function draw() {
        ctx.fillStyle = "#16213e";
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        
        if (gameState !== "battle") return;
        
        glowPhase += 0.1;
        
        // 空白地圖背景
        ctx.fillStyle = "#3d6b3d";
        ctx.fillRect(0, ARENA_TOP, GAME_WIDTH, ARENA_BOTTOM - ARENA_TOP);
        
        // 網格線
        ctx.strokeStyle = "rgba(255,255,255,0.05)";
        ctx.lineWidth = 1;
        for (let x = 0; x < GAME_WIDTH; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, ARENA_TOP);
            ctx.lineTo(x, ARENA_BOTTOM);
            ctx.stroke();
        }
        for (let y = ARENA_TOP; y < ARENA_BOTTOM; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(GAME_WIDTH, y);
            ctx.stroke();
        }
        
        // 繪製單位
        const allUnits = [...enemyUnits, ...playerUnits];
        const currentActionUnit = getCurrentActionUnit();
        
        allUnits.forEach(unit => {
            if (!unit.alive) return;
            
            const x = unit.x;
            const y = unit.y;
            const r = unit.size / 2;
            
            // 陰影
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.beginPath();
            ctx.ellipse(x, y + r - 5, r * 0.9, r * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();
            
            const colors = {
                N: ["#5a5a5a", "#888"],
                R: ["#2e7d32", "#4caf50"],
                SR: ["#1565c0", "#42a5f5"],
                SSR: ["#7b1fa2", "#ab47bc"],
                UR: ["#ff8f00", "#ffd700"]
            };
            
            const [mainColor, borderColor] = colors[unit.rarity];
            
            // 玩家回合時，所有我方英雄閃光
            if (!unit.isEnemy && !animating) {
                const glowIntensity = (Math.sin(glowPhase * 2) + 1) / 2;
                
                if (currentActionUnit === unit) {
                    // 當前行動英雄 - 強烈閃光
                    ctx.shadowColor = "#00ff00";
                    ctx.shadowBlur = 20 + glowIntensity * 25;
                    
                    ctx.strokeStyle = `rgba(0, 255, 0, ${0.6 + glowIntensity * 0.4})`;
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.arc(x, y, r + 12 + glowIntensity * 10, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    // 其他我方英雄 - 較弱閃光
                    ctx.strokeStyle = `rgba(100, 255, 100, ${0.3 + glowIntensity * 0.3})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(x, y, r + 8, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            
            // 等級2發光
            if (unit.level >= 2) {
                ctx.shadowColor = borderColor;
                ctx.shadowBlur = 20;
            }
            
            ctx.fillStyle = mainColor;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.shadowBlur = 0;
            
            // 護盾
            if (unit.shield > 0) {
                ctx.strokeStyle = "#00ffff";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(x, y, r + 6, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // 虛空帝皇穿透效果
            if (unit.phaseThrough && unit === activeAttacker) {
                ctx.strokeStyle = "rgba(128, 0, 255, 0.7)";
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(x, y, r + 8, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            // Emoji
            const emojiSize = Math.max(r * 1.0, 14);
            ctx.font = `${emojiSize}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(unit.emoji, x, y);
            
            // HP條
            const hpBarWidth = Math.max(r * 2.5, 50);
            const hpBarHeight = 12;
            const hpBarY = y - r - 24;
            const hpPercent = Math.max(0, unit.currentHp / unit.maxHp);
            
            ctx.fillStyle = "#333";
            ctx.fillRect(x - hpBarWidth/2, hpBarY, hpBarWidth, hpBarHeight);
            
            ctx.fillStyle = hpPercent > 0.5 ? "#4caf50" : hpPercent > 0.25 ? "#ff9800" : "#f44336";
            ctx.fillRect(x - hpBarWidth/2, hpBarY, hpBarWidth * hpPercent, hpBarHeight);
            
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1;
            ctx.strokeRect(x - hpBarWidth/2, hpBarY, hpBarWidth, hpBarHeight);
            
            // HP數值
            ctx.fillStyle = "#fff";
            ctx.font = "bold 9px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(`${Math.max(0, Math.floor(unit.currentHp))}/${unit.maxHp}`, x, hpBarY + hpBarHeight / 2);
            
            // 等級標記
            if (unit.level >= 2) {
                ctx.fillStyle = "#ffd700";
                ctx.font = "bold 10px Arial";
                ctx.fillText("Lv.2", x, y + r + 16);
            }
            
            // 狀態效果
            let effectX = x - r;
            unit.effects.forEach(effect => {
                ctx.font = "14px Arial";
                if (effect.type === "burn") ctx.fillText("🔥", effectX, y - r - 38);
                if (effect.type === "powerLimit") ctx.fillText("❄️", effectX, y - r - 38);
                effectX += 18;
            });
        });
        
        // 繪製箭矢
        arrows.forEach(arrow => {
            const arrowAngle = Math.atan2(arrow.vy, arrow.vx);
            
            ctx.save();
            ctx.translate(arrow.x, arrow.y);
            ctx.rotate(arrowAngle);
            
            // 箭身
            ctx.fillStyle = "#8B4513";
            ctx.fillRect(-15, -2, 25, 4);
            
            // 箭頭
            ctx.fillStyle = "#C0C0C0";
            ctx.beginPath();
            ctx.moveTo(12, 0);
            ctx.lineTo(5, -5);
            ctx.lineTo(5, 5);
            ctx.closePath();
            ctx.fill();
            
            // 箭羽
            ctx.fillStyle = "#FF6B6B";
            ctx.beginPath();
            ctx.moveTo(-15, 0);
            ctx.lineTo(-20, -6);
            ctx.lineTo(-12, 0);
            ctx.lineTo(-20, 6);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        });
        
        // 繪製折射火焰
        refractionFlames.forEach(flame => {
            const flameAngle = Math.atan2(flame.vy, flame.vx);
            
            ctx.save();
            ctx.translate(flame.x, flame.y);
            ctx.rotate(flameAngle);
            
            // 火焰尾巴
            const gradient = ctx.createLinearGradient(-30, 0, 15, 0);
            gradient.addColorStop(0, 'rgba(255, 100, 0, 0)');
            gradient.addColorStop(0.3, 'rgba(255, 150, 0, 0.6)');
            gradient.addColorStop(0.7, 'rgba(255, 200, 0, 0.9)');
            gradient.addColorStop(1, 'rgba(255, 255, 200, 1)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(-30, 0);
            ctx.quadraticCurveTo(-15, -8, 15, 0);
            ctx.quadraticCurveTo(-15, 8, -30, 0);
            ctx.fill();
            
            // 火焰核心
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(5, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(5, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        });
        
        // 繪製視覺特效
        const now = Date.now();
        visualEffects = visualEffects.filter(effect => {
            const elapsed = now - effect.startTime;
            if (elapsed >= effect.duration) return false;
            
            const progress = elapsed / effect.duration;
            
            if (effect.type === "fire") {
                // 火焰噴射特效
                const alpha = 1 - progress;
                const length = effect.length * (1 - progress * 0.3);
                
                ctx.save();
                ctx.translate(effect.x, effect.y);
                ctx.rotate(effect.angle);
                
                // 火焰漸變
                const gradient = ctx.createLinearGradient(0, 0, length, 0);
                gradient.addColorStop(0, `rgba(255, 200, 0, ${alpha})`);
                gradient.addColorStop(0.3, `rgba(255, 100, 0, ${alpha * 0.8})`);
                gradient.addColorStop(0.7, `rgba(255, 50, 0, ${alpha * 0.5})`);
                gradient.addColorStop(1, `rgba(100, 0, 0, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(0, -15);
                ctx.lineTo(length, -5);
                ctx.lineTo(length, 5);
                ctx.lineTo(0, 15);
                ctx.closePath();
                ctx.fill();
                
                // 火焰粒子
                for (let i = 0; i < 8; i++) {
                    const px = Math.random() * length;
                    const py = (Math.random() - 0.5) * 20;
                    const psize = 3 + Math.random() * 5;
                    ctx.fillStyle = `rgba(255, ${150 + Math.random() * 100}, 0, ${alpha * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(px, py, psize, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            }
            
            if (effect.type === "ambush") {
                // 偷襲特效
                const alpha = 1 - progress;
                ctx.fillStyle = `rgba(128, 0, 128, ${alpha * 0.5})`;
                ctx.beginPath();
                ctx.arc(effect.x, effect.y, 30 * (1 + progress), 0, Math.PI * 2);
                ctx.fill();
                
                ctx.font = `${20 + progress * 10}px Arial`;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.textAlign = "center";
                ctx.fillText("🌙", effect.x, effect.y);
            }
            
            if (effect.type === "pull") {
                // 洋流拉近特效
                const alpha = 1 - progress;
                const maxRadius = 150;
                
                // 向內收縮的圓圈
                for (let i = 0; i < 3; i++) {
                    const radiusOffset = (i / 3 + progress) % 1;
                    const radius = maxRadius * (1 - radiusOffset);
                    ctx.strokeStyle = `rgba(0, 150, 255, ${alpha * (1 - radiusOffset)})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                // 中心漩渦
                ctx.fillStyle = `rgba(0, 100, 200, ${alpha * 0.5})`;
                ctx.beginPath();
                ctx.arc(effect.x, effect.y, 20 * (1 - progress * 0.5), 0, Math.PI * 2);
                ctx.fill();
                
                ctx.font = `${24}px Arial`;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.textAlign = "center";
                ctx.fillText("🌊", effect.x, effect.y + 8);
            }
            
            return true;
        });
        
        // 拖拉線
        if (dragging && dragUnit) {
            const dx = dragStart.x - dragEnd.x;
            const dy = dragStart.y - dragEnd.y;
            const dragDistance = Math.sqrt(dx*dx + dy*dy);
            const maxDrag = 120;
            const power = Math.min(dragDistance, maxDrag);
            const powerPercent = Math.floor((power / maxDrag) * 100);
            
            // 方向箭頭
            const gradient = ctx.createLinearGradient(dragUnit.x, dragUnit.y, dragUnit.x + dx, dragUnit.y + dy);
            gradient.addColorStop(0, `rgba(255, 255, 0, 0.9)`);
            gradient.addColorStop(1, `rgba(255, 100, 0, ${Math.min(powerPercent / 100, 0.9)})`);
            
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(dragUnit.x, dragUnit.y);
            ctx.lineTo(dragUnit.x + dx, dragUnit.y + dy);
            ctx.stroke();
            
            // 箭頭頭部
            const arrowSize = 15;
            const arrowAngle = Math.atan2(dy, dx);
            ctx.fillStyle = "#ffff00";
            ctx.beginPath();
            ctx.moveTo(dragUnit.x + dx, dragUnit.y + dy);
            ctx.lineTo(
                dragUnit.x + dx - arrowSize * Math.cos(arrowAngle - 0.4),
                dragUnit.y + dy - arrowSize * Math.sin(arrowAngle - 0.4)
            );
            ctx.lineTo(
                dragUnit.x + dx - arrowSize * Math.cos(arrowAngle + 0.4),
                dragUnit.y + dy - arrowSize * Math.sin(arrowAngle + 0.4)
            );
            ctx.closePath();
            ctx.fill();
            
            // 力度指示
            ctx.fillStyle = "#fff";
            ctx.font = "bold 16px Arial";
            ctx.textAlign = "center";
            ctx.fillText(`力度: ${powerPercent}%`, dragUnit.x, dragUnit.y + dragUnit.size + 35);
            
            // 選中框
            ctx.strokeStyle = "#ffff00";
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 4]);
            ctx.beginPath();
            ctx.arc(dragUnit.x, dragUnit.y, dragUnit.size / 2 + 15, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }
    
    // ==========================================
    // 遊戲主循環
    // ==========================================
    function gameLoop() {
        if (gameState === "battle") {
            const isMoving = updatePhysics();
            
            if (animating && !isMoving) {
                animating = false;
                setTimeout(endTurn, 300);
            }
        }
        
        draw();
        requestAnimationFrame(gameLoop);
    }
    
    window.onload = init;
    </script>
