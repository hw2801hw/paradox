<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smashing Four HTML5 Mobile Web App</title>
    <!--
    ==========================================
    🎮 Smashing Four HTML5 Mobile Web App 🎮
    ==========================================
    
    【遊戲說明】
    這是一款回合制物理碰撞對戰遊戲，玩家與 AI 各派出 4 名英雄進行對戰。
    
    【操作方式】
    1. 首次進入遊戲會進行免費九連抽，獲得 9 名不同英雄（保底1張UR）
    2. 從擁有的英雄中選擇 4 名組成隊伍
    3. 對戰時採用交替回合制：
       - 隨機決定先手方
       - 每次只有一名英雄行動，然後切換到對方
       - 點擊/觸控當前行動的英雄並拖拉
       - 拖拉方向的反方向就是發射方向
       - 拖拉距離決定力度（最高100%）
       - 放開後英雄會飛出去
    4. 英雄碰撞敵人會造成傷害，碰撞隊友可能觸發支援效果
    5. 只有主動攻擊方會造成傷害，被動碰撞不會受傷（水晶魔像反彈除外）
    6. 擊敗敵方或我方英雄被擊敗時都會獲得 👍能量
    7. 可用 👍能量 升級我方英雄（最高Lv.2）
    8. 先消滅對方全部英雄者獲勝！
    
    【稀有度】
    N(灰) < R(綠) < SR(藍) < SSR(紫) < UR(金)
    UR 英雄擁有兩項能力，Lv.2 時解鎖第二項能力
    
    【體型】微細 < 小 < 正常 < 大 < 巨大（每級2倍大小差距）
    【重量】極輕 < 輕 < 正常 < 重 < 極重（影響擊退效果）
    
    【虛空帝皇特殊能力】
    次元裂隙：移動時可穿透所有英雄，不會被碰撞阻擋
    
    作者：AI Game Developer
    版本：1.5 (Fixes: Chaos Titan 10x, Forest Scout Physics, Time Mage Passive, RWD)
    ==========================================
    -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        body {
            background: #1a1a2e;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        
        /* RWD 調整：確保容器保持 9:16 比例，且適應視窗大小 */
        #gameContainer {
            position: relative;
            background: #16213e;
            overflow: hidden;
            
            /* 預設寬度優先 */
            width: 100%;
            max-width: 450px;
            aspect-ratio: 9/16;
            
            /* 如果高度會超出視窗，則改以高度優先 */
            max-height: 100vh;
            
            /* 陰影增加立體感 */
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        
        /* 針對超長螢幕或手機的適配 */
        @media (min-aspect-ratio: 9/16) {
            #gameContainer {
                height: 100vh;
                width: auto; /* 寬度自動計算以維持比例 */
            }
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(22, 33, 62, 0.98);
            z-index: 10;
        }
        
        .screen.active {
            display: flex;
        }
        
        .title {
            font-size: 1.5em;
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-gold {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 0.75em;
            margin: 3px;
        }
        
        /* Gacha Screen */
        #gachaScreen {
            background: radial-gradient(ellipse at center, #2d1b4e 0%, #1a1a2e 100%);
            padding: 10px;
        }
        
        #gachaCards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
            width: 100%;
            max-width: 320px;
        }
        
        .gacha-card {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .gacha-card:active {
            transform: scale(0.95);
        }
        
        .gacha-card .emoji {
            font-size: 2.5em;
        }
        
        .gacha-card .rarity-badge {
            font-size: 0.7em;
            margin-top: 5px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            color: white;
        }
        
        /* Rarity Colors */
        .rarity-N { background: linear-gradient(135deg, #5a5a5a 0%, #3d3d3d 100%); border: 3px solid #777; }
        .rarity-R { background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); border: 3px solid #4caf50; }
        .rarity-SR { background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%); border: 3px solid #42a5f5; }
        .rarity-SSR { background: linear-gradient(135deg, #7b1fa2 0%, #4a148c 100%); border: 3px solid #ab47bc; }
        .rarity-UR { background: linear-gradient(135deg, #ff8f00 0%, #e65100 100%); border: 3px solid #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
        
        /* Team Select Screen */
        #teamScreen {
            padding: 10px;
        }
        
        #heroGrid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-height: 45%;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
        }
        
        .hero-select-card {
            width: 65px;
            height: 90px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.6em;
            color: white;
            text-align: center;
            padding: 4px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        
        .hero-select-card.selected {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }
        
        .hero-select-card .order-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            background: #ff4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        #selectedTeam {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            min-height: 70px;
        }
        
        .team-slot {
            width: 60px;
            height: 65px;
            border: 2px dashed #555;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 1.5em;
        }
        
        .team-slot.filled {
            border-style: solid;
        }
        
        /* Hero Detail Modal */
        #heroDetailModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        #heroDetailModal.active {
            display: flex;
        }
        
        .modal-content {
            background: #1e3a5f;
            border-radius: 15px;
            padding: 20px;
            max-width: 85%;
            max-height: 80%;
            overflow-y: auto;
            color: white;
            text-align: center;
        }
        
        .modal-content .hero-emoji {
            font-size: 4em;
            margin-bottom: 10px;
        }
        
        .modal-content .hero-name {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .modal-content .hero-stats {
            margin: 15px 0;
            text-align: left;
            font-size: 0.9em;
        }
        
        .modal-content .ability {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            text-align: left;
            font-size: 0.85em;
        }
        
        .ability-locked {
            opacity: 0.5;
        }
        
        .close-modal {
            margin-top: 15px;
        }
        
        /* Codex Screen */
        #codexScreen {
            padding: 10px;
        }
        
        .sort-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .sort-btn {
            padding: 5px 10px;
            font-size: 0.7em;
            border: 2px solid #555;
            border-radius: 15px;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .sort-btn.active {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }
        
        #codexGrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-height: 60%;
            overflow-y: auto;
            padding: 10px;
        }
        
        .codex-card {
            width: 70px;
            height: 85px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .codex-card:active {
            transform: scale(0.95);
        }
        
        .codex-card .emoji {
            font-size: 1.8em;
        }
        
        .codex-card .name {
            font-size: 0.5em;
            color: white;
            margin-top: 3px;
            text-align: center;
        }
        
        /* Battle UI */
        #battleUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 5;
        }
        
        #topBar {
            background: rgba(0,0,0,0.7);
            padding: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }
        
        .energy-display {
            color: #ffd700;
            font-size: 1.1em;
            font-weight: bold;
        }
        
        .turn-indicator {
            color: white;
            font-size: 0.9em;
            padding: 5px 15px;
            border-radius: 15px;
        }
        
        .turn-player {
            background: #4caf50;
        }
        
        .turn-enemy {
            background: #f44336;
        }
        
        #turnOrderDisplay {
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            display: flex;
            gap: 5px;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        
        .turn-order-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            border: 2px solid #555;
            background: rgba(0,0,0,0.5);
        }
        
        .turn-order-icon.current {
            border-color: #ffd700;
            box-shadow: 0 0 10px #ffd700;
            transform: scale(1.2);
        }
        
        .turn-order-icon.player-side {
            border-color: #4caf50;
        }
        
        .turn-order-icon.enemy-side {
            border-color: #f44336;
        }
        
        .turn-separator {
            color: #888;
            font-size: 0.8em;
            margin: 0 3px;
        }
        
        #upgradePanel {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            padding: 10px;
            border-radius: 10px;
            display: none;
            pointer-events: auto;
        }
        
        #upgradePanel.active {
            display: block;
        }
        
        .upgrade-btn {
            padding: 8px 15px;
            margin: 3px;
            font-size: 0.75em;
            border: none;
            border-radius: 5px;
            background: #673ab7;
            color: white;
            cursor: pointer;
        }
        
        .upgrade-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Battle Log - 固定在畫面底部，左右分欄 */
        #battleLog {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 20px);
            max-width: 430px;
            height: 100px;
            background: rgba(0,0,0,0.9);
            border-radius: 8px;
            padding: 5px;
            font-size: 0.6em;
            color: #ccc;
            pointer-events: auto;
            z-index: 100;
            display: flex;
            flex-direction: row !important;
            gap: 5px;
        }
        
        .log-column {
            flex: 1;
            width: 50%;
            height: 90px;
            overflow-y: auto;
            padding: 3px;
            display: flex;
            flex-direction: column;
        }
        
        .log-column-player {
            border-right: 2px solid #4caf50;
        }
        
        .log-column-enemy {
            border-left: 2px solid #f44336;
        }
        
        .log-header {
            font-weight: bold;
            text-align: center;
            padding: 2px;
            margin-bottom: 3px;
            border-radius: 3px;
        }
        
        .log-header-player {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }
        
        .log-header-enemy {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
        }
        
        .log-entry {
            margin: 2px 0;
            padding: 2px 4px;
            border-left: 2px solid #555;
            font-size: 0.95em;
        }
        
        .log-round {
            color: #ffd700;
            font-weight: bold;
        }
        
        .log-damage {
            border-left-color: #f44336;
        }
        
        .log-heal {
            border-left-color: #4caf50;
        }
        
        .log-ability {
            border-left-color: #ffd700;
        }
        
        .log-death {
            border-left-color: #9c27b0;
            color: #ff9800;
        }
        
        /* Result Screen */
        #resultScreen {
            background: rgba(0,0,0,0.9);
        }
        
        .result-title {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        .result-win {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }
        
        .result-lose {
            color: #ff4444;
        }
        
        /* Damage popup */
        .damage-popup {
            position: absolute;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.8);
            animation: floatUp 1s ease-out forwards;
            z-index: 50;
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.5); }
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Title Screen -->
        <div id="titleScreen" class="screen active">
            <h1 class="title">⚔️ Smashing Four ⚔️</h1>
            <p style="color: #aaa; margin-bottom: 20px; font-size: 0.9em;">HTML5 Mobile Edition</p>
            <button class="btn btn-gold" id="startBtn">🎮 開始遊戲</button>
            <button class="btn btn-info" id="codexBtn">📖 英雄圖鑑</button>
        </div>
        
        <!-- Codex Screen -->
        <div id="codexScreen" class="screen">
            <h2 class="title">📖 英雄圖鑑</h2>
            <p style="color: #aaa; font-size: 0.75em; margin-bottom: 8px;">共28名英雄，點擊查看詳情</p>
            <div class="sort-buttons">
                <button class="sort-btn active" data-sort="rarity">稀有度</button>
                <button class="sort-btn" data-sort="size">體型</button>
                <button class="sort-btn" data-sort="weight">重量</button>
                <button class="sort-btn" data-sort="hp">生命值</button>
                <button class="sort-btn" data-sort="damage">攻擊力</button>
            </div>
            <div id="codexGrid"></div>
            <button class="btn btn-primary" id="backFromCodexBtn">返回</button>
        </div>
        
        <!-- Gacha Screen -->
        <div id="gachaScreen" class="screen">
            <h2 class="title">🎰 免費九連抽！</h2>
            <p style="color: #ffd700; margin-bottom: 10px; font-size: 0.85em;">保底1張UR！點擊查看詳情</p>
            <div id="gachaCards"></div>
            <button class="btn btn-primary" id="confirmGachaBtn">確認獲得 ✓</button>
        </div>
        
        <!-- Team Select Screen -->
        <div id="teamScreen" class="screen">
            <h2 class="title">📋 選擇隊伍 (4名)</h2>
            <p style="color: #aaa; font-size: 0.75em; margin-bottom: 10px;">長按查看詳情，點擊選擇/取消</p>
            <div id="selectedTeam">
                <div class="team-slot">1</div>
                <div class="team-slot">2</div>
                <div class="team-slot">3</div>
                <div class="team-slot">4</div>
            </div>
            <div id="heroGrid"></div>
            <button class="btn btn-success" id="startBattleBtn" disabled>開始對戰 ⚔️</button>
        </div>
        
        <!-- Battle UI Overlay -->
        <div id="battleUI" style="display:none;">
            <div id="topBar">
                <button class="btn" style="padding:5px 10px; font-size:0.7em; background:#666;" id="returnToMenuBtn">⬅返回</button>
                <span class="energy-display">👍 <span id="energyCount">0</span></span>
                <span class="turn-indicator" id="turnIndicator">玩家回合</span>
                <button class="btn" style="padding:5px 10px; font-size:0.7em;" id="upgradeToggleBtn">升級</button>
            </div>
            <div id="turnOrderDisplay"></div>
            <div id="upgradePanel"></div>
        </div>
        
        <!-- Battle Log - 獨立於 battleUI，固定在底部 -->
        <div id="battleLog" style="display:none;"></div>
        
        <!-- Result Screen -->
        <div id="resultScreen" class="screen">
            <h1 class="result-title" id="resultTitle">勝利！</h1>
            <p style="color:#aaa; margin-bottom:20px;" id="resultStats"></p>
            <button class="btn btn-primary" id="playAgainBtn">再來一局</button>
            <button class="btn btn-gold" id="backToTeamBtn">重選隊伍</button>
        </div>
        
        <!-- Hero Detail Modal -->
        <div id="heroDetailModal">
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <script>
    // ==========================================
    // 遊戲常數與配置
    // ==========================================
    const GAME_WIDTH = 360;
    const GAME_HEIGHT = 640;
    const ARENA_TOP = 100;
    const ARENA_BOTTOM = 560;
    const FRICTION = 0.98;
    const BOUNCE = 0.85;
    const MIN_VELOCITY = 0.5;
    const MAX_POWER = 30;
    
    // 體型設定（每級2倍大小差距）
    const SIZE_TINY = 14;
    const SIZE_SMALL = 22;
    const SIZE_NORMAL = 32;
    const SIZE_LARGE = 48;
    const SIZE_HUGE = 70;
    
    // 重量設定
    const WEIGHT_VLIGHT = 0.4;
    const WEIGHT_LIGHT = 0.7;
    const WEIGHT_NORMAL = 1.0;
    const WEIGHT_HEAVY = 1.5;
    const WEIGHT_VHEAVY = 2.2;
    
    // ==========================================
    // 28名英雄資料
    // ==========================================
    const ALL_HEROES = [
        // N級 (4名) - 灰色
        { id: 1, name: "石衛兵", rarity: "N", emoji: "🗿", hp: 120, damage: 18, 
          sizeType: "大", size: SIZE_LARGE, weightType: "重", weight: WEIGHT_HEAVY,
          abilities: ["被擊中時減少20%傷害"] },
        { id: 2, name: "火焰小鬼", rarity: "N", emoji: "👹", hp: 70, damage: 28,

    function renderCodexGrid() {
        const grid = document.getElementById("codexGrid");
        grid.innerHTML = "";
        
        const rarityOrder = { N: 0, R: 1, SR: 2, SSR: 3, UR: 4 };
        const sizeOrder = { "微細": 0, "小": 1, "正常": 2, "大": 3, "巨大": 4 };
        const weightOrder = { "極輕": 0, "輕": 1, "正常": 2, "重": 3, "極重": 4 };
        
        let sortedHeroes = [...ALL_HEROES];
        
        switch(codexSortType) {
            case "rarity":
                sortedHeroes.sort((a, b) => rarityOrder[b.rarity] - rarityOrder[a.rarity]);
                break;
            case "size":
                sortedHeroes.sort((a, b) => sizeOrder[b.sizeType] - sizeOrder[a.sizeType]);
                break;
            case "weight":
                sortedHeroes.sort((a, b) => weightOrder[b.weightType] - weightOrder[a.weightType]);
                break;
            case "hp":
                sortedHeroes.sort((a, b) => b.hp - a.hp);
                break;
            case "damage":
                sortedHeroes.sort((a, b) => b.damage - a.damage);
                break;
        }
        
        sortedHeroes.forEach(hero => {
            const card = document.createElement("div");
            card.className = `codex-card rarity-${hero.rarity}`;
            card.innerHTML = `
                <div class="emoji">${hero.emoji}</div>
                <div class="name">${hero.name}</div>
            `;
            card.onclick = () => showHeroDetail(hero);
            grid.appendChild(card);
        });
    }
    
    // ==========================================
    // 抽卡系統（九連抽，3x3排列）
    // ==========================================
    function startGacha() {
        showScreen("gacha");
        
        const pool = [...ALL_HEROES];
        const pulled = [];
        
        // 先抽一張保底UR
        const urPool = pool.filter(h => h.rarity === "UR");
        const guaranteedUR = urPool[Math.floor(Math.random() * urPool.length)];
        pulled.push(guaranteedUR);
        pool.splice(pool.findIndex(h => h.id === guaranteedUR.id), 1);
        
        // 再抽8張不重複
        for (let i = 0; i < 8; i++) {
            const weights = pool.map(h => {
                switch(h.rarity) {
                    case "N": return 30;
                    case "R": return 25;
                    case "SR": return 20;
                    case "SSR": return 15;
                    case "UR": return 10;
                    default: return 10;
                }
            });
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            let random = Math.random() * totalWeight;
            let selectedIndex = 0;
            for (let j = 0; j < weights.length; j++) {
                random -= weights[j];
                if (random <= 0) {
                    selectedIndex = j;
                    break;
                }
            }
            pulled.push(pool[selectedIndex]);
            pool.splice(selectedIndex, 1);
        }
        
        // 打亂順序
        pulled.sort(() => Math.random() - 0.5);
        ownedHeroes = pulled;
        
        // 顯示3x3卡片
        const container = document.getElementById("gachaCards");
        container.innerHTML = "";
        
        pulled.forEach((hero, index) => {
            const card = document.createElement("div");
            card.className = `gacha-card rarity-${hero.rarity}`;
            card.innerHTML = `
                <div class="emoji">${hero.emoji}</div>
                <div class="rarity-badge">${hero.rarity}</div>
            `;
            card.onclick = () => showHeroDetail(hero);
            container.appendChild(card);
        });
    }
    
    function confirmGacha() {
        localStorage.setItem("smashingFourHeroes", JSON.stringify(ownedHeroes));
        showTeamSelect();
    }

    // 組隊系統

    function showTeamSelect() {
        showScreen("team");
        selectedTeam = [];
        updateTeamDisplay();
        
        const grid = document.getElementById("heroGrid");
        grid.innerHTML = "";
        
        ownedHeroes.forEach((hero, index) => {

            card.className = `hero-select-card rarity-${hero.rarity}`;
            card.innerHTML = `

                <div class="name" style="font-size:0.8em;">${hero.name}</div>
                <div class="rarity">${hero.rarity}</div>
            `;
            
            card.onclick = (e) => {
                if (longPressTimer) return;
                toggleHeroSelection(hero, card);
            };
            
            card.onmousedown = card.ontouchstart = (e) => {
                longPressTimer = setTimeout(() => {
                    showHeroDetail(hero);
                    longPressTimer = null;
                }, 500);
            };
            
            card.onmouseup = card.ontouchend = card.onmouseleave = () => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            };
            
            grid.appendChild(card);
        });
    }
    
    function toggleHeroSelection(hero, card) {
        const index = selectedTeam.findIndex(h => h.id === hero.id);
        
        if (index >= 0) {
            selectedTeam.splice(index, 1);
            card.classList.remove("selected");
            const badge = card.querySelector(".order-badge");
            if (badge) badge.remove();
        } else if (selectedTeam.length < 4) {
            selectedTeam.push(hero);
            card.classList.add("selected");
            const badge = document.createElement("div");
            badge.className = "order-badge";
            badge.textContent = selectedTeam.length;
            card.appendChild(badge);
        }
        
        updateTeamDisplay();
    }
    
    function updateTeamDisplay() {
        const slots = document.querySelectorAll(".team-slot");
        slots.forEach((slot, i) => {
            if (selectedTeam[i]) {
                slot.innerHTML = `<span style="font-size:1.8em;">${selectedTeam[i].emoji}</span>`;
                slot.classList.add("filled");
                slot.className = `team-slot filled rarity-${selectedTeam[i].rarity}`;
            } else {
                slot.innerHTML = i + 1;
                slot.className = "team-slot";
            }
        });
        
        const btn = document.getElementById("startBattleBtn");
        btn.disabled = selectedTeam.length !== 4;
        
        document.querySelectorAll(".hero-select-card").forEach(card => {
            const badge = card.querySelector(".order-badge");
            if (badge) {
                const heroName = card.querySelector(".name").textContent;
                const heroIndex = selectedTeam.findIndex(h => h.name === heroName);
                if (heroIndex >= 0) {
                    badge.textContent = heroIndex + 1;
                }
            }
        });
    }

    function createUnit(hero, index, isEnemy) {
        const y = isEnemy ? ARENA_TOP + 60 + hero.size/2 : ARENA_BOTTOM - 60 - hero.size/2;
        const spacing = GAME_WIDTH / 5;
        const x = spacing * (index + 1);
        
        return {
            ...hero,
            x: x,
            y: y,
            vx: 0,
            vy: 0,
            currentHp: hero.hp,
            maxHp: hero.hp,
            currentDamage: hero.damage,
            level: 1,
            isEnemy: isEnemy,
            alive: true,
            effects: [],
            shield: 0,
            phaseThrough: hero.phaseThrough || false,
            isDemonLord: hero.isDemonLord || false,
            isLightEmpress: hero.isLightEmpress || false,
            isTimeMage: hero.isTimeMage || false,
            isVoidWalker: hero.isVoidWalker || false,
            isThunderSon: hero.isThunderSon || false,
            isIronKnight: hero.isIronKnight || false,
            isChaosTitan: hero.isChaosTitan || false,
            isAmbusher: hero.isAmbusher || false,
            isArcher: hero.isArcher || false,
            isDragonGeneral: hero.isDragonGeneral || false,
            isOceanLord: hero.isOceanLord || false,
            chaosPowerBoost: false
        };
    }
    
    function generateAITeam() {
        // 從未被玩家選擇的英雄中隨機抽取4名
        const available = ALL_HEROES.filter(h => !selectedTeam.find(s => s.id === h.id));
        const team = [];
        
        // 建立加權隨機池（與抽卡相同的機率分佈）
        const shuffled = [...available].sort(() => Math.random() - 0.5);
        
        for (let i = 0; i < 4 && shuffled.length > 0; i++) {
            // 使用加權隨機選擇
            const weights = shuffled.map(h => {
                switch(h.rarity) {
                    case "N": return 30;
                    case "R": return 25;
                    case "SR": return 20;
                    case "SSR": return 15;
                    case "UR": return 10;
                    default: return 20;
                }
            });
            
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            let random = Math.random() * totalWeight;
            let selectedIndex = 0;
            
            for (let j = 0; j < weights.length; j++) {
                random -= weights[j];
                if (random <= 0) {
                    selectedIndex = j;
                    break;
                }
            }
            
            const selected = shuffled[selectedIndex];
            team.push({...selected});
            shuffled.splice(selectedIndex, 1);
        }
        
        return team;
    }
    
    function initTurnSystem() {
        // 隨機決定先手
        currentSide = Math.random() > 0.5 ? 'player' : 'enemy';
        playerTurnIndex = 0;
        enemyTurnIndex = 0;
        roundNumber = 1;
        
        addBattleLog(`【第 ${roundNumber} 回合】`, "round", currentSide === 'player' ? 'player' : 'enemy');
    }
    
    function getCurrentActionUnit() {
        if (currentSide === 'player') {
            const alivePlayers = playerUnits.filter(u => u.alive);
            if (alivePlayers.length === 0) return null;
            return alivePlayers[playerTurnIndex % alivePlayers.length];
        } else {
            const aliveEnemies = enemyUnits.filter(u => u.alive);
            if (aliveEnemies.length === 0) return null;
            return aliveEnemies[enemyTurnIndex % aliveEnemies.length];
        }
    }
    
    function getNextUnits(count) {
        // 獲取接下來幾個行動單位的預覽
        const result = [];
        let tempSide = currentSide;
        let tempPlayerIdx = playerTurnIndex;
        let tempEnemyIdx = enemyTurnIndex;
        
        const alivePlayers = playerUnits.filter(u => u.alive);
        const aliveEnemies = enemyUnits.filter(u => u.alive);
        
        for (let i = 0; i < count && (alivePlayers.length > 0 || aliveEnemies.length > 0); i++) {
            if (tempSide === 'player' && alivePlayers.length > 0) {
                result.push({ unit: alivePlayers[tempPlayerIdx % alivePlayers.length], type: 'player' });
                tempPlayerIdx++;
                tempSide = aliveEnemies.length > 0 ? 'enemy' : 'player';
            } else if (tempSide === 'enemy' && aliveEnemies.length > 0) {
                result.push({ unit: aliveEnemies[tempEnemyIdx % aliveEnemies.length], type: 'enemy' });
                tempEnemyIdx++;
                tempSide = alivePlayers.length > 0 ? 'player' : 'enemy';
            } else if (alivePlayers.length > 0) {
                result.push({ unit: alivePlayers[tempPlayerIdx % alivePlayers.length], type: 'player' });
                tempPlayerIdx++;
            } else if (aliveEnemies.length > 0) {
                result.push({ unit: aliveEnemies[tempEnemyIdx % aliveEnemies.length], type: 'enemy' });
                tempEnemyIdx++;
            }
        }
        
        return result;
    }
    
    function updateBattleUI() {
        document.getElementById("energyCount").textContent = energy;
        
        const currentUnit = getCurrentActionUnit();
        isPlayerTurn = currentSide === 'player';
        
        const indicator = document.getElementById("turnIndicator");
        indicator.textContent = isPlayerTurn ? `玩家回合 R${roundNumber}` : `敵方回合 R${roundNumber}`;
        indicator.className = "turn-indicator " + (isPlayerTurn ? "turn-player" : "turn-enemy");
        
        // 更新回合順序顯示

        // 獲取接下來8個行動單位

            icon.className = "turn-order-icon";
            icon.classList.add(entry.type === 'player' ? 'player-side' : 'enemy-side');
            
            if (index === 0) {
                icon.classList.add("current");
            }
            
            icon.textContent = entry.unit.emoji;
            orderDisplay.appendChild(icon);
            
            if (index < nextUnits.length - 1) {

                sep.className = "turn-separator";
                sep.textContent = "→";
                orderDisplay.appendChild(sep);
            }
        });
        
        updateUpgradePanel();
    }
    
    function toggleUpgradePanel() {
        const panel = document.getElementById("upgradePanel");
        panel.classList.toggle("active");
    }
    
    function updateUpgradePanel() {
        const panel = document.getElementById("upgradePanel");
        panel.innerHTML = "<div style='color:white;font-size:0.8em;margin-bottom:8px;'>升級UR英雄 (消耗1👍)</div>";
        
        // 只能升級當前行動的英雄
        const currentUnit = getCurrentActionUnit();
        
        if (!currentUnit || currentUnit.isEnemy) {
            panel.innerHTML += "<div style='color:#aaa;font-size:0.7em;'>等待你的回合</div>";
            return;
        }
        
        // 只有UR英雄才能升級
        if (currentUnit.rarity !== "UR") {
            panel.innerHTML += "<div style='color:#aaa;font-size:0.7em;'>只有UR英雄可以升級</div>";
            return;
        }
        
        if (energy < 1) {
            panel.innerHTML += "<div style='color:#aaa;font-size:0.7em;'>能量不足</div>";
            return;
        }
        
        if (currentUnit.level >= 2) {
            panel.innerHTML += "<div style='color:#aaa;font-size:0.7em;'>當前英雄已達最高等級</div>";
            return;
        }
        
        const btn = document.createElement("button");
        btn.className = "upgrade-btn";
        btn.textContent = `${currentUnit.emoji} ${currentUnit.name} → Lv.2`;
        btn.onclick = () => upgradeUnit(currentUnit);
        panel.appendChild(btn);
    }
    
    function upgradeUnit(unit) {
        if (energy < 1 || unit.level >= 2) return;
        
        energy--;
        unit.level = 2;
        unit.currentHp = Math.min(unit.currentHp + Math.floor(unit.maxHp * 0.3), Math.floor(unit.maxHp * 1.3));
        unit.maxHp = Math.floor(unit.maxHp * 1.3);
        unit.currentDamage = Math.floor(unit.currentDamage * 1.25);
        
        updateBattleUI();
        toggleUpgradePanel();
    }
