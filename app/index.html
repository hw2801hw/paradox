<!DOCTYPE html>
<html lang="zh-TW" manifest="cache.appcache">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>記事本 PWA</title>
  <meta name="theme-color" content="#f0f0f0">
  
  <!-- PWA 必要 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">

  <style>
    body {
      margin:0; font-family:system-ui,sans-serif; background:#fafafa; 
      height:100vh; display:flex; flex-direction:column;
    }
    textarea {
      flex:1; padding:16px; font-size:17px; line-height:1.5;
      border:none; resize:none; outline:none; background:#fff;
    }
    header {
      background:#0066cc; color:white; padding:12px 16px;
      font-weight:bold; font-size:1.1rem;
      display:flex; justify-content:space-between; align-items:center;
    }
    small { opacity:0.8; font-size:0.85rem; }
  </style>
</head>
<body>

<header>
  記事本 
  <small id="status">離線可用</small>
</header>

<textarea id="note" placeholder="開始寫吧... 自動儲存" autofocus></textarea>

<script>
  const ta = document.getElementById('note');
  const status = document.getElementById('status');

  // 讀取儲存的內容
  ta.value = localStorage.getItem('notepad-content') || '';

  // 輸入時自動存
  ta.addEventListener('input', () => {
    localStorage.setItem('notepad-content', ta.value);
    status.textContent = '已儲存 ' + new Date().toLocaleTimeString('zh-TW');
    setTimeout(() => status.textContent = '離線可用', 1800);
  });

  // 註冊 Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW 註冊成功', reg))
        .catch(err => console.log('SW 失敗', err));
    });
  }
</script>
</body>
</html>
